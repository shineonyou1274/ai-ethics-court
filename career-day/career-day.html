선합니다."],aptitude:"공학 전문직"},10118:{name:"데이터 라벨러",wage:3100,from:"임금직업포털 워크피디아",basis:"전잔자료입력원 및 사무보조원",year:2023,sat:"60.4",works:["데이터 라벨러는 인공지능이 학습 데이터를 쉽게 인식할 수 있도록 데이터에 라벨(정보 표식)을 입력합니다.","텍스트, 사진 이미지, 동영상, 사운드 등의 파일에 등장하는 사물, 동식물, 특정 단어 등에 라벨(정보 표식)을 수집하고 입력합니다.","자율주행 자동차의 AI 학습을 위하여 도로 위의 자동차, 사람, 신호 등에 네모 박스를 그립니다."],aptitude:"IT관련전문직"},10112:{name:"스마트공장 기술자",wage:4867,from:"워크넷",basis:"플랜트기계공학기술자",year:2021,sat:"74.0",works:["스마트공장 기술자는 제품의 전 생산과정을 사물인터넷(IoT)과 인공지능(AI), 빅 데이터 등 정보통신기술(ICT)로 통합해서 디지털화된 공장을 만들고 운용합니다.","스마트공장 시스템의 설계안을 만들고 하드웨어, 소프트웨어, 네트워크, 보안 설비 등을 설치하고 운용합니다.","최적의 설비를 설계하기 위해 시스템의 기술규격을 검토하고 분석합니다.","스마트 설비의 기구설계를 모델링하고 설비 구성단위 요소를 설계합니다."],aptitude:"공학 전문직"},10111:{name:"핀테크 전문가",wage:4750,from:"워크넷",basis:"정보통신컨설턴트 및 감리원",year:2021,sat:"75.6",works:["핀테크 전문가는 금융 서비스에 정보기술을 적용하기 위한 방안을 제시하고 효율적인 핀테크 서비스를 제공하는 시스템을 구축하고 운영합니다.","금융기관 방문 없이 스마트폰이나 컴퓨터로 쉽게 이용할 수 있도록 텔레뱅킹, 인터넷 뱅킹, 앱 카드 등 정보기술을 적용하기 위한 설계안을 개발합니다.","서비스를 쉽게 사용할 수 있도록 고객사의 상황과 니즈에 맞춰 가이드를 제공합니다.","핀테크 서비스를 운영하는 고객사가 직면하는 기술적 문제를 관리하고 해결을 돕습니다."],aptitude:"공학 전문직"},10110:{name:"양자 컴퓨팅 기술자",wage:4631,from:"워크넷",basis:"전자제품 및 부품 개발기술자",year:2021,sat:"74.5",works:["양자 컴퓨팅 기술자는 양자 물리학의 지식을 이용해서 기존 컴퓨터보다 빠르게 계산할 수 있는 양자 컴퓨터를 개발하고 운용합니다.","물리학자, 컴퓨터 공학자 등과 협력하여 새로운 양자 컴퓨팅 하드웨어와 소프트웨어를 개발합니다.","큐비트(qubits, 양자 컴퓨터로 계산할 때의 기본 단위)와 제어 시스템과 같은 양자 컴퓨터 하드웨어를 개발하고 운용합니다.","양자 컴퓨터를 실행할 수 있는 알고리즘을 설계합니다."],aptitude:"공학 전문직"},10109:{name:"나노공학 기술자",wage:5e3,from:null,basis:"재료(금속)공학기술자",year:null,sat:"73.5",works:["나노공학 기술자는 나노미터(1 나노는 10억 분의 1m)를 탐구하는 나노기술을 활용하여 전자(소자), 바이오, 소재, 공장장비 및 측정 기기 등을 개발하고 관리합니다.","나노미터(십억분의 일) 단위의 조작을 통해 기존의 전자, 바이오, 소재, 장비 및 기기에 나노기술을 적용합니다.","초소형 ·초경량 제품의 개발, 저 에너지의 신공정 개발, 집적· 저소비 전력 나노소자 개발을 한다.","나노 단위 부품을 설계하고 제어, 측정할 수 있는 기술을 개발한다."],aptitude:"공학 전문직"},10108:{name:"배터리 기술자",wage:5090,from:"워크넷",basis:"석유화학공학기술자 및 연구원",year:2021,sat:"73.4",works:["배터리 기술자는 2차 전지의 기본 단위가 되는 배터리 셀을 비롯하여 각종 배터리 부품을 설계하고, 제품 생산 과정을 관리합니다.","2차 전지 각각의 공정(전극, 조립, 활성화, 팩 공정)이 보다 효율적으로 작동할 수 있도록 신기술을 개발하고 문제를 해결합니다.","2차 전지를 만드는 생산 공정에서 문제가 생기면 원인을 분석하고 해결책을 제시합니다.","보다 효율적으로 배터리를 생산할 수 있는 개선안을 만들고 테스트합니다."],aptitude:"공학 전문직"},10107:{name:"디스플레이 개발자",wage:4800,from:"워크넷",basis:"디스플레이연구 및 개발자",year:2021,sat:"71.7",works:["디스플레이 개발자는 컴퓨터나 TV 화면으로 사용되는 디스플레이의 제조 설비를 개발하고, 공정상 발생하는 문제점을 해결합니다.","기존 제조 공정의 문제점과 개선 방법을 조사 ·평가하고 공정 기술과 공정 장비를 개선합니다.","새로운 공정 기술을 도입하는 데 따른 신소재 및 기술 내용을 분석합니다.","공정 장비를 시험적으로 가동하여 대량 생산의 가능성을 평가합니다."],aptitude:"공학 전문직"},10102:{name:"감성인식기술전문가",wage:5698,from:"워크넷",basis:"로봇공학기술자",year:2021,sat:"77.0",works:["인간의 감성을 컴퓨터가 인식할 수 있는 기술을 개발합니다.","인간의 감성을 인식할 수 있는 유무선 센서 기술을 개발합니다.","기존 IT 제품 및 몸에 착용할 수 있는 기기(웨어러블 장치)에 사용자의 감성을 인식시키는 기술을 적용합니다."],aptitude:"IT관련전문직"},10103:{name:"개인형 이동수단 개발자",wage:4986,from:"워크넷",basis:"자동차공학기술자",year:2021,sat:"77.7",works:["전기자동차, 전동 퀵보드 등 전기를 동력으로 하는 1인용 이동 수단을 연구하고 개발합니다.","새로운 개인용 이동 수단의 동력장치와 구성품을 연구하고 설계합니다.","개인용 이동 수단의 디자인을 설계합니다.","동력장치를 비롯하여 각종 구성품의 성능을 평가하고 개선합니다."],aptitude:"공학 전문직"},10104:{name:"유전자 재조합 식품 전문가",wage:4850,from:"워크넷",basis:"식품공학기술자 및 연구원",year:2021,sat:"79.9",works:["유전자 재조합 기술을 이용하여 새로운 식품을 개발하고, 안전성을 검토합니다.","유용한 유전자를 다른 생물체의 유전자와 결합하여 새로운 식품을 개발합니다.","유전자 재조합 식품의 안전성을 검사하고 관리합니다.","국민의 건강을 고려하여 유전자 변형 생물체의 안전한 수입을 담당합니다."],aptitude:"공학 전문직"},10105:{name:"태양광발전연구 및 개발자",wage:5393,from:"워크넷",basis:"태양광발전연구 및 개발자",year:2021,sat:"76.6",works:["태양 빛을 이용하여 전기를 발생시키는 장치를 연구하고 태양광 발전에 필요한 각종 장비를 개발합니다.","태양전지, 태양광 모듈 등 태양광 분야의 새로운 제품을 연구하고 개발합니다.","태양전지, 태양광 모듈 등 태양광 분야의 제품을 생산하는 데 필요한 각종 공정 장비를 연구·설계하고 개발합니다.","태양광 분야의 제품을 보다 효율적으로 생산하기 위한 공정을 연구합니다."],aptitude:"공학 전문직"},10106:{name:"스마트팜 운영자",wage:3613,from:"워크넷",basis:"곡식작물재배원",year:2021,sat:"56.0",works:["농사 기술에 정보통신기술(ICT)을 결합한 스마트 팜(농장)에서 농사를 운영합니다.","스마트폰과 같은 모바일 기기를 통해서 농장의 상태를 관리합니다.","사물인터넷 기술을 이용해서 농작물의 환경을 분석하고 조정합니다."],aptitude:"농생명산업 관련직"},10101:{name:"메타버스 크리에이터",wage:3522,from:"워크넷",basis:"웹디자이너",year:2021,sat:"72.7",works:["메타버스 플랫폼에서 제공하는 제작 툴을 사용하여 단일 아이템을 주로 제작하고 판매합니다.","메타버스의 가상공간에 메타버스 사용자들을 위한 건축물, 아바타 맵 등의 서비스를 설계하고 구현합니다.","메타버스 가상공간에서 사용자들을 위한 아바타 맵을 만듭니다.","맵 내부에서 건축물, 팝업스토어, 전시전 등 가상공간 전용 콘텐츠를 디자인하고 구현합니다."],aptitude:"웹·게임·애니메이션 관련직"},262:{name:"기자",wage:4050,from:"워크넷",basis:"신문기자",year:2021,sat:"74.7",works:["기자는 우리 주변에서 일어나는 각종 사고ㆍ사건, 정치ㆍ경제 소식, 생활 정보 등을 신문, 잡지, 라디오, TV, 인터넷 등을 통해 일반인에게 신속하게 알려 주는 일을 합니다.","활동하는 매체에 따라 방송기자, 신문기자, 잡지기자 등으로 분류되고, 담당 업무에 따라 취재기자, 편집기자, 사진기자 등으로 구분되며 취재 분야에 따라 스포츠, 연예, 의학 전문기자로 나누기도 합니다.","수집한 정보를 토대로 주요 내용을 분석, 정리하여 편집 형태와 기준에 따라 기사를 작성합니다.","핵심 내용을 파악하여 가장 중요한 정보에 해당되는 내용을 중심으로 제목과 소제목을 뽑습니다."],aptitude:"언어 관련 전문직"},1151:{name:"종이제품생산직(기계조작)",wage:3358,from:"워크넷",basis:"종이제품생산기계조작원",year:2021,sat:"61.0",works:["종이제품생산직(기계조작)은 종이 가방, 상자, 종이컵 등의 종이 제품을 생산하기 위해 각종 기계를 조작하는 일을 담당합니다.","필요한 길이로 종이를 자르거나 상자를 만들기 위해 판지를 자르고 접는 기계를 조작합니다.","종이를 접고 풀칠을 해서 봉투, 포대를 제조하거나 셀로판지 또는 유사 재료로 봉투를 만드는 기계를 조작합니다.","정기적으로 관련 기계를 점검하고 정비합니다."],aptitude:"기능직"},132:{name:"철도 및 지하철기관사",wage:5749,from:"워크넷",basis:"철도·전동차기관사",year:2021,sat:"77.8",works:["철도 및 지하철기관사는 승객과 화물을 목적지까지 안전하게 수송하기 위해 각각 철도 열차와 지하철의 운행을 담당합니다.","운행 스케줄을 확인하고 전달 사항 및 운행 주의 사항, 운전 조건 등에 대하여 교번 운용원에게 전달받아 운행 일지에 기록합니다.","열차를 안전하고 효율적으로 운행하기 위하여 운전명령서, 무선통신, 수신호, 철도 규정 등을 해석 및 적용하고 보고서를 작성합니다.","열차의 진행 방향과 철로를 관찰하며 정지, 지연, 소통에 관한 정보를 주고받기 위하여 열차승무원 및 교통통제 직원과 의사 교환을 하거나 신호를 주고받습니다."],aptitude:"일반운전 관련직"},951:{name:"행사기획자",wage:3469,from:"워크넷",basis:"행사기획자",year:2021,sat:"68.2",works:["행사기획자는 기업을 홍보하거나 지역 진흥을 위한 전시회, 시사회, 축제, 자동차 시승회, 국제회의 등 다양한 행사의 기획 및 섭외, 실행을 합니다.","설문조사, 시장조사, 관련 자료 및 데이터 분석 등 행사에 필요한 자료를 수집·분석하고, 팀원과의 회의를 거쳐 행사의 틀을 잡습니다.","행사 주최에 대해 논의하기 위해 의뢰 업체와 후원자들을 만나 행사의 범위 및 형식을 계획하고 예산을 세우며 행사에 필요한 인력들을 고용합니다."],aptitude:"기획서비스직"},1:{name:"가스ㆍ수도ㆍ전기 계기 검침원 및 안전점검원",wage:2799,from:"워크넷",basis:"계기검침원및가스점검원",year:2021,sat:"63.3",works:["가스·수도·전기 계기 검침원 및 안전점검원은 정기적으로 담당 가구나 업소에 방문해서 가스, 수도, 전력 사용량을 검침하고 기록하는 업무를 수행합니다.","가스, 수도, 전력 등의 사용량에 따라 검침 서류를 대단위, 소단위 소비자와 지역으로 구분하여 전산에 입력합니다.","계량기의 불량 상태 등을 점검하고, 계량기 표면의 이물질을 제거합니다."],aptitude:"안전 관련직"},380:{name:"상담전문가",wage:3108,from:"워크넷",basis:"심리상담전문가",year:2021,sat:"73.1",works:["상담전문가는 성격, 정서, 관계, 진로 및 정신적 증상 등에 대해서 어려움을 겪고 있거나 그러한 어려움을 해결하고자 하는 사람에게 심리검사, 상담 프로그램 등을 활용하여 문제 해결을 돕고 지원합니다.","성격, 정서, 관계, 진로 등에 대해 상담을 요청하는 사람(내담자)과의 대화를 통해 문제가 무엇인지 알아봅니다.","표준화된 심리검사를 실시하고, 상담을 통해 내담자의 내면을 심층적으로 탐색하여 그 결과를 분석합니다.","분석한 결과를 토대로 개인상담, 집단상담, 자기 성장 프로그램, 대인관계 향상 프로그램 등 다양한 방식으로 앞으로의 바람직한 방향을 함께 찾습니다."],aptitude:"사회서비스직"},10059:{name:"평등관리사무원",wage:null,from:null,basis:null,year:null,sat:null,works:["평등관리사무원은 일반인들이 다른 문화에 대한 바른 이해와 태도를 가질 수 있도록 하고, 다른 문화권 사람들이 공정한 대우를 받을 수 있도록 돕습니다.","평등 보장과 관련된 문제 및 새로운 정책에 대한 최신 정보를 유지합니다.","사업주들이 사회의 다양한 계층과 집단 출신 근로자들을 고용하도록 장려합니다.","평등 관련 행사 및 교육훈련을 준비하고 진행합니다."],aptitude:"사회서비스직"},264:{name:"통역가",wage:3550,from:"워크넷",basis:"통역가",year:2021,sat:"82.1",works:["통역가는 외국인의 대화나 발표를 우리말로 전달하거나, 우리말을 외국어로 전달합니다.","통역 방법에는 동시통역, 순차 통역, 수행 통역, 위스퍼링 통역 등이 있으며 상황에 따라 통역 방법을 혼용해서 쓰기도 합니다.","동시통역은 각종 국제회의나 세미나 등에서 사람들에게 연사의 말을 해당 국가의 언어로 실시간 통역하는 것이며, 순차 통역이란 발표자가 연설을 하면 통역가는 연설 내용을 기록한 후 옆에서 바로 발표자의 말을 이어서 통역을 하는 것입니다.","수행 통역은 통역이 필요한 사람을 동반하면서 통역하는 것으로 사람을 따라다니면서 그 사람의 의사소통을 돕는 것이며, 위스퍼링(whispering) 통역은 속삭이듯 귓속말로 통역하는 것입니다."],aptitude:"언어 관련 전문직"},1152:{name:"가구조립 및 검사원",wage:3200,from:"워크넷",basis:"가구조립원",year:2021,sat:"60.5",works:["가구조립 및 검사원은 여러 형태의 가구를 조립하고 조립을 완성한 가구제품의 결함 여부를 검사하는 일을 담당합니다.","조립할 목재의 규격을 검사하고 조립 부분의 먼지나 오물을 제거합니다.","만들어진 가구 부품을 가구조립기에 장착하여 조립하거나 수동 공구를 사용하여 조립합니다.","드라이버, 동력 공구, 아교 등을 이용하여 손잡이, 경첩, 걸쇠 등의 부착물을 붙입니다."],aptitude:"기능직"},133:{name:"철도차량정비원",wage:4698,from:"워크넷",basis:"철도기관차·전동차정비원",year:2021,sat:"68.3",works:["철도차량정비원은 철도 열차의 본체, 객차 또는 지하철의 주요 부분과 바퀴 등을 정비 및 점검하고 고장 부위를 수리하는 일을 담당합니다.","열차나 지하철의 이상이나 고장 유무를 확인하고 고장을 수리합니다."],aptitude:"기능직"},952:{name:"화학공학기술자",wage:5090,from:"워크넷",basis:"석유화학공학기술자및연구원",year:2021,sat:"73.4",works:["화학공학기술자 및 연구원은 석유, 광물, 나무 등 천연자원을 이용해 일상생활에 필요한 화장품, 비누, 섬유, 의약, 고무, 플라스틱 등 화학제품을 만드는 공정을 연구하거나, 화학제품을 생산하기 위한 설비 시스템 및 관련 정보를 연구, 설계, 개발하는 일을 합니다.","안전기준에 적합한 화학제품 생산 시스템을 만들기 위한 설계를 수행하고, 설계도에 따라 설비의 건설과 설치를 감독하며, 생산공정 및 각종 제어시스템을 전문적으로 다루거나 제작합니다.","생산된 제품이 품질 표준을 만족했는지 확인하는 품질 통제 활동과 품질관리 프로그램을 운영하고 원료, 제품, 폐기물에 대한 기준을 마련하는 활동을 합니다."],aptitude:"공학 전문직"},5:{name:"일기예보관",wage:4662,from:"워크넷",basis:"천문·기상학연구원",year:2021,sat:"70.9",works:["일기예보관은 각종 기상 관측 자료의 분석을 바탕으로 일기예보와 기상현상에 대한 주의보, 경보, 기상 전망을 발표하는 업무를 수행합니다.","기류의 방향, 속도, 온도, 습도, 기압 등 지구 대기의 물리적 특성과 그 특성에 영향을 미치는 요인을 조사하여 일기도를 작성합니다.","기상 관측 자료의 분석을 통해 장기, 단기 일기예보와 기상현상에 대한 주의보, 경보, 기상 전망을 발표합니다."],aptitude:"이학 전문직"},383:{name:"우편물집배원",wage:3511,from:"워크넷",basis:"우편물집배원",year:2021,sat:"67.6",works:["우편물집배원은 우편물을 표시된 주소에 전달하는 일을 담당합니다.","우체국 관할 구역에 있는 우체통 안의 우편물을 수집하여 우체국에 전달하고, 배달할 우편물을 담당 구역 및 배달 순서로 구분합니다.","지정된 순서에 따라 오토바이 또는 차량으로 해당 주소지에 전달하고, 등기 소포 등의 우편물은 전달한 사람에게 직접 전달하여 확인을 받습니다.","주소가 분명하지 않거나 받는 사람이 확실하지 않아 전달하지 못한 우편물은 전달하지 못한 이유를 기록하여 사고우편물 처리원에게 인수인계합니다."],aptitude:"안전 관련직"},10060:{name:"애견테라피스트",wage:null,from:null,basis:null,year:null,sat:null,works:["애견테라피스트는 반려동물의 질병이나 마음의 상처를 예방하고 건강을 유지하는 방법에 대해 조언해 줍니다.","반려동물이 본래 가진 습성이나 자연치유력을 이용하여 치료합니다.","손가락으로 동물의 신체에 자극을 줌으로써 마음의 균형을 맞추기도 하고, 신체의 움직임을 좋게 하여 건강한 상태로 보살펴 줍니다.","마사지 등을 통해 신진대사를 활발하게 하고 근육의 긴장을 풀어 주고, 아로마 향을 활용하여 냄새를 제거하거나 살균합니다."],aptitude:"사회서비스직"},265:{name:"리포터",wage:3108,from:"워크넷",basis:"리포터",year:2021,sat:"66.4",works:["리포터는 뉴스나 시사 문제 등을 취재하여 라디오, TV, 케이블, 인터넷 방송 등에 기사 내용을 전달하는 일을 담당합니다.","취재를 위해 사건 현장에 직접 가거나 관련된 사건 당사자들을 인터뷰합니다.","라디오, 텔레비전, 교양, 오락 등의 프로그램에 출연하여 보도 내용을 소개합니다.","유명인이나 화제의 인물과 직접 인터뷰하기도 합니다."],aptitude:"언어 관련 전문직"},1153:{name:"포장원",wage:2800,from:"워크넷",basis:"포장원",year:2021,sat:"54.2",works:["포장원은 품질검사가 완료된 제품을 운반하고, 포장기계를 작동하여 제품을 포장하는 일을 담당합니다.","제품의 품질검사가 완료되면 제품을 옮겨 수량을 확인한 다음, 포장기계를 조작하여 제품을 포장합니다.","포장된 제품의 마크, 부호, 숫자 등을 확인하며 포장제품의 불량 여부를 검사합니다."],aptitude:"기능직"},137:{name:"토목공학기술자",wage:5128,from:"워크넷",basis:"토목구조설계기술자",year:2021,sat:"69.3",works:["토목공학기술자는 국가 기반 시설인 도로, 철도, 교량, 터널, 항만, 상하수도, 댐 등을 계획 및 설계하고 시공합니다.","설비계획 또는 사업계획에 의하여 공사 일정, 설계 일정, 공사 기간 등 단위 공사의 기본 계획을 작성합니다.","토목시설물의 재료를 선택하고 기기의 하중, 풍압 등의 조건에 적합한 구조를 결정하며 색채, 외형 등이 균형과 조화를 이루도록 합니다.","토목 시설물 공사의 각 작업 과정 소요 일정을 판단하고 기전 설비와의 연관관계를 검토하며, 작업의 우선순위, 기후 조건 등을 고려하여 종합 공정표를 작성하고 공정대로 공사가 진행되도록 자재, 인원, 장비의 투입 등 전반적인 공정을 검토·분석합니다."],aptitude:"공학 전문직"},954:{name:"화훼재배기술자",wage:4299,from:"워크넷",basis:"농학연구원",year:2021,sat:"72.3",works:["화훼재배기술자는 여러 품종의 과목, 교목, 꽃 등의 화훼 작물을 육성 및 재배하고 관리하는 일을 담당합니다.","재배할 화훼 작물의 종류와 양을 결정한 다음, 필요한 종자와 비료, 장비 등을 준비합니다.","토양에 화훼 종자를 심고, 꽃의 종류에 따라 이식, 솎아주기, 거름주기 등을 합니다."],aptitude:"농생명산업 관련직"},6:{name:"기상연구원",wage:4662,from:"워크넷",basis:"천문·기상학연구원",year:2021,sat:"70.9",works:["기상연구원은 각종 기상 관측 자료를 분석하여 정확하게 일기예보를 할 수 있는 방법을 연구하고 개발합니다.","기류의 방향, 속도, 기압, 온도, 습도 등 기상현상과 대기, 기후, 해양기상, 지진 특성 등을 조사하고 분석하여 보다 정확한 일기예보 기법을 개발하기 위한 연구를 합니다.","대기 상황에 대한 자료를 분석하고, 장기, 단기 기상예보를 위해 관측된 자료를 해석하며, 기상도를 작성합니다.","기상관측 기기의 정밀도를 향상시키고자 기상계측 기술개발에 대한 연구를 수행합니다."],aptitude:"이학 전문직"},384:{name:"성직자",wage:null,from:null,basis:null,year:null,sat:null,works:["성직자는 신자들에게 정신적, 도덕적 지도를 하며 교리 해설과 설교를 하고 종교의식을 거행합니다.","성직자는 승려, 목사, 신부 등이 있으며 교리를 해석하고 전달하며 신자들의 고충을 들어주고 안식을 주는 상담자로서 역할을 수행하면서 사회 지도자로서의 역할을 하기도 합니다.","일반적으로 종교 의례와 의식을 거행 및 관리하며, 의식을 거행할 때에는 불경이나 성경 등의 경전을 읽습니다.","그 외에도 병든 사람을 위로하거나 가난한 사람을 도와주고, 정신적인 아픔을 호소하거나 안식을 원하는 사람을 돕고 신앙으로 인도합니다."],aptitude:"사회서비스직"},10061:{name:"유전상담사",wage:null,from:null,basis:null,year:null,sat:null,works:["유전상담사는 환자와 가족들에게 유전 관련 정보를 제공하여 의학적, 사회적, 심리적 측면에서 유전질환을 충분히 이해하고 적절한 대응 방법을 선택할 수 있도록 도와줍니다.","환자의 가족과 병력, 사진 등의 기초 자료를 수집하여 가계도를 분석합니다.","환자의 유전자 검사를 통해 질환을 확인합니다.","상담을 통해 환자 개인과 가족이 겪는 심리사회적 불안감을 해소시키고, 질환의 예후나 재발 위험도, 향후 검사와 관련된 정보를 제공합니다."],aptitude:"보건의료 관련 서비스직"},266:{name:"드라마작가",wage:2500,from:"워크넷",basis:"영화시나리오작가",year:2021,sat:"63.3",works:["드라마작가는 라디오나 텔레비전 드라마에 필요한 대본을 창작하고 글을 쓰는 일을 담당합니다.","드라마의 주제를 선택하고 내용에 따른 역사적 현실이나 사건의 과정 등을 조사, 분석하여 작품의 줄거리를 구상합니다.","작품의 주제에 따라 등장인물의 성격, 시대적 배경, 장소 등을 결정하며, 드라마를 전개하는 데 필요한 대사와 동작 등을 구상합니다.","완성도 높은 프로그램을 제작하기 위해 드라마작가는 글 쓰는 일 외에 출연자 섭외, 촬영, 편집, 방송 진행에 모두 관여하기도 합니다."],aptitude:"작가 관련직"},1154:{name:"채소 및 특용작물재배자",wage:3300,from:"워크넷",basis:"채소·특용작물재배원",year:2021,sat:"57.9",works:["채소 및 특용작물재배자는 상추, 배추, 쑥갓 등 채소 작물과 인삼 등의 특용작물을 재배하고 수확하는 일을 합니다.","재배할 작물의 종류와 양, 재배면적을 결정하고 계획을 세웁니다.","농기계류, 기구, 재배할 작물, 경작지를 준비하고 작물의 종류에 따라 재배 방법을 결정합니다.","작지에 종자를 심고 필요에 따라 비료와 농약을 사용하여 채소 및 특용작물을 재배합니다."],aptitude:"농생명산업 관련직"},138:{name:"통신공학 기술자 및 연구원",wage:4325,from:"워크넷",basis:"통신기술개발자 ",year:2021,sat:"75.5",works:["통신공학 기술자 및 연구원은 물리학, 수학 및 컴퓨터의 구조와 원리에 대한 전문 지식을 바탕으로 통신 장비의 설계, 생산 업무를 관리 및 감독합니다.","종합적인 통신망 체계를 구축하기 위해 망을 기획, 연구,설계하며, 세부적인 시설에 대한 계획을 수립합니다.","단파방송 서비스 현황 및 수신 상태를 분석하고 주파수를 선별하며 송출 시스템 송신 장비 운용 사항을 검토하고, 방송 시설을 설계합니다.","무선통신에 관한 공학 기초 지식을 바탕으로 이동전화, 레이다 설비, 방향탐지기, 팩시밀리, 공동시청안테나, 무선랜 등의 각종 무선설비 설계 및 설치공사를 감독 및 시공하는 기술적인 업무를 수행합니다."],aptitude:"공학 전문직"},957:{name:"평론가",wage:null,from:null,basis:null,year:null,sat:null,works:["평론가는 미술 전람회, 음악 연주회, 연극 공연, 영화 시사회 등에 참석하거나 TV 방송 프로그램을 보고 이에 대한 감상이나 비평을 작성합니다.","예술작품의 주제, 표현, 기술 등의 요인을 분석한 다음, 개인적 지식과 판단, 경험 등을 근거로 작품에 대한 평론서를 작성합니다.","작품에 대한 평론을 신문이나 전문 잡지에 기재하거나 방송 인터뷰 등에 응하기도 합니다."],aptitude:"작가 관련직"},8:{name:"물리학연구원",wage:6734,from:"워크넷",basis:"물리학연구원",year:2021,sat:"79.8",works:["물리학연구원은 자연현상의 기본 법칙을 규명하여 합리적으로 설명, 예측하고, 물리학적 원리와 기법을 산업, 의료, 군사 분야 등에 응용하기 위한 연구를 수행합니다.","물질과 구조의 운동, 전기나 빛 등 에너지의 발생과 이동, 물질과 에너지의 상호 관계에 대한 연구와 실험을 합니다.","물질과 에너지의 관계 등 물리학적 현상에 대해 관찰, 실험합니다.","고형 물질의 구조와 특성을 조사하기 위해 온도, 압력 등의 환경조건을 변화시켜 실험하고 반응을 연구합니다."],aptitude:"이학 전문직"},385:{name:"소방관",wage:4e3,from:"워크넷",basis:"소방관",year:2021,sat:"66.5",works:["소방관은 화재 및 사고를 예방하고, 화재, 사고 혹은 재난이 발생했을 경우 진화 작업, 긴급 구조, 구급 출동 등을 통해 사람을 구조하고 재산을 보호합니다.","화재 예방을 위하여 학교, 병원, 시장 등 건축물 소방시설의 안점을 점검하거나 건물 주변에 위험 요소가 있는지 순찰합니다.","화재가 발생하였을 경우 신속하게 출동하여 화재를 진압하며, 소방용수 시설을 관리하여 소방용수를 효과적으로 공급합니다.","교통사고, 건물 붕괴 등의 사고가 발생하였을 때 119구조대의 인명구조 활동, 위급한 환자와 장애인의 병원 이송 활동, 각종 재해로 인한 피해 복구 등의 활동을 합니다."],aptitude:"안전 관련직"},10062:{name:"학습장애간호사",wage:3665,from:"워크넷",basis:"간호사",year:2021,sat:"76.3",works:["학습장애간호사는 학습(발달)장애가 있는 사람이나 기타 도움이 필요한 사람들이 일상생활을 유지할 수 있도록 돕고, 이들에게 필요한 치료를 제공합니다.","환자의 상태를 진단하고 환자가 필요로 하는 의료 및 사회적 치료가 무엇인지 판단합니다.","환자가 스스로 의복을 갖추고, 쇼핑을 하고, 대중교통을 이용하는 등 일상생활을 할 수 있도록 돕습니다.","필요에 따라 환자의 가족과 보호자에게 상담을 제공하고, 치료에 동참하도록 독려합니다."],aptitude:"사회서비스직"},267:{name:"번역가",wage:3561,from:"워크넷",basis:"번역가",year:2021,sat:"71.7",works:["번역가는 외국어로 쓰인 문서, 보고서 또는 전문 서적 등을 우리말로 옮기거나 우리말을 외국어로 옮기는 작업을 전문적으로 합니다.","번역을 의뢰받은 원문의 정확한 이해를 위해 사전 및 기타 참고 자료를 수집하고, 원문을 연구하여 본래의 사상과 감정을 그대로 살려서 씁니다.","전문 서적의 경우 해당 분야 전문가나 번역 업체를 통해 전문 용어를 감수받아 잘못 번역된 부분이 없는지 확인합니다.","번역된 내용에 대한 수정, 보완, 교정 작업을 거쳐 완성본을 만듭니다."],aptitude:"작가 관련직"},1155:{name:"과수작물재배자",wage:3730,from:"워크넷",basis:"과수작물재배원",year:2021,sat:"60.3",works:["과수작물재배자는 사과, 배, 감귤 등의 과수 작물을 재배하고 수확하는 일을 합니다.","재배하는 과수 작물의 종류와 양을 결정하고 계획합니다.","사과, 배, 감귤 등의 과수 작물을 재배할 경작지와 종자, 비료, 농약 및 기계장비 등을 준비합니다.","병충해 방제를 위해 제초제나 살충제를 뿌리고, 병충해 피해를 막기 위해 봉지를 씌우기도 합니다."],aptitude:"농생명산업 관련직"},139:{name:"통신케이블설치 및 수리원",wage:3500,from:"워크넷",basis:"방송·통신·인터넷케이블설치·수리원",year:2021,sat:"62.3",works:["통신케이블설치 및 수리원은 통신망의 기초가 되는 통신선로를 전선, 다리, 선로 등에 시설하고, 정기적으로 유지하고 보수하는 일을 담당합니다.","설계도나 도면도에 따라 전화선이나 케이블선을 몇 가닥씩 묶어 연결합니다.","모든 선을 연결한 후에 물이나 기타 이물질이 선에 묻어 합선되는 등의 문제를 막기 위해 열수축관으로 통신선을 둘러쌉니다.","설치된 통신케이블을 정기적으로 점검하고 이상이 발견되면 수리합니다."],aptitude:"기능직"},963:{name:"원예기술자",wage:4500,from:"워크넷",basis:"원예작물재배원",year:2021,sat:"65.8",works:["원예기술자는 새로운 품종의 채소, 화훼 등을 기르고, 재배하고, 관리하는 일을 담당합니다.","채소, 화훼 등 새로운 품종의 원예를 재배하기 위해 품종 간 또는 개체 간 교배 등의 시험연구를 수행합니다."],aptitude:"농생명산업 관련직"},10:{name:"방사선사",wage:3833,from:"워크넷",basis:"방사선사",year:2021,sat:"77.0",works:["방사선사는 의사를 보조하여 신체의 질병, 장애를 진단하기 위해 각종 방사선 장비를 조작하고, 방사성물질을 이용하여 치료하는 업무를 수행합니다.","신체 특정 부위에 대한 치료를 위해 X선(X-ray) 검사, 전산화단층촬영(CT : Computed Tomography) 검사, 자기공명영상촬영(MRI : Magnetic Resonance Imaging), 초음파 검사 등을 통해 환자의 상태를 정밀하게 진단합니다.","방사선 촬영과 치료를 위해 환자를 고정시키고, 의사의 지도에 따라 검사받지 않는 다른 신체 부위가 방사선에 노출되지 않도록 방사선 노출 범위와 강도를 조절하여 치료합니다.","방사선 촬영 결과를 정리, 분석하여 보고서를 작성하고, 의사에게 전달하며, 치료 기록을 관리합니다."],aptitude:"의료관련 전문직"},386:{name:"언어치료사",wage:3108,from:"워크넷",basis:"언어치료사",year:2021,sat:"69.3",works:["언어치료사는 언어장애의 증상과 원인을 진단하고, 이에 대한 치료 계획을 세워 환자를 치료합니다.","환자의 발음, 지능 및 어휘력 측정을 위하여 각종 검사를 실시하여 조음장애, 언어 지체, 실어증, 음성 장애 등 언어장애의 원인과 유형 및 심각한 정도를 진단합니다.","사회관계 형성 및 유지에 필요한 언어 사용 능력을 증진시키기 위해 단어, 글자, 그림 카드, 퍼즐 등 도구를 사용하거나 및 집단적 치료를 수행하기도 합니다.","언어장애 환자와 환자 기족 및 담당 교사를 대상으로 상담 또는 지도 활동을 합니다."],aptitude:"보건의료 관련 서비스직"},10063:{name:"사설탐정",wage:null,from:null,basis:null,year:null,sat:null,works:["범죄를 확인하고 법정 소송에 필요한 정보를 얻기 위하여 용의자, 범죄 사실, 혹은 권리 침해 사항에 관한 정보를 얻고 분석합니다.","사람의 사망, 상해, 화재, 교통사고, 물건의 파손과 훼손 등 각종 사고의 원인 및 책임을 조사합니다.","사라진 사람, 상속인, 소유자가 분명하지 않은 재산의 소유자, 국내외로 도망간 죄인 등 특정인에 대한 정보를 탐지합니다."],aptitude:"일반 서비스직"},268:{name:"사서",wage:3204,from:"워크넷",basis:"사서",year:2021,sat:"73.3",works:["사서는 각 기관의 도서관과 자료실에서 도서 및 자료를 배치하고 보관하며 이용자가 자료를 편리하게 열람 및 대출할 수 있도록 지원합니다.","이용자가 열람 및 대출하고자 하는 자료를 요청할 경우 검색을 통하여 자료를 신속하게 찾을 수 있도록 도와주고 대출을 희망하면 절차에 따라 대출을 해 줍니다.","이용자가 자료를 반납하고자 할 때에 자료와 대출자를 확인하고 파손 여부를 점검한 뒤 서가에 재배치합니다.","자료의 내용, 주제에 따라 도서 자료를 분류하고, 규정된 분류 체계에 따라 분류 연호와 표제를 결정합니다."],aptitude:"사무 관련직"},1156:{name:"조림 영림 및 벌목원",wage:4196,from:"워크넷",basis:"조림·산림경영인및벌목원",year:2021,sat:"56.7",works:["조림 영림 및 벌목원은 숲에 나무를 심어 가꾸며, 각기의 용도에 따라 사용할 나무를 베는 벌목 작업을 담당하기도 합니다.","조림원은 심은 나무들이 잘 성장할 수 있도록 가지치기 등의 손질을 하고 병충해 방제 작업을 수행합니다.","벌목원은 가구 제작 등의 여러 목적에 사용할 나무를 정해 벌목합니다.","영림원은 산불을 감시하고 방지하며 산불 진화 활동에 참여하기도 하며, 나무의 수피나 수액 등의 각종 임산물을 채취하기도 합니다."],aptitude:"농생명산업 관련직"},140:{name:"통신장비기사",wage:3937,from:"워크넷",basis:"통신장비기사",year:2021,sat:"67.8",works:["통신장비기사는 무선중계기시스템, 유선통신장비, 무선통신장비, 위성통신장비 등의 장비를 유지하고 관리하며 운용합니다.","설치 접수증을 확인하여 설치할 장소와 통신 장비의 종류를 확인합니다.","설계 도면을 검토하여 통신선로를 분리하고 수동 공구, 전기인두 등을 사용하여 전화기, 팩시밀리 등에 통신선로를 연결합니다.","설치가 완료되면 선로시험원에게 연락하여 선로의 장애 유무를 확인합니다."],aptitude:"기능직"},966:{name:"안무가",wage:3200,from:"워크넷",basis:"안무가",year:2021,sat:"69.8",works:["안무가는 무대, 영화, 텔레비전 등의 공연을 위해 공연의 주제에 맞춰 춤을 고안하고, 무용수들에게 춤을 가르치는 일을 담당합니다.","표현하려고 하는 이미지를 리듬이 담긴 동작으로 감정을 곁들여 춤으로 구성합니다.","춤을 잘 출 수 있도록 무용가나 백댄서를 연습시키고 지도합니다."],aptitude:"무용 관련직"},13:{name:"생물학연구원",wage:4835,from:"워크넷",basis:"생물학연구원",year:2021,sat:"75.3",works:["생물학연구원은 생명체에 대한 기원, 발달, 구조, 해부, 환경 등에 대해 연구하고, 연구 결과를 의학, 농업 등 다른 분야에 적용하거나 응용하는 방법을 연구, 개발합니다.","생명체의 기원, 발달, 구조, 환경, 기타 생활방식 등에 대한 현지 조사와 실험실 연구를 수행합니다.","과학 장비들을 사용하여 실험실에서 생물 표본을 연구하고 실험합니다.","통계학적 기술을 이용해서 자료를 분석하고 평가합니다."],aptitude:"이학 전문직"},388:{name:"여행안내원",wage:3154,from:"워크넷",basis:"여행안내원",year:2021,sat:"65.5",works:["여행안내원은 국내외를 여행하는 개인이나 단체 여행객을 대상으로 쾌적하고 보람 있는 여행을 할 수 있도록 도와주는 모든 업무를 담당합니다.","여행 출발 전 여행객의 여행 목적을 파악하고, 여행 방문지에 대한 정보를 수집하여 숙박 시설, 교통편, 관광지 등 모든 사항을 확인합니다.","여행객들에게 여행 일정에 대해 설명하고, 여행을 인솔하며, 관광지에 관련된 역사, 문화, 정보 등을 안내합니다.","외국인을 대상으로 하는 여행안내원은 공항 마중부터 환전, 호텔, 택시 이용, 관광지 안내 등 외국인 관광객들에게 관광에 대한 다양한 편의를 제공합니다."],aptitude:"일반 서비스직"},10064:{name:"범죄과학수사관",wage:null,from:null,basis:null,year:null,sat:null,works:["지문, 글씨체, 문서, 통신, 의료, 생화학, 또는 금속 분야 등의 영역에서 전문가로서의 역할을 수행하거나 타 분야의 전문가와 협의하여 범죄 과정을 추리합니다.","범죄 현장의 증거 수집 및 분석을 통해 범죄 현장을 재구성하고 조사 및 분석 기법 또는 분석 결과에 대해 법원에서 증언을 합니다.","각종 범죄와 관련된 컴퓨터 메모리 하드디스크, USB 메모리 등에 대한 증거 수집, 증거 복구 및 분석을 통해 범죄 증거를 제시합니다."],aptitude:"이학 전문직"},269:{name:"정치학연구원",wage:6358,from:"워크넷",basis:"정치학연구원",year:2021,sat:"78.3",works:["정치학연구원은 정치제도, 정치운동, 국제정치 상황 등의 연구를 통해 정치 이론을 정립 및 발전시키며 관련 자료를 분석하여 정부, 정당 및 기타 단체에게 정치 관련 자문을 하기도 합니다.","여러 정치 이론과 사상을 바탕으로 실제 행정, 정당제도, 정부와 기업의 관계, 국제사회 관계 등의 제반 문제와 이에 대한 대응 및 해결 방법을 연구합니다.","당대의 정치제도와 정치 관행을 관찰하고 관련 자료들을 분석하여 정부, 정당 및 기타 사회단체에게 정치 관련 자문을 하기도 합니다.","자료를 수집 및 분석하고 정부, 정당 및 기타 단체가 이용하기에 적합한 형식으로 연구 내용과 결론을 발표합니다."],aptitude:"인문 및 사회과학 관련직"},1157:{name:"원양어부",wage:2443,from:"워크넷",basis:"어부및해녀",year:2021,sat:"60.7",works:["원양어부는 먼바다로 나아가 참치, 대구 등의 물고기를 잡습니다.","그물 등의 장비나 미끼를 이용하여 물고기를 잡고, 잡은 고기들을 종류별로 분류합니다.","잡은 물고기 등은 씻어서 소금에 절이거나 냉동고에 보관하여 시장에 판매할 준비를 합니다."],aptitude:"농생명산업 관련직"},142:{name:"트럭운전기사",wage:3833,from:"워크넷",basis:"화물차·특수차운전원",year:2021,sat:"56.8",works:["트럭운전기사는 각종 화물을 수송하기 위해 트럭을 운전하는 일을 담당합니다.","화물의 운송 목적지를 확인하고 트럭의 엔진 오일, 냉각수, 타이어의 공기압력 상태 및 각종 안전장치의 이상 여부를 점검합니다.","국가 간 도로를 이용하여 수하물을 운송하는 데 필요한 서류를 구비합니다.","목적지에 도착하여 운송한 화물이 안전하게 운송되어 왔는지를 확인하고 화물 운송과 관련된 서류를 정리한 다음, 관련 부서에 화물과 서류를 인계합니다."],aptitude:"일반운전 관련직"},968:{name:"시인",wage:2450,from:"워크넷",basis:"소설가",year:2021,sat:"64.3",works:["시인은 자연, 인생 등 여러 현상에 대한 인간의 사상과 감정을 운율이 있는 언어로 표현합니다.","자연, 인생 등 여러 현상을 작가의 주관적이고 독특한 시각으로 관찰하여 시적 어구로 정리합니다.","다양하고 현실성 있는 소재 발굴을 위해 취재를 하거나, 다양한 사람들과의 접촉 등을 통하여 정보를 수집하고 창작에 반영합니다."],aptitude:"작가 관련직"},15:{name:"수의사",wage:6216,from:"워크넷",basis:"수의사",year:2021,sat:"74.4",works:["수의사는 개, 고양이, 소, 돼지, 물고기, 어패류 등 동물의 질병과 상해를 예방, 진단, 처방, 치료하고 자문하며 연구하는 업무를 수행합니다.","각종 검사를 통해 아픈 동물의 질병을 진단, 처방, 치료하고, 동물의 분만을 돕거나 외과수술을 시행하며, 동물 질병에 대한 역학조사와 위생 관리를 통해 질병을 예방합니다.","육류, 우유, 계란 등 축산물에 대한 검사를 시행하고, 수입통관되는 축산물에 대한 검역을 실시합니다.","동물원과 수족관에 사는 각종 동물의 영양상태, 번식, 사육, 질병을 관리합니다."],aptitude:"의료관련 전문직"},390:{name:"신호원 및 수송원",wage:4300,from:"워크넷",basis:"신호원및수송원",year:2021,sat:"67.0",works:["신호원 및 수송원은 철도 교통이 원활하고 효율적으로 운행될 수 있도록 신호기 등을 조작하고, 수신호나 깃발 신호로 열차의 속도나 정지 등을 조정합니다.","신호원은 열차 운전원과 연락하여 열차의 운행 계획이나 시간표 등을 확인하고 역내로 진입하는 열차를 관찰하면서 연결선로와 신호기를 점검합니다.","수송원은 역내, 광산, 채석장 및 산업체 등에서 운반할 화물과 도착지가 지정된 명령문을 확인합니다.","수송원은 차량의 연결 순서를 결정하고 수신호나 깃발신호로 철도 신호원에게 신호를 보내어 열차를 지정된 철도 노선으로 인도합니다."],aptitude:"일반운전 관련직"},10065:{name:"야외활동지도사",wage:null,from:null,basis:null,year:null,sat:null,works:["전문적인 장비와 기술이 필요한 레저스포츠를 안전하게 즐길 수 있도록 지도합니다.","체험자가 야외활동을 만끽하고 자연에 대해 잘 이해할 수 있도록 지도하고 지원합니다.","야외활동에 필요한 안전시설을 설치하고 이를 관리합니다."],aptitude:"일반 서비스직"},270:{name:"성우",wage:3678,from:"워크넷",basis:"성우",year:2021,sat:"73.0",works:["성우는 라디오, 텔레비전, 영화녹음 등에서 연기의 감정을 자신의 목소리에 실어 연기합니다.","방송 연출가로부터 역할을 배정받고 텔레비전이나 라디오의 각종 프로그램에서 극의 내용, 분위기, 대사, 역할 등을 소화하여 목소리 연기를 합니다.","외국 영화의 대사를 우리말로 녹음할 때, 배역의 성격과 내용에 따라 어린이, 청소년, 노인 등 다양한 목소리를 연기합니다.","영화녹음 또는 외국영화의 대사를 우리말로 녹음하며, 교양프로그램을 해설하거나 라디오와 방송의 사회를 보기도 합니다."],aptitude:"연기 관련직"},1158:{name:"자동조립라인 및 산업용로봇조작원",wage:4403,from:"워크넷",basis:"자동조립라인·산업용로봇조작원",year:2021,sat:"70.4",works:["자동조립라인 및 산업용로봇조작원은 생산 현장의 자동 또는 반자동 조립라인을 조작하거나 산업용 로봇을 조작하는 일을 담당한다.","자동차 등의 기업체 생산 현장에서 자동, 반자동 조립라인을 제어하고 조작합니다.","로봇의 수행 작업에 대한 프로그램을 작성하고 관리합니다.","로봇의 움직임을 관찰하고 정확한 작업을 수행하는지 점검합니다."],aptitude:"기능직"},143:{name:"판금원",wage:3730,from:"워크넷",basis:"판금원및판금기조작원",year:2021,sat:"64.5",works:["판금원은 철판, 알루미늄, 동, 주석 등과 같은 얇은 금속판을 가공하여 자동차, 선박, 가전제품 등에 사용되는 각종 금속제품을 제작합니다.","도면이나 작업지시서를 검토하여 어떤 제품을 제작해야 하는지 파악하고, 제품의 제작 전개도를 그립니다.","해머, 측정용 공구, 펀치, 절단기, 컴퓨터 등을 이용하여 얇은 금속판으로 필요한 공작물을 제작합니다.","금속판을 절단, 절곡, 천공, 조립, 용접하기 위하여 다양한 수공구 및 동력 공구를 기술적으로 사용합니다."],aptitude:"기능직"},973:{name:"소설가",wage:2450,from:"워크넷",basis:"소설가",year:2021,sat:"64.3",works:["소설가는 소설의 주제를 결정하고 그 주제를 가장 효과적으로 나타낼 수 있는 소재들을 찾아 적절하게 구성하여 예술적으로 표현합니다.","소재를 찾기 위해 취재를 하거나, 다양한 사람들과 접촉 등을 통해 정보를 수집하고 창작에 반영합니다.","소설의 줄거리나 등장인물을 결정하고 등장인물의 성격, 줄거리 전개, 심리 묘사, 사회적 배경 등을 구상하여 작품을 씁니다."],aptitude:"작가 관련직"},17:{name:"수학연구원",wage:5387,from:"워크넷",basis:"수학·통계학연구원",year:2021,sat:"81.3",works:["수학연구원은 수학적 지식과 이론에 대해 연구하며, 수학적 이론과 기법을 활용하여 경제학, 과학, 공학 등의 문제를 해결하기 위한 연구를 수행합니다.","대수학, 기하학, 확률과 같은 전통적인 수학 분야와 자연과학, 엔지니어링, 컴퓨터공학, 경영과 같은 기타분야의 문제해결을 위한 응용수학기술 분야 등에서 수학적 지식을 확장하기 위한 연구를 수행합니다.","순수수학연구원은 자연현상을 관찰해 얻어진 일반적인 생각을 논리적인 모순이 없는 수학적 모형으로 만든 다음 그 모형을 분석해서 이론을 개발합니다.","응용수학연구원은 순수수학 연구를 통해 얻어진 수학적 모형을 암호학, 컴퓨터 공학, 엔지니어링, 금융 수학 등에 적용하는 연구를 수행합니다."],aptitude:"이학 전문직"},391:{name:"운동경기심판",wage:3937,from:"워크넷",basis:"경기심판",year:2021,sat:"67.0",works:["운동경기심판은 각종 운동경기의 규칙을 적용하여 경기를 진행하는 일을 담당합니다.","경기의 시작과 종료를 알리며, 경기 진행 중 선수들의 동작을 관찰하여 규칙 위반이 발견되면 이를 호루라기, 수신호, 깃발, 카드 등으로 알리고 벌칙 또는 벌점을 적용합니다.","경기 도중 선수의 부상 등 예기치 못한 상황이 발생하면 경기를 일시 중단하거나 종료합니다.","규칙으로 명시되어 있지 않은 상황이 생긴 경우 심판의 재량으로 판단하여 경기가 원활하게 진행될 수 있도록 합니다."],aptitude:"운동 관련직"},10066:{name:"스포츠기록분석연구원",wage:null,from:null,basis:null,year:null,sat:null,works:["스포츠기록분석연구원은 각종 스포츠 경기의 모든 요소들을 수치적 데이터로 기록하고 이를 분석하는 일을 전문적으로 수행하는 사람을 말합니다.","육상, 수영 등의 개인 종목을 포함해 축구, 야구 등 단체 종목에서 나오는 기록들을 체계적으로 정리하여 경기의 특성과 내용에 맞게 분석하고 수치로 나타나는 객관적인 근거를 통해 상대 팀이나 선수의 기록과 전략을 파악합니다.","스포츠 경기를 객관적으로 분석하기 위한 기록 시스템과 분석 기법을 개발하고 분석 기법과 통계를 활용한 학문적인 연구 또한 스포츠기록분석연구원이 수행하는 주요한 업무입니다."],aptitude:"기타 게임·오락·스포츠 관련직"},271:{name:"아나운서",wage:4766,from:"워크넷",basis:"아나운서",year:2021,sat:"79.8",works:["아나운서는 라디오와 텔레비전 방송을 통하여 각종 정보를 전달하고 프로그램을 진행합니다.","방송 직전에 미리 이야기해야 할 내용이 적혀 있는 대본을 여러 번 읽고 무엇에 관한 내용인가를 파악하고 방송 진행 중에 쉽게 알아볼 수 있도록 표시를 해 둡니다.","앵커는 준비된 뉴스를 발표하고 취재기자와 연결하여 현장의 상황을 전달합니다.","스포츠캐스터는 운동경기를 현지에서 중계하거나 녹화방송을 합니다."],aptitude:"언어 관련 전문직"},1255:{name:"수질환경연구원",wage:4144,from:"워크넷",basis:"수질환경기술자및연구원",year:2021,sat:"78.8",works:["수질환경연구원은 지역의 수질오염 상태를 측정하고, 연구와 실험분석을 통해 수질오염 개선 및 방지에 대한 대책을 연구합니다.","수질오염 측정 및 분석 도구를 이용하여 지역의 수질 특성과 수질오염 정도를 조사합니다.","폐수를 조사하여 오염 원인을 분석하고 방지 대책을 세웁니다.","이미 발생한 수질오염 물질을 제거하고, 수질오염을 감소시키기 위한 방법을 연구합니다."],aptitude:"이학 전문직"},144:{name:"펄프 및 종이 생산직",wage:3522,from:"워크넷",basis:"펄프·종이제조장치조작원",year:2021,sat:"56.0",works:["펄프 및 종이 생산직은 각종 식물성 물질, 섬유, 펄프 등을 가공하여 종이나 판지 등을 생산하는 기계를 조작합니다.","작업명세서를 통해 종이 제작에 필요한 식물성 물질, 섬유, 펄프, 약품 등과 장비를 준비합니다.","벌목한 나무의 껍질을 벗긴 후에 나무를 파쇄하여 죽처럼 만들어서 종이 형성에 적당한 농도로 농축시킨 후에 표백하고, 약품과 일정한 비율로 배합하여 종이 원료를 만듭니다.","헌 신문이나 잡지, 기타 폐지를 물과 약품에 섞어서 작은 섬유 입자로 풀어준 후에 폐지 속의 잉크 입자를 제거하고, 약품과 일정한 비율로 배합하여 종이 원료를 만듭니다."],aptitude:"기능직"},975:{name:"사진사",wage:3522,from:"워크넷",basis:"사진작가및사진사",year:2021,sat:"71.1",works:["사진사는 각종 카메라와 보조 장비를 이용하여 인물, 사물 및 자연 풍경 등을 촬영한 다음, 필름을 현상하고 사진을 인화, 수정, 완성합니다.","사진사는 사진을 촬영할 수 있는 모델이나 장소를 섭외하기도 하고, 사람들의 요청에 따라 증명사진을 찍기도 합니다.","현미경 사진, 천체 사진, 의학 사진 등 특수한 사진을 찍는 일을 수행하기도 합니다."],aptitude:"영상 관련직"},19:{name:"의료장비기사",wage:null,from:null,basis:null,year:null,sat:null,works:["의료장비기사는 병원에서 사용되는 의료 장비의 성능을 개선하거나 새로운 장비를 연구하고 개발하는 업무를 수행합니다.","의료 장비를 적절한 장소에 설치하고 신규기기에 대한 설치부터 폐기 시까지 성능 관리와 정비, 안전 점검 등을 수행하며, 의료기기 사용자의 교육을 진행합니다.","의료 장비에 이상이 있는 경우 고장 난 부분을 찾아내고 부품을 교체하고 수리합니다.","사용자와 함께 의료기기와 관련된 기술적 내용을 협의, 검토, 개발합니다."],aptitude:"기능직"},392:{name:"스포츠트레이너",wage:3600,from:"워크넷",basis:"스포츠트레이너",year:2021,sat:"67.7",works:["스포츠트레이너는 운동선수들의 건강상태를 확인하고 선수들이 경기에서 최상의 컨디션을 발휘할 수 있도록 조언하고 훈련을 시킵니다.","운동감독 및 코치와의 협의를 통해 운동 종목, 선수들의 포지션과 선수 개인의 기량에 따라 필요한 운동량을 결정하고 근육 단련을 위해 규칙적인 운동과 식이요법을 지시합니다.","부상을 당한 선수들에게 응급 조치를 하고, 의사의 진단 결과에 따라 재활훈련을 계획하고 실시합니다.","선수들의 부상을 예방하기 위해 마사지를 해 주고 안전교육을 실시합니다."],aptitude:"운동 관련직"},10067:{name:"비디오게임디자이너",wage:4500,from:"워크넷",basis:"게임프로그래머",year:2021,sat:"70.8",works:["비디오게임디자이너는 게임의 줄거리, 등장인물의 캐릭터, 행적에 대한 이야기의 틀을 잡습니다. 또한 하나 또는 다수의 캐릭터 입장에서 진행되는 이야기인 롤플레잉 방법(role-play mechanics)을 구체화합니다.","구체화된 게임 기획안에 따라 프로그래머, 작가, 애니메이터 등의 개발 팀원들을 지휘하며 소프트웨어 제작 과정을 총괄하여 감독합니다.","계획된 제작 일정에 맞추어 프로토타입을 개발하고 재미 요소나 구현 가능성을 검증한 후 게임의 다양한 콘텐츠를 균형 있게 경험할 수 있도록 조정합니다."],aptitude:"웹·게임·애니메이션 관련직"},272:{name:"언어학연구원",wage:7045,from:"워크넷",basis:"언어학연구원",year:2021,sat:"78.8",works:["언어학연구원은 언어를 과학적 연구 방법을 통해 특정 언어나 언어 집단의 구조, 변천, 발달 과정을 객관적, 체계적으로 연구합니다.","고어와 현대어에 대한 비교연구를 통해 언어의 기원, 구조, 진화를 연구하고, 언어의 어족과 기원에 따라 고대 및 현대의 불명료한 언어를 분류하고 분석합니다.","특정 언어나 언어집단의 비교연구를 통해 단어와 문장구조의 기원과 변천을 조사하고 연구합니다."],aptitude:"인문 및 사회과학 관련직"},1256:{name:"커플매니저",wage:3358,from:"워크넷",basis:"웨딩플래너",year:2021,sat:"61.8",works:["커플매니저는 결혼을 전제로 이성과의 교제를 계획하는 남녀 고객들에게 각자의 이상에 적합한 배우자를 찾아 그들의 만남을 주선하는 일을 담당합니다.","상담을 통해 회원의 학력, 신체 조건, 직업 등의 인적 사항과 이상형, 인생관, 용모, 태도 등에 대한 정보를 수집·기록합니다.","커플 연결 시스템을 이용하거나 또는 상담원의 전문적인 의견과 경험을 가지고 회원에게 적합한 상대를 찾고, 그들의 만남을 주선합니다.","만남 주선 후, 회원의 반응을 확인하여 지속적인 만남을 유지할 것인지 또는 회원에게 새로운 만남을 주선할 것인지를 결정합니다."],aptitude:"매니지먼트 관련직"},145:{name:"재활용 처리 및 소각로 조작원",wage:3600,from:"워크넷",basis:"재활용처리장치·소각로조작원",year:2021,sat:"54.7",works:["재활용 처리 및 소각로 조작원은 일반 및 산업 폐기물을 처리하는 소각로를 조작하는 일을 합니다.","소각로의 중앙통제 장치를 조작해서 일반 및 산업 폐기물을 소각하고, 폐기물 등의 소각이 잘 처리되었는지를 확인합니다.","소각로를 정기적으로 점검하고 이상이나 고장이 발생하면 직접 수리하거나 수리를 요청합니다."],aptitude:"기능직"},976:{name:"사진기자",wage:3522,from:"워크넷",basis:"사진작가및사진사",year:2021,sat:"71.1",works:["사진기자는 신문이나 잡지 등에 게재되는 뉴스, 스포츠, 연예 등 관련 분야의 현장 보도사진을 찍습니다.","독자의 관심과 흥미를 불러일으킬 수 있는 사건, 사고 현장 및 장소를 찾아 사건, 사고의 전개 과정이나 정보의 중요성에 따라 주요 장면을 사진 촬영합니다.","촬영한 사진을 현상하고 편집하여 기사나 정보의 순서에 맞게 편집부에 제공합니다."],aptitude:"영상 관련직"},20:{name:"심리학연구원",wage:5698,from:"워크넷",basis:"심리학연구원",year:2021,sat:"74.7",works:["심리학연구원은 인간의 행동과 정신적 과정을 과학적으로 연구하고, 연구 결과를 의학, 교육, 산업 현장에 적용할 수 있는 심리학적 지식과 정보를 제공합니다.","인간과 동물에 관한 실험과 관찰을 계획하고 수행합니다.","지능, 능력, 적성, 인성, 기타 인간 행동을 측정하는 검사를 개발하고 시행하며, 검사 자료를 분석하고 해석합니다.","환경과 개인의 사상, 행동에 관한 요소 등을 분석합니다."],aptitude:"인문 및 사회과학 관련직"},395:{name:"유치원교사",wage:3e3,from:"워크넷",basis:"유치원교사",year:2021,sat:"67.9",works:["유치원교사는 학교에 입학하기 전인 아동에게 필요한 교육을 합니다.","아동들의 지적, 정서적, 사회적 발달을 위한 교육활동을 합니다.","유아들이 직접 참여할 수 있는 다양한 수업 방법(발표, 토의, 조사, 견학, 발표회 등)을 계획하고 활용하여 지도합니다.","등원, 정리 정돈, 평가, 집단활동(토의, 게임, 요리 등) 및 실외활동 진행, 급식 및 간식 제공, 하원,교육과정의 계획 및 운영 등의 일을 합니다."],aptitude:"교육관련 서비스직"},10068:{name:"게임감시관 및 조사관",wage:null,from:null,basis:null,year:null,sat:null,works:["직원 및 고객의 부정행위 또는 도난 등과 같은 카지노호텔의 비정상적 활동을 감시하고 사전에 예방하는 역할을 수행합니다.","카지노하우스 룰, 주정부 및 연방정부 규정 준수, 직원의 빠르고 정중한 서비스 제공 여부 등 게임 활동 전반을 모니터링합니다."],aptitude:"웹·게임·애니메이션 관련직"},273:{name:"역사학연구원",wage:4662,from:"워크넷",basis:"역사학연구원",year:2021,sat:"79.4",works:["역사학연구원은 선사시대부터 현대에 이르기까지 정치, 경제, 사회, 문화 등 인간 활동에 대해 조사하고 그와 관련한 역사적 사실을 기록하고 연구합니다.","도서관과 기록 보관소의 자료 또는 개인 소장 자료로부터 역사적으로 유용한 자료들을 수집 및 분석하고 평가합니다.","역사관의 흐름, 역사의 시대 구분, 역사 인식 문제 등을 연구하여 현대 사학의 과제를 인식하고 사료를 비판적으로 탐구하며 역사 이론의 당면 문제들을 연구합니다.","과거 사건에 대한 원본 자료와, 당대의 기록과 유물을 조사하고 연구하며, 관련 자료와 비교하여 역사적 사실을 판단합니다."],aptitude:"인문 및 사회과학 관련직"},1257:{name:"병원코디네이터",wage:3108,from:"워크넷",basis:"의료코디네이터",year:2021,sat:"68.3",works:["병원코디네이터는 양질의 의료서비스를 제공하기 위해 환자 상담과 지속적 관리, 직원 친절 서비스 교육, 병원 이미지 개선을 위한 일을 합니다.","환자의 고민이나 불만 사항을 병원에 전달하고, 환자의 만족도를 높이기 위해 차별화된 서비스를 기획합니다.","고객 서비스 개선, 환자 상담과 사후관리, 진료 계획 수립, 병원 서비스 품질관리를 수행합니다.","직원들의 서비스 교육을 담당하며 병원의 이미지 홍보를 위한 마케팅 전략을 수립하고 실행합니다."],aptitude:"보건의료 관련 서비스직"},147:{name:"플라스틱제품제조원",wage:3200,from:"워크넷",basis:"고무·플라스틱제품조립원",year:2021,sat:"53.2",works:["플라스틱제품제조원은 각종 플라스틱 제품을 제작하기 위해 여러 화학 재료를 혼합 및 가공하는 기기 및 장치를 조작합니다.","작업지시서에 따라 필요한 재료를 준비하여 계량하고, 일정 비율로 배합하여 플라스틱제품 제조기기에 투입합니다.","합성수지, 안료 등의 각종 재료를 계량하고 일정 비율로 배합하고 제조 공정에 따라 부착물을 장착합니다.","재료 및 부품을 공정에 따라 혼합, 사출, 압출, 압착, 주입, 성형, 조립, 마무리하는 각종 기계장치를 조정 및 조작합니다."],aptitude:"기능직"},978:{name:"보일러공",wage:3870,from:"워크넷",basis:"보일러설치·정비원",year:2021,sat:"64.2",works:["보일러공은 산업용 및 건물 난방용 보일러를 설치하고, 고장 난 보일러를 수리하는 일을 담당합니다.","건축물의 시공 도면에 따라 보일러를 설치할 위치를 확인하고, 천장, 바닥, 벽면 등에 구멍을 뚫어 보일러 장치를 설치합니다.","보일러 본체와 부속 설비 계기판의 온도, 압력, 수위 등의 이상 여부를 원격으로 확인합니다."],aptitude:"기능직"},21:{name:"안경사",wage:3500,from:"워크넷",basis:"안경사",year:2021,sat:"71.6",works:["안경사는 고객에게 안경과 콘택트렌즈를 처방하고 맞추며, 시력 보조 기구의 사용법을 알려줍니다.","고객의 시력, 난시, 안질환 등을 확인한 후 교정 도수를 결정하고, 적합한 안경 렌즈나 콘택트렌즈를 선별하며, 고객의 눈 상태에 대해 설명합니다.","고객의 얼굴 형태, 눈의 크기, 각막의 두께 등을 측정하여 고객에게 가장 적합한 크기와 모양의 안경테를 추천해줍니다.","시력 검사를 통해 교정 도수를 정확하게 검출하여 손상된 시력을 교정해 줍니다."],aptitude:"보건의료 관련 서비스직"},396:{name:"음악치료사",wage:2901,from:"워크넷",basis:"예술치료사",year:2021,sat:"73.8",works:["음악치료사는 음악을 이용해 사람의 신체와 정신을 치료하는 일을 합니다.","우울증, 불안증 등 정신적인 어려움이 있는 사람을 대상으로 음악치료 진단평가, 음악치료 계획 수립 및 음악치료를 실시하고 그 결과를 평가합니다.","어려움이 있는 사람과 함께 피아노, 북, 꽹과리 등 악기를 이용해 즉흥 연주 및 작곡을 하며 음악적 표현을 이끌어 내고, 음악연주를 통해 나타나는 개인의 상태를 진단하고 평가합니다.","진단 결과와 환자의 특성에 따라 음악적 치료 방법을 계획하고 제시합니다."],aptitude:"음악 관련직"},10069:{name:"목소리코치",wage:null,from:null,basis:null,year:null,sat:null,works:["기업 대표, 정치인 등 대중을 상대로 연설이나 발표를 자주 해야 하는 사람이 자신감 있게 말할 수 있도록 지도합니다.","목소리의 문제점을 파악하여 그에 적합한 훈련을 실시합니다.","정확한 발음을 위한 훈련을 통해 명확하게 말할 수 있도록 지도합니다."],aptitude:"일반 서비스직"},278:{name:"카피라이터",wage:4248,from:"워크넷",basis:"광고·홍보·마케팅전문가",year:2021,sat:"69.2",works:["카피라이터는 기발한 아이디어나 감수성으로 특정 상품이나 서비스가 일반인들에게 쉽게 기억될 수 있는 광고 문구나 문안을 작성하는 일을 담당합니다.","상품 또는 용역에 관한 정보를 얻고 광고 문안의 길이와 형태 등을 토의하기 위해 광고주 및 시장조사 분석가와 협의합니다.","광고의 배경 정보를 얻기 위해 조사와 인터뷰를 수행하고, 광고 문안을 작성하기 위해 상품의 시장조사, 소비자 성향 조사 등의 자료를 검토합니다.","광고전략에 따라 광고 문안, 즉 표제어, 부제어, 본문, 슬로건 등을 작성합니다."],aptitude:"작가 관련직"},1259:{name:"마술사",wage:4579,from:"워크넷",basis:"공연·영화·음반기획자",year:2021,sat:"65.9",works:["마술사는 재빠른 손 기술, 카드, 동전, 마술 상자 등을 사용하여 신기한 속임수를 개발하고, 무대에 올라 관중들 앞에서 다양한 마술 공연을 합니다.","마술 공연을 위해 도구, 음악 조명, 무대장치 등을 준비하고 공연을 기획합니다.","마술을 개발하기 위해 기술을 연구하고, 마술 도구를 직접 제작하기도 합니다.","마술사는 공연 일정 외에도 학교나 학원 등에서 마술 관련 강의를 하기도 합니다."],aptitude:"디자인 관련직"},148:{name:"항공교통관제사",wage:5387,from:"워크넷",basis:"항공교통관제사",year:2021,sat:"78.7",works:["항공교통관제사는 항공기의 안전한 이착륙을 돕기 위하여 비행기조종사에게 기상, 풍속 등의 정보를 제공하고 항공교통을 지휘합니다.","관제탑에서 항공기의 이륙 및 착륙 신고서를 확인하고 활주로 및 공항 주변의 기상 상태를 점검합니다.","해당 항공기의 이착륙 활주로, 예정 시간, 순서 등을 배정하여 항공기를 유도하고 이착륙을 허가합니다.","접근관제소에서 운항 중인 항공기의 위치와 고도 등을 확인하고 항로의 상태를 파악하여 고도의 상승 및 강하 수준을 지시합니다."],aptitude:"고급 운전 관련직"},985:{name:"공업기계설치 및 정비원",wage:3665,from:"워크넷",basis:"공업기계설치·정비원",year:2021,sat:"63.4",works:["공업기계설치 및 정비원은 각종 제품 생산에 사용되는 기계를 설치하고, 기계의 고장을 확인하여 이를 수리합니다.","기계 설계 도면에 따라 기계설비의 설치 위치를 정하고, 기계를 설치한 다음 시험 가동을 하여 기계의 작동상태를 확인합니다.","장비나 기계의 작동불능 등 고장 원인을 분석하고, 드라이버 등 각종 기공구 및 측정 장비를 이용하여 고장 부위를 수리합니다."],aptitude:"기능직"},23:{name:"약사 및 한약사",wage:6500,from:"워크넷",basis:"약사",year:2021,sat:"76.1",works:["약사는 의사의 처방전이나 공인된 조제 방법에 의해 약을 조제하고, 환자나 보호자를 대상으로 질병 치료와 건강 유지에 대한 상담 업무를 수행하며, 한약사는 한약 및 한약제제의 생산, 제조, 조제, 유통, 가공, 연구, 판매 등의 업무를 수행합니다.","의사의 처방전에 이상이 없는지 확인한 후 약물의 무게와 양을 측정하여 제조합니다.","조제된 약의 복용 시 주의 사항, 부작용 위험 등을 설명하면서 투여 경로, 투여량, 투여 간격 등 복용 방법을 확인시켜 줍니다.","제약회사에 근무하는 경우 새로운 의약품을 연구, 개발하고 약품의 효능을 재평가하거나 부작용을 연구합니다."],aptitude:"의료관련 전문직"},397:{name:"응급구조사",wage:4144,from:"워크넷",basis:"응급구조사",year:2021,sat:"67.8",works:["응급환자가 발생한 현장에서 구조 업무를 하며, 법령에 정해진 범위 내에서 현장의 응급처치, 환자의 이송을 담당합니다.","응급환자의 신고를 받으면 구급차를 이용하여 신속하게 현장에 출동하고, 환자의 상태를 파악한 후 필요한 응급처치를 합니다.","응급처치가 끝난 후 응급 의료시설로 환자를 이송하고, 응급처치 상황과 환자의 처치 내용을 기록하여 담당 의사에게 보고합니다.","해결하기 곤란하거나 어려운 문제에 대해서는 지도 의사와 통화로 협의하여 조치합니다."],aptitude:"안전 관련직"},10070:{name:"무인항공촬영감독",wage:null,from:null,basis:null,year:null,sat:null,works:["무인항공촬영감독은 소형카메라가 장착된 무인 조종 비행체인 헬리 캠을 조정하여 영화, 드라마, 광고의 스틸 영상이나 동영상을 촬영하는 전 과정을 기획하고 실행합니다.","헬리 캠을 이용한 실시간 항공 촬영 영상을 송수신 모니터 또는 안경 모니터로 지켜보며 원하는 사진이나 동영상 장면이 나오도록 촬영합니다.","무선 영상 송수신 시스템을 통해 고화질 영상 촬영은 물론 실시간으로 방송사에 직접 영상을 전송하는 작업도 수행합니다."],aptitude:"영상 관련직"},280:{name:"가수",wage:2901,from:"워크넷",basis:"가수",year:2021,sat:"63.8",works:["가수는 악단이나 녹음된 반주에 맞추어 공연장이나 콘서트 무대에서 대중적인 노래나 고전음악, 국악 및 가곡을 노래합니다.","악보를 보고 악기나 녹음된 반주에 맞추어 리듬을 확인하고 노래 연습을 하며, 음반 녹음 및 제작, 방송 출연, 공연이나 콘서트 개최, 각종 행사 출연 등의 활동을 합니다.","광고 및 영화, 드라마 등에 참여하여 곡을 부르기도 하며, 가창력과 연기력을 바탕으로 뮤지컬 배우로 활동하기도 합니다."],aptitude:"음악 관련직"},1276:{name:"파티플래너",wage:3108,from:"워크넷",basis:"레크리에이션전문가",year:2021,sat:"66.7",works:["파티플래너는 효과적인 파티 진행을 위하여 기획·운영·연출·홍보 등 파티의 전체 과정을 총괄합니다.","고객과 파티의 주제 및 구성에 대해 협의합니다.","조명·음향·무대 등의 특수효과와 음식, 파티장 장식 등의 세부 계획을 세우고 준비하며, 공연 팀을 섭외합니다.","초청 대상자의 참석 여부를 확인하며, 파티 당일 사전 준비 사항을 점검한 후 파티를 진행합니다."],aptitude:"예술기획 관련직"},149:{name:"항공기정비원",wage:4e3,from:"워크넷",basis:"항공기정비원",year:2021,sat:"73.2",works:["항공기정비원은 항공기의 안전 운행을 위해 항공기의 동체 및 엔진, 계기 등을 조립, 조정, 정비합니다.","고장의 위치, 범위, 정도와 잠재적 불량 상태 등을 확인하기 위하여 시험 측정 기구를 사용하여 각 부분을 진단 및 검사합니다.","고장 부위를 분해하고 수리 또는 교체의 필요성을 판단하기 위하여 명세서와 비교 및 검사하고 작동 상태를 평가합니다.","고장나거나 사용 한계치를 초과한 부품을 교체하고, 연료, 오일 및 기타 보급품을 채웁니다."],aptitude:"기능직"},988:{name:"인문사회계열교수",wage:7785,from:"워크넷",basis:"대학교수",year:2021,sat:"77.4",works:["인문사회계열교수는 대학에서 인문사회계열 과목을 강의하고 시험, 보고서 등을 통해 학생들을 지도하며 자신의 전공 분야에 대한 지속적인 연구 활동을 합니다.","대학교에서 국문학, 영문학, 사학, 철학, 정치학, 경제학, 사회학 등의 과목을 교육합니다.","대학교수는 전공이나 담당 교과목에 따라 강의, 실험, 실습 등 다양한 강의 방법을 이용하여 학생을 지도하며 인문 계열 교수는 대부분 강의를 통한 수업을 진행합니다."],aptitude:"인문 및 사회과학 관련직"},24:{name:"유전공학연구원",wage:4579,from:"워크넷",basis:"의학연구원",year:2021,sat:"74.2",works:["유전공학연구원은 생명현상의 기본 물질인 유전자를 재조합하여 인류에게 유익한 의약물질, 기능성물질 등을 생산하고, 새로운 형질의 생명체를 창출, 실용화하는 첨단 기술에 대해 연구합니다.","인체를 포함한 동물, 식물, 미생물 등 세포 내에서 수행되는 생명활동의 기본 현상과 원리를 규명하고 식물이나 동물의 유전방식을 연구합니다.","유전자를 인위적으로 재조합하여 새로운 품종을 개발하거나 유전질환, 암, 노화, 치매, 에이즈 등과 같은 질병의 유발 원인에 대해 연구합니다."],aptitude:"이학 전문직"},398:{name:"임상심리사",wage:3994,from:"워크넷",basis:"임상심리사",year:2021,sat:"73.9",works:["임상심리사는 정신적인 어려움이 있는 사람에게 심리 평가를 실시하며 몸과 마음의 건강 증진을 돕습니다.","정신 건강에 어려움을 경험하고 있는 사람(환자 및 내담자)에 대한 정확한 진단을 위하여 인지능력, 성격, 정서, 신경 심리 등에 대해 검사를 실시하고 평가합니다.","내담자가 겪는 어려움의 원인을 분석하고 치료 방법, 기간, 강도 등 적절한 치료 계획을 수립합니다.","심리 평가 결과와 치료 경과에 대하여 정신과의사 등 정신보건 관련 전문가들과 공유하고 치료 진행 사항 등에 대해 논의합니다."],aptitude:"보건의료 관련 서비스직"},10071:{name:"동물랭글러",wage:null,from:null,basis:null,year:null,sat:null,works:["동물랭글러는 영화나 드라마, 텔레비전 프로그램, 광고 등에 출연하는 동물을 섭외하고 훈련시킵니다.","강아지, 고양이, 새, 토끼 등 학습 가능한 애완동물을 섭외하여 대본에 맞추어 활동할 수 있도록 조련합니다.","훈련된 동물들이 영화나 텔레비전 등 방송 촬영에 투입되면 손짓이나 표식을 통해 동물의 움직임, 소리 등을 지시하여 동물들이 연기할 수 있도록 합니다."],aptitude:"자연친화 관련직"},281:{name:"개그맨",wage:3200,from:"워크넷",basis:"개그맨및코미디언",year:2021,sat:"63.7",works:["개그맨은 주로 텔레비전이나 라디오 프로그램에 출연하여 말과 몸짓으로 사람들에게 웃음을 줍니다.","단막극 형식의 짧은 희극을 창작하여 사람들을 즐겁게 할 수 있는 언어와 행동을 합니다.","개인 또는 단체로 대사 연습을 하고, 무대나 드라마에서 사람들을 즐겁게 할 수 있는 연기를 합니다.","방송 출연 전 아이디어 회의를 하고, 프로듀서, 작가와 협력하여 대본을 만들고 연습합니다."],aptitude:"연기 관련직"},1277:{name:"건축사",wage:5076,from:null,basis:"건축가(건축설계사)",year:null,sat:"70.1",works:["건축사는 건축주(고객)의 의뢰를 받아 조형미, 경제성, 안전성, 기능성 등을 고려하여 주택, 사무용 빌딩 등의 건축물을 계획하고 설계하는 일을 합니다.","스케치 및 모형을 준비하고, 전문 지식을 바탕으로 건축계획안과 설계도를 작성합니다.","설계도의 내용이 공사 과정에 정확히 반영되는지를 확인하는 감리 업무를 합니다.","건물의 건설 및 유지 활동을 지휘하거나 건축주 및 시공자에게 조언과 기술 지도를 합니다."],aptitude:"공학 전문직"},150:{name:"비행기조종사",wage:10205,from:"워크넷",basis:"항공기조종사",year:2021,sat:"78.8",works:["비행기조종사는 승객이나 화물을 운반하기 위해 여객기, 전투기, 경비행기, 헬리콥터 등을 조종합니다.","비행 일정에 따라 항로, 목적지, 연료량, 기상 조건 등을 숙지하고 항공기 상태, 조종실 시스템 등을 점검합니다.","비행하는 동안 비행기의 장으로 항공승무원의 활동을 지휘하며 운항 일지를 기록하고 비행 중 발생한 각종 설비상의 문제나 이상 현상을 보고합니다.","탐색, 구조, 항공 측량 작업을 하며 소독약의 분무, 농약 살포와 같은 일을 하기도 합니다."],aptitude:"고급 운전 관련직"},994:{name:"환경컨설턴트",wage:3419,from:"워크넷",basis:"환경영향평가원",year:2021,sat:"73.9",works:["환경컨설턴트는 기업이나 공공 조직이 가지고 있는 환경 관리상의 문제점을 진단하고 이에 대한 해결책을 제시하는 일을 합니다.","신도시 개발 사업 등 여러 형태의 개발 행위가 자연환경에 미치는 영향을 사전에 측정하고 평가하여 환경적으로 건전하고 지속 가능한 개발이 될 수 있는 해결책을 제시합니다.","기업이나 공공 조직의 환경 관리 상태를 진단하고 체계적인 환경 관리를 위한 조직의 방침 및 장기 계획을 수립하며, 그것을 실행하기 위한 방법들에 대해 조직원들에게 교육합니다."],aptitude:"이학 전문직"},25:{name:"전문의사",wage:8500,from:"워크넷",basis:"일반의사",year:2021,sat:"74.9",works:["전문의사는 환자의 병에 대한 원인을 찾아 치료하고 예방하며, 손상된 신체를 복구하고 재활시키는 업무를 수행합니다.","의료 검사와 시험을 통해 얻은 자료를 분석하여 환자의 질병과 장애에 대해 처방하고 치료의 범위와 방법, 종류와 순서를 결정합니다.","진단과 치료를 위해 내외과적 기구와 장비를 사용하거나 의학실험과 수술을 수행하고 특수 기술과 장비를 이용하여 환자를 치료합니다.","투약을 비롯한 각종 치료 행위를 처방 지시하고, 환자들에게 식사, 질병 예방 방법 등에 대해 조언합니다."],aptitude:"의료관련 전문직"},400:{name:"운동감독",wage:4700,from:"워크넷",basis:"스포츠감독및코치",year:2021,sat:"66.7",works:["운동감독은 운동선수의 지식, 능력, 실력을 높이기 위해 훈련 및 지도하고, 경기에서 이기기 위한 전략과 작전을 세웁니다.","선수의 소질과 능력에 맞게 적절한 위치에 배치하고 팀을 구성하며, 유능한 선수의 발굴을 위해 관련 경기를 참관하거나 테스트를 실시합니다.","팀이나 개인을 관리하고 지도하여 경기에 참가할 운동선수를 훈련시킵니다.","자신의 팀과 상대 팀의 전략을 평가하고 분석하여 경기에서 좋은 성적을 거둘 수 있는 작전을 수립합니다."],aptitude:"운동 관련직"},10072:{name:"웹툰작가",wage:null,from:null,basis:null,year:null,sat:null,works:["웹툰작가는 스토리의 소재를 찾고, 기획, 취재하며, 콘티(스토리전개도)를 짜서 스케치, 데생, 채색, 편집 등의 작업을 수행 후 웹툰 플랫폼에 제공하는 업무를 수행합니다.","태블릿, 컴퓨터 프로그램을 활용하여 그림을 완성한 후 편집자들과 회의를 진행하고 수정 작업을 합니다.","완성된 작품을 웹툰 플랫폼에 연재합니다."],aptitude:"웹·게임·애니메이션 관련직"},283:{name:"광고기획자",wage:4248,from:"워크넷",basis:"광고·홍보·마케팅전문가",year:2021,sat:"69.2",works:["광고기획자는 특정 상품이나 서비스에 대한 광고 제작 방향 및 전략 수립에서부터 실제 광고 제작까지의 전체적인 관리와 감독 업무를 담당합니다.","상품의 판매 자료나 시장조사 자료, 제품 정보 등을 입수하여 소비자의 성향을 분석하고 광고 제작 방향을 정합니다.","광고 제작 회의를 개최하여 광고주의 의견을 수렴하고 각종 아이디어를 수집합니다.","광고 문안, 광고의 영상 및 그래픽 등을 모두 총괄 정리해서 광고를 완성시키며, 광고가 완성되면 광고주와 시사회를 갖고 내용을 수정합니다."],aptitude:"예술기획 관련직"},1278:{name:"행정부고위공무원",wage:9324,from:"워크넷",basis:"고위공무원",year:2021,sat:"80.3",works:["행정부고위공무원은 행정기관 국장급(3급) 이상 공무원으로, 정부의 정책을 결정하고 예산과 법령안을 작성·수정하며 정부 부처의 법령을 해석·적용합니다.","정책을 기획, 조직, 통제하고 국외에서는 국가를 대표·대리합니다.","정부 부처 관련 행정 업무를 기획, 지휘, 조정합니다.","각급 지방자치단체의 행정관리, 주민 복지 증진, 지역개발, 산업 진흥 등 지방행정 분야의 정책수행을 기획, 조직, 통제합니다."],aptitude:"법률 및 사회활동 관련직"},151:{name:"항공우주공학기술자",wage:5450,from:"워크넷",basis:"항공공학기술자",year:2021,sat:"77.1",works:["항공우주공학기술자는 공기 중을 비행하는 물체 즉, 여객기, 전투기, 우주선 등의 각종 비행 물체를 설계하고 개발하는 일을 담당합니다.","항공기의 본체나 시스템 및 전자 설비(레이더 등)를 설계하고, 실험 및 연구를 통해 새로운 항공공학기술을 개발합니다.","다목적 인공위성, 로켓 개발 등과 같은 프로젝트에 참여하여 기체나 시스템 및 각종 장비를 연구하고 설계합니다.","항공기 제조 공정을 감독하고 관련 기술을 지도하기도 합니다."],aptitude:"공학 전문직"},995:{name:"에너지공학기술자",wage:null,from:null,basis:null,year:null,sat:null,works:["에너지공학기술자는 에너지 사업을 위한 기술상의 조건을 분석하며 이에 필요한 시스템 장비를 설계, 계획, 조직화합니다.","광산 개발 관련 업무를 수행하고, 광산 시설, 시스템 및 장비를 설계하며 지하의 금속 또는 비금속광물, 광석의 추출을 계획 및 조직합니다.","석유 및 가스 매장량의 탐사, 개발, 추출과 관련된 연구를 수행하며, 광석 매장량 및 보유량 추정 및 탄광 설계에 관한 측량 및 연구를 수행합니다."],aptitude:"공학 전문직"},29:{name:"지리학연구원",wage:4070,from:"워크넷",basis:"지리정보시스템전문가",year:2021,sat:"72.8",works:["지리학연구원은 지표상 나타나는 자연, 인문적 현상의 공간적 분포 양식, 형성 과정, 상호 연관성에 대해 연구합니다.","자연, 인문적 현상이 지표상 어디에서 발생하고, 왜 특정 장소에서 특정 형태로 발생하는지에 대해 여러 이론과 분석을 통해 원인을 규명합니다.","지역 답사 활동을 통해 특정 지역의 자연환경과 기후조건의 특징을 조사, 연구합니다.","측량 장비와 기상학적 도구를 사용하여 지도, 도표 도식을 작성하고 해석합니다."],aptitude:"이학 전문직"},401:{name:"작업치료사",wage:3367,from:"워크넷",basis:"작업치료사",year:2021,sat:"68.5",works:["작업치료사는 신체적 또는 장애를 입은 환자가 독립적으로 일상생활을 할 수 있도록 치료 활동을 합니다.","환자의 병력을 근거로 인지 지각 능력, 운동능력, 손 기능 능력 등을 평가하고, 평가에 의거하여 치료 계획을 수립합니다.","환자의 신체적 또는 정신적 장애를 회복시키기 위해 감각 지각 활동 훈련, 인지 재활치료, 일상생활 훈련, 직업 재활훈련 등 작업요법적 치료를 계획하고 실시합니다.","치료 과정, 훈련 실시 내용, 결과 등을 작성하여 의료진과 함께 평가합니다."],aptitude:"보건의료 관련 서비스직"},10073:{name:"아쿠아리스트",wage:null,from:null,basis:null,year:null,sat:null,works:["아쿠아리스트는 수중생물을 인공적인 환경인 수족관 내에서 기르고 관리하는 업무를 수행합니다.","수중생물의 특성과 습성을 고려해서 수족관의 생태환경을 조성합니다.","수중생물의 상태, 특이 사항을 관찰하고 먹이를 준비하며, 질병을 예방하는 역할을 수행합니다.","수중생물에 대한 정보를 수집하고 연구합니다."],aptitude:"자연친화 관련직"},284:{name:"간판제작원",wage:3500,from:"워크넷",basis:"간판제작·설치원",year:2021,sat:"58.8",works:["간판제작원은 네온사인이나 안내표지, 실외 간판 등을 설계 및 제작하여 설치하는 일을 담당합니다.","광고주로부터 주문을 받으면 광고주가 원하는 성격의 광고물에 대해 구체적으로 사용될 디자인, 형태, 기술 등을 기획합니다.","고객의 명세서와 도면에 따라 필요한 재료 및 공구를 준비하고 문자, 상표, 무늬 등을 디자인합니다.","바탕이나 도안에 맞춰 아크릴 등의 재료를 절단하고 색을 칠합니다."],aptitude:"기능직"},1279:{name:"헤드헌터",wage:3056,from:"워크넷",basis:"직업상담사",year:2021,sat:"72.8",works:["헤드헌터는 기업의 임원, 기술자 등 고급 인력을 필요로 하는 업체가 원하는 인력을 선정 및 평가하고 적정 인력을 알선해 줍니다.","인재 추천을 의뢰한 기업체를 방문하여 그 기업에 대한 정보를 파악하고, 채용하고자 하는 직종, 직무, 인재상 등에 관한 내용을 파악합니다.","인재 추천을 위해 적합한 사람을 직책이나 나이, 연봉 등의 기준을 토대로 범위를 좁혀가며 몇 배수로 선발하고, 대상자의 업무 수행 능력과 됨됨이를 중심으로 인터뷰를 실시합니다.","직무 중심의 경력 사항, 학력 등 객관적인 평가 자료와 함께 후보자의 인성, 전직 이유, 업무 수행 능력, 연봉 등을 자세히 기술한 평가서를 작성합니다."],aptitude:"기획서비스직"},153:{name:"화학제품제조원",wage:3695,from:null,basis:"화학제품생산기계조작원(고무·플라스틱제외)",year:null,sat:"65.2",works:["화학제품제조원은 화학제품 제조기기를 조작하여 의약품, 화장품 등의 화학제품을 생산하는 일을 담당합니다.","작업지시서에 따라 필요한 화학 재료를 준비하고, 화학 재료들을 혼합, 분쇄, 가열, 증류하는 기계장치를 조작합니다.","화학제품 기계장치를 조작하면서 기계장치의 처리 온도, 압력, 속도, 재료의 흐름 등을 조정하고 화학물질의 가공 처리 과정에 따른 변화를 관찰합니다.","원료를 검사하여 제품 제조에 적합한지 판단하고, 공정에서 발생하는 문제를 파악합니다."],aptitude:"기능직"},997:{name:"토양환경기술자",wage:3626,from:"워크넷",basis:"토양환경기술자및연구원",year:2021,sat:"75.3",works:["토양환경기술자는 지역의 토양오염 상태를 측정하고, 연구와 실험분석을 통해 토양오염물질이 환경에 미치는 영향을 최소화하고 환경보존에 필요한 공학적 기술들을 연구하고 개발합니다.","오염된 토양을 정화하고 복원하기 위해 다양한 실험과 분석을 실시합니다.","토양오염의 감소 또는 방지를 위한 오염방지시설을 설계하고 시공에 관여합니다."],aptitude:"이학 전문직"},30:{name:"지질학연구원",wage:5180,from:"워크넷",basis:"지질학연구원",year:2021,sat:"73.6",works:["지질학연구원은 암석 분포, 지질구조, 퇴적환경 등에 대한 조사를 통해 지하자원의 개발이나 국토개발의 기초를 제공합니다.","지각 내 지하자원의 분포를 예측 및 조사하고, 자원의 효율적 이용 방법에 대해 연구합니다.","대양 밑바닥을 탐사하고 지질환경의 보존과 지하공간에 대한 효과적인 개발 방법을 연구합니다.","화석이 된 식물, 동물들을 연구하여 그들의 진화 순서와 연령을 알아냅니다."],aptitude:"이학 전문직"},403:{name:"장례지도사",wage:3315,from:"워크넷",basis:"장례지도사및장례상담원",year:2021,sat:"64.3",works:["장례지도사는 장례 절차와 관련된 모든 업무를 총괄하는 일을 담당합니다.","장례 절차 및 방법에 대해 고객과 상담하고 이에 대한 정보를 제공합니다.","장례와 관련된 용품을 준비하고 시신 관리, 장례식 주관, 매장 등 장례의 모든 업무를 수행합니다.","시신을 닦고 정리하며 준비된 수의를 입히고 관에 넣습니다."],aptitude:"보건의료 관련 서비스직"},10074:{name:"범죄심리분석관(프로파일러)",wage:null,from:null,basis:null,year:null,sat:null,works:["범죄심리분석관(프로파일러)은 증거가 충분히 확보되지 않아 일반수사 기법 조사로는 한계가 있는 이상범죄, 연쇄살인 등의 범죄 사건을 담당, 해결하는 역할을 수행합니다.","사건 현장을 조사하여 범죄 과정을 과학적으로 재구성하고, 범죄 정황과 단서를 통해 용의자의 특징을 추론합니다.","수사에 필요한 목격자를 찾고, 수사 가치가 있는 목격자의 진술을 이끌어 냅니다.","피의자 검거 후에는 자백을 받고 여죄를 심문합니다."],aptitude:"인문 및 사회과학 관련직"},285:{name:"광고디자이너",wage:4550,from:"워크넷",basis:"광고영상감독",year:2021,sat:"71.6",works:["광고디자이너는 텔레비전, 잡지, 신문, 라디오, 포스터 등의 영상이나 인쇄매체의 광고 화면을 구성하고 필요한 그림과 이미지를 디자인합니다.","제품이나 서비스 등 광고할 대상의 특성 및 소비자의 유형, 시장동향 등을 분석합니다.","광고 의뢰인과 회의를 거쳐 상품의 광고 방향을 설정합니다.","상품의 모형이나 기능, 시장 및 소비자의 특성을 파악하여 상품의 광고물을 디자인합니다."],aptitude:"디자인 관련직"},1281:{name:"환경영향평가원",wage:3419,from:"워크넷",basis:"환경영향평가원",year:2021,sat:"73.9",works:["환경에 영향을 미치는 사업 계획 수립 시 이러한 사업 계획이 자연환경, 생활환경, 사회·경제 환경 등에 미치는 영향을 미리 예측·분석하고, 환경에 해로운 영향을 줄이는 방안을 모색합니다.","사업의 특성, 입지 여건 등을 고려하여 환경에 중대한 영향을 미칠 수 있는 중요한 평가 요인을 설정합니다.","공청회 등을 통해 개발사업의 시행으로 직접적인 영향을 받을 수 있는 지역주민의 의견을 수렴합니다.","환경의 현재 상태를 파악하고 정리하기 위하여 다양한 연구 기법과 문헌을 탐색합니다."],aptitude:"공학 기술직"},155:{name:"바닥재시공원",wage:3868,from:"워크넷",basis:"타일·대리석시공원",year:2021,sat:"62.4",works:["바닥재시공원은 각종 타일이나 카펫 등을 설치하여 건물의 내외벽, 바닥, 천장 등을 마무리 또는 장식하는 일을 합니다.","건설 도면을 검토하고 현장 측량 및 의뢰인과의 협의를 통해 필요한 타일이나 카펫의 종류와 형태를 결정합니다.","작업할 표면의 재질에 따라 표면처리 작업을 하고 기준 위치를 결정하며 수직, 수평을 측정합니다.","접합재료를 배합하고 타일을 용도에 따라 절단 및 가공합니다."],aptitude:"기능직"},1004:{name:"환경설비기술자",wage:3833,from:"워크넷",basis:"폐기물처리기술자",year:2021,sat:"71.3",works:["환경설비기술자는 폐수ㆍ폐기물 처리 설비기기 및 장치를 조작하는 등의 일을 담당합니다.","연구자의 관리하에 오염물질의 유입량 및 유입 오염물질의 변화를 살피고 이와 관련한 실험을 관찰하고 결과를 기록합니다.","폐수처리 및 폐기물 처리 기기 및 장치를 조작하고, 장치의 가동, 보수, 개조 등의 업무 사항을 작업 일지에 기록합니다."],aptitude:"공학 기술직"},31:{name:"천문학연구원",wage:4662,from:"워크넷",basis:"천문·기상학연구원",year:2021,sat:"70.9",works:["천문학연구원은 천체를 관측하고, 천체 현상을 물리학적 지식을 적용하여 해석하며, 천체들이 생성되고 소멸하는 원리를 밝히는 연구를 수행합니다.","천체관측시설의 운영을 관리하고, 천체관측시설을 사용하여 천체의 현상을 연구하며, 천체관측과 관련된 시스템과 관련 장비 등을 연구, 설계합니다.","물리법칙을 적용하여 혹성, 항성, 성운, 은하계의 크기, 형태, 광도, 성분, 구조, 온도, 운동 등과 같은 특성을 측정합니다.","우주의 탄생과 진화, 외계행성의 탐색, 우주전파수신 등 우주개발산업에 대한 연구를 수행합니다."],aptitude:"이학 전문직"},404:{name:"전화교환원",wage:2800,from:"워크넷",basis:"안내·접수원",year:2021,sat:"57.2",works:["전화교환원은 시내, 시외 및 국제 간 혹은 회사 내부의 전화 통화를 연결하는 일을 담당합니다.","고객이 문의하는 상호 또는 인명을 듣고 컴퓨터에 연결된 단말기를 조작하여 번호를 안내하거나 통화를 연결하는 일을 합니다.","숙박업소의 전화교환원은 호텔에 투숙한 고객의 방으로 전화를 연결해 주며, 고객의 요청에 따라 모닝콜을 하기도 합니다."],aptitude:"일반 서비스직"},10075:{name:"다문화코디네이터",wage:null,from:null,basis:null,year:null,sat:null,works:["다문화코디네이터는 다문화가정의 자녀가 교육을 받는 데 필요한 프로그램을 소개하고 지원하는 업무를 수행합니다.","다문화가정의 자녀가 학교에 입학하는 것을 돕고, 알맞은 교육 지원 사업을 연계하는 역할을 합니다.","개인 사례 관리를 통해 다문화가정 자녀의 사회 정착을 돕습니다."],aptitude:"사회서비스직"},286:{name:"국악인",wage:3522,from:"워크넷",basis:"국악인",year:2021,sat:"72.3",works:["국악인은 전통음악을 하는 사람으로, 가야금, 해금 등의 국악기를 연주하거나 판소리, 민요 등을 부릅니다.","판소리, 민요, 가곡, 가사 등의 창을 하거나 거문고, 가야금, 향비파, 대금 등과 같은 악기를 연주합니다.","국악 연주가는 가야금, 거문고, 해금, 아쟁, 장구 등의 국악기로 정악, 민속악 등의 전통 국악이나 창작 국악을 연주합니다.","국악 성악가는 북, 장구, 가야금, 거문고, 대금 등 국악기의 장단에 맞춰 가곡, 가사, 시조를 노래하거나 판소리, 민요, 창극 등을 부릅니다."],aptitude:"음악 관련직"},1282:{name:"대체에너지개발연구원",wage:null,from:null,basis:null,year:null,sat:null,works:["대체에너지개발연구원은 태양열, 태양광, 조력, 풍력, 바이오매스 등의 대체 에너지를 연구ㆍ개발합니다.","에너지의 사용으로 인하여 배출되는 환경오염 물질을 줄이고 화석 연료를 효율적으로 이용하기 위하여 신재생 에너지의 안정적인 공급과 관련된 연구·개발을 수행합니다.","에너지 기술의 자립을 위하여 저공해, 고효율의 대체에너지 기술의 연구·개발을 수행합니다.","연구 과제의 생성, 진행, 완료까지 전체적인 과정을 관리합니다."],aptitude:"공학 전문직"},157:{name:"반도체공학기술자",wage:4662,from:"워크넷",basis:"반도체공학기술자및연구원",year:2021,sat:"74.4",works:["반도체공학기술자는 냉장고, 텔레비전, 세탁기 등의 가전제품과 의료기기, 컴퓨터, 휴대폰 등 전자제품에 사용되는 반도체의 기술적 성능을 개선하거나 새로운 기능과 성능을 갖춘 반도체를 개발합니다.","반도체에 대한 전반적인 기술적 지식을 활용하여 반도체의 제조 및 조립을 위한 공정별 최적 조건을 설정합니다.","반도체 제조에 필요한 설비와 장비를 시운전하여 조작 및 운영 방법을 규정하여 작업자에게 지시하고, 불량제품의 원인을 분석하고 그 대책을 수립합니다.","기술적 성능을 개선하고 부품, 제품 및 시스템에 사용되는 전자적 특성에 대한 변형과 응용에 대해 계획하고 개발합니다."],aptitude:"공학 전문직"},1006:{name:"해양환경기사",wage:4144,from:"워크넷",basis:"수질환경기술자및연구원",year:2021,sat:"78.8",works:["해양환경기사는 물리, 화학, 지질 및 해양생물학적 지식과 기술을 활용하여 해양개발에 필요한 기초 조사 및 연구를 수행합니다.","기름 배출 사고 방지, 사고 발생 시 배출된 기름의 수거와 처리 등의 조치를 취합니다.","해수의 물성(수온, 압력, 염분), 해저 지각의 운동, 해저 퇴적물의 분포 및 특성 등에 대한 분석을 통해 해양학적 자원을 개발합니다."],aptitude:"공학 기술직"},32:{name:"측량사",wage:5e3,from:"워크넷",basis:"지적및측량기술자",year:2021,sat:"73.4",works:["측량사는 국토의 이용, 개발, 건설 공사, 지도 제작을 목적으로 토지의 형태, 지형선, 위치, 고도, 면적 등을 측량하는 업무를 수행합니다.","토지에 대한 측량 계획과 방법, 절차를 계획함으로써 토지에 물권이 미치는 한계를 정합니다.","토지 자산, 필지, 토지구획에 대한 사법적 경계를 확립하고자 측량을 계획, 지휘, 감독합니다.","지형, 지형선 등 영역들을 도면화하고자 경도, 각도, 컴퓨터 삼각법, 기타 계산을 활용하여 분석합니다."],aptitude:"공학 기술직"},405:{name:"주택관리사",wage:3561,from:"워크넷",basis:"시설·특수경비원",year:2021,sat:"65.4",works:["주택관리사는 아파트와 같은 대규모 공동주택의 각종 시설 및 환경을 유지 관리하며, 공동시설의 유지 및 보수와 관련된 각종 회계 업무를 담당합니다.","공동주택의 공동시설인 노인정, 놀이터, 주차장 등을 관리하고 유지하여 아파트 내 시설물에 의한 안전사고가 발생하지 않도록 합니다.","관리비를 징수하고 공과금 납부를 대행합니다.","공동주택의 주민의 안전관리와 입주, 퇴거에 관한 업무를 수행합니다."],aptitude:"일반 서비스직"},10076:{name:"모바일앱개발자",wage:4e3,from:"워크넷",basis:"모바일앱개발자",year:2021,sat:"69.2",works:["모바일앱개발자는 스마트폰이나 태블릿PC 등 모바일기기에서 사용되는 소프트웨어인 모바일 애플리케이션을 개발하고 수정하는 일을 합니다.","국내외의 모바일 앱 개발 흐름 및 우리나라 사람들의 모바일기기 이용 특성에 적합한 애플리케이션을 기획하고 개발합니다.","기업이나 기관이 이용하기 원하는 정보들을 체계적으로 모바일앱을 이용하여 관리할 수 있는 다양한 기능의 애플리케이션을 만듭니다.","애플리케이션이 작동하는데 필요한 구글 안드로이드, 애플 iOS, 윈도우 등 모바일 운영체제(OS: Operation System)별로 기술 변경 사항 등에 대해 확인하고 고객의 요구 사항대로 앱을 개발하기 위한 기술 검토와 업무 분석을 합니다."],aptitude:"IT관련전문직"},288:{name:"네일아티스트",wage:2865,from:"워크넷",basis:"네일아티스트",year:2021,sat:"65.0",works:["네일아티스트는 고객의 손, 손톱, 발, 발톱의 건강 등 미용 관리, 제모와 관련된 업무를 담당합니다.","고객의 건강 상태와 미용 관리 부위에 대한 정보를 파악하여 손, 손톱, 발, 발톱의 미용 관리 및 제모에 대해 구체적으로 계획을 세웁니다.","미용 보조원에게 각종 장비 및 물품을 준비시키고 고객의 시술 부위를 알코올 등으로 소독합니다.","피부, 손톱, 발톱 등 시술 부위에 있던 매니큐어 및 광택제 등을 제거합니다."],aptitude:"이미용 관련직"},1431:{name:"음악강사",wage:3522,from:"워크넷",basis:"예능강사",year:2021,sat:"75.9",works:["피아노, 바이올린, 기타, 드럼, 가야금, 해금 악기별로 수강생들에게 음악에 관한 이론과 연주법을 가르칩니다.","클래식 음악, 국악, 재즈, 실용음악 등의 전문 분야에 맞추어 악기를 가르칩니다.","수강생의 음악 연주를 듣고 실기 기능을 평가합니다."],aptitude:"음악 관련직"},159:{name:"가구제조,수리원",wage:3108,from:"워크넷",basis:"가구제조·수리원",year:2021,sat:"57.5",works:["가구제조,수리원은 여러 형태의 가구를 가공, 제작하고, 가구의 파손된 부위를 수선하는 일을 담당합니다.","다양한 수공구 및 목공기계를 사용하여 각종 가구를 제작, 조립, 장식, 수선, 가공하는 업무를 수행합니다.","재료의 형태, 치수 및 요구되는 기계가공을 결정하기 위하여 도면과 명세서를 검토 및 분석합니다.","목재를 필요한 규격으로 절단하여 구멍을 뚫고 대패질하며, 접착 조립하기 위하여 다양한 수공구 및 목공기계를 조정 및 조작합니다"],aptitude:"기능직"},1007:{name:"상수도기술자",wage:3715,from:"워크넷",basis:"배관공",year:2021,sat:"58.9",works:["상수도기술자는 안전한 수돗물을 생산해 사람들에게 공급하기 위해 상수도의 수질 상태를 지속적으로 검사하고, 정수 처리 대응 방안 및 배급수의 효과적인 유지, 관리 방법 등에 대해 연구하고 개발합니다.","상수원을 지속적으로 관리하고 검사하여 향후 수질 변화를 예측합니다.","수리학적 현상 및 수질 변화 예측, 물 수요 예측 등의 방법을 적용하여 배급수의 효과적인 유지 및 관리 방법에 대해 연구하고 개발합니다."],aptitude:"공학 전문직"},33:{name:"치과기공사",wage:3765,from:"워크넷",basis:"치과기공사",year:2021,sat:"72.9",works:["치과기공사는 치과의사의 의뢰를 바탕으로 치아, 치아 장치, 교정 장치 등을 다양한 형태와 재료로 제작하고, 수리하는 업무를 수행합니다.","치과 보철물의 종류, 재료, 설계, 완성 시간 등을 확인합니다.","치과 병원과 의원에서 제공받은 환자의 치아 모형을 분석, 설계해서 석고 모형을 뜨고, 작업 모형에 맞게 금, 은, 합성수지 등으로 인공 치아를 만들거나 의치, 교정 틀 등 보철 제작물을 주조합니다.","제작물을 연마, 가공하여 보철물을 완성하고 제작된 모델을 확인합니다."],aptitude:"보건의료 관련 서비스직"},406:{name:"인문계중등학교교사",wage:4540,from:"워크넷",basis:"중·고등학교교사",year:2021,sat:"79.4",works:["인문계중등학교교사는 중학교와 고등학교에서 학생들에게 인문계 교과목을 가르치고 생활을 지도합니다.","학교의 교육 계획과 수업 이수 등을 고려하여 자신이 맡은 교과목의 학습안을 설계하고 교과서를 비롯해 시청각 자료 등 다양한 교재를 활용하여 수업을 진행합니다.","학습 진단을 위하여 시험을 출제하고 그 결과를 평가합니다.","학생들의 다양한 고민에 대해 상담하고 필요한 경우 학부모와도 상담을 하며 진로지도와 생활지도를 합니다."],aptitude:"인문계 교육 관련직"},10077:{name:"SNS 마케터",wage:null,from:null,basis:null,year:null,sat:null,works:["SNS(Social Network Service)마케터는 SNS를 통해 상품을 홍보 및 판매하고 소비자 반응을 분석하는 업무를 수행합니다.","판매하는 상품에 적합한 SNS 채널과 소비자층을 설정하고 마케팅 계획을 수립한 후 판매를 진행합니다.","상품 판매 이후에는 소비자의 반응을 분석합니다."],aptitude:"영업관련 서비스직"},291:{name:"만화가",wage:3e3,from:"워크넷",basis:"만화가",year:2021,sat:"61.1",works:["만화가는 풍자나 우스갯거리 등을 경쾌하고 익살스러운 그림으로 표현하거나 어떤 줄거리가 있는 이야기를 연속된 그림과 대화로 엮는 일을 담당합니다.","새로운 만화의 소재를 개발하거나 자료를 수집하여 만화의 주제를 결정하고, 그 주제에 맞게 이야기 전개도(콘티)를 구성합니다.","등장인물 및 이야기의 전개 상황을 설정하고, 밑그림인 데생을 합니다.","장면, 대화 등에 따라 적절한 내용을 구상하여 그리고 컴퓨터를 사용하여 그리기도 합니다."],aptitude:"웹·게임·애니메이션 관련직"},1432:{name:"베타테스터",wage:4144,from:null,basis:"IT테스터및QA전문가(SW테스터)",year:null,sat:"69.6",works:["베타테스터는 컴퓨터업체에서 소프트웨어나 하드웨어 제품을 판매하기 전에 제품의 결함 여부를 검사하는 사람으로, 프로그램의 오류를 파악하고 해결 방안을 제시하여 상품성을 높이는 일을 합니다.","소프트웨어, 하드웨어 등 제품의 문제점 및 보완점을 발견해 필요한 조치를 취합니다.","소프트웨어 프로그램의 장단점을 파악하여 홍보하는 역할을 하기도 합니다.","게임 베타테스터는 게임 출시 전에 일부 사용자를 선발하여 테스트 자격을 부여하여 문제점을 파악하거나, 게임 출시 직전에 전체 사용자들에게 서비스를 이용하게 한 후 시스템 문제점, 버그 등을 파악합니다."],aptitude:"IT관련전문직"},162:{name:"식품공학기술자",wage:4850,from:"워크넷",basis:"식품공학기술자및연구원",year:2021,sat:"79.9",works:["식품공학기술자는 식품에 대한 조사, 개발, 생산 기술 개발, 품질 관리, 포장, 가공 및 이용에 관한 업무를 합니다.","식품개발을 담당하는 식품공학기술자는 자사 및 경쟁업체의 상품에 대해 식품 및 소비자의 반응을 분석하고, 생산할 제품을 기획하고 식품의 영양, 맛, 색깔, 상품 가치 등을 고려해 적합한 재료를 선택하고, 조리 방법 등을 연구합니다.","식품의 각종 성분을 검사하는 식품공학기술자는 각 식품의 특성에 따라 유해 성분 잔류 여부, 식품첨가물의 적절성 여부 등, 제품의 안전성을 판단하는 안전 검사를 실시하며, 이러한 실험·검사 결과를 토대로 종합적인 보고서를 작성합니다.","식품공학기술자 중 식품감시원은 백화점 및 할인 마트의 식품 코너, 식품생산업체 등에서 판매되거나 조리되는 식품이 안전하게 소비자에게 유통되고 판매되는지를 관리하고 감독합니다."],aptitude:"공학 기술직"},1009:{name:"환경위생검사원",wage:3730,from:"워크넷",basis:"보건위생·환경검사원",year:2021,sat:"68.9",works:["환경위생검사원은 음식점, 산업체, 호텔 및 기타 작업장 환경을 조사하고 점검하여, 작업장의 위생 관리, 공해 관리, 위험물 처리가 정부 규정에 따라 잘 운영되고 있는지 감독합니다.","음식점이나 식품가공업체 등의 위생 관리 상태를 조사 및 점검하고, 전염병 예방을 위한 공중보건 및 위생 관리에 대한 교육 및 지도를 합니다.","분진, 소음, 진동 측정기 등의 측정 도구를 사용하여 사업장 내의 유해 물질의 유출이나 대기오염 및 수질오염 상태를 확인합니다."],aptitude:"공학 기술직"},34:{name:"치과의사",wage:9578,from:"워크넷",basis:"치과의사",year:2021,sat:"83.4",works:["치과의사는 건강 유지와 증진의 목적을 가지고 치아, 치주조직, 구강구조물, 턱뼈, 턱관절, 얼굴, 얼굴과 연결된 머리와 목 등에 대한 연구와 의료행위를 하며, 의료인으로서의 임무를 수행합니다.","치아를 포함한 구강 질환을 치료, 교정하고, 건강한 치아를 유지, 증진하는 업무를 수행합니다.","의료기기를 이용하여 구강 질환을 정밀하게 검사, 진단하고 손상된 치아를 인공적 장치물로 대치하거나 잇몸의 염증 등을 치료합니다.","턱뼈, 턱관절 등 턱에 생긴 질환과 손상 등을 진단하고 치료합니다."],aptitude:"의료관련 전문직"},407:{name:"직업군인",wage:3600,from:"워크넷",basis:"위관급장교",year:2021,sat:"71.4",works:["직업군인은 국가의 안전보장과 국민의 생명 및 재산을 보호하기 위한 일을 합니다.","지휘관으로서 일반 병사를 지휘, 통솔하거나 혹은 참모로서 지휘관을 보좌하여 정보, 작전, 인사, 군수 등 전문 업무를 수행합니다.","외부의 모든 군사적 위협으로부터 국가를 보호하고 전쟁이 일어나지 않도록 하며 군사적 긴장을 낮추어 평화와 안정을 위한 일을 합니다.","남북한 간의 군사분계선 감시 및 관리, 해안선 및 국가 중요 시설에 대한 경계와 수색 정찰을 합니다."],aptitude:"안전 관련직"},10078:{name:"국제개발협력전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["국제개발협력전문가는 국제개발협력 관련 사업, 협력 프로그램을 기획, 실행, 모니터링함으로써 개발도상국을 지원하는 역할을 수행합니다.","국가별 사무소와의 소통을 통해 각 국가에서 필요로 하는 사업의 수요를 파악합니다.","각 국가의 수요에 따른 개발 사업을 기획 및 논의하고, 진행 과정을 관리합니다."],aptitude:"법률 및 사회활동 관련직"},293:{name:"메이크업아티스트",wage:3250,from:"워크넷",basis:"메이크업아티스트",year:2021,sat:"66.2",works:["메이크업아티스트는 화장을 통해 아름다움을 연출하는 직업으로 분위기와 상황에 맞추어 고객의 메이크업을 담당합니다.","고객의 요구를 파악하고 외모와 얼굴 특성에 따라 화장을 해 줍니다.","메이크업이 끝나면 헤어스타일 및 의상과 조화를 이루는지 점검하고, 화장법에 대해 고객에게 조언하기도 합니다.","메이크업 분야에 따라 뷰티메이크업, 웨딩메이크업, 무대메이크업, 광고메이크업, 포토메이크업, 패션메이크업 등으로 분류됩니다."],aptitude:"이미용 관련직"},1433:{name:"발명가",wage:null,from:null,basis:null,year:null,sat:null,works:["발명가는 지금까지 없던 기술이나 물건을 새로 생각하여 만들어 내는 일을 전문적으로 하는 사람으로, 새로운 아이디어를 생각해 내고 시제품을 만듭니다.","자신이 생각해 낸 발명품의 개요를 적어 개인이 직접 특허청에 특허출원을 신청하거나 특허사무소 또는 변리사를 통하여 특허를 신청하기도 합니다.","중소기업이나 대기업 등에 특허법에 의하여 발명을 독점적으로 이용할 수 있는 권리인이 자신의 발명 특허권을 팔기도 합니다.","자신이 발명한 특허기술을 바탕으로 벤처회사를 설립하거나 상품화하여 팔기도 합니다."],aptitude:"디자인 관련직"},163:{name:"도축원 및 육류가공원",wage:3511,from:"워크넷",basis:"정육원및도축원",year:2021,sat:"60.4",works:["도축원 및 육류가공원은 소, 돼지, 닭 등의 가축을 식용으로 사용할 수 있도록 도살하여 부위별로 알맞은 크기로 자르고, 손질 및 가공, 처리하는 일을 담당합니다.","식용으로 사용하기 위해 가축을 도살하고, 가축의 외피와 뼈를 제거한 다음 부위별로 가축의 고기를 적당한 크기로 자릅니다.","손질된 고기에 훈제나 살균 등의 처리를 합니다."],aptitude:"기능직"},1010:{name:"방사성폐기물관리원",wage:3833,from:"워크넷",basis:"폐기물처리기술자",year:2021,sat:"71.3",works:["방사성폐기물관리원은 원자력시설 혹은 방사성물질을 다루는 작업장과 실험실에서 나오는 폐기물 처리 설비 및 용기를 관리하고, 작업원을 감독합니다.","방사성폐기물 처리 장치를 조작하고, 방사성폐기물의 처리가 제대로 되었는지를 확인합니다.","작업장의 방사능오염을 방지하기 위해 방사성물질 취급자를 감독하거나 방사성동위원소 등의 사용, 저장, 운반 등에 관련된 사항들을 수행합니다."],aptitude:"공학 기술직"},36:{name:"통계학연구원",wage:5387,from:"워크넷",basis:"수학·통계학연구원",year:2021,sat:"81.3",works:["통계학연구원은 자연, 사회, 경제 현상 등으로부터 얻어진 자료를 과학적으로 분석, 추론함으로써 최적의 의사결정과 미래 예측에 도움이 되는 정보로 가공하는 업무를 수행합니다.","통계학의 수학적 기초에 대해 연구하고, 실제 현상에 적용하는 통계학적 이론과 방법을 연구합니다.","통계학적 방법론을 개발하고 통계 방법론의 실무적 적용에 관해 조언하며, 통계적 결과를 해석합니다.","생물학, 공학, 농학, 의학, 정치학, 사회학, 경제학 등의 현상에 대해 관찰하고 연구하며, 그 결과를 수량적으로 정리하여 집단의 합리적인 의사결정을 돕습니다."],aptitude:"이학 전문직"},408:{name:"직업상담 및 취업알선원",wage:3056,from:"워크넷",basis:"직업상담사",year:2021,sat:"72.8",works:["직업상담 및 취업알선원은 취업을 희망하는 사람에게 적합한 일자리에 대한 정보를 제공하거나 인재 채용을 희망하는 업체에 적합한 사람을 소개합니다.","직업상담원은 취업을 희망하는 자들에게 구직 등록을 받은 후 인재 채용을 희망하는 업체 중에서 적합한 일자리를 선별하여 안내해 줍니다.","채용을 희망하는 사람이 잘하는 일, 흥미, 경력 등을 파악하여 알맞은 직업 정보와 취업 정보를 제공합니다.","근로기준법을 비롯한 노동관계법규 등 노동시장에서 발생하는 직업과 관련된 법적인 일반 상담과 창업상담, 경력개발상담, 직업 적응상담, 직업전화상담, 은퇴 상담 등을 수행합니다."],aptitude:"사회서비스직"},10079:{name:"창업컨설턴트",wage:null,from:null,basis:null,year:null,sat:null,works:["창업컨설턴트는 업종, 비용, 수익성 등의 분석을 통해 창업 종목 선정에서부터 개업까지 각 단계별 업무를 도와주는 업무를 수행합니다.","창업을 원하는 고객과의 상담을 통해 고객의 특성, 희망 업종, 비용, 수익성 등을 분석합니다.","고객에 대한 분석 결과를 바탕으로 업종 선택, 점포 구매 등 창업 계획을 세웁니다.","인테리어, 점포 홍보, 마케팅을 도우며, 창업 관련 교육을 합니다."],aptitude:"영업관련 서비스직"},294:{name:"모델",wage:2072,from:"워크넷",basis:"모델",year:2021,sat:"70.8",works:["모델은 다른 사람들에게 제품을 아름답게 보이게 함으로써 제품 홍보를 합니다.","디자이너가 만든 옷을 입고 의상의 아름다움과 특징을 보여주거나 광고를 통해 상품의 장점을 전달합니다.","특정 상품의 사진 또는 영상 매체를 이용한 광고를 제작하기 위하여 언어, 표정, 자세를 취하거나 연출합니다.","예술사진작가, 조각가, 화가의 작품 창작을 위한 모델로서 자세를 취하기도 합니다."],aptitude:"연기 관련직"},1436:{name:"신약개발연구원",wage:5e3,from:"워크넷",basis:"약학연구원",year:2021,sat:"75.5",works:["신약개발연구원은 새로운 의약품을 개발하기 위해 기초연구와 응용연구를 수행합니다.","의약품 개발을 위한 국내·외 각종 전문 자료와 정보를 수집하여 분석합니다.","사람, 동식물 등 생물의 기관, 조직, 생명 작용에 영향을 미치는 물질의 효과를 연구하고, 새롭게 개량된 의약품을 연구·개발합니다.","의약품의 원료를 시험·분석하고, 원료의 혼합 비율을 조절하여 더 나은 제품으로 개량하기도 합니다."],aptitude:"이학 전문직"},164:{name:"양장사 및 양복사",wage:3108,from:"워크넷",basis:"양장·양복제조원",year:2021,sat:"62.5",works:["양장사 및 양복사는 고객의 요구에 따라 여러 디자인의 의복을 제작합니다.","천의 종류, 색상 및 스타일을 상의한 후 고객의 치수를 재고 기록합니다.","고객의 치수대로 본을 제조하여 패턴 모형을 제작합니다.","원단 위에 패턴 모형을 올려놓고 재단하여 시침질로 바느질하거나 재봉틀로 의복의 부분들을 접합합니다."],aptitude:"의복제조 관련직"},1061:{name:"국회의원",wage:9324,from:"워크넷",basis:"고위공무원",year:2021,sat:"80.3",works:["국회의원은 선거를 통해 선출된 국민의 대표로서 국회에서 헌법과 법률의 개정 및 의결과 관련된 일을 하고, 정부 예산안을 심의 및 확정하는 등의 업무를 담당합니다.","헌법과 법률에 규정된 개정 절차에 따라 특정 조항을 수정 및 삭제하거나 새로운 조항을 추가합니다.","정부의 예산안에 대한 심의와 수정을 통해 예산안을 확정합니다."],aptitude:"법률 및 사회활동 관련직"},37:{name:"한의사",wage:9324,from:"워크넷",basis:"한의사",year:2021,sat:"81.7",works:["한의사는 한방 의료의 원리와 기술을 활용해서 인체의 질병과 장애를 진료, 예방하는 업무를 수행합니다.","환자의 얼굴색, 피부 윤기, 혀 등을 눈으로 살펴보고, 환자의 말이나 호흡, 기침 등의 소리를 들으며, 환자의 질병 발생 과정과 증상에 대해 묻고, 맥을 짚어 보는 진료 방법을 사용합니다.","한약재 처방, 침, 뜸, 물리치료 등의 치료법을 사용합니다.","피부, 근육 등을 깊게 혹은 얕게 찌르는 침술을 사용합니다."],aptitude:"의료관련 전문직"},409:{name:"직업능력개발훈련교사",wage:3367,from:"워크넷",basis:"기술·기능계강사",year:2021,sat:"72.0",works:["직업능력개발훈련교사는 직업전문학교나 공공직업훈련원 등에서 사람들에게 직업에 필요한 기능과 지식을 가르칩니다.","해당 직업에 필요한 기술을 시범적으로 보여주고 훈련생들에게 그 분야의 이론, 실기, 방법, 절차 등을 가르칩니다.","실습 과제를 부여하고 그 결과를 평가하여 학생들의 학습의 향상 정도를 평가합니다.","학생들에게 취업 상담과 진로지도의 업무를 수행합니다."],aptitude:"교육관련 서비스직"},10080:{name:"공정무역전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["공정무역전문가는 개발도상국에서 생산한 제품을 소비자가 구입할 수 있도록 교역을 돕는 업무를 수행합니다.","현지 생산자가 생산한 제품이 선진국에서 판매될 수 있도록 지원하고 논의합니다.","생산품의 품질을 높이기 위해 현지 생산자를 대상으로 교육과 훈련을 제공합니다.","개발도상국에서 생산한 제품의 수입, 제조, 판매, 유통을 진행합니다."],aptitude:"금융 및 경영 관련직"},295:{name:"패턴사",wage:3500,from:"워크넷",basis:"패턴사",year:2021,sat:"63.0",works:["패턴사는 디자이너의 스케치나 작업지시서에 따라 패턴 용지나 컴퓨터 프로그램을 이용하여 의류의 패턴 즉, 기본 모형을 제작하는 일을 담당합니다.","패턴 용지 위에 의복의 본을 제도하고, 패턴 라인대로 오려 내어 패턴 모형을 만듭니다.","패턴에 따라 시제품을 제작하고, 패턴과 시제품을 비교하여 패턴을 수정 및 보완합니다."],aptitude:"의복제조 관련직"},1437:{name:"스포츠해설가",wage:4766,from:"워크넷",basis:"아나운서",year:2021,sat:"79.8",works:["축구, 야구, 배구 등 각종 스포츠 경기를 방송을 통하여 설명하고 해설합니다.","스포츠 분야에서 발생한 각종 정보를 수집하고 분석하여 보도자료를 정리합니다.","경기에 참여하는 팀과 선수에 대한 특징과 동향 등을 분석합니다.","최근 경기 영상이나 외국 인터넷 사이트 등을 통해 정보를 얻기도 합니다."],aptitude:"언어 관련 전문직"},165:{name:"설문조사원",wage:2850,from:"워크넷",basis:"통계사무원",year:2021,sat:"58.8",works:["설문조사원은 공공기관, 대기업, 백화점, 방송국, 리서치회사 등에서 고객이나 일반 국민들의 의견을 청취하고 조사하기 위해 설문조사나 시장조사를 실시합니다.","조사감독원이 제시한 조사대상자를 직접 방문하거나 전화를 하여 설문조사를 수행합니다.","완성된 설문지를 조사 감독원에게 제시합니다.","백화점이나 가전업체에서 서비스나 상품에 대한 소비자의 반응이나 의견과 동종 업계의 현황 등을 조사합니다."],aptitude:"사무 관련직"},1068:{name:"마케팅전문가",wage:4248,from:"워크넷",basis:"광고·홍보·마케팅전문가",year:2021,sat:"69.2",works:["마케팅전문가는 마케팅과 소비자 행동 등에 대한 전문 지식을 활용하여 특정 상품의 시장성, 소비자 취향, 잠재 구매 고객 등에 대해 조사하여 효율적인 판매 전략을 계획하고 실행합니다.","사업체의 경영전략, 특징, 비용 등을 고려하고 시장 경향을 파악해 제품에 대한 시장 호가를 판단합니다.","특정 상품과 경쟁 상품에 대한 시장 분석을 바탕으로 특정 상품의 가격 결정 및 상품의 확대 등의 결정을 위해 필요한 정보를 경영진에게 제공합니다."],aptitude:"금융 및 경영 관련직"},38:{name:"해부학연구원",wage:4579,from:"워크넷",basis:"의학연구원",year:2021,sat:"74.2",works:["해부학연구원은 사람과 동물의 해부학적 특성을 분석하여 의학과 관련 분야에 적용하기 위한 연구를 수행합니다.","해부 실습을 통해 사람과 동물의 신체 구조, 해부학적 특성에 대해 연구합니다.","인체의 정상 구조와 각 장기들의 상호 관계, 의학교육에 필요한 기초 지식을 쌓을 수 있도록 대학에서 학생들을 가르칩니다."],aptitude:"이학 전문직"},410:{name:"초등학교교사",wage:4072,from:"워크넷",basis:"초등학교교사",year:2021,sat:"81.6",works:["초등학교 교사는 초등학교에서 학생들을 대상으로 수업 지도, 학급 운영, 생활지도 등을 담당합니다.","학교의 교육 계획과 수업일수 등을 고려하여 각 교과목의 학습 계획안을 작성하고 이에 맞는 교재 연구 및 교수학습 자료를 준비합니다.","학습 과제물을 검사하고 시험을 출제하고 평가하는 등의 학습평가를 실시합니다.","학생들이 원만한 친구 관계를 맺고 다른 사람과 더불어 살 수 있도록 지도하고, 안전사고 및 폭력의 예방, 기본 생활 습관 등과 관련된 생활지도를 하며, 학생과 학부모를 대상으로 상담을 합니다."],aptitude:"교육관련 서비스직"},296:{name:"무대감독",wage:4973,from:"워크넷",basis:"기술감독",year:2021,sat:"67.4",works:["무대감독은 무대 연출에 필요한 촬영, 무대장치, 편집 등의 기술적인 업무를 계획하고 조정합니다.","작품의 예술성을 살리기 위한 무대장치, 조명, 의상, 음향 분야 종사자 등의 역할과 활동을 결정하며, 출연 배우들이 적절한 시기에 등장하도록 조정합니다.","돌발적으로 발생할 수 있는 무대 위의 안전사고에 대한 점검을 하고, 안전사고를 미연에 방지합니다.","공연이 완료되면 무대 종사자들을 지휘하여 모든 물품을 정리 및 보관하고 다음 행사를 준비합니다."],aptitude:"예술기획 관련직"},1438:{name:"카레이서",wage:4662,from:"워크넷",basis:"직업운동선수",year:2021,sat:"67.8",works:["카레이서는 각종 자동차경주대회에서 경주용 차량을 운전하여 경주를 합니다.","경기 일정에 따라 미리 자동차 경주장의 상태, 상대 팀의 경기력과 과거 경력 등 자료를 수집·분석하여 전략을 세웁니다.","평소에는 운동으로 근력과 지구력을 키우며, 팀원들과 함께 주행 연습을 합니다.","시합 전에는 차량 점검을 받고 시험주행 후 이상 시 정비전문가에게 부탁하여 차량을 정비합니다."],aptitude:"기타 게임·오락·스포츠 관련직"},166:{name:"세탁원",wage:3108,from:null,basis:null,year:null,sat:"59.3",works:["세탁원은 더러워진 의복, 침구류, 피혁제품 등을 제품의 변형 없이 깨끗하게 세탁하는 일을 담당합니다.","고객으로부터 의뢰받은 세탁물을 옷감의 종류에 따라 분류합니다.","의류, 침구류 등에 묻은 얼룩 및 더러움을 제거하기 위해 손으로 세탁을 하거나 특수 용제와 세제를 사용하여 세탁을 합니다.","세탁 및 건조가 끝난 세탁물은 종류와 형태에 따라 주름을 잡고 다림질을 합니다."],aptitude:"기능직"},1076:{name:"자동차공학기술자",wage:4986,from:"워크넷",basis:"자동차공학기술자",year:2021,sat:"77.7",works:["자동차공학기술자는 각종 차량의 차체, 엔진, 제동장치, 및 기타 구성품에 관하여 개발 및 제조를 계획, 감독합니다.","자동차의 기계, 전기 및 기관에 대한 새로운 디자인을 개발하기 위하여 관련 자료를 검토하고 분석합니다.","구성부품 및 기관을 설계하고, 공학기술상의 설계와 일치 여부를 확인하기 위하여 부품, 차량의 제조, 개조, 수리 작업을 감독, 조정합니다."],aptitude:"공학 전문직"},39:{name:"해양학연구원",wage:5090,from:"워크넷",basis:"수산학연구원",year:2021,sat:"71.6",works:["해양학연구원은 해양기후, 해양환경, 해양생물자원, 해양안전방제, 해양운송시스템 등 해양 전반과 관련된 과학기술과 정책 개발에 관한 연구를 수행합니다.","해수의 특성, 수질, 해양생물의 분포 등을 조사해서 해양의 도면과 환경도를 작성합니다.","물리, 화학, 생물, 지질 등 다양한 접근 방법을 통해 해양의 잠재력을 극대화합니다.","해양 속에 존재하는 생물자원과 비생물자원의 개발과 이용 방법에 대해 연구합니다."],aptitude:"이학 전문직"},411:{name:"치과위생사",wage:3044,from:"워크넷",basis:"치과위생사",year:2021,sat:"74.4",works:["치과위생사는 치과의사의 진료 및 치료를 보조하여 구강 관련 질환을 예방 및 치료하고, 구강 관리에 대해 안내합니다.","환자의 구상 상태를 간단히 검진하고 치과 위생에 필요한 방사선촬영을 하며, 치과의사를 보조하여 구강 내 검사 및 진단, 교정 및 치아를 뽑거나 수술할 때 보조합니다.","구강 내 여러 가지 침착물을 제거하고(스케일링), 치아 표면을 매끈하게 하여 치주질환을 예방합니다.","치과 진료기구 및 장비를 소독하고 관리하며, 병원 관리 업무나 의료보험 청구 업무 등 기타 행정적인 업무를 합니다."],aptitude:"보건의료 관련 서비스직"},298:{name:"무용가",wage:3108,from:"워크넷",basis:"무용가",year:2021,sat:"66.7",works:["무용가는 무용을 창안, 해석하거나 혼자 또는 단체의 일원으로서 예술적으로 춤을 춥니다.","작품의 내용과 감정을 관객에게 전달하기 위해 다양한 동작을 통해 작품을 표현합니다.","다양한 동작을 창작하고 표현하려는 이미지와 감정을 춤으로 구성합니다.","공연이 결정되면 연습 스케줄을 계획하고 자신이 맡은 배역과 전체적인 공연 콘셉트 및 분위기를 파악합니다."],aptitude:"무용 관련직"},1439:{name:"캐스팅디렉터",wage:4579,from:"워크넷",basis:"공연·영화·음반기획자",year:2021,sat:"65.9",works:["캐스팅디렉터는 드라마나 영화의 연출을 맡은 PD나 감독의 의도를 파악하여 작품의 장르에 적합하고 상업적인 흥행을 이끌 수 있는 배우를 선정하는 일을 합니다.","오디션을 통하여 신인배우를 선발하거나 활동하고 있는 배우를 선정하여 영화 및 드라마의 배역에 가장 적합한 배우를 섭외합니다.","시나리오를 읽어 본 후 등장인물의 성격을 파악하고, 각 배역에 적합한 배우를 섭외하기 위해 배우들에 대한 정보를 수집하여 분석합니다.","배우를 섭외한 이후에도 리허설 장소 제공이나, 녹음 작업, 시사회 초대에 이르기까지 모든 작업에서 배우의 스케줄을 관리하는 일을 하기도 합니다."],aptitude:"예술기획 관련직"},167:{name:"소믈리에",wage:3315,from:"워크넷",basis:"바텐터",year:2021,sat:"54.9",works:["소믈리에는 와인을 취급하는 호텔이나 레스토랑, 바, 와인 전문점에서 고객이 주문한 요리에 어울리는 와인을 추천하고 고객의 취향을 파악하여 고객이 원하는 와인을 감정하고 골라 주는 일을 담당합니다.","호텔이나 레스토랑에서 고객이 주문한 요리에 적합한 와인을 추천하고 와인의 맛과 특징, 원산지 등을 설명합니다.","와인의 품목을 선정하고 이에 따른 와인 리스트를 작성하며 와인의 보관과 관리의 책임을 집니다.","와인의 맛을 보고 와인과 어울리는 음식, 장소, 대상 등을 연구합니다."],aptitude:"영업관련 서비스직"},1078:{name:"대형트럭 및 특수차운전원",wage:3833,from:"워크넷",basis:"화물차·특수차운전원",year:2021,sat:"56.8",works:["대형 트럭 및 특수차 운전원은 각종 화물을 수송하기 위해 대형 트럭을 운전하거나, 특수설비가 장착된 특수차량을 운전합니다.","주로 대형트럭, 덤프트럭, 트레일러트럭, 레미콘, 유조차, 견인차, 청소차 등을 운전합니다.","엔진오일, 냉각수, 타이어의 공기 압력 등을 점검하고 각종 안전장치의 이상 유무를 확인합니다."],aptitude:"일반운전 관련직"},40:{name:"화학연구원",wage:4750,from:"워크넷",basis:"화학연구원",year:2021,sat:"75.8",works:["화학연구원은 열, 압력 등 물리적 요인의 변화를 측정하고 물질의 특성과 상호작용, 물질의 변환을 통한 새로운 물질의 창조과정 등을 연구개발 하는 업무를 수행합니다.","분광학, 분광광도 측정법 등의 기술을 활용하여 화학적인 특성을 분석합니다.","유기화합물 분석을 통해 합성 메커니즘을 밝혀내거나 새로운 고분자물질을 발견, 개발합니다.","물질의 화학적 성질, 조성, 구조, 변화 등에 대해 연구합니다."],aptitude:"이학 전문직"},412:{name:"캐디",wage:2950,from:"워크넷",basis:"오락시설서비스원",year:2021,sat:"59.1",works:["캐디는 골프장에서 고객이나 골프선수를 보조하여 골프 용품을 정리, 운반하는 등 골프 경기가 원활하게 진행될 수 있도록 돕습니다.","골프 경기가 진행될 때에는 고객 또는 선수를 따라 골프백을 운반하고 용도에 맞는 골프채를 건네줍니다.","전문 골프선수들을 보조하는 전문 캐디의 경우, 선수들에게 스윙 자세와 종류, 방향 등을 조언합니다.","고객 또는 선수가 쳐낸 공을 찾고, 골프공과 골프채를 깨끗하게 세척하고 관리합니다."],aptitude:"운동 관련직"},299:{name:"문화재보존원",wage:3800,from:"워크넷",basis:"문화재보존원",year:2021,sat:"71.8",works:["문화재보존원은 궁궐, 사찰, 미술관, 박물관의 소장품과 같은 문화재의 파손 부위를 복원 및 관리합니다.","손상되거나 훼손된 문화재의 원형을 되살리기 위해 과학적 방법을 사용하며 관련 기술을 연구합니다.","문화재 수리를 담당하는 중요한 사찰이나 유적의 수리 및 보존 공사를 담당합니다.","국가유산수리기술자, 국가유산수리기능자, 보존과학기술자 및 기능자 등으로 구분되며 국가유산수리기술자는 각 분야에 대한 기술을 자문하고, 각종 공사와 국가유산수리기능자를 관리 및 감독합니다."],aptitude:"인문 및 사회과학 관련직"},1440:{name:"일반의사",wage:8500,from:"워크넷",basis:"일반의사",year:2021,sat:"74.9",works:["인간의 질병, 장애, 상해를 진단하고 치료하기 위해 진찰과 의학적 검사를 시행합니다.","치료의 범위와 방향을 정하고, 환자와의 상담을 통해 구체적인 내용을 결정합니다.","의과학 연구 및 보건 향상을 위한 연구를 수행합니다.","청진기, 맥박 기록기 등 간단한 의료 기구를 사용하여 환자를 진찰하고 검사하며 결과를 분석하여 치료 및 약물을 처방합니다."],aptitude:"의료관련 전문직"},169:{name:"영양사",wage:3419,from:"워크넷",basis:"영양사",year:2021,sat:"72.3",works:["영양사는 건강 증진 및 질병 치료를 목적으로 영양 기법 및 응용에 관하여 연구개발 하고 전문적인 영양 서비스를 제공합니다.","식품의 신선도, 함유 열량 등을 계산하고 섭취해야 할 영양소의 양을 분석합니다.","식단에 필요한 양을 산출하여 재료를 구입하고, 재료의 품질 상태 및 조리 방법을 확인합니다.","조리 담당자의 음식 조리 상황과 위생 상태를 관리 및 감독하며, 음식물을 내놓기 전에 이를 평가하기 위해 먼저 먹어 보는 일을 수행합니다."],aptitude:"보건의료 관련 서비스직"},1080:{name:"환경공학기술자 및 연구원",wage:3833,from:"워크넷",basis:"폐기물처리기술자",year:2021,sat:"71.3",works:["환경공학기술자 및 연구원은 각종 환경오염 문제를 확인하여 연구개발을 통해 방지 대책을 세우거나 공해 방지 설비를 설계하고 제작하며 환경 개선 방안을 수립합니다.","환경보전에 필요한 다양한 공학적인 기술을 개발하고, 환경오염 방지 및 제어를 위한 처리시설을 설계합니다.","발생된 폐기물 및 기타 오염물질 등을 정화하기 위한 공정의 설계, 시공, 운전 등에 관여합니다."],aptitude:"이학 전문직"},41:{name:"가전제품 설치 및 수리원",wage:3663,from:"워크넷",basis:"가전제품설치·수리원",year:2021,sat:"57.8",works:["가전제품 설치 및 수리원은 서비스 센터 내에 근무하면서 방문하는 고객의 제품을 수리하거나 고객의 집을 방문하여 수리하는 업무를 수행합니다.","고객의 수리 신청이 접수되면 접수된 내용을 확인하고 고객과의 소통을 통해 제품의 문제를 확인합니다.","제품의 파손 부위를 확인하고 공구를 사용하여 교체하거나 수리합니다.","가전제품의 시운전을 통해 작동상태를 확인하고 수동 공구를 사용하여 재조립합니다."],aptitude:"기능직"},413:{name:"특수교사",wage:3833,from:"워크넷",basis:"특수교육교사",year:2021,sat:"66.9",works:["특수교사는 신체적, 정신적 장애를 겪고 있는 학생에게 유치원, 초등학교, 중학교, 고등학교에 준하는 교육과 생활에 필요한 지식 및 기능을 가르칩니다.","장애에 따라 시각장애, 청각장애, 발달장애, 지체부자유, 정서장애로 구분되며, 학생들이 겪는 어려움에 맞추어 교육을 합니다.","장애 학생의 장애 정도와 발달 상황 등을 고려하여 적절한 교재와 교육 방법을 활용해 학습지도를 합니다.","점심 식사 및 등하교 지도, 옷 입기와 벗기, 몸단장, 손 씻기 등 학생들의 생활지도 및 인성 지도를 담당합니다."],aptitude:"인문계 교육 관련직"},301:{name:"방송연출가",wage:4500,from:"워크넷",basis:"방송연출가",year:2021,sat:"74.3",works:["방송연출가는 라디오 또는 텔레비전의 프로그램을 기획하고 제작합니다.","시나리오작가를 선정하여 제작될 프로그램의 계획을 설명하고 완성된 대본을 평가합니다.","프로그램을 기획하고 이에 적합한 방송 작가와 제작진, 연기자들을 섭외합니다.","완성된 대본을 평가하고 배역을 정하며, 의상, 무대배경, 음악, 카메라 작업, 시간 배정 등을 결정하기 위해 제작진과 협의하고 조정합니다."],aptitude:"예술기획 관련직"},1441:{name:"작가",wage:2450,from:"워크넷",basis:"소설가",year:2021,sat:"64.3",works:["출판이나 연극, 영화, 방송을 위한 문학작품을 창작하거나 소설, 시, 동화, 수필, 영화 시나리오, 연극 대본, 드라마 극본을 창작합니다.","영화, 방송, 연극 제작을 위해 작품의 주제를 선택하고 내용에 따른 등장인물의 성격, 시대적 배경, 장소 등을 결정하며 작품을 전개하는 데 필요한 대사 내용, 동작 등을 작성합니다.","각 장면의 특징에 따라 인물의 표정, 동작, 음향, 조명 등을 고려하여 시나리오와 극본을 작성합니다.","작품을 창작하기 위하여 주제를 선정하고 관련 자료를 수집 및 분석하고 작품을 씁니다."],aptitude:"작가 관련직"},171:{name:"전통식품제조원",wage:2722,from:"워크넷",basis:"김치·밑반찬제조종사원",year:2021,sat:"59.2",works:["전통식품제조원은 우리나라의 고유 음식인 떡, 한과, 간장, 된장, 김치 등을 만드는 일을 담당합니다.","조리할 식품의 종류에 따라 필요한 재료를 준비하여 재료들을 세척하고, 조리 방법에 따라 전통 식품을 만듭니다.","완성된 식품을 포장하고 주문한 고객에게 배달하거나 매장에 진열하여 판매합니다."],aptitude:"조리 관련직"},1081:{name:"해양공학기술자",wage:4860,from:"워크넷",basis:"조선·해양공학기술자",year:2021,sat:"75.1",works:["해양공학기술자는 관련 전문 지식을 이용하여 기초 자료를 조사, 분석하고 해양환경 현황을 조사, 관측, 평가, 계획합니다.","각종 관측과 기상관측을 통하여 환경영향평가 및 위치적 타당성을 검토합니다.","흙의 일반적인 활동 현상을 분석하고, 구조물의 하중에 대한 지지력을 추적하여 해안보전 시설물, 방파제, 방사제 등 해양구조물의 안정을 위한 합리적인 설계 및 도면 작성, 재료 선택, 시공을 진행하고, 시공에 따른 오염물의 확산, 해안 건설공사로 인한 생태계의 영향 등을 분석합니다."],aptitude:"공학 전문직"},42:{name:"건설공사품질관리원",wage:5387,from:"워크넷",basis:"건축감리기술자",year:2021,sat:"68.8",works:["건설공사품질관리원은 건설자재에 대한 품질검사를 실시하고, 건설 재료의 품질과 안전성 검사를 통해 부실 공사를 방지하고 건설 사고를 예방하는 업무를 담당합니다.","계측기, 시험 장비 등을 이용하여 콘크리트, 철근, 마감 재료 등 건설자재에 대한 품질검사를 실시하고, 결함 발견 시 적절한 조치를 취해 사고를 예방합니다.","건설 설계도 검토를 통해 품질보증계획서, 품질시험계획서를 작성하고, 건설 현장의 토질과 지반이 예정된 건설 공사에 적합한지 검사합니다.","파괴시험, 비파괴시험, 토공사 점검, 마감공사 점검 등을 실시합니다."],aptitude:"공학 기술직"},414:{name:"판사",wage:7770,from:"워크넷",basis:"판사",year:2021,sat:"80.6",works:["판사는 법정에서 재판을 진행하며 검사와 변호사의 논쟁, 변호사 및 증인의 진술, 사건 증거 등 재판에 관련된 자료를 검토하고 법률에 근거해 판결을 내립니다.","재판과 관련하여 증인의 채택, 증거 채택 방식, 재판 방식 등 재판 절차를 정합니다.","재판 진행을 통해 민사 분쟁을 해결하며, 기소된 형사사건의 범죄 여부를 판단합니다.","재판이 진행될 때는 변호사와 검사의 논쟁을 경청하고 증인의 진술과 법정에 제출된 증거를 검토하고 추론합니다."],aptitude:"법률 및 사회활동 관련직"},303:{name:"연기자",wage:4e3,from:"워크넷",basis:"영화배우및탤런트",year:2021,sat:"70.8",works:["연기자는 연극, 영화, TV 드라마에 등장하는 인물의 배역을 맡아 출연하여 대본과 감독의 연출에 따라 연기합니다.","연극, 영화, 드라마 등에 캐스팅되어 배역이 결정되면, 극중인물의 성격을 파악하여 얼굴 표정이나 행동을 연습하고 대본을 암기합니다.","상대 연기자와 조화를 이루기 위해 촬영이나 공연에 앞서 대본 연습을 합니다.","인물의 성격을 잘 표현할 수 있는 의상, 소품, 분장 등을 담당자와 협의하여 준비합니다."],aptitude:"연기 관련직"},1541:{name:"자연과학연구원",wage:4835,from:"워크넷",basis:"생물학연구원",year:2021,sat:"75.3",works:["자연과학 분야의 기초적인 이론과 지식을 탐구하며, 발견된 이론과 지식을 다른 분야에 적용하는 응용 연구를 수행합니다.","물리학, 생물학, 화학, 지구과학, 천문학을 연구하여 관련 개념과 이론을 개선하거나 개발합니다.","수학적 지식을 확장하기 위한 연구를 수행하거나 통계학적 이론과 기술을 개발합니다.","자연과학의 원리와 지식을 다양한 산업 분야에 적용하여 문제 해결을 할 수 있도록 조언합니다."],aptitude:"이학 전문직"},172:{name:"제과사 및 제빵사",wage:3450,from:"워크넷",basis:"제과·제빵원",year:2021,sat:"71.8",works:["제과사 및 제빵사는 빵, 케이크, 쿠키, 파이 등 다양한 빵 및 과자류를 만듭니다.","손이나 혼합기를 이용하여 반죽을 완성한 후, 일정한 온도와 습도에서 규정된 시간 동안 발효 및 숙성시킵니다.","오븐에 넣고 온도와 시간을 조절하여 구운 후, 냉각기를 사용하거나 자연 상태에서 냉각시킵니다.","제품의 종류에 따라 크림, 잼 등의 장식을 하고 포장을 합니다."],aptitude:"조리 관련직"},1087:{name:"전자 부품 및 제품 생산직",wage:3358,from:"워크넷",basis:"전자부품·제품생산기계조작원",year:2021,sat:"66.0",works:["전자 부품 및 제품 생산직은 전자장비에 사용되는 부분품을 제조하는 장치를 조작하고 생산과정이 원활히 진행되도록 이에 대한 제반 사항을 관리합니다.","자재부서로부터 자재를 수령하여 이상 유무를 확인하고 작업지시서, 부품목록 등을 숙지하며, 프로그램을 기계에 입력하고 전자 부품 자재를 제품 모델에 맞게 기계에 장착합니다.","인쇄회로기판에 삽입될 전자 부품의 첫 좌표를 설정하고 프로그램에 입력된 삽입 위치의 파일을 보며 부품이 삽입되도록 작동시킵니다."],aptitude:"기능직"},46:{name:"건축공학기술자",wage:4662,from:"워크넷",basis:"건축구조기술자",year:2021,sat:"71.2",works:["건축공학기술자는 건축물 공사 시 전체적인 관리, 감독을 수행하고, 구조 설계, 시공과 관련된 기술적 자문을 합니다.","공사가 설계 도면에 따라 진행되는지와 공사 현장의 안전, 환경, 건축물의 품질, 공사를 위한 재료, 인력 등에 대해 관리, 감독합니다.","공사 기간, 시공 방법, 투입 인력의 규모, 건설기계와 건설자재 투입량 등의 세부 공정을 수립하고 시행합니다.","공사가 설계에 따라 제대로 진행되고 있는지 감독하고 현장을 관리합니다."],aptitude:"공학 전문직"},415:{name:"프로바둑기사",wage:5180,from:"워크넷",basis:"프로게이머",year:2021,sat:"61.2",works:["프로바둑기사는 바둑 대회에 참가하여 다른 프로바둑기사와 서로 바둑 실력을 겨룹니다.","많은 사람들이 바둑을 즐길 수 있도록 바둑의 보급 및 교류 활동과 관련된 일을 담당합니다.","바둑을 연구하고, 경기에 승리하기 위해 자신 또는 경쟁 상대의 장단점을 조사하고 분석합니다.","일반인들에게 바둑을 가르치기도 하며, 바둑 경기를 해설하기도 합니다."],aptitude:"운동 관련직"},304:{name:"백댄서(백업댄서)",wage:2950,from:"워크넷",basis:"대중무용수",year:2021,sat:"62.8",works:["백댄서는 가수의 노래와 음악에 어울리는 춤을 개발하고 연습하며, 함께 공연에 참가하여 가수의 무대를 보조하는 일을 합니다.","가수의 노래와 음악에 어울리는 춤을 개발하고 가수에게 춤을 지도하기도 합니다.","관객에게 즐거움을 제공하기 위해 음악에 맞춰 춤을 춥니다.","안무가가 개발한 무용을 지도받고 연습합니다."],aptitude:"무용 관련직"},10001:{name:"3D 프린팅 전문가",wage:3715,from:"워크넷",basis:"3D프린팅모델러",year:2021,sat:"79.4",works:["3D 프린팅 전문가는 소재를 쌓아 물체를 만드는 3D프린터를 이용해 고객의 요구에 따라 제품(미니어처, 액세서리, 일상용품, 개인 편의 제품, 기계 부품 등)을 만들어 냅니다.","컴퓨터 프로그램을 활용하여 설계된 디자인대로 프린터를 조작하고 운영합니다.","제품을 디자인하는 3D 모델링 과정, 설계된 데이터값을 입력하는 3D 프린팅 과정, 출력된 제품을 후처리하는 과정을 통해 최종 제품을 설계하고 제작하는 서비스를 제공하는 일을 합니다."],aptitude:"공학 전문직"},173:{name:"조리사 및 주방장",wage:3937,from:"워크넷",basis:"주방장",year:2021,sat:"64.0",works:["조리사 및 주방장은 식자재와 조리 도구에 대한 지식을 바탕으로 재료 준비, 식료품 검사와 관리, 세척, 각종 요리 기구를 사용해 알맞은 조리법에 따라 요리하고, 조리된 음식의 맛, 영양 상태 등을 점검합니다.","주문서나 식단 계획표에 따라 재료를 준비하고 세척하며 식료품의 상태를 검사하고 관리합니다.","남은 재료를 손질하여 보관하고 식기, 요리 기구, 장내를 정리합니다.","주방장은 조리사에게 요리와 식재료 가공을 지시 및 감독하고 조리사의 교육과 훈련을 담당하며 주방을 전반적으로 관리합니다."],aptitude:"조리 관련직"},1088:{name:"스포츠에이전트",wage:4248,from:"워크넷",basis:"광고·홍보·마케팅전문가",year:2021,sat:"69.2",works:["스포츠에이전트는 스포츠 관련 프로그램 및 서비스를 개발하고 운영을 위한 기획 및 절차를 조직하여 조정 및 관리합니다.","시합이나 경기에 관한 정보를 수집하고 훈련 과정을 설계하기도 하며 스포츠 관련 회사와 소속 선수를 연결하여 계약을 성사시킵니다.","선수를 돌보고 스케줄 관리를 하는 것은 물론 선수의 이미지 관리, 운동량 관리, 광고 계약 체결, 연봉 협상, 언론 홍보, 팬클럽 관리 등을 합니다."],aptitude:"매니지먼트 관련직"},47:{name:"타이어 및 고무제품 생산직",wage:3885,from:"워크넷",basis:"타이어·고무제품생산기계조작원",year:2021,sat:"56.5",works:["타이어 및 고무제품 생산직은 각종 고무 제품 제작을 위해 여러 화학제품과 원료를 배합, 가공하는 제조기기와 장치를 조작합니다.","작업지시서에 따라 필요한 고무나 고무 화합물을 준비하여 계량합니다.","압출, 성형된 고무 부품을 작업대 위에 올려놓고, 부품의 제조 상태를 점검하여 파손되거나 규격 미달인 제품을 제거합니다.","컨베이어벨트나 작업대 위에 고무 부품을 조립하기 쉽게 늘어놓고, 홈이나 틀에 맞추어 주름이 발생하지 않도록 합니다."],aptitude:"기능직"},416:{name:"피부관리사",wage:3108,from:"워크넷",basis:"피부및체형관리사",year:2021,sat:"64.5",works:["피부관리사는 고객의 얼굴부터 발끝까지 신체의 모든 피부 상태를 아름답고 건강하게 관리해주는 일을 합니다.","고객과의 상담을 통해 피부 유형을 파악하고, 적합한 화장품의 종류나 피부 관리법을 소개합니다.","피부의 모공 관리, 여드름 관리, 눈썹 관리, 주름 및 피부 처짐 방지, 노화 방지, 손상된 피부 회복 등 피부 개선 프로그램을 계획하고 관리합니다.","피부 관리 서비스를 수행하면서 고객의 피부 유형에 맞는 화장품과 미용 기구, 마사지, 팩 등을 이용해 피부를 탄력 있고 청결하게 관리합니다."],aptitude:"이미용 관련직"},305:{name:"보석디자이너",wage:3613,from:"워크넷",basis:"패션소품디자이너",year:2021,sat:"70.4",works:["보석디자이너는 다이아몬드, 사파이어, 금 등의 보석을 이용하여 아름다운 장신구나 액세서리를 디자인합니다.","새로운 제품에 대한 아이디어를 얻기 위해 국내외 시장조사를 실시합니다.","보석의 원석을 감정하고 보석 액세서리의 전체 모형과 보석 세공에 대한 정밀 묘사를 합니다."],aptitude:"디자인 관련직"},10002:{name:"홀로그램 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["홀로그램 전문가는 기술 분야와 서비스 분야로 나눌 수 있는데, 기술 관련 전문가는 홀로그램을 데이터로 생성하고 처리하는 연구와 개발을 담당합니다.","서비스 관련 전문가는 주로 문화 공연이나 전시를 기획하고 설계하여 콘텐츠를 제작함으로써 사람들이 홀로그램을 직접 볼 수 있도록 만드는 일을 합니다.","오디오, 영상, 컴퓨터그래픽, 시스템설계 등의 다양한 분야의 전문가와 함께 작업을 수행합니다."],aptitude:"공학 전문직"},174:{name:"가축사육자",wage:3500,from:"워크넷",basis:"가축사육종사원",year:2021,sat:"54.4",works:["가축사육자는 가축의 번식과 사육에 대한 지식을 바탕으로 조류, 파충류, 모피생산 동물, 품종을 개량한 조류인 가금, 사냥이 허가 난 새인 엽조류와 더불어 소, 양, 돼지, 산양, 말 등과 같은 가축을 번식하고 사육하며 낙농제품을 생산하는 데 필요한 활동을 기획하고 수행합니다.","가축, 새 등 사육할 동물의 종류와 양을 결정한 후 구입합니다.","양질의 고기와 알을 얻기 위해 사료의 배합과 공급을 조절하여 가축에게 먹이를 주고 축사 내의 온도를 적절히 유지합니다.","가축의 건강을 위해 구충제를 투여하고 콜레라 등의 예방접종을 실시하며, 분뇨 청소, 방목장 및 우사 청소, 방역 등의 작업을 통해 적절한 위생 상태를 유지합니다."],aptitude:"농생명산업 관련직"},1089:{name:"자연계중등학교교사",wage:4540,from:"워크넷",basis:"중·고등학교교사",year:2021,sat:"79.4",works:["자연계중등학교교사는 국립, 공립, 사립 중등학교에서 교육과정에 따라 학생들에게 자연계 교과목을 가르치고 생활을 지도하는 업무를 수행합니다.","단순히 지식을 전달하는 사람이 아니라 인생에서 가장 중요한 시기인 청소년기를 보내는 학생에게 가치관을 확립해 주는 안내자의 역할을 합니다.","학교의 교육계획과 수업일수 등을 고려하여 자신이 전담하는 과목의 학습안을 설계하고 교과서를 비롯해 시청각 자료 등 다양한 교재를 활용합니다."],aptitude:"이공계 교육 관련직"},48:{name:"공작기계조작원",wage:3626,from:"워크넷",basis:"금속공작기계조작원",year:2021,sat:"61.7",works:["공작기계조작원은 각종 공작기계를 조작하여 금속과 비금속 재료를 깎고 구멍을 뚫고 마무리 작업을 합니다.","금속 공작물의 설계 도면, 명세서, 작업지시서를 검토하여 공정 순서에 따라 절삭, 연삭, 용접, 마무리 작업 등의 가공 계획을 세웁니다.","공작기계의 작동과 조정, 자동 검사 시스템의 확인 등의 업무를 수행합니다."],aptitude:"기능직"},417:{name:"학원강사",wage:4e3,from:"워크넷",basis:"문리학원강사",year:2021,sat:"68.6",works:["학원강사는 여러 연령층의 사람들이 가진 다양한 교육적 요구에 따라 필요로 하는 지식과 기능을 교육하는 일을 합니다.","강의 분야에 따라 문리어학계열, 기술기능계열, 예체능계열의 학원 강사로 나뉘어 각 분야에 대한 전문 지식과 기능을 가르치고 각종 시험 및 자격증 시험에 대비한 과정을 운영합니다.","문리어학계열 학원강사는 학교 교과목, 외국어, 각종 고시 과목에 대한 이론과 기술을 강의하고 자격·면허 취득을 위한 전문과목 등을 지도합니다.","예체능계열 학원강사는 수강생들에게 무용, 음악, 미술, 체육 등 예체능 분야에 관한 이론과 실기실습 위주로 강의를 합니다."],aptitude:"교육관련 서비스직"},306:{name:"분장사",wage:3400,from:"워크넷",basis:"분장사",year:2021,sat:"66.4",works:["분장사는 영화, 연극, TV 드라마의 작품 내용과 인물의 성격에 어울리도록 배우를 분장하는 일을 담당합니다.","극의 분위기와 시대적 배경에 맞는 사진, 문헌 등을 검토하고, 방송 연출가, 배우와의 협의를 통해 분장 방법을 결정합니다.","가발, 수염, 연지, 분, 물감 등의 분장용 재료와 화장품을 이용하여 출연자를 작품 속 인물의 외양과 성격에 어울리게 분장합니다.","각종 마스크, 눈알, 이빨, 송곳니, 틀니, 입체 상처, 내장, 표피 등을 이용하여 젊은이를 노인으로 만들거나 흉측한 괴물로 만드는 특수 분장을 담당하기도 합니다."],aptitude:"이미용 관련직"},10003:{name:"UX 디자인 컨설턴트",wage:4090,from:"워크넷",basis:"UX·UI디자이너",year:2021,sat:"74.2",works:["UX 디자인 컨설턴트는 사용자의 마음과 행동에 대한 조사와 이해를 바탕으로 사용자 입장에서 제품을 설계해 더 편리하게 사용하도록 하는 UX(사용자 경험, UX: User Experience) 디자인 업무를 수행합니다.","사용자들이 제품이나 서비스에 만족 또는 불만족을 느끼는 요소는 무엇이고, 이에 더해 새로 원하는 요구가 무엇인지를 찾아 새로운 제품 기획안을 만들어 냅니다.","웹, 스마트폰, 태블릿PC에 담기는 각종 애플리케이션을 어떻게 하면 더 편리하게 사용할 수 있을지 문제점을 파악하고 해결책을 제시합니다."],aptitude:"디자인 관련직"},175:{name:"한복사",wage:3056,from:"워크넷",basis:"한복제조원",year:2021,sat:"62.3",works:["한복사는 직물의 종류, 원단의 실용성 디자인 등의 지식을 바탕으로 고객의 주문에 따라 저고리, 치마, 두루마기, 마고자, 버선 등의 한복을 제작합니다.","한복 제작 시 직물의 종류, 색상, 원단의 실용성과 디자인에 관하여 고객과 상의하고, 고객의 치수를 재고, 명세서에 규격, 색상, 직물의 종류, 본 등을 기록합니다.","재단 후 명세서에 따라 실의 색깔을 선택하고 재봉틀, 바늘과 같이 다음 공정에 알맞은 도구를 선택해 재봉 및 손바느질을 합니다.","가위나 칼로 불필요한 실을 제거하고 다림질하며, 단추나 장식물들을 손바느질하여 한복을 완성합니다."],aptitude:"의복제조 관련직"},1090:{name:"콘크리트공",wage:3522,from:"워크넷",basis:"콘크리트공",year:2021,sat:"57.2",works:["콘크리트공은 건축 및 토목 공사에서 일정 수준 이상의 콘크리트 강도가 나오도록 시멘트, 모래, 자갈, 물을 적정하게 배합하여, 이것을 조립된 철근 위에 붓고, 잘 굳도록 관리하는 일을 합니다.","콘크리트 반장의 지시에 따라 시멘트, 모래, 자갈을 일정 비율로 배합하여 섞은 다음 물을 부어 콘크리트 혼합물을 만듭니다.","만들어진 콘크리트 혼합물을 콘크리트 펌프나 손수레 등을 이용하여 작업 현장으로 운반하고, 거푸집 또는 타설 위치에 콘크리트 혼합물을 붓고 바이브레이터로 진동다짐을 한 후, 평탄하게 마무리를 합니다."],aptitude:"기능직"},49:{name:"광원 및 채석원",wage:4144,from:"워크넷",basis:"광원·채석원및석재절단원",year:2021,sat:"54.3",works:["광원 및 채석원은 지하에 매장되어 있는 석탄, 금속, 비금속 등의 광물과 건설 석재를 채굴하고 운반하며, 채석된 석재를 가공하는 업무를 수행합니다.","곡괭이, 삽, 착암기 등의 작업 장비를 준비하여 광물과 석재의 채굴 작업을 합니다.","다양한 굴착 기계를 사용하여 굴착 작업을 합니다.","광차나 체인컨베이어 등의 장비를 이용하여 채굴한 광물과 석재를 광 밖으로 운반합니다."],aptitude:"기능직"},418:{name:"비행기승무원",wage:4450,from:"워크넷",basis:"항공기객실승무원",year:2021,sat:"72.3",works:["비행기승무원은 비행기 승객이 목적지까지 안전하고 쾌적하게 여행할 수 있도록 기내에서 각종 서비스를 제공하는 일을 합니다.","비행기 탑승 전에 업무 분담, 비행 일정, 항로 및 기상 조건, 기타 유의 사항 등에 관한 필수 사항을 전달받고 기장과 함께 안전한 비행이 될 수 있도록 합니다.","기내의 비상장비 및 시설의 이상 유무 확인, 기내 서비스를 위한 용품의 수량 및 탑재 확인, 기내의 청결 상태를 포함한 객실 서비스를 위한 사항을 확인하고 준비합니다.","비행기 탑승이 시작되면 승객이 제시하는 탑승권을 확인하고 좌석을 안내하며, 승객의 안전벨트 착용 여부, 이동 물품의 고정 여부 등을 확인합니다."],aptitude:"일반 서비스직"},309:{name:"비디오저널리스트(VJ)",wage:4500,from:"워크넷",basis:"방송연출가",year:2021,sat:"74.3",works:["비디오저널리스트는 비디오카메라를 가지고 방송물 등을 직접 기획, 취재, 촬영, 편집하는 일을 담당합니다.","방송물의 주제를 정하고 전체적인 방향에 대해 기획합니다.","방송물에 출연할 사람을 섭외하고 촬영합니다.","주제와 관련된 인터뷰를 하고 녹음과 편집을 진행합니다."],aptitude:"예술기획 관련직"},10004:{name:"도시 재생 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["도시 재생 전문가는 쇠퇴하거나 낙후된 도시를 되살리기 위하여 도시 재생 계획을 세우는 일을 합니다.","도시를 되살리는 방법에 대하여 주민들의 의견을 조사하고 정리합니다.","주민들에게 도시 재생에 대하여 홍보하고 교육을 합니다.","마을 기업을 창업하고 운영하는 일을 자문합니다"],aptitude:"공학 전문직"},176:{name:"선장 및 항해사",wage:5594,from:"워크넷",basis:"선장및항해사",year:2021,sat:"72.5",works:["선장은 선박 항로, 안전, 해상운송 등의 지식을 바탕으로 화물과 승객 운송을 비롯해, 어로를 위하여 항해하는 선박 내의 여러 활동을 지휘하고 감독하며 조정합니다.","항해사는 선장의 지시에 따라 선박의 항로를 결정하고, 승무원을 지휘하고 감독하여 항해 안전 업무, 선원의 의료 업무, 해상운송 등 갑판 업무의 전반을 관리합니다.","안전한 운항을 위해 항해 목적지, 기후, 거리 등을 확인하고 선박의 조정실, 기관실, 통신실 등을 점검하며 화물의 적재 상태, 식료품, 연료 등을 검사하고 승무원을 확인해 그에 알맞은 업무를 분담하고 지휘합니다.","항해도, 레이더 등을 통해 선박 속도를 파악하여 기후, 해양 상태 등을 바탕으로 선박의 진행을 조절하고 항해 기구, 지도, 차트를 통해 지리적 위치를 파악하며 선박의 항해 기기 및 장비를 유지하고 관리합니다."],aptitude:"일반운전 관련직"},1092:{name:"GIS전문가",wage:5e3,from:"워크넷",basis:"지적및측량기술자",year:2021,sat:"73.4",works:["지리정보시스템(GIS: Geographic Information System)전문가는 국토 공간상에 존재하는 각종 위치 및 속성정보 등을 정보화하여 활용하는 것으로 첨단정보시스템에 대한 전반적인 업무를 수행합니다.","사용자 의견을 수렴하여 시스템의 구조를 설계하고, 데이터베이스, 사용자 인터페이스 및 네트워크의 기본적인 시스템 구조를 설계합니다.","지리정보에 사용되는 각종 데이터를 수집 및 분석하여 이를 데이터베이스화 합니다."],aptitude:"공학 전문직"},50:{name:"제화원",wage:3500,from:"워크넷",basis:"제화원",year:2021,sat:"61.3",works:["제화원은 가죽, 인조가죽 등의 재료를 이용해서 각종 구두, 가방, 벨트 등의 제품을 생산하고 수선하는 업무를 담당합니다.","고객의 주문서와 작업지시서에 따라 제품 디자인, 크기, 수량을 확인하고 필요한 재료와 공구를 준비합니다.","제품의 모형을 만들고, 모형에 따라 가죽 또는 인조가죽 등의 재료를 재단하며, 접착제와 재봉틀을 이용하여 형태를 고정합니다.","바닥을 매끄럽게 다듬고 고무 밑창을 접착시키며, 구두의 깔창을 부착하거나 가방의 끈을 다는 등 마무리 작업을 합니다."],aptitude:"의복제조 관련직"},419:{name:"홍보도우미",wage:2443,from:"워크넷",basis:"홍보도우미및판촉원",year:2021,sat:"57.8",works:["홍보도우미는 고객이 상품이나 서비스의 구매하거나 시설 이용을 하도록 판촉물을 배포하거나 춤, 노래, 게임 등을 이용하여 상품과 서비스를 홍보하는 일을 합니다.","전시회, 판촉 행사, 신제품 설명회 등이 시작하기 전에 상품이나 서비스, 시설의 특징, 홍보 방법 등에 대한 교육을 받고 관련 내용을 외웁니다.","상품과 서비스에 대한 고객의 질문에 응답하고, 상품의 특징이나 장점을 설명하거나, 각종 행사나 박람회장의 관람객을 안내하는 일을 합니다.","제품에 대한 시범 사용, 시식 및 시음 행사 등을 운영하고 고객이 상품이나 서비스를 직접 체험할 수 있도록 돕고 설명합니다."],aptitude:"영업관련 서비스직"},310:{name:"사진작가",wage:3522,from:"워크넷",basis:"사진작가및사진사",year:2021,sat:"71.1",works:["사진작가는 촬영대상 또는 장소를 선정하여 작품사진과 보도사진 등을 촬영합니다.","바다, 산, 도시 등 현장 방문을 통해 사진 촬영 대상과 장소를 선정합니다.","촬영대상의 특징, 거리, 구도를 확인하고 그에 따라 각도, 조명, 초점, 노출정도를 결정하여 촬영합니다.","촬영된 필름을 현상인화하고, 사진작품 전시를 위해 촬영방법과 현상기술을 연구합니다."],aptitude:"영상 관련직"},10005:{name:"스마트 도시 전문가",wage:4276,from:"워크넷",basis:"도시계획·설계가",year:2021,sat:"70.1",works:["스마트 도시 전문가는 정보 통신 기술을 이용하여 정보를 수집하고 자원을 효율적으로 관리하는 스마트 도시를 계획합니다.","도시 지역의 교통, 에너지, 수도, 하수, 폐기물, 학교, 병원 등에 관한 전반적인 데이터를 수집하고 분석합니다.","사물 인터넷과 인공지능 기술을 적용하여 도시 문제를 분석하고 해결책을 내놓는 일을 합니다.","스마트 도시를 만들기 위하여 필요한 각종 설비나 시스템을 설치하고 관리하는 일을 합니다."],aptitude:"공학 전문직"},177:{name:"푸드스타일리스트",wage:3800,from:"워크넷",basis:"제품디자이너",year:2021,sat:"69.3",works:["푸드스타일리스트는 식품 조리와 스타일링에 대한 지식을 바탕으로 영화, 드라마, 광고 등에 내보낼 음식 관련 장면을 연출하며, 레스토랑의 새로운 메뉴를 개발하거나 요리책이나 잡지 등에 올릴 요리 개발 및 조리법 작성 등의 일을 수행합니다.","국내외 요리, 식기, 소품, 인테리어 등의 관련 자료를 수집 및 분석해 요리의 특성과 의뢰자가 원하는 구성에 맞춰 식기와 소품을 구성합니다.","소비자 시장을 조사하고, 조사 결과를 바탕으로 레스토랑의 기존 메뉴를 보완하거나 새로운 메뉴를 추가하며, 잡지나 요리 프로그램의 기획 주제에 적합한 메뉴를 개발합니다."],aptitude:"기타 특수 예술직"},10
