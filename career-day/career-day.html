:"워크넷",basis:"레크리에이션전문가",year:2021,sat:"66.7",works:["문화여가사는 문화와 여가에 관한 다양한 정보와 서비스를 제공함으로써 여가 시간을 알차게 보내는 방법을 알려주고 여가 생활을 지원하는 역할을 합니다.","사람들에게 여가 시간을 의미 있게 활용하는 방법을 알려주고, 관련 활동을 기획하고 조언합니다.","개인이나 가족, 동호회 등을 대상으로 여가 프로그램에 관한 계획을 세워 줍니다.","조직이나 단체 등을 대상으로 레저에 관한 전문적인 컨설팅을 진행하기도 합니다."],aptitude:"사회서비스직"},234:{name:"외환딜러",wage:5698,from:"워크넷",basis:"증권딜러",year:2021,sat:"73.4",works:["외환딜러는 국제금융 관련 지식을 바탕으로 달러화, 엔화, 마르크화 등 국제금융시장에서 통용되는 외환과 파생상품을 싼 시점에 사들이고 비쌀 때 팔아 그 차액을 남기는 일을 합니다.","세계정세 변화, 외환시장 동향 등 금융 관련 정보를 수집하고 분석합니다.","환율 변화를 예측하고, 이에 따른 손실 발생을 방지하고 이익을 남기기 위해 매매 시점을 포착한 후 외환과 외환 선물 상품을 매매합니다.","외환시장 조건과 전망에 대해 고객이나 상급 관리자에게 알리고 거래를 권고합니다."],aptitude:"금융 및 경영 관련직"},1135:{name:"공구제조원",wage:3358,from:"워크넷",basis:"일반기계조립원",year:2021,sat:"56.7",works:["공구제조원은 공구 제조에 대한 지식과 기술을 가지고 각종 금속공작기계 등을 사용하여 절삭 공구, 목공 공구, 다듬질 공구 등을 제작합니다.","공구 설계도나 작업 지시서를 확인하고, 공구 제작 절차와 방법에 따라 선택한 금속재료를 준비합니다.","준비한 재료를 금속공작기계를 조작하여 절삭공구 등으로 가공합니다.","제작된 각종 공구를 보수하고 정비하는 일을 담당하기도 합니다."],aptitude:"기능직"},107:{name:"인공위성개발원",wage:4200,from:"워크넷",basis:"통신기기·장비기술자",year:2021,sat:"70.4",works:["인공위성개발원은 우주탐사, 기상예보 등의 다양한 목적을 달성하기 위한 인공위성을 연구 및 개발하는 일을 담당합니다.","인공위성 및 인공위성과 관련된 분야에 대한 전문적 지식과 기술을 활용하여 목적에 맞는 인공위성을 연구, 개발, 설계합니다.","인공위성이 궤도에 도달하도록 유도하며, 위성으로부터 보내진 탐사 자료를 분석합니다.","시장조사와 세계 인공위성개발의 기술 변화 등에 대해 분석하여 인공위성의 기술적 성능의 개선 및 개발에 참고합니다."],aptitude:"공학 전문직"},917:{name:"음반기획자",wage:4579,from:"워크넷",basis:"공연·영화·음반기획자",year:2021,sat:"65.9",works:["음반기획자는 국외 음반 시장의 상황과 음반 구매자의 요구를 분석하고 제작할 음반의 주제와 내용을 기획하는 일을 합니다.","음반 구매자가 요구하는 음악의 주제나 스타일을 찾기 위해 다양한 마케팅 조사를 실시합니다.","음악감독과의 회의를 통해 음반의 주제를 선정하고, 음반의 주제에 맞는 가수, 연주자, 작곡가, 작사가, 편곡가 등을 정하고 작사, 작곡 및 편곡, 녹음 등의 과정을 거쳐 음반으로 제작합니다.","음반이 완성되면 방송 출연 및 신문사, 잡지사와 같은 홍보 매체와의 인터뷰 등을 계획하거나 SNS를 활용하는 등 음반의 홍보와 판매 전략을 기획합니다."],aptitude:"음악 관련직"},360:{name:"경호원",wage:3522,from:"워크넷",basis:"경호원",year:2021,sat:"62.8",works:["경호원은 개인을 외부의 위협으로부터 보호하여 상해나 납치 등 위협으로부터 안전하게 경호하고 보호합니다.","경호 대상자의 정보(개인 경력, 인적 사항, 상황 등) 및 고객의 경호 내용을 확인하고 위험한 요인이 무엇인지 파악하여 적절한 경호 방법을 선택하여 경호 계획을 수립합니다.","박람회, 전시회, 콘서트 등의 행사장을 경호할 때는 행사장의 질서를 유지하고, 사람들의 출입을 통제하며, 특정인의 돌출 행동을 막는 업무를 수행합니다.","방문자의 출입을 점검하고, 불법침입 및 도난 등의 위험을 방지합니다."],aptitude:"안전 관련직"},10043:{name:"개인브랜드매니저",wage:null,from:null,basis:null,year:null,sat:null,works:["개인브랜드매니저는 의뢰인이 사회 구성원으로서 원활하게 활동할 수 있도록 의뢰인이 개발하기를 원하는 기술과 능력, 지식에 대해 파악하고, 이러한 특징들을 의뢰인 스스로 인식할 수 있도록 돕는 역할을 수행합니다.","의뢰인에게 직업심리검사를 실시하고 적성과 기술에 알맞은 직업정보를 찾아 소개합니다.","의뢰인의 교육 수준과 경력 등을 파악하여 취업 전략을 제시합니다.","의뢰인의 성향, 성격 등을 파악하여 강점은 부각시키고 약점은 보완할 수 있는 방법을 제시합니다."],aptitude:"매니지먼트 관련직"},236:{name:"자동차영업원",wage:4351,from:"워크넷",basis:"자동차영업원",year:2021,sat:"68.0",works:["자동차영업원은 자동차에 대한 지식을 바탕으로 자동차 제조회사에서 생산된 자동차를 고객에게 판매하는 일을 담당합니다.","고객이 원하는 차종과 종류를 파악한 다음, 차량의 가격, 연비, 옵션 사항 등에 대해 설명하고 구매가 이루어질 수 있도록 고객을 설득하여 자동차의 판매 계약을 성사합니다.","자동차 판매 계약을 성사하면, 고객과 자동차의 구매 비용, 인도 일자, 계약조건 등에 대해 논의하며 판매 차량에 대한 보증, 정비 관련 서비스를 제공합니다.","자동차의 제품 정보, 경쟁업체, 시장상황에 대한 정보를 수집하고 분석하여 자동차 영업 및 판매 활동에 활용합니다."],aptitude:"영업관련 서비스직"},1136:{name:"항공기·선박조립 및 검사원",wage:3918,from:"워크넷",basis:"선박조립원",year:2021,sat:"55.3",works:["항공기ㆍ선박 조립 및 검사원은 항공기 또는 선박을 만들기 위해 외장 부분과 내부 부속품을 조립하는 일을 합니다.","부품, 하위 부품과 최종 완성품을 검사하고, 수행한 작업이 품질기준에 적합한지를 확인합니다.","엔진 등의 구성품을 용접기, 동력 공구, 기중기 등을 사용하여 항공기 또는 선박에 탑재합니다.","손, 공구, 설비를 사용하며, 로봇이나 자동 조립 설비를 사용하기도 합니다."],aptitude:"기능직"},108:{name:"인쇄기조작원",wage:3308,from:"워크넷",basis:"인쇄기계조작원",year:2021,sat:"61.8",works:["인쇄기조작원은 활판, 평판 등의 인쇄기를 조작하여 책, 신문, 팸플릿 등의 각종 인쇄물을 생산합니다.","작업지시서 또는 주문서에 따라 제작할 인쇄물의 종류, 용지, 잉크, 인쇄 방식, 인쇄량 등을 확인하고, 인쇄판, 인쇄용지 등을 기계에 장착합니다.","잉크를 조합하여 잉크통에 투입하고 교정인쇄를 통해 원고와 비교하여 색도, 망점 등을 검사 및 교정합니다.","인쇄 중에 종이 공급 상황, 잉크 상황, 인쇄물의 상태를 점검 및 조정하고 인쇄물을 정리합니다."],aptitude:"기능직"},920:{name:"애니메이션기획자",wage:4579,from:"워크넷",basis:"공연·영화·음반기획자",year:2021,sat:"65.9",works:["애니메이션기획자는 애니메이션의 제작에 필요한 각종 업무를 기획하고 조정하는 일을 합니다.","역사나 문화에 관련된 다양한 자료를 읽고 조사하여 애니메이션 작품의 새로운 소재를 발굴하거나 애니메이션의 주제 및 내용의 전체 방향을 결정합니다.","애니메이션 제작에 필요한 예상 인력, 비용, 필요한 제작 기간 등에 대한 전체 예산을 기획하고, 기타 제작에 필요한 사항들을 조정하며 제작 인력 등을 섭외하고 제작을 총감독합니다.","각 장면에 따라 캐릭터를 연기하는 성우에게 분위기, 동작 등을 설명하고 지도합니다."],aptitude:"예술기획 관련직"},362:{name:"일반공무원",wage:3626,from:"워크넷",basis:"공공행정사무원",year:2021,sat:"73.8",works:["일반공무원은 국가 또는 공공기관에 소속되어 행정 업무와 민원 업무 등 각종 업무를 수행합니다.","법령과 업무처리 규정에 따라 관련 업무를 계획하고 시행합니다.","정부 고유의 행정 업무인 주민등록, 출생, 사망, 혼인 등과 관련된 서류 접수 및 발급 등의 업무를 수행하거나, 각종 승인이나 검사, 허가 등 정부 행정 집행과 관련된 업무를 수행합니다.","국민과 직간접적으로 연관되어 있으며, 기술적인 업무, 연구, 농어촌 지도 업무, 일반 행정 등을 담당합니다."],aptitude:"사무 관련직"},10044:{name:"개인관리컨설턴트",wage:null,from:null,basis:null,year:null,sat:null,works:["개인관리컨설턴트는 건강관리, 자연치료, 다이어트 등과 같은 개인관리서비스를 전문적으로 제공합니다.","건강관리, 자연치료, 다이어트 등에 관한 조사, 연구를 통해 개인 관리 서비스를 필요로 하는 고객에게 관련 내용을 상담해 줍니다.","고객이 정신적, 신체적 불균형을 바로잡을 수 있도록 상담해 줍니다."],aptitude:"매니지먼트 관련직"},238:{name:"기업고위임원",wage:12e3,from:"워크넷",basis:"기업고위임원",year:2021,sat:"79.5",works:["기업고위임원은 경영학적 지식을 바탕으로 기업의 기본 경영방침과 목표를 계획하고, 목표를 달성하기 위한 전략과 정책을 수립합니다.","이사회나 이와 유사한 운영 기관 또는 법령에 의해 위임된 권한 하에 사업체의 전반적인 정책을 수립하고 운영 현황, 과거의 실적, 미래의 계획을 평가하여 사업 계획을 결정합니다.","대외적으로 사업체를 대표하며, 고위 간부와 임원의 임명을 결정하고 예산 배정과 조직의 업무 분담을 조정하고 승인합니다.","부서 사이의 활동을 조정하고 사업체 운영상의 문제점을 해결합니다."],aptitude:"금융 및 경영 관련직"},1137:{name:"제관원",wage:3613,from:"워크넷",basis:"제관원및제관기조작원",year:2021,sat:"60.0",works:["제관원은 두꺼운 철판, 봉, 관 등의 재료를 설계 도면에 맞게 가공하여 보일러, 철 구조물, 금속 용기 등을 제작합니다.","도면이나 작업 지시서를 검토하여 어떤 제품을 제작해야 하는지 파악하고, 제관 작업에 필요한 철골, 강판, 공구 등의 장비를 준비합니다.","절단기나 프레스 등의 장비를 이용하여 철판, 봉 등의 재료를 절단하거나 구부리고 볼트와 너트로 각 부분을 가조립하여 제품의 형태가 도면과 일치하는지 확인합니다.","제품과 도면이 일치하면, 가조립한 제품이 완전하게 고정될 수 있도록 용접 및 조립하고 용접 부위를 다듬습니다."],aptitude:"기능직"},109:{name:"자동차정비원",wage:4172,from:"워크넷",basis:"자동차정비원",year:2021,sat:"64.9",works:["자동차 정비원은 자동차를 검사, 정비, 수리합니다.","소비자의 차량 상태를 확인하고, 차량 정보에 대한 기초 자료를 수집합니다.","고장의 위치, 범위, 정도, 성격을 확인하기 위해 시험 측정 기구를 이용하여 각 부분을 진단 및 검사하고 기계의 작동 상태를 평가합니다.","자동차의 성능을 향상시키거나 스타일을 바꾸기 위해 개조하는 튜닝 작업도 합니다."],aptitude:"기능직"},922:{name:"애니메이션작가",wage:2500,from:"워크넷",basis:"영화시나리오작가",year:2021,sat:"63.3",works:["애니메이션작가는 애니메이션의 전체적인 내용의 전개와 뼈대를 구성하고 이에 따라 이야기의 전체 흐름과 상세한 내용이 담긴 콘티 작업을 합니다.","국내외의 다양한 자료를 읽거나 조사하고, 애니메이션 시장의 분위기를 파악하여 새로운 작품 소재를 찾아냅니다.","애니메이션의 주제가 선정되면 해당 주제와 관련 있는 자료 조사를 실시하고 전문적인 영역의 내용이 포함되는 경우 전문가에게 조언을 구하기도 합니다.","애니메이션 작품의 주제와 전체적인 내용 전개에 맞게 캐릭터의 대사와 대본을 만드는 작업을 합니다."],aptitude:"작가 관련직"},363:{name:"교도관",wage:3765,from:"워크넷",basis:"교도관",year:2021,sat:"73.1",works:["교도관은 교도소, 구치소 등 교정시설에서 수용자를 관리 및 감독하고, 교정 교육을 합니다.","수용자의 행동을 감독하고, 기록하며 수용자가 건전한 정신과 올바른 생활 자세를 가지도록 생활 지도와 더불어 교화 교육, 직업훈련 등을 실시합니다.","수용자의 건강관리를 위하여 개인위생, 침구, 의류 등을 검사하고, 수용자의 교정시설 내 규율 유지와 탈출, 도주, 자해 행위 등을 예방하기 위해 출입구 및 교도소의 중요 시설을 경비합니다.","범죄를 예방하거나 범죄자를 재활시키기 위하여 청소년 클럽, 지역 공동체 센터 및 유사 조직에서 사회, 오락 및 교육활동을 조직하고 감독합니다."],aptitude:"안전 관련직"},10045:{name:"재활용코디네이터",wage:3833,from:"워크넷",basis:"폐기물처리기술자",year:2021,sat:"71.3",works:["재활용코디네이터는 재활용을 통해 자원을 아끼기 위한 프로그램을 만들거나 실행하고 이에 관련된 기술을 개발합니다.","기업체 등에서의 폐기물을 최소화하고 각종 법률과 특정한 조건에 따라 재활용 계획과 목표를 수립하고 폐기물 관리 회사 및 기타 회사와의 계약 협상 등의 일을 합니다.","재활용 기술자, 재활용 작업자나 자원봉사자 등을 감독하거나 재활용 운영 예산 등 재활용 프로그램이 잘 운영될 수 있도록 관리하고 관련 법률에 대한 위반 사항을 조사합니다.","기업이나 일반인을 대상으로 재활용하는 방법이나 재활용의 환경적 장점에 대해 교육합니다."],aptitude:"환경관련 전문직"},239:{name:"증권분석가",wage:6216,from:"워크넷",basis:"투자분석가",year:2021,sat:"77.3",works:["증권분석가는 통계학, 경제학의 지식을 바탕으로 경제 동향을 파악하여 기업의 재무 상태나 신용도 등의 정보를 토대로 어음, 수표, 채권, 주권, 상품권과 같은 유가증권을 분석합니다.","기업의 실적 예상, 기업의 자금조달 형편의 조사 및 분석, 증권의 가격변동과 수익률 추세 분석 등에 대한 업무를 수행하며 고객에게 유용한 투자 정보를 제공합니다.","주식, 채권 등 유가증권을 발행한 기업의 재무 상태, 유가증권의 가격변동, 수익률, 추세 등을 분석하는 업무를 수행합니다.","위의 분석 결과와 다른 투자회사나 펀드매니저, 투자 고객과의 각종 정보 교환을 바탕으로 신시장 개척, 새로운 투자, 신기술 개발 등 미래에 실현될 증권 관련 사항들을 예측하고 전망합니다."],aptitude:"금융 및 경영 관련직"},1138:{name:"새시원",wage:3419,from:"워크넷",basis:"섀시조립·설치원",year:2021,sat:"56.4",works:["새시원은 철재, 알루미늄, 스테인리스, 철사 등을 가공하여 창문틀, 새시, 철망문 등을 제작하고 시공하는 일을 담당합니다.","줄자를 이용하여 새시 시공 위치의 규격을 측정하고, 규격에 맞추어 철재, 알루미늄, 스테인리스, 철사 등을 자릅니다.","새시를 조립하기 위하여 부속품에 구멍을 뚫고 공구를 사용하여 볼트를 조입니다.","조립된 새시를 용접하거나 볼트를 조여 고정시키고, 각종 장식물을 부착하거나 페인트를 칠하기도 합니다."],aptitude:"기능직"},110:{name:"자동차조립원",wage:4973,from:"워크넷",basis:"자동차조립원",year:2021,sat:"66.3",works:["자동차조립원은 각종 자동차의 차체, 외·내장품, 타이어, 유리 등의 부품들을 조립 및 부착하여 자동차를 완성하거나 완성된 자동차 조립품을 검사합니다.","작업 표준서를 보고 필요한 공구 및 자재를 확인하고, 도장이 끝난 차체에 동력 공구를 이용하여 각종 내장 부품, 배선, 트림 등을 조립합니다.","차량의 앞, 뒤 유리와 옆문 유리, 제동장치, 엔진, 변속기를 조립합니다.","타이어, 앞뒤 범퍼, 전조등, 제동등 등 외장 부품을 조립하고, 운전석과 조수석 내부 의자를 조립합니다."],aptitude:"기능직"},923:{name:"게임기획자",wage:4579,from:"워크넷",basis:"공연·영화·음반기획자",year:2021,sat:"65.9",works:["게임기획자는 PC 게임, 모바일 게임, 콘솔 게임 등 게임용 소프트웨어 제작과 관련된 모든 사항을 기획하고 감독합니다.","국외의 게임 시장 조사를 통해 소비자들이 원하는 게임이 무엇인지를 확인하고, 새로운 게임 제작을 위한 아이디어를 내거나 이에 대한 기획안을 작성합니다.","게임의 장르와 이용 연령층, 게임의 난이도, 게임 내 각종 캐릭터 역할과 특징, 기본적인 스토리 흐름을 설정하고, 그래픽 디자이너, 컴퓨터 프로그래머 등과 함께 게임 소프트웨어를 제작합니다.","게임 소프트웨어에 대한 공개 전 테스트를 하고 시연회에 참여하는 등 홍보와 마케팅 업무를 기획합니다."],aptitude:"예술기획 관련직"},364:{name:"이공학계열교수",wage:7785,from:"워크넷",basis:"대학교수",year:2021,sat:"77.4",works:["이공학계열교수는 대학에서 이공학계열 과목을 강의하고, 학생들을 지도하며 자신의 전공 분야에 대한 지속적인 연구 활동을 합니다.","전문대학 및 대학교에서 물리, 화학, 생물, 전기전자, 산업공학, 화학, 건축 등의 과목을 가르칩니다.","전공이나 담당 교과목에 따라 강의, 실험, 실습 등 다양한 방법을 이용하여 학생을 지도합니다.","자신의 전공 분야를 연구하여 각종 학회, 세미나 등에 논문을 제출하며, 전공 분야 및 관심 분야 등에 대한 서적을 집필하기도 합니다."],aptitude:"이학 전문직"},10046:{name:"동물보호보안관",wage:null,from:null,basis:null,year:null,sat:null,works:["동물보호보안관은 동물 학대를 예방하고, 동물을 위험한 상황으로부터 보호하는 일을 합니다.","동물을 방치하거나 학대 신고를 받고 출동하여 동물을 구조하고, 상황에 따라 동물 학대자를 경고하거나 고발하여 법적인 조치를 합니다.","동물을 키우는 사람들이 반려동물을 잘 돌볼 수 있도록 돕거나 교육합니다.","동물과 관련된 기관이나 업체, 서커스나 동물 쇼 같은 행사를 정기적으로 점검하고 다치거나 위험에 빠진 동물을 구조합니다."],aptitude:"자연친화 관련직"},240:{name:"증권중개인",wage:5900,from:"워크넷",basis:"증권사무원",year:2021,sat:"72.8",works:["증권중개인은 증권에 대한 지식을 바탕으로 증권의 거래 주문을 받아 일을 담당하는 중간자로서 증권을 사거나 팔고자 하는 고객의 주문을 증권 거래소에 등록하고 고객의 거래조건과 맞는 주문자를 찾아 연결해 주는 일을 합니다.","투자 정보를 검토하고 시장상황을 모니터하며, 다른 투자회사나 금융분석가와 연락하여 투자 거래 전략을 세웁니다.","고객에게 증권 정보를 제공하고, 고객의 희망 거래조건과 맞는 주문자를 찾아 연결하여 증권 거래 계약이 이루어질 수 있도록 합니다.","금융 정기간행물, 기업의 주식 및 채권 보고서, 시장조사 등 여러 투자 정보를 검토하고 분석하여 고객에게 투자 정보를 제공하고 자문합니다."],aptitude:"금융 및 경영 관련직"},1139:{name:"단조원",wage:3500,from:"워크넷",basis:"단조원및단조기조작원",year:2021,sat:"58.4",works:["단조원은 해머나 단조프레스 등의 기계를 이용하여 쇠붙이와 같은 금속재료에 열을 가하고, 두들기거나 압력을 가하여 원하는 형태의 제품으로 가공하는 일을 담당합니다.","도면과 작업 지시서를 검토하여 작업에 필요한 해머, 단조프레스 등의 도구와 금속재료를 준비합니다.","가열한 금속재료를 해머나 단조프레스 등을 사용하여 금속의 품질을 개선하고 유연한 형태로 가공합니다.","도면과 완성된 제품을 비교하여 제품의 결함 여부와 길이나 크기가 정확한지에 대해 확인합니다."],aptitude:"기능직"},112:{name:"재료공학기술자",wage:5e3,from:"워크넷",basis:"금속·재료공학기술자",year:2021,sat:"73.5",works:["재료공학기술자는 산업에서 사용하고 있는 금속 및 비금속 재료를 가공ㆍ처리하여 제조하는 일련의 제조공정을 연구ㆍ개발하고 기술을 지휘ㆍ감독합니다.","비금속의 속성 및 특성에 관한 연구를 수행하고 세라믹, 반도체 및 기타 재료들의 주형, 조형, 열처리를 위한 공정을 설계합니다.","각종 설비와 배관의 물성 및 부식에 대한 진단을 위하여 비파괴 기술에 대한 연구를 합니다.","화학, 물리적 분석 및 기타 연구를 수행하고 재료의 설계, 부식 관리 방법과 공정을 검사하며 기타 절차들에 관해 자문합니다."],aptitude:"공학 전문직"},926:{name:"출판편집자",wage:3400,from:"워크넷",basis:"출판·자료편집사무원",year:2021,sat:"66.3",works:["출판편집자는 작가가 쓴 원고의 내용을 검토하고 작성 내용의 손상 없이 원고의 오타나 맞춤법 등을 수정하는 교정, 문법에 맞지 않는 문장을 고치는 교열, 글을 다듬는 윤문 작업을 합니다.","원고를 받아서 출판물의 디자인을 검토하고, 편집 작업의 순서와 방법을 결정합니다.","작가와 출판 기획자와의 상의를 통해 책의 내용에 맞는 글씨체, 디자인, 책의 크기와 규격인 판형 등을 결정하고 알맞은 양식에 따라 원고의 내용을 편집합니다.","디자인 설계부터 편집까지의 모든 작업을 수행하기도 하며, 디자인 프로그램인 일러스트, 포토샵 등을 이용하여 사진을 합성 또는 수정하여 더욱 좋은 이미지를 만듭니다."],aptitude:"언어 관련 전문직"},365:{name:"독서지도사",wage:4e3,from:"워크넷",basis:"문리학원강사",year:2021,sat:"68.6",works:["초등학생, 중학생, 고등학생을 대상으로 독서교육 프로그램을 개발하고 교육하고 평가합니다.","학생들에게 독서지도를 하며, 독서교육에 대한 학습 상담 및 교육적 자문을 합니다.","학생들에게 독서 전, 독서 중, 도서 후 활동에 필요한 기술 및 방법을 가르치고, 독후감 쓰기 및 자유로운 독서 토론을 지도합니다.","학생들의 독서 습관에 대해 부모나 학생들과 상담을 합니다."],aptitude:"교육관련 서비스직"},10047:{name:"식품융합엔지니어",wage:null,from:null,basis:null,year:null,sat:null,works:["식품융합엔지니어는 미래의 식량 부족 위기에 대비해서 생명과학과식품과학 기술, 전자 및 기계공학 기술 등의 융합을 통해 새로운 기능과 형태를 가진 식재료를 개발하는 일을 합니다.","유전자 조작과 세포를 합치는 병합 등을 통해 병과 해충에 강하고 생산량이 많은 작물을 개발합니다.","식재료뿐만 아니라 다양한 용도로 활용될 수 있는 새로운 작물을 개발합니다."],aptitude:"공학 기술직"},242:{name:"텔레마케터",wage:2800,from:"워크넷",basis:"텔레마케터",year:2021,sat:"59.6",works:["텔레마케터는 마케팅에 대한 지식을 바탕으로 각종 상품을 전화 주문을 통해 판매하거나 직접 고객에게 전화를 걸어 상품을 홍보하고 판매하는 일을 담당합니다.","사업체 또는 개인에게 전화를 걸어 제품이나 서비스를 설명하고 구매가 이루어질 수 있도록 영업 활동을 합니다.","고객의 전화에 응대하며 주문받고, 고객의 정보를 데이터베이스에 입력합니다.","고객이 구매한 상품이나 서비스와 관련한 고객의 불편 사항을 접수하기도 하며, 이에 대한 대안이나 해결책을 제시하며 관련 부서에 통보하는 일을 수행합니다."],aptitude:"영업관련 서비스직"},1140:{name:"도장원",wage:4092,from:null,basis:null,year:null,sat:"57.2",works:["자동차, 선박, 가구 등의 다양한 제품의 표면에 페인트, 에나멜, 래커 또는 코팅 처리를 하는 분무 기기를 조작합니다.","표면을 매끄럽게 하기 위해 스크래퍼(긁개), 사포 등을 사용하여 묵은 페인트나 거친 부위를 긁어냅니다.","페인트에 희석제를 섞거나 색조를 혼합하여 롤러, 솔, 분사기 등을 사용하여 지정된 표면에 페인트, 래커 등을 칠합니다.","도안, 글씨, 상호 등을 작업 대상에 그리기도 합니다."],aptitude:"기능직"},113:{name:"전공",wage:3885,from:"워크넷",basis:"내선전기공",year:2021,sat:"65.6",works:["전공은 발전소에서 주택이나 상가, 공장까지 전기가 안전하게 전달되어 사용될 수 있도록 각종 전력시설을 설치하고 수리합니다.","전기공사에 관한 기초적인 지식과 숙련기능을 소지하고 전기공사용 기자재와 측정기를 사용하여 고압선이나 저압선을 가설하여 지지물 및 기기를 설치·보수합니다.","분야에 따라 외선전공, 내선전공, 산업전공으로 분류됩니다."],aptitude:"공학 기술직"},927:{name:"북디자이너",wage:3500,from:"워크넷",basis:"시각디자이너",year:2021,sat:"66.9",works:["북디자이너는 출판물의 앞뒤 표지와 내부를 디자인하거나 출판물의 내용 본문의 활자, 구성 및 그림 등을 편집하고 디자인하는 업무를 담당합니다.","국내외의 책 디자인 유행이나 흐름을 알기 위한 시장조사를 하고 북디자인의 방향을 정하거나 소비자의 욕구에 맞는 디자인을 찾아 기획합니다.","책을 만들기 위해 내용에 들어갈 이미지, 글의 배열, 글꼴의 크기, 색, 음영 등을 고른 후 디자인에 소요되는 비용 등을 예상하여 고객에게 제안합니다.","여러 개의 디자인 중 내부 전문가 및 고객과 회의를 통해 최종 디자인을 결정합니다."],aptitude:"디자인 관련직"},366:{name:"레크리에이션지도자",wage:3108,from:"워크넷",basis:"레크리에이션전문가",year:2021,sat:"66.7",works:["레크리에이션지도자는 캠프, 사교 모임 등에서 여가 활동을 즐길 수 있도록 다양한 오락 프로그램을 계획하고 진행하는 일을 담당합니다.","기업체, 학교 등 레크리에이션 진행을 의뢰하는 기관 및 행사의 성격, 인원, 배정 시간 등에 따라 프로그램을 준비합니다.","오락 프로그램 진행 시에는 사회를 보며 노래, 율동, 게임 등을 지도합니다.","양육시설, 노인요양시설, 단체 교육 등에서 프로그램을 진행하기도 합니다."],aptitude:"연기 관련직"},10048:{name:"수의테크니션",wage:2600,from:"워크넷",basis:"수의사보조원",year:2021,sat:"66.7",works:["수의테크니션은 동물병원이나 그 외 관련된 기관에서 수의사의 지도하에 동물의 간호 또는 진료를 보조하는 일을 합니다.","동물에 대한 기초 검진 자료를 수집하고, 간호가 필요한 동물을 돌보거나 동물의 요양을 위한 간호 등의 업무를 합니다.","수의사의 지도하에 마취나 수술 보조, 약물 투여나 도포 등 동물 진료의 보조 업무를 합니다.","동물의 행동과 상태를 관찰하고 응급 상황 시 응급처치 및 간호를 담당합니다."],aptitude:"보건의료 관련 서비스직"},243:{name:"상점판매원",wage:2486,from:"워크넷",basis:"상점판매원",year:2021,sat:"56.3",works:["상점판매원은 마케팅, 유통에 대한 지식을 바탕으로 고객에게 상품을 설명하고 판매하는 업무를 수행합니다.","고객을 응대하고 고객이 사거나 임대하려는 상품의 종류, 품질, 수량에 대해 의논합니다.","제품의 사용법 및 보관 요령을 설명하고, 가격, 판매 조건 등을 협의합니다.","상품에 가격표를 부착하고 상품을 진열하며, 수시로 재고량을 확인하여 부족한 상품을 보충합니다."],aptitude:"영업관련 서비스직"},1141:{name:"도금원",wage:3561,from:"워크넷",basis:"도금·금속분무기조작원",year:2021,sat:"61.3",works:["금속제품의 부식과 마모를 방지하고 품질을 향상시키기 위해 제품 또는 부품의 표면에 금속이나 합금의 얇은 막을 입히는 일을 담당합니다.","도금 작업을 할 표면을 청결하게 하고, 전기도금, 아연도금 등의 도구를 준비하여 도금 작업을 수행합니다.","도금이 끝나면 도금한 제품을 깨끗하게 물로 세척하여 건조시킵니다.","표면을 재생하기 위한 물질을 뿌리는 장비를 조작합니다."],aptitude:"기능직"},114:{name:"전기공학기술자",wage:4351,from:"워크넷",basis:"전기계측제어기술자",year:2021,sat:"70.6",works:["전기공학기술자는 전력, 자동화 및 제어 시스템, 엔지니어링 및 건설, 전기 설비 등의 분야에서 계획 설계 시공 및 감리 업무와 전력시설물의 유지 보수 및 안전관리 업무를 합니다.","자료를 수집·분석하여 회사 실정에 맞는 장·단기 기술 정책안을 세우고 과학기술정보를 수집·조사하여 생산 및 설비 기술 향상을 위한 방안을 연구합니다.","공업 표준화 및 사내 기술 규격 표준 등의 제정·조정 업무를 수행합니다.","전기 부문의 각종 기술적 조정 업무를 수행하며, 기존 설비의 시설용량, 규격, 형식 등을 검토하여 설비 개선 방안을 연구합니다."],aptitude:"공학 전문직"},928:{name:"영업원",wage:5200,from:"워크넷",basis:"영업·판매관리자",year:2021,sat:"67.5",works:["영업원은 아직 제품이나 서비스에 대해 구매 의사가 없는 사람이 구매를 할 수 있도록 권하거나 판매합니다.","전화나 이메일을 통하거나 직접 고객을 만나 면담하고 계약조건 등을 상의한 다음 거래 계약을 체결하고 결제한 다음 상품을 전달합니다.","기술영업원은 산업용 장비, 정보통신 장비, 그 외 부품이나 설비의 사용 방법과 구매 후 서비스(A/S)에 대한 전문 지식을 활용하여 각종 기술 장비나 서비스를 판매하고, 제품에 문제가 생긴 경우 고객과 면담하여 문제를 해결합니다.","해외영업원은 해외로 상품을 판매하는 데 필요한 홍보 및 국내외 법과 제도 등 절차를 파악하고 관련된 모든 사무에 대한 일을 합니다."],aptitude:"영업관련 서비스직"},369:{name:"물리치료사",wage:3240,from:"워크넷",basis:"물리치료사",year:2021,sat:"66.3",works:["물리치료사는 의사의 진단 및 처방에 따라 운동, 온열, 전기, 마사지 등 신체의 통증을 완화하고 회복시키는 일을 합니다.","환자의 상태나 신체적인 기능을 평가하고 의사와 치료 방향에 대해 협의합니다.","각종 치료 기구를 사용하여 온열치료, 전기치료, 운동치료, 약물치료 등을 합니다.","신체적 손상이나 움직임을 더 원활하게 하기 위해 치료적 운동, 도수 치료 등의 방법을 사용하기도 하며, 보조 및 보호 기구와 장비를 사용하여 치료하며 환자 교육 등을 실시합니다."],aptitude:"보건의료 관련 서비스직"},10049:{name:"무인항공기시스템개발자",wage:null,from:null,basis:null,year:null,sat:null,works:["무인항공기시스템개발자는 무인항공기 시스템의 설계, 제조, 작동 및 유지에 필요한 활동을 합니다.","무인항공기의 정교한 자동 운항 시스템 개발과 함께 무인기의 정보 자료 수집체계를 설계하고 개발합니다.","무인항공기로부터 수집된 자료를 분석하고 체계적으로 저장할 수 있는 정보 분석 및 관리 체계를 만듭니다."],aptitude:"공학 기술직"},244:{name:"금융자산운용가(펀드매니저)",wage:6200,from:"워크넷",basis:"자산운용가",year:2021,sat:"73.9",works:["금융자산운용가는 금융경영, 경제학 등의 지식을 바탕으로 투자신탁, 연금 등의 기관투자가나 개인투자가의 자산이 최대한의 투자수익을 올릴 수 있도록 투자전략에 대한 정보를 제공하고 계획을 세워 운용하며 전문 지식에 기초하여 증권사나 고객이 위탁한 자산을 운용합니다.","간접투자상품을 개발하여 투자 고객들에게 판매하고, 투자신탁의 재산을 운용하거나 기관투자가의 펀드를 관리하고 운용합니다.","운용자산의 특징에 맞추어 효율적인 투자계획을 세우고, 자금 사정의 변화와 주식시장의 변동 및 앞으로의 시장 흐름을 파악하여 투자전략을 세웁니다.","또한 투자 배분상의 손실위험을 피하기 위해 주식, 채권, 파생상품, 현금 등으로 구분하여 운용하는 등 위험관리도 담당합니다."],aptitude:"금융 및 경영 관련직"},1142:{name:"의복수선원",wage:2590,from:"워크넷",basis:"의복·가죽·모피수선원",year:2021,sat:"59.0",works:["의복수선원은 고객의 요청에 따라 옷, 모자, 장갑 등 의류제품의 불량 상태를 개선하거나 의류제품의 치수나 길이를 조정하는 일을 담당합니다.","고객과의 상담 또는 작업지시서에 따라 의류제품의 수선 부위나 수선 방향을 확인합니다.","수선에 필요한 천이나 실 등의 재료를 준비합니다.","재봉틀을 조작하거나 바느질을 하여 의류제품을 수선합니다."],aptitude:"의복제조 관련직"},119:{name:"전자공학기술자",wage:4631,from:"워크넷",basis:"전자제품및부품개발기술자",year:2021,sat:"74.5",works:["전자공학기술자는 물리학 및 수학의 이론과 원리를 바탕으로 재료 속성에 대한 지식을 활용하여 전자제품을 설계 및 개발하고 생산관리 및 감독 업무를 합니다.","제품을 설계 및 개발하기 위해서는 시장조사를 거쳐 소비자가 원하는 성능, 기능, 디자인 등에 대한 의견 수렴을 하고 경쟁업체 제품 및 세계 동향, 기술 변화 등을 분석한 후 디자인 설계를 합니다.","계획된 공사의 설계와 시공에 대한 감독 및 조언을 담당하고 계측제어설비에 대한 정비 계획을 수립·시행합니다.","전산기 하드웨어 및 계측제어설비의 사양을 검토·조정하고 신기술 도입 및 개발 방안을 연구합니다."],aptitude:"공학 전문직"},929:{name:"공예원",wage:3308,from:"워크넷",basis:"공예원",year:2021,sat:"67.3",works:["공예원은 목재, 석재, 점토, 금속, 종이 등 다양한 소재를 가지고 손이나 도구를 이용하여 각종 수공예품이나 전통공예품을 만듭니다.","공예원은 사용하는 재료나 만드는 제품에 따라 목공예원, 석공예원, 도자기공예원, 금속공예원 등으로 구분되며, 목공예원은 나무를 이용하여 목기 제품, 실내 장식장, 일반 가구 등을 제작합니다.","석공예원은 석불, 석탑, 석등, 비석 등의 석물제품을 만듭니다.","도자기공예원은 각종 식기류, 타일, 액자 등을 만듭니다."],aptitude:"미술 및 공예 관련직"},370:{name:"바텐더",wage:3315,from:"워크넷",basis:"바텐터",year:2021,sat:"54.9",works:["바텐더는 음료와 관련한 전문 지식을 갖추고 각종 술에 향신료, 과일 등을 섞어 고객의 취향에 맞는 칵테일 또는 음료를 만들어 제공합니다.","칵테일 만드는 법을 알고 증류수, 소다수, 칵테일용 음료 등과 코냑, 위스키, 진, 보드카 등의 술을 적당히 섞어 칵테일 및 음료를 만듭니다.","춤, 마술, 셰이커를 흔드는 등 칵테일 제조 방법을 시각적으로 연출하여 다양한 볼거리를 제공하기도 합니다.","칵테일에 들어갈 재료를 준비하고, 매일 판매된 음료와 술을 기록하고 정리합니다."],aptitude:"영업관련 서비스직"},10050:{name:"지리정보시스템기사",wage:4070,from:"워크넷",basis:"지리정보시스템전문가",year:2021,sat:"72.8",works:["지리정보시스템 데이터베이스 설계, 유지, 수정 및 기술지원을 담당합니다.","지리정보시스템기사는 지리정보시스템(GIS: Geographic Information System) 자료를 설계, 유지, 수정 또는 사용하여 과학자, 기술자, 관련 전문가들에게 필요한 지원을 합니다.","고급 공간 분석, 데이터 조작, 또는 지도 제작 소프트웨어를 사용하여 지리 공간 데이터를 구축하거나 모델링하고 전문적인 분석을 수행합니다.","통합 지리정보시스템의 공간 또는 비공간 데이터베이스의 개발을 설계 또는 조정하는 일을 하거나 효과적으로 정보를 보여주는 데 필요한 지도 제작 요소를 선택합니다."],aptitude:"공학 기술직"},247:{name:"네이미스트",wage:4248,from:"워크넷",basis:"광고·홍보·마케팅전문가",year:2021,sat:"69.2",works:["네이미스트는 문예 창작에 대한 지식을 바탕으로 기업명이나 상표, 도메인, 인명 등 전문적으로 이름을 짓습니다.","제품의 특성과 제품 수요층을 파악합니다.","제품에 어울릴 만한 이름의 안을 만들어 2~3개의 후보작을 고릅니다.","후보작과 같은 이름의 등록 여부를 검색한 후 최종 이름을 결정합니다."],aptitude:"작가 관련직"},1143:{name:"의복제품검사원",wage:3937,from:"워크넷",basis:"섬유공학시험원",year:2021,sat:"72.8",works:["의복제품검사원은 가죽, 모피 및 기타 직물로 만들어진 각종 의류제품의 품질을 검사하고 등급을 매기는 일을 담당합니다.","의류제품의 크기, 상태, 무게별로 가죽이나 직물 등을 검사하여 제품의 품질에 결함이 있는지를 확인하고 등급을 매깁니다.","얼룩이 발견되면 용액을 사용해서 제거하는 등 의류제품의 사소한 결함을 해결하기도 하며, 생산된 의류제품의 총 불량 개수와 불량 원인을 기록합니다.","의류제품에 사이즈, 종류, 세탁 방법이 표시된 꼬리표를 부착합니다."],aptitude:"의복제조 관련직"},120:{name:"전자장비설치 및 수리원",wage:3500,from:"워크넷",basis:"사무용전자기기설치·수리원",year:2021,sat:"65.3",works:["전자장비설치 및 수리원은 환자 모니터링을 위한 의료기기나 신용카드 조회기 등의 전자 장비를 설치하고, 검사 계기를 이용하여 전자 장비의 고장 사항을 점검하고 수리합니다.","의료기기, 게임용 기기, 노래방 기기 등의 전자 장비를 설치하고 고객에게 기기의 사용 방법과 사용 시 주의 사항에 대해 설명합니다.","검사 계기를 이용하여 전자장비의 전기회로, 잘못된 연결이나 결함 부분의 위치를 파악하고 분석한 다음, 장비를 분해하여 마모된 부품은 교체하는 등의 수리 작업을 합니다."],aptitude:"기능직"},933:{name:"사회학연구원",wage:4714,from:"워크넷",basis:"사회학연구원",year:2021,sat:"71.2",works:["사회학연구원은 개인, 집단의 행동, 발달, 학교, 가정 등 여러 환경에서 발생하는 조직 및 사회적 상호작용, 원인과 결과 등을 연구하고 사회적 문제나 국가의 법, 제도, 정책에 대한 문제 해결 방법 및 정책적 대안 등을 탐색합니다.","사회의 변화, 가족과 결혼, 사회문제, 소집단, 일탈행위, 집단행동과 사회운동, 인구 문제, 지역사회, 사회통제, 사회정책, 산업사회학 등과 여러 주제의 사회적 현상에 포함된 자료를 과학적으로 수집하고 분석합니다.","수집된 자료의 분석 결과를 바탕으로 사회의 다양한 문제에 대한 정책적 대안을 찾고 제시합니다.","서로 다른 사회의 문화적 특성을 가려내고 그 상호작용의 과정이나 문제의 원인과 결과, 다양한 요인들의 관계 등을 분석합니다."],aptitude:"인문 및 사회과학 관련직"},371:{name:"택배원",wage:3765,from:"워크넷",basis:"택배원",year:2021,sat:"52.8",works:["택배원은 고객이 주문한 상품이나 구매한 상품 등 각종 물품을 고객이 원하는 곳까지 운반하는 일을 합니다.","고객이 주문하거나 구매한 상품을 받아 차량을 이용하여 고객이 원하는 장소에 배달합니다.","물류 관련 사무원으로부터 배송물의 목록, 품목, 수량, 장소 등이 적힌 출고장과 배송장을 수령하고 전산시스템에 입력합니다.","물품을 고객에게 전달하고, 배송장의 바코드를 이용하여 전산시스템에 배송 완료 내역을 입력합니다."],aptitude:"일반운전 관련직"},10051:{name:"데이터마이너",wage:null,from:null,basis:null,year:null,sat:null,works:["데이터마이너는 데이터를 원하는 형태로 바꾸고 분석해서 필요한 정보를 찾아냅니다.","정보를 분석하는 소프트웨어를 통해 데이터를 다양한 차원과 관점에서 분류하고 요약하고 분석합니다.","데이터마이닝을 하기에 앞서 목적을 파악하고, 어떤 형식으로 데이터마이닝을 할지 결정한 다음 필요한 데이터를 결정하고, 분석 목적에 맞는 형태로 데이터를 바꿉니다.","데이터마이닝을 실행하여 필요한 정보를 찾아낸 뒤, 그 결과가 유용한지 판단하고, 분석을 통해 데이터에 오류가 있지는 않은지 알아내기도 합니다."],aptitude:"IT관련전문직"},252:{name:"법률사무원",wage:3700,from:"워크넷",basis:"법률사무원",year:2021,sat:"67.8",works:["법률사무원은 법률적 지식을 바탕으로 주로 변호사나 법무사, 변리사 등 법률 관련 전문가의 감독하에 관련 업무를 보조하고 처리하는 일을 담당합니다.","법원이나 검찰에서 서류 접수와 사건 분류 등 사법 관련 행정 업무가 원활하게 이루어지도록 돕습니다.","각종 문서의 접수와 관리, 간단한 서면 작성 업무를 수행합니다."],aptitude:"사무 관련직"},1144:{name:"발전장치조작원",wage:4500,from:"워크넷",basis:"발전·배전장치조작원",year:2021,sat:"69.0",works:["발전장치조작원은 화력발전, 수력발전, 원자력발전 분야에서 전기를 생산하고 전력 공급을 통제하는 기계 장비를 조작합니다.","작업 일지나 작업지시서를 통해 발전기의 운전 상태를 파악하고 보호장치와 자동제어설비의 작동 상태를 확인합니다.","각종 지시계기와 기록계를 점검하고 확인하며 현황을 기록합니다.","발전기 운전 중 발생한 기기의 이상이나 고장의 원인을 분석하고 보수 작업을 합니다."],aptitude:"기능직"},121:{name:"전화설치 및 수리원",wage:3765,from:"워크넷",basis:"통신장비설치·수리원",year:2021,sat:"60.8",works:["전화설치 및 수리원은 이용자의 전화 이전 신청에 따라 전화를 이전하여 설치 및 연결해주거나 전화기의 고장 사항을 수리해 주는 일을 담당합니다.","전화기 이용자가 이사를 가게 되면, 이용자가 이사를 간 곳에 전화선을 연결해 줍니다.","기능 불량품 및 인쇄회로기판을 해당 기능시험기에 연결하여 종합 시험을 실시하여 불량 정도를 파악하고 원인을 분석합니다.","파악된 불량 내용에 따라 각종 계측기기를 사용하여 점검하며 불량 위치를 찾아내고, 치공구를 사용하여 수리하거나 부품을 교체합니다."],aptitude:"기능직"},934:{name:"사회단체활동가",wage:3e3,from:"워크넷",basis:"사회단체활동가",year:2021,sat:"72.3",works:["사회단체활동가는 국내나 국외의 정치, 복지, 주택, 고용, 여성, 청소년, 건강 등과 관련된 사회 문제들을 연구하고 평가하여 문제 해결을 위한 방법 및 정책을 제안하고, 이를 변화시키기 위한 사회운동을 합니다.","개인, 기관, 단체에게 필요한 사회서비스 프로그램을 개발하고 업무 수행을 지원합니다.","사회 문제를 해결하기 위한 정책을 제도화하기 위해 필요한 자금을 모으거나 기관이나 단체 또는 개인들을 대상으로 의견을 듣거나 수집합니다.","보다 많은 사람들이 사회 문제에 관심을 갖고 사회 문제 해결을 위한 활동에 함께 참여할 수 있도록 다양한 홍보 활동을 펼칩니다."],aptitude:"사회서비스직"},372:{name:"버스운전기사",wage:4e3,from:"워크넷",basis:"버스운전원",year:2021,sat:"61.8",works:["버스운전기사는 시내버스, 시외버스, 고속버스 등 노선버스나 관광버스를 운전하거나 학교, 기업체 등의 비영업용 버스를 운전하여 승객을 운송하는 일을 담당합니다.","버스 운행 시간과 정해진 버스노선 등에 따라 목적지까지 버스를 운전하며, 정차 신호에 따라 정해진 정류장이나 목적지까지 승객이나 물건을 실어 나릅니다.","배차 계획에 따라 버스 차량을 배차받고 점검표에 따라 연료, 타이어 등 차량을 점검하고 이상이 발견되면 수리를 맡깁니다.","운행이 종료되면 수입금을 정리하고, 출발 시간, 도착 시간, 주행거리 등에 대한 운행 일지를 작성합니다."],aptitude:"일반운전 관련직"},10052:{name:"웹접근성컨설턴트",wage:null,from:null,basis:null,year:null,sat:null,works:["누구나 손쉽게 웹사이트에 접근할 수 있도록 웹 접근성을 지키고 있는지를 확인하고 필요한 기업이나 기관을 대상으로 전문적인 조언과 지원을 합니다.","웹접근성컨설턴트는 콘텐츠의 분석, 설계, 개발, 테스트, 실행의 전 과정에서 웹 접근성에 특화하여 웹디자이너 또는 퍼블리셔와 같은 작업자를 교육하거나 개발물을 진단 및 보완하는 컨설팅 서비스를 제공합니다.","컨설팅을 의뢰한 기업과 관계자에게 웹 접근성의 개념 및 웹 접근성 구현 사례 교육을 실시하고 관련된 가이드라인과 표준 지침을 제공하고 설명합니다.","PC웹 사이트와 모바일 웹 등의 화면을 기획하는 내용이 담긴 화면 설계서나 디자인 시안을 확인하고 오류 사항이나 개선점을 제안하여 개발할 때 적용할 수 있도록 합니다."],aptitude:"IT관련전문직"},253:{name:"사무보조원",wage:2590,from:"워크넷",basis:"사무보조원",year:2021,sat:"58.8",works:["사무보조원은 컴퓨터 문서 작업에 관한 지식을 바탕으로 기업체나 공공기관 사무직원의 업무를 보조하여 각종 문서 수신과 발신 및 정리, 전표 정리, 자료 복사 등의 일을 담당합니다.","서류를 정리하고 문서를 수발하며, 근태와 작업 일지 등의 자료를 집계합니다.","기록물, 문서, 기타 소장 자료를 검토하고 분류하고 정리하는 업무를 수행하며 필요한 경우 자료를 복사합니다.","각종 자료를 컴퓨터에 입력하고, 자료의 오류를 심사하고 수정합니다."],aptitude:"사무 관련직"},1145:{name:"전기설비조작원",wage:3522,from:"워크넷",basis:"전기·전자설비조작원",year:2021,sat:"70.7",works:["전기설비조작원은 병원, 대학, 공공기관, 상업시설물 등 건물 내에 설치되어 있는 전기시설을 조작하여 건물 내 전기시스템이 원활하게 작동될 수 있도록 합니다.","수리가 필요한 작업 장소의 주전원 스위치 개폐 상태를 확인하고 작업 표시판을 부착합니다.","전기시설의 설치 또는 수리 방법과 절차를 계획하고 필요한 도구 등을 준비합니다.","전기설비를 점검하고 검사하여 고장 원인과 고장난 부품을 찾고 새로운 부품으로 교체하는 등 전기시설에 대한 보수 작업을 합니다."],aptitude:"기능직"},122:{name:"정밀기기제품제조원",wage:4350,from:"워크넷",basis:"전기기기·제품개발기술자및연구원",year:2021,sat:"69.9",works:["정밀기기제품제조원은 각종 센서, 제어장치 등의 부품을 제작 및 조립하여 현미경, 시계, 카메라 등, 모양은 작지만 다양한 기능을 갖춘 기기들을 제조하는 일을 담당합니다.","작업지시서에 따라 센서, 제어장치 등의 부품들을 제작하고 조립하여 현미경, 카메라, 의료 영상기기 등의 제품을 생산합니다.","정밀 측정기구를 사용하여 부품의 품질, 완성된 제품의 조립 이상 유무 등을 검사합니다."],aptitude:"기능직"},937:{name:"시각디자이너",wage:3500,from:"워크넷",basis:"시각디자이너",year:2021,sat:"66.9",works:["시각디자이너는 다양한 정보가 시각으로 확인되는 이미지를 통해 효율적으로 표현되고 잘 전달될 수 있도록 이미지를 도안하고 표현합니다.","디자인 의뢰가 들어오면 디자인 작업의 기본 방향과 주제와 세부 내용을 정하고, 디자인 목적에 맞는 틀 작업을 전체적으로 한 후 사진, 그림, 텍스트, 삽화(일러스트) 등을 시각적으로 배치합니다.","완성된 디자인은 내부의 확인을 거쳐 의뢰자에게 보내며, 상업용으로 인쇄, 제작될 경우 제작 과정에서부터 디자인이 생각대로 잘 완성되었는지 확인합니다.","시각디자인에는 광고디자인, 포장디자인, 편집디자인, 북디자인, 서체(문자)디자인, 일러스트레이션, 웹디자인, 캐릭터디자인, 컴퓨터그래픽디자인, 기업이미지디자인, 브랜드이미지디자인, 회사로고디자인 등이 포함됩니다."],aptitude:"디자인 관련직"},373:{name:"법무사",wage:6617,from:"워크넷",basis:"법무사및집행관",year:2021,sat:"78.3",works:["다른 사람의 요청에 의해 법원과 검찰청에 제출할 서류를 작성하고 제출하며, 등기 및 공탁(법적인 절차에 따라 돈이나 증권을 공탁기관에 맡기는 것) 사건의 신청 대리에 관한 모든 업무를 수행합니다.","의뢰인이 문서나 구두로 의뢰한 사항을 접수하여 관계 법령의 규정에 따라 법원과 검찰청 업무에 관계되는 서류를 작성합니다.","구비된 서류를 관련 기관에 제출하고 등기와 공탁에 관한 절차를 대신 합니다.","민사 관련 신청 서류 작성이나 소송과 관련된 서류를 작성하는 일을 합니다."],aptitude:"법률 및 사회활동 관련직"},10053:{name:"산업카운슬러",wage:null,from:null,basis:null,year:null,sat:null,works:["산업카운슬러는 기업의 환경에 따라 직원들의 정신적 문제를 파악하고 정신건강을 위한 전문적인 도움을 받을 수 있도록 상담하는 일을 합니다.","상담을 원하는 직원에게 제공하는 대표적 상담 내용은 정신건강과 관련된 문제, 일하는 것과 살아가는 방식, 보람 있는 일터를 만들기 위한 인간관계의 개선 방법입니다.","정신건강의 상태가 매우 좋지 못해 상담만으로 해결하기 어려운 직원의 경우에는 정신과 의사나 임상심리상담사 등 관련된 전문가에게 연결하는 역할을 합니다."],aptitude:"영업관련 서비스직"},255:{name:"은행출납사무원",wage:5547,from:"워크넷",basis:"은행사무원",year:2021,sat:"71.5",works:["은행출납사무원은 경영, 회계에 대한 지식을 바탕으로 고객을 상대로 공과금의 수납, 금전의 예치, 환전 및 지불 등의 업무를 담당합니다.","은행에서 고객이 맡긴 돈을 예치하고, 고객의 대출을 상담하는 등의 일을 수행하고. 계좌를 개설하고 개인이나 기업으로부터 단기 또는 장기의 자금을 보관하고 위탁합니다.","예금 전표나 수표를 분류하고 철해둡니다.","고객들의 거래에 대한 문의에 답하고 문제점이 있다면 해결합니다."],aptitude:"금융 및 경영 관련직"},1146:{name:"전기 부품 및 제품 생산직",wage:3700,from:"워크넷",basis:"전기부품·제품생산기계조작원",year:2021,sat:"63.8",works:["전기 부품 및 제품 생산직은 건전지, 전동기, 발전기 등 전기 장비에 사용되는 부품을 제조하는 기계를 조작하여 생산과정이 원활히 진행될 수 있도록 관리합니다.","작업지시서 또는 명세서에 따라 생산할 전기 장비에 사용되는 부품에 대해 파악하고, 필요한 재료들을 준비합니다.","전기제품의 생산과 관련된 각종 기계 및 장치를 조작합니다.","완성된 부품들의 품질을 검사하고 결함 사항들을 확인하며, 전기제품의 생산과 관련된 기계 및 장치를 정기적으로 점검합니다."],aptitude:"기능직"},125:{name:"캐드원",wage:3775,from:null,basis:null,year:null,sat:"71.1",works:["캐드원은 공학기술자나 설계사가 작성한 스케치와 명세서를 가지고 캐드(컴퓨터 지원 설계, CAD: Computer Aided Design)를 활용하여 건축토목용 시공도나 기계, 전기, 전자 장비 및 제품의 제조와 설치에 필요한 세부 도면을 작성합니다.","약도나 설계서의 내용을 파악하여 캐드 작업을 제품, 기계, 특수, 정밀 도면으로 분류합니다.","공학적 계산을 수행하고 명세서 및 기타 자료로부터 설계 스케치를 계획합니다.","완성된 도면으로 컴퓨터상에서 투시도 또는 3차원 시뮬레이션으로 재현하기도 합니다."],aptitude:"기능직"},938:{name:"정보시스템운영자",wage:4300,from:"워크넷",basis:"정보시스템운영자",year:2021,sat:"74.0",works:["정보시스템운영자는 기업이나 기관에서 운영하고 있는 정보시스템을 안전하고 체계적으로 운영 및 관리하고 사용자들에게 서비스를 제공하는 일을 합니다.","정보시스템의 하드웨어나 네트워크 장비는 외부 환경에 영향을 받기 쉬우므로 전산실 내부의 온도, 습도, 먼지 등을 체크하고 쾌적하게 유지될 수 있도록 합니다.","정보시스템의 사용자에 대한 등록 및 삭제에 대한 관리와 각 기능별 사용 권한을 주거나, 시스템 내의 정보를 외부로부터 보호하기 위해 기술적 장치를 마련하고 정기적으로 데이터를 원래 상태로 복구할 수 있는 형태로 보관합니다.","시스템을 운영하면서 문제점이나 오류 및 고장이 발생하면, 즉시 원인을 파악하여 시스템을 빠른 시간 내에 복구합니다."],aptitude:"IT관련전문직"},374:{name:"변리사",wage:6508,from:"워크넷",basis:"변리사",year:2021,sat:"76.9",works:["변리사는 새로운 기술의 발명이나 디자인, 상표 등의 특허권 취득을 위한 법률적인 부분과 기술적인 부분에 대한 상담 및 지원을 제공합니다.","특허권을 얻고자 하는 대상의 설계도, 제품 등을 조사 및 검토하고 유사 제품의 특허권을 조사합니다.","기존 다른 산업재산권의 침해 여부, 발명이나 상표 등이 비슷한지에 대한 감정을 합니다.","특허등록을 위한 문서를 작성하고, 의뢰인과 검토 후 특허권을 출원, 청구합니다."],aptitude:"법률 및 사회활동 관련직"},10054:{name:"괴롭힘방지조언사",wage:null,from:null,basis:null,year:null,sat:null,works:["괴롭힘방지조언사는 직장 내 구성원들의 대인관계에서 문제가 발생할 수 있는 원인을 분석하고, 예방 조치를 합니다.","직장 내 구성원들의 대인관계에서 문제가 발생하면 공정한 조사를 통해 적절한 조치를 합니다.","직원들에게 따돌림과 괴롭힘 방지 교육을 제공합니다.","성희롱, 따돌림, 폭력 등으로 인해 피해자가 발생하면 피해자를 보호하고, 공정한 조사를 수행합니다."],aptitude:"사회서비스직"},256:{name:"보건의료정보관리사",wage:3561,from:"워크넷",basis:"보건의료정보관리사",year:2021,sat:"70.0",works:["보건의료정보관리사는 보건 행정에 대한 지식을 바탕으로 이용자의 건강 및 질병과 관련된 자료를 수집하고 분석하고 관리합니다.","의료기관에서 질병과 수술 분류, 진료기록의 분석, 진료 통계, 암 등록, 전사 등 각종 의무에 관한 기록 및 정보를 유지하고 관리하며 확인하는 업무를 수행합니다.","의료진이 차트를 필요로 할 때 신속하고 정확하게 제공하기 위해 외래 및 입원 환자로 구분하여 의사가 의무기록에 기록한 진단명, 처치, 수술, 검사 등에 대한 정보를 관리합니다.","정리 및 보관된 의무기록의 내용을 검토하고 분석하여 필요한 정보를 요약하고 통계자료를 작성하며, 미비한 의무기록의 경우 검출 목록을 첨부하여 담당자에게 알립니다."],aptitude:"사무 관련직"},1147:{name:"방송장비(H/W)설치 및 수리원",wage:4477,from:"워크넷",basis:"방송송출장비기사",year:2021,sat:"72.1",works:["방송장비 설치 및 수리원은 사람들이 TV, 라디오, 케이블TV를 이용하는데 필요한 방송장비를 설치하고 수리하는 일을 담당합니다.","방송 기자재의 구입년도, 규격, 종류 등을 검토하여 정기적인 보수 계획을 수립합니다.","방송 관련 장비의 작동 불량 부위를 확인하고 각종 기구를 사용하여 고장원인을 조사합니다.","관련된 부품이나 기기를 시험하기도 하고 장비의 작동 여부를 점검합니다."],aptitude:"기능직"},126:{name:"단순노무자",wage:2950,from:"워크넷",basis:"건설·채굴단순종사원",year:2021,sat:"52.1",works:["단순노무자는 건설업이나 제조업, 유통업 등의 분야에서 제품이나 자재의 운반, 분류 및 단순 포장을 수행하거나 손이나 기계를 이용하여 구성품을 조립하는 등의 일을 담당합니다.","작업지시서 또는 작업 감독의 지시에 따라 제품이나 자재를 운반하고 적재, 분류하는 등의 일을 수행합니다.","손이나 수동 기계를 이용하여 원료, 재료, 제품 등을 포장하고 운반합니다."],aptitude:"기능직"},941:{name:"임상병리사",wage:3200,from:"워크넷",basis:"임상병리사",year:2021,sat:"76.6",works:["임상병리사는 질병의 예방과 진단, 치료를 돕기 위해 환자의 혈액, 소변, 체액, 생체 조직 등을 이용하여 각종 의학적 검사를 수행하고 분석합니다.","응고, 착색 등의 기법을 적용하여 인체의 기관, 조직, 세포, 혈액, 분비물 등의 검사물을 준비하고 검사, 분석, 실험을 합니다.","진단 혈액 검사, 미생물 검사, 수혈 의학 검사, 진단 분자 유전 검사, 면역 혈청 검사 등을 통해서 질병의 원인을 찾아냅니다.","인체의 기관, 조직, 세포, 혈액, 분비물 등의 여러 가지 검사물에 대해 현미경 등의 기구나 시약을 사용하여 검사, 분석하여 질병의 여부를 확인하고, 혈액형 및 혈구 수 계산 등의 검사 결과를 확인합니다."],aptitude:"의료관련 전문직"},375:{name:"변호사",wage:7770,from:"워크넷",basis:"변호사",year:2021,sat:"83.3",works:["변호사는 개인 간의 다툼에 관련된 민사사건과 범죄 사건에 관련된 형사사건이 발생한 경우 개인이나 단체를 대신하여 법정에서 그들을 변호해 주는 일을 합니다.","민사 소송사건, 조정사건 등 사건 당사자나 기관의 의뢰를 받아 소송 제기와 취하, 조정, 화해 등의 법률 업무를 수행합니다.","형사사건에서는 피고인 또는 피의자들을 만나 증거 등을 확인하고, 구속 취소, 보석 등 법원에서 진행하는 업무를 수행합니다.","전문적인 법률 지식을 통해 의뢰인에게 유리한 변론을 하고, 판결에 불복하는 경우 심급에 따라 항소 및 상고 등의 절차를 진행합니다."],aptitude:"법률 및 사회활동 관련직"},10055:{name:"재능기부코디네이터",wage:null,from:null,basis:null,year:null,sat:null,works:["재능기부코디네이터는 재능을 기부하려는 사람과 재능 기부가 필요한 사람을 연결해 줍니다.","재능 기부자와 수혜자 간 연결 시스템 및 프로그램을 기획하여 운영합니다.","구체적인 재능 기부의 분야, 활동의 내용 등 세부 활동을 기획하고 운영합니다.","재능 기부가 활성화될 수 있도록 홍보 및 마케팅 방안을 마련하고, 재능 기부에 관심을 보이거나 이를 실시하는 기업체나 학교 등과 협력할 수 있는 방법을 찾는 등의 일을 합니다."],aptitude:"사회서비스직"},258:{name:"회계사무원",wage:3561,from:"워크넷",basis:"회계사무원",year:2021,sat:"73.3",works:["회계사무원은 회계학과 관련된 지식을 바탕으로 기업에서 이루어지는 수입과 지출 등 모든 거래 사항을 기록하고 정리하며 회계사의 업무를 지원합니다.","손익을 예상하고 일정한 기간 안에 일어났던 수입과 지출을 계산하여 서류로 작성하는 결산 업무를 하며, 주요 장부 정리 및 거래 내용이 담긴 전표를 계산합니다.","재무 기록을 기입하여 거래 발생 시 자산, 부채, 자본의 증감을 구체적으로 기록하고 계산하며 정리해 재무의 변화를 보고서로 작성합니다.","급여, 공과금, 세금에 관한 입금 기록, 소득신고서, 급여 지급 양식, 연금, 보험 양식 등의 서류를 작성합니다."],aptitude:"회계 관련직"},1148:{name:"통신설비설치 및 수리원",wage:3500,from:"워크넷",basis:"방송·통신·인터넷케이블설치·수리원",year:2021,sat:"62.3",works:["통신설비설치 및 수리원은 유선전화, 휴대폰, 무선통신기, 무선전화 등의 각종 유선이나 무선통신장비를 설치하고 수리하는 일을 담당합니다.","유선전화, 휴대폰, 무선전화, 무선통신기 등의 송신과 수신을 이어주기 위한 설계도에 따라 통신장비 설치 위치를 확인하고, 통신장비를 설비합니다.","설비한 통신장비가 잘 작동하는지 확인하며, 이상이나 고장이 발생하면 이를 수리합니다."],aptitude:"기능직"},127:{name:"주조원",wage:4100,from:"워크넷",basis:"주조원및주조기조작원",year:2021,sat:"61.4",works:["주조원은 제작하고자 하는 제품의 형태에 맞는 구조물(주형)에 금속을 가열하여 녹인 것(용탕)을 붓고 이를 냉각 및 응고하여 제품을 완성하는 일을 담당합니다.","도면과 작업지시서를 검토하여 어떤 제품을 제작해야 하는지 파악하고, 목재나 금속 등의 재료를 이용하여 제품의 모형을 제작합니다.","도면과 완성된 제품을 비교하여 치수의 정확성, 제품의 결함 여부에 대해 검사합니다."],aptitude:"기능직"},946:{name:"카지노딜러",wage:2950,from:"워크넷",basis:"오락시설서비스원",year:2021,sat:"59.1",works:["카지노딜러는 카지노에서 고객의 편의를 위한 각종 서비스를 제공하거나 룰렛, 블랙잭, 바카라 등의 카지노 게임을 진행합니다.","딜러는 원활한 카지노 게임의 진행을 위해 게임 규칙을 완벽하게 알아야 하고, 게임에 사용하는 카드나 칩을 잘 다루고 신속하고 정확한 동작을 합니다.","딜러는 게임 참여자에게 게임의 기본 규칙을 설명하고 참가자들의 착석 여부와 규정된 금액을 사용했는지 확인을 한 후, 카드, 주사위를 통해 게임을 진행합니다.","게임의 승패에 따라 근무하는 테이블에서 고객에게 칩을 주거나 받고 고객의 칩을 바꿔주기도 하며, 게임 도중 의심이 가는 행동을 하는 사람이 있으면 카지노 게임장을 감독하는 플로어퍼슨에게 보고합니다."],aptitude:"기타 게임·오락·스포츠 관련직"},376:{name:"보육교사",wage:2901,from:"워크넷",basis:"보육교사",year:2021,sat:"70.2",works:["보육교사는 어린이집, 놀이방 등 보육시설이나 아동복지시설에서 유아를 교육하고 보호합니다.","영유아의 심신 상태, 발육단계, 연령 등에 따라 적절한 보육 계획을 세웁니다.","그림책, 장난감, 악기 등을 이용하여 유아의 정서 및 지능 발달에 도움을 주는 활동을 합니다.","유아를 보살피고 균형 있는 영양 공급과 바른 식습관을 지도합니다."],aptitude:"교육관련 서비스직"},10056:{name:"장애인잡코치",wage:null,from:null,basis:null,year:null,sat:null,works:["장애인잡코치는 장애가 있는 사람의 업무 능력을 평가하고 직장 알선, 직장 내 업무 조정, 업무 지원 등 장애인의 직장 생활을 위한 지원 업무를 담당합니다.","상담을 통해 장애인의 기초 정보를 수집하고 각종 검사 및 직업 수행을 위한 정보를 수집합니다.","장애인의 직무 내용을 설정하고 직무수행 관련 지도 방법에 대한 조언을 해 줍니다.","직장 내 근무자들에게 장애의 이해에 관한 조언을 합니다."],aptitude:"사회서비스직"},260:{name:"구성작가",wage:4e3,from:"워크넷",basis:"방송작가",year:2021,sat:"67.0",works:["구성작가는 문예 창작과 관련된 지식을 바탕으로 드라마를 제외한 그 외 프로그램들의 기획과 구성, 대본 작성 등에 참여합니다.","교양 및 예능 프로그램의 제작 형식을 기획하고 검토하여 제작에 필요한 자료를 수집하고 정리합니다.","수집한 자료를 기초로 원고를 작성하고 출연진을 섭외하기도 합니다.","방송 연출가와 협의하여 관련 프로그램의 제작에 필요한 정보를 제공합니다."],aptitude:"작가 관련직"},1149:{name:"음료제조관련조작원",wage:3108,from:"워크넷",basis:"음료제조기계조작원",year:2021,sat:"63.8",works:["음료제조관련조작원은 음료수나 기타 기호 식품을 생산하는 관련 제조기기 및 장치를 조작합니다.","작업지시서와 생산할 음료 제품의 종류에 따라 과일, 찻잎, 커피 등 필요한 재료를 준비하여 계량하고, 일정 비율로 배합하여 음료 제조 기기에 투입합니다.","음료 제조 기기를 조작하면서 기계장치의 온도, 압력, 속도 등을 조정합니다.","완성된 제품을 포장합니다."],aptitude:"기능직"},129:{name:"직조원",wage:3511,from:"워크넷",basis:"직조기·편직기조작원",year:2021,sat:"55.3",works:["직조원은 섬유로부터 생산된 실을 이용하여 천 등의 직물을 만들어내는 기계 즉, 직기를 조작하는 일을 담당합니다.","작업지시서에 따라 제작할 직물의 조직과 무늬에 대해 파악하고 직물을 생산하기 위해 필요한 실을 준비합니다.","직조기를 조작하여 경사와 위사를 서로 교차시켜 직물을 짭니다.","직조 상태(직물의 무늬, 무게), 기계의 속도 등을 확인하고, 기계의 기능 장애를 점검 및 조정합니다."],aptitude:"기능직"},948:{name:"컴퓨터하드웨어 기술자 및 연구원",wage:4200,from:"워크넷",basis:"컴퓨터하드웨어기술자및연구원",year:2021,sat:"72.0",works:["컴퓨터하드웨어 기술자 및 연구원은 컴퓨터시스템과 주변기기에 대한 지식을 바탕으로 컴퓨터 하드웨어 시스템을 설계하고 실제 생산에 필요한 기술을 지원합니다.","컴퓨터 본체, 중앙처리장치, 주기억장치, 그래픽카드 등 컴퓨터와 관련된 각종 부품을 설계, 개발하고, 생산을 관리합니다.","컴퓨터와 관련 장비를 설치, 설비, 변경하고, 기타 작업을 감독하거나 검사하며 컴퓨터 도면 프로그램인 CAD의 설계사, 기술자 및 기타 엔지니어를 관리합니다."],aptitude:"공학 전문직"},378:{name:"전문비서",wage:3500,from:"워크넷",basis:"비서",year:2021,sat:"62.4",works:["전문비서는 상사가 최대한의 업무 성과를 낼 수 있도록 일정을 계획, 관리, 조정하며, 최적의 조건에서 업무를 수행할 수 있도록 돕습니다.","일반비서는 상사의 일정을 계획, 조정하고 우편물이나 서류 보관, 각종 자료 정리 및 문서 작성, 전화 응답, 회의 소집 연락, 외부 손님 응대 등의 업무를 수행합니다.","관리비서는 정치, 경제, 외교 산업의 각 분야에서 전문적인 행정 및 관리의 실무자로 상사의 보좌 역할을 수행합니다.","각종 자료를 정리하거나 문서를 작성하고, 회의 참석 시 회의록을 작성하고 회의 내용을 요약합니다."],aptitude:"사무 관련직"},10057:{name:"아동청소년시설보호사",wage:null,from:null,basis:null,year:null,sat:null,works:["아동청소년시설보호사는 교정 시설에 거주하고 있는 아동 및 청소년을 관리, 감독하고 특별 활동을 제공합니다.","교정 시설에 거주하는 아동 및 청소년의 안전한 생활을 위해 생활지도를 합니다.","교정 시설에 거주하는 아동 및 청소년의 사회적, 신체적, 정서적, 지적 능력을 향상시키기 위한 프로그램을 기획하고 운영합니다.","교정 시설에 거주하는 아동 및 청소년에게 교화 교육, 직업훈련, 생활지도 등 교정교육을 수행합니다."],aptitude:"안전 관련직"},261:{name:"극작가",wage:2500,from:"워크넷",basis:"영화시나리오작가",year:2021,sat:"63.3",works:["극작가는 어문학적 지식을 바탕으로 연극을 공연하기 위해 연극 주제에 적합한 문학작품을 새롭게 창작하거나 기존의 문학작품을 선정하여 연극의 형식에 맞게 각색합니다.","연극 작
