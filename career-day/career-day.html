93:{name:"가상현실전문가",wage:3730,from:"워크넷",basis:"응용소프트웨어개발자",year:2021,sat:"68.9",works:["가상현실전문가는 3차원모델링(3D)등의 기술을 이용해 가상의 시공간에서 가상시스템을 개발합니다.","사용자가 원하는 가상 세계가 무엇인지 파악하거나 개발하고자 하는 시스템을 분석하여 개발 방향을 설정합니다.","신제품에 대한 기획안을 토대로 3차원 컴퓨터그래픽 제어 기술을 활용하여 프로그래밍 한 후 디자인 감각을 바탕으로 사용자가 실제감을 느낄 수 있도록 가상현실시스템을 디자인합니다."],aptitude:"IT관련전문직"},52:{name:"금속가공장치조작원",wage:3833,from:"워크넷",basis:"금속가공기계조작원",year:2021,sat:"57.8",works:["금속가공장치조작원은 광석의 불순물을 제거하고 제련, 정련 과정을 거쳐 제철과 제강 등을 위해 장치를 조작하는 업무를 담당합니다.","금속가공 공정 중 압연, 가열, 압출기와 같은 금속가공 기기를 준비, 조정, 작동하는 역할을 수행합니다.","컴퓨터의 출력 정보와 모니터 자료 등을 관찰하여 적절한 가공조건을 측정하며 필요한 조치를 수행합니다.","중앙조정실에서 제어장치 컴퓨터 터미널, 기타 통제 시스템의 조정을 통해 금속의 제련, 정련 과정을 조정, 제어합니다."],aptitude:"기능직"},421:{name:"스포츠강사",wage:3104,from:"워크넷",basis:"스포츠강사",year:2021,sat:"66.4",works:["스포츠강사는 공공 또는 민간 체육시설에서 사람들을 대상으로 건강 유지와 증진, 스트레스 해소, 여가의 목적을 위해 여러 운동 프로그램을 개발하거나 가르치는 일을 합니다.","사람들에게 근육 단련이나 건강 유지의 목적을 위해 규칙적인 운동 방법을 가르쳐 주거나 체중 조절을 위한 식이요법에 대한 정보를 제공합니다.","수영, 태권도, 에어로빅, 테니스, 탁구, 골프 등 스포츠 분야별로 각 종목의 기본 동작이나 응용 동작을 가르치고 숙달할 수 있도록 도와줍니다.","긴장된 근육을 풀어주거나 준비운동 방법을 가르치고 만일 안전사고가 발생했을 때는 응급조치를 실시합니다."],aptitude:"운동 관련직"},311:{name:"사진인화 및 현상관련조작원",wage:3500,from:null,basis:"사진인화·현상기조작원(사진수정포함)",year:null,sat:"67.0",works:["사진인화 및 현상관련조작원은 사진필름 및 인화지 제조기를 조작하며, 사진필름을 가공하고 인화합니다.","사진판 코팅 및 보강용 장비를 조작합니다.","음화 또는 투명한 양화를 얻기 위하여 천연색 및 흑백필름을 가공하는 장비를 조작합니다.","흑백 및 컬러 사진 인화용, 확대용, 축소용 장비를 조작합니다."],aptitude:"기능직"},10006:{name:"곤충 음식 개발자·조리사",wage:null,from:null,basis:null,year:null,sat:null,works:["곤충 음식 개발자는 곤충을 재료로 사람이 먹을 수 있는 식품을 연구하고 만드는 방법을 개발합니다.","사람들이 손쉽게 식용 곤충을 먹고 즐길 수 있도록 식용 곤충을 이용한 음식 메뉴를 만들고 요리를 합니다.","사람이 먹을 수 있는 곤충에 관한 정보를 구하고 곤충의 특성에 관하여 연구합니다."],aptitude:"조리 관련직"},178:{name:"쇼핑호스트",wage:4766,from:"워크넷",basis:"아나운서",year:2021,sat:"79.8",works:["쇼핑호스트는 상품의 특성과 방송에 대한 지식을 바탕으로 상품 판매 방송을 진행하면서 시청자에게 상품의 기능, 특성 등을 설명하고 상품의 판매를 촉진합니다.","원활한 방송 진행을 위해 방송 시작 전에 판매 상품에 대한 시장을 조사하고, 제품의 특성을 충분히 파악하며, 방송에 함께 출연하는 출연자와 진행 상황을 연습합니다.","시청자들의 제품에 관한 관심을 유도하고 제품에 대한 정보와 소비자들이 궁금해 하는 사항을 설명하며, 소비자들을 대신해 상품을 확인하고 상품의 기능과 특성, 장단점 등의 정보를 제공합니다.","매출 현황, 주문 내역 등을 파악하고 방송 후에는 매출량을 확인하여 다음 번 방송에 참고합니다."],aptitude:"연기 관련직"},1096:{name:"웹프로듀서",wage:4e3,from:"워크넷",basis:"웹기획자",year:2021,sat:"70.8",works:["웹프로듀서는 웹사이트 기획, 구축 및 운영, 마케팅 등을 총괄합니다.","새로운 인터넷 사이트를 만들기 위한 기획안을 만들며, 웹사이트에서 제공할 내용, 디자인 등 전반적인 홈페이지 관리를 담당합니다.","웹사이트의 자료를 지속적으로 갱신합니다."],aptitude:"IT관련전문직"},53:{name:"금속공학기술자",wage:5e3,from:"워크넷",basis:"금속·재료공학기술자",year:2021,sat:"73.5",works:["금속공학기술자는 금속, 합금의 제조와 가공 방법 개발을 위해 금속의 물리적, 조직적 특성을 실험하고 연구하며, 장단기 기술개발 계획을 수립하는 업무를 수행합니다.","금속제품의 제조, 가공, 합금 등 금속 분야에 대한 자료를 수집, 분석해서 신기술을 개발하고 생산기술을 향상시키는 역할을 수행합니다.","금속의 주형, 조형, 열처리를 위한 공정을 설계합니다.","금속을 응집, 추출, 제련, 처리하기 위한 공정을 계획하고 설계합니다."],aptitude:"공학 전문직"},426:{name:"택시운전기사",wage:2800,from:"워크넷",basis:"택시운전원",year:2021,sat:"58.7",works:["택시운전기사는 택시에 탄 손님이 요청한 장소까지 신속하고 안전하게 데려다주는 일을 합니다.","택시 운전을 시작하기 전, 점검표에 따라 차량을 점검하고 이상한 점이 발견되면 정비소에 수리를 맡깁니다.","택시를 탄 손님의 목적지를 확인하고 도로의 교통 사정에 따라 가장 빠른 길로 안전하고 신속하게 운전하고 택시 요금을 받습니다.","택시 운전이 끝나면 차량을 회사에 주차하고 주행거리, 연료 소모량, 차량의 고장이나 장애 등에 대한 운행일지를 기록합니다."],aptitude:"일반운전 관련직"},313:{name:"성악가",wage:3100,from:"워크넷",basis:"성악가",year:2021,sat:"72.3",works:["성악가는 독창, 중창, 합창의 형태로 고전 음악 및 가곡을 노래하며, 보통 합창단에 소속되어 합창 발표회를 하거나 독창회, 중창회를 개최합니다.","음악 악보를 보고 피아노나 오케스트라의 반주에 맞추어 리듬을 확인하고 노래합니다.","가사와 음악을 연구하고 다른 성악가 및 반주자와 음색을 조정하기도 하며, 오페라의 등장인물로 출연하여 대사를 음악에 맞추어 표현합니다."],aptitude:"음악 관련직"},10007:{name:"정밀 농업기술자",wage:null,from:null,basis:null,year:null,sat:null,works:["정밀 농업기술자는 작물이나 흙의 상태에 따라서 적합한 비료와 농약 등을 사용하여 환경을 보호하고 가장 효율적으로 농사를 짓는 기술을 개발합니다.","정밀 농업을 하려는 농민들에게 농업기술을 교육하고 전문적인 조언을 제공하는 일을 합니다.","정밀 농업에 필요한 기계를 관리하고 작업 정보를 분석합니다.","작물에 영향을 미치는 토양과 기후 등에 관한 정보를 분석하여 농업인들에게 제공합니다."],aptitude:"농생명산업 관련직"},179:{name:"체형관리사",wage:3108,from:"워크넷",basis:"피부및체형관리사",year:2021,sat:"64.5",works:["체형관리사는 영양학과 체육학의 지식을 바탕으로 체계적인 운동 방법과 식이요법 등을 이용하여 고객의 체중과 몸매를 종합적으로 관리하는 일을 담당합니다.","고객의 요구와 몸의 특성을 파악하고 신체 균형 상태가 어떤지 기계로 측정하고, 고객에게 적합한 운동 처방, 식이요법, 마인드 컨트롤 등으로 나뉘는 다이어트 프로그램을 설계합니다.","목표 체중이 빠져도 고객이 계속해서 탄력적인 몸매를 갖출 수 있도록 집에서 할 수 있는 간단한 유산소 운동 프로그램 등을 계획하기도 합니다."],aptitude:"이미용 관련직"},1097:{name:"프로게이머",wage:5180,from:"워크넷",basis:"프로게이머",year:2021,sat:"61.2",works:["프로게이머는 각종 컴퓨터게임 대회에 참가하여 게임을 합니다.","프로게이머는 게임감독, 팀원들과 함께 전략시뮬레이션, 롤플레잉, 액션게임, 온라인게임 등 컴퓨터게임에 대한 기술 및 전략을 익히고 꾸준히 연습하여 각종 대회에 참가합니다.","소속 회사에서 개발한 새로운 게임소프트웨어에 대한 테스트를 하며, 새 게임소프트웨어가 출시되면 시연회와 홍보를 하기도 합니다."],aptitude:"기타 게임·오락·스포츠 관련직"},54:{name:"금형원",wage:3700,from:"워크넷",basis:"금형원",year:2021,sat:"61.8",works:["금형원은 금속 공작기계, 수공구, 정밀 측정기를 사용하여 동일한 형상의 제품이나 부품을 반복하여 대량으로 생산할 수 있는 틀인 금형을 제작, 보수, 정비합니다.","설계 도면과 작업지시서 검토를 통해 작업의 절차와 방법에 대한 계획을 세웁니다.","가공에 활용할 재료를 선택하고, 치수를 측정, 표시한 후 작업대에 금형 가공물을 설치하고 고정합니다.","금속 공작기계 조작을 통해 금형 가공물을 가공하고, 제작한 금형 부품의 치수를 확인합니다."],aptitude:"기능직"},427:{name:"웨딩플래너",wage:3358,from:"워크넷",basis:"웨딩플래너",year:2021,sat:"61.8",works:["웨딩플래너는 결혼을 준비하는 사람을 대신하여 결혼식장 준비, 웨딩 사진, 웨딩드레스 예약, 신혼여행의 예약, 혼수품 구입 등 결혼과 관련된 모든 일을 대신하여 계획하고 조언하는 일을 합니다.","고객과의 상담을 통해 직업, 소득, 취향과 예상 지출 비용과 필요한 예산 등에 대한 정보를 파악하고, 고객에게 적합한 웨딩 관련 정보 및 결혼 비용을 제시합니다.","고객에게 결혼 준비와 관련된 진행 상황 및 준비물을 알려주고, 고객과 업체 간의 필요한 업무를 중간에서 조정합니다.","웨딩 사진 촬영, 예식 등의 현장 준비 사항을 점검하고, 구입한 결혼 상품들이 제대로 서비스되고 있는지 수시로 확인하여 문제가 발생하지 않도록 합니다."],aptitude:"매니지먼트 관련직"},314:{name:"스턴트맨",wage:4e3,from:"워크넷",basis:"영화배우및탤런트",year:2021,sat:"70.8",works:["스턴트맨은 영화나 텔레비전 드라마에 출연하여 무술 연기를 합니다.","연극, 영화, 드라마 등에서 주연배우를 대신하여 춤, 수영, 스케이팅, 승마 등의 특수한 기술을 요하는 역할이나 연기를 대신합니다.","각 장면에서 연출되는 특정 상황에 맞는 복장이나 분장을 하고 감독의 지시에 따라 액션 연기를 합니다.","주연 배우를 대신하여 고공 낙하, 자동차나 말에서 뛰어내리기, 폭발 직전의 건물에서 뛰어나오기 등의 위험한 연기를 합니다."],aptitude:"연기 관련직"},10008:{name:"스마트 팜 구축가",wage:null,from:null,basis:null,year:null,sat:null,works:["스마트 팜 구축가는 농업에 정보통신 기술을 접목하여 효율적으로 작물을 재배하거나 가축을 기르는 기술을 개발하고 수집된 정보를 분석합니다.","딸기, 토마토, 사과 등의 작물과 소, 돼지 등 가축의 특성을 이해하고 적합한 정보통신 기술을 개발하고 분석합니다.","온도, 습도, 이산화탄소 등을 측정할 수 있는 감지기나 농작물 및 가축의 상태를 점검할 수 있는 기술을 개발하고, 이를 컴퓨터나 모바일에서 확인할 수 있도록 합니다.","스마트팜을 원하는 농민을 위하여 스마트팜에 대하여 교육하고 전문적인 도움을 줍니다."],aptitude:"농생명산업 관련직"},180:{name:"바리스타",wage:3004,from:"워크넷",basis:"음료조리사",year:2021,sat:"62.3",works:["바리스타는 원두에 대한 지식을 바탕으로 좋은 원두를 선택하고 커피 기계를 활용하여 고객이 원하는 커피를 만들어 서비스하는 일을 담당합니다.","고객의 주문에 맞게 추출된 에스프레소에 물, 우유, 각종 시럽 등을 첨가하여 커피를 만듭니다.","좋은 원두를 감별한 후 구입하고, 저장 및 재고 관리를 철저하게 합니다.","커피를 시음하여 새로운 맛의 커피를 만들어 내고, 기계 성능 유지를 위해 확인하고 식기류의 청결을 항상 점검하고 유지합니다."],aptitude:"조리 관련직"},1100:{name:"군무원",wage:3600,from:"워크넷",basis:"병무행정사무원",year:2021,sat:"70.8",works:["군무원은 군부대에서 군인과 함께 근무하는 특정직 국가 공무원으로서 담당 직렬에 따라 기술, 연구, 일반 행정, 이미용 등에 대한 업무를 수행합니다.","국민에 대한 봉사자로서 직업윤리 정신을 바탕으로 공공의 이익을 실현하고 공무를 올바르게 수행합니다.","업무 분야에 대한 전문 지식을 활용하여 보고서 및 문서를 작성하고 관리합니다."],aptitude:"사무 관련직"},56:{name:"기계공학 기술자ㆍ연구원",wage:5100,from:"워크넷",basis:"건설기계공학기술자및연구원",year:2021,sat:"78.0",works:["기계공학 기술자ㆍ연구원은 다양한 산업과 연관된 기계, 기구, 산업 설비, 생산시스템 등을 연구, 개발, 설계, 제조하고, 생산 공정을 운영, 감독하는 업무를 수행합니다.","기계의 구성 요소, 설계, 운영, 성능, 시스템의 실현 가능성에 관해 연구하고, 제품에 대한 아이디어를 기획하며, 세부 사항을 설계합니다.","산업 설비와 건설 현장의 기계 시스템의 설비, 변경, 위탁을 감독하고 검사합니다.","기계의 고장이나 문제를 파악하고 해결하며 기술자와 엔지니어를 감독합니다."],aptitude:"공학 전문직"},428:{name:"호스피스전문간호사",wage:3665,from:"워크넷",basis:"간호사",year:2021,sat:"76.3",works:["호스피스전문간호사는 죽음을 앞둔 말기 환자가 인생을 편안하게 마무리할 수 있도록 돕는 일을 합니다.","죽음이란 삶의 자연스러운 과정이라는 것을 알게 하고, 환자의 정신적, 육체적 고통이 완화될 수 있도록 돕습니다.","환자의 건강 상태와 통증을 확인하고 이를 완화할 수 있도록 간호합니다.","말기 환자와 가족의 심리적 문제나 어려움은 없는지 상태를 평가하고 간호하거나 교육하기도 합니다."],aptitude:"보건의료 관련 서비스직"},316:{name:"플로리스트",wage:3308,from:"워크넷",basis:"공예원",year:2021,sat:"67.3",works:["플로리스트는 꽃, 식물, 화초 등의 화훼류를 여러 가지 목적에 따라 보기 좋게 꾸미는 일을 합니다.","화훼가 시들지 않도록 적정 온도와 습도를 갖추어 보관하고, 고객의 요청에 따라 꽃을 포장하여 판매합니다.","행사의 특성을 살펴 장식 계획을 세우고, 고객과 협의하여 행사장에 화훼를 장식합니다."],aptitude:"기타 특수 예술직"},10009:{name:"스마트 의류 개발자",wage:null,from:null,basis:null,year:null,sat:null,works:["스마트 의류 개발자는 정보 통신 기술을 이용하여 옷을 입은 사람의 심박수, 체온 등을 감지할 수 있는 의류를 개발합니다.","쾌적하고 안전하며 편리한 스마트 의류를 만들기 위하여 연구하고 개발합니다.","음악을 들을 수 있는 멀티미디어, 현재 위치를 확인할 수 있는 위치기반서비스를 활용하여 사람들의 생활을 풍요롭게 만드는 스마트 의류를 개발합니다."],aptitude:"의복제조 관련직"},182:{name:"농업기술자",wage:4299,from:"워크넷",basis:"농학연구원",year:2021,sat:"72.3",works:["농업기술자는 농업에 대한 지식을 바탕으로 농업의 발전과 농업인의 복지 향상을 도모하기 위하여 농업과학기술의 진흥을 위한 연구와 농촌지도, 농업 관련인에 대한 교육 훈련 업무를 수행합니다.","농업생산력의 증진과 농업인의 생활 개선을 목적으로 하는 농업인 조직을 육성하고, 농촌 청소년과 후계 농업경영인 등 농업 후계 인력을 육성합니다.","농산물의 지속적이고 안정적인 생산을 위해 품질이 좋은 종자를 보급하고, 지역 농업 발전을 위해 기여하며, 현장 기술을 개발해 농업인에게 보급합니다.","농작물 병해충을 막기 위한 방제 정보 확산, 기상재해에 대비한 기술 지도, 농작물의 품질 향상을 위한 지도를 수행합니다."],aptitude:"환경관련 전문직"},1101:{name:"신용관련추심원",wage:4100,from:"워크넷",basis:"신용추심원",year:2021,sat:"66.4",works:["신용관련추심원은 은행이나 카드사 등 금융기관의 채권관리부서 또는 신용정보회사에 고용되어 채무자의 미납된 빚을 받아내는 업무를 담당합니다.","요금 미납 등 연체금을 회수하기 위해 고객에게 연체 및 체납 사실을 전화나 우편으로 알리고 연체금 납입을 독촉합니다.","채권자의 위임을 바탕으로 채무자의 재산조사 등과 같은 채권 회수 업무를 수행합니다."],aptitude:"일반 서비스직"},57:{name:"섬유공학기술자",wage:4220,from:"워크넷",basis:"섬유공학기술자",year:2021,sat:"71.0",works:["섬유공학기술자는 공학 기술을 기반으로 섬유제품의 품질에 대해 연구하고, 새로운 첨단 섬유 소재를 연구개발 하는 업무를 수행합니다.","새로운 섬유 소재 제품을 개발하며, 섬유 소재의 품질 향상을 위한 연구를 수행합니다.","섬유제품을 위한 공정, 장비, 절차를 설계하는 등 가공 공정을 개선합니다.","동물섬유, 식물섬유, 합성섬유에 대해 분석하고, 제조된 섬유제품을 분석합니다."],aptitude:"공학 전문직"},429:{name:"통신엔지니어",wage:4325,from:"워크넷",basis:"통신기술개발자 ",year:2021,sat:"75.5",works:["통신엔지니어는 초고속 인터넷 시스템 및 기타 전송 방식에 사용되는 통신의 전자회로, 제품, 관련된 기술을 연구하고 개발하는 일을 담당합니다.","국내외 시장조사, 통신 분야의 최신 기술이나 변화 등을 분석하여 새로운 기능과 성능을 갖춘 통신 제품과 기술을 연구하고 개발합니다.","새롭게 개발된 통신 제품과 기술, 제품의 성능과 기능, 개발된 제품과 기술이 실제로 상품화되어 고객에게 서비스될 수 있는지에 대해 평가하고 확인합니다.","통신 관련 제품이나 부품 등을 정기적으로 점검하고, 문제점이나 이상이 발견되면 원인을 분석하고 수리하기도 합니다."],aptitude:"공학 전문직"},317:{name:"연주가",wage:3e3,from:"워크넷",basis:"연주가",year:2021,sat:"61.8",works:["연주가는 독주자 또는 오케스트라 및 악단의 일원으로 악기를 연주합니다.","현악기, 관악기, 건반악기, 타악기 중 특정 악기의 연주를 전문으로 합니다.","음악과 악보를 연구하고 바람직한 음악적 효과를 내기 위하여 각 요소를 종합하며, 지휘자 및 다른 연주자들과 토론하고 협연합니다.","음반 제작을 위해 녹음에 참여하며, 악기를 조율하고 악보를 직접 편곡하기도 합니다."],aptitude:"음악 관련직"},10010:{name:"원격진료 코디네이터",wage:null,from:null,basis:null,year:null,sat:null,works:["의학적 지식을 바탕으로 직접 병원에 가기 어려운 환자들을 정보 통신 기술(ICT: Information and Communication Technologies)을 이용하여 의사와 연결해 주어 원격진료 서비스가 가능하도록 도와주는 업무를 수행합니다.","환자의 원격진료 서비스 요청에 대응하여 진료를 위해 상담을 하고 관련 내용을 문서로 정리합니다.","환자가 보내온 혈당, 혈압, 심전도, 체중 등 의료 정보를 PC, 스마트폰 등을 통해 수집하고 분석하여 의료진에게 전달합니다.","원격진료 서비스 결과에 대하여 환자에게 설명해 주고 이에 대한 상담 서비스를 제공합니다."],aptitude:"보건의료 관련 서비스직"},183:{name:"곡식작물재배자",wage:3613,from:"워크넷",basis:"곡식작물재배원",year:2021,sat:"56.0",works:["곡식작물재배자는 농업에 대한 지식을 바탕으로 벼, 보리, 쌀 등 곡식을 재배하기 위한 계획을 세우고, 각종 농작물 재배 방법이나 기계 등을 이용하여 곡식을 생산하고 수확하는 일을 담당합니다.","입지 조건을 고려해 생산 품목과 양을 결정하고, 농기계 준비, 노동력 확보, 수확 계획 등을 세운 뒤 이를 실행합니다.","농작물에 따라 토양을 조성하고 씨뿌리기를 하여 지지대 설치, 거름주기, 병충해방제, 수확, 탈곡 등의 활동을 합니다.","농기구를 사용해 논을 갈고, 씨를 준비한 후 발아하도록 합니다. 작물의 생육 상태에 따라 물을 조정하고 병충해 예방이 필요할 때 약제를 살포합니다."],aptitude:"농생명산업 관련직"},1102:{name:"장학사",wage:5040,from:"워크넷",basis:"정부·공공행정전문가",year:2021,sat:"75.9",works:["장학사는 행정상의 지휘권, 명령권, 감독권은 가지고 있지 않으나 학교를 주기적으로 시찰하고 교과과정, 교육 방법, 장비 및 기타 사안 등을 평가하고 제반 문제에 대해 교사와 협의하고 조언하는 역할을 담당합니다.","교사의 수업 능력과 학습자의 학습 결과를 평가해 이를 보고서로 작성하고, 각 시도 교육청 및 지역교육청에 보고합니다.","학교 교육과정 등을 관찰하고 그에 대한 평가 보고서를 작성합니다."],aptitude:"인문계 교육 관련직"},58:{name:"냉동기사",wage:3800,from:"워크넷",basis:"냉동·냉장·공조기설치·정비원",year:2021,sat:"66.2",works:["냉동기사는 냉동 기계 조작을 통해 식품을 저장하거나 얼음을 만들며, 공기조화장치를 조작하는 업무를 수행합니다.","냉동장치 계측기를 활용해서 온도, 습도, 저항, 압력 등을 측정하고 관찰 및 기록합니다.","냉동장치 작동 시 발생하는 소음이나 고장 사항을 진단하고 수리하는 업무를 수행합니다.","냉동장치의 냉매를 보충하거나 교환합니다."],aptitude:"기능직"},430:{name:"네트워크엔지니어",wage:4144,from:"워크넷",basis:"네트워크시스템개발자",year:2021,sat:"71.9",works:["네트워크엔지니어는 전산망을 만들기 위해 각종 하드웨어와 소프트웨어를 이해하고 사용 목적에 맞는 네트워크시스템의 기획, 분석, 설계, 구축에 관한 일을 합니다.","네트워크 시스템의 전체 구조를 분석 및 평가하여 문제점과 개선책을 마련하거나 사용자의 요구와 기대를 만족시키는 네트워크 시스템에 대한 기능성, 안정성, 확장성, 변경 가능성, 관리 용이성을 고려하여 구조를 설계합니다.","네트워크 시스템의 상세 설계에 대한 시공 방법이 적힌 시방서를 참고하여 하드웨어 및 네트워크 장비, 각종 소프트웨어에 대한 확보 방안을 마련합니다.","네트워크와 관련된 하드웨어와 소프트웨어가 들어오면, 각 시스템을 설치하고, 기능과 성능을 시험하며, 실제 운영에 필요한 네트워크 시스템의 관리체계를 마련합니다."],aptitude:"IT관련전문직"},318:{name:"악기제조원",wage:3815,from:"워크넷",basis:"악기제조원및조율사",year:2021,sat:"62.6",works:["악기제조원은 피아노, 바이올린 등의 각종 악기를 제조하거나 고객의 요청에 따라 악기의 소리를 조율하는 일을 담당합니다.","악기 설계 도면이나 작업명세서를 통해 제작할 악기의 형태를 파악하고, 필요한 재료 및 공구를 준비하여 악기를 제작합니다.","제작이 완성된 악기의 품질이나 이상 여부를 검사하며, 고객의 요청에 따라 악기의 소리를 조율하기도 합니다."],aptitude:"악기 관련직"},10011:{name:"노년 플래너",wage:null,from:null,basis:null,year:null,sat:null,works:["노년 플래너는 노후를 건강하고 행복하게 보낼 수 있도록 조언해 주는 업무를 수행합니다.","고객의 경제 상황이나 가족관계, 건강상태, 정서, 노후 계획 등에 대해 파악하고 적합한 노후생활을 할 수 있도록 상담합니다.","가족들과 좋은 관계를 유지하는 방법, 자산관리 방법, 건강하게 오래 사는 방법 등 노후를 행복하게 보낼 수 있도록 전문적인 조언을 해줍니다.","유산 상속, 유서 쓰기, 존엄사에 관한 내용을 제공하고 죽음을 사전에 준비해 의연하게 맞이할 수 있도록 돕습니다."],aptitude:"사회서비스직"},186:{name:"동물조련사",wage:null,from:null,basis:null,year:null,sat:null,works:["동물조련사는 동물에 대한 지식을 바탕으로 동물원의 동물을 사육하고 관리하거나, 인명구조 및 맹인 안내 등 특수한 목적을 위해 동물을 훈련합니다.","물개, 돌고래, 개, 원숭이, 말, 사자 등 조련할 동물의 특성에 대하여 학습하여 동물의 성격을 파악합니다.","조련할 동물의 특성과 훈련 목적을 토대로 동물 훈련 계획을 수립하고 반복적인 훈련을 통해 공연 시 동물이 각종 행동을 취하도록 유도합니다.","동물의 건강상태를 파악하고, 이상이 있을 경우 수의사에게 알리며 조련하는 동물들을 사육하거나 보살피기도 합니다."],aptitude:"자연친화 관련직"},1103:{name:"교육학연구원",wage:5180,from:"워크넷",basis:"교육학연구원",year:2021,sat:"76.5",works:["교육학연구원은 교육의 목적, 내용, 방법 등에 관한 종합적이며 과학적인 연구를 실시하고, 합리적인 교육체제 및 방법을 설계하고 개발합니다.","교육체제 및 방법 등 교육 전반에 관련된 문제를 분석하고 평가합니다.","우리나라 교육체계가 당면하고 있는 제반 문제들을 합리적으로 해결할 수 있는 혁신적이고 선진화된 교육체제 및 방법에 대해 연구하고 개발합니다."],aptitude:"인문 및 사회과학 관련직"},59:{name:"녹음기사",wage:3937,from:"워크넷",basis:"음향·녹음기사",year:2021,sat:"66.9",works:["녹음기사는 영화, 텔레비전, 라디오 등에서 사용되는 음악, 배경음, 대사 등을 녹음하는 장비를 조작하는 업무를 수행합니다.","촬영 장소에 대한 사전 답사를 통해 주변 환경을 확인하고 촬영에 대한 대비를 제작진에게 요구합니다.","촬영 시 가장 적절한 위치에 마이크를 설치해서 소리를 명료하게 녹음하고, 배우의 대사 톤을 세심히 살펴 톤이 일관되게 유지될 수 있도록 돕는 역할을 수행합니다.","녹음기의 가동 상태를 확인하고 조작하여 프로그램의 음향을 녹음테이프에 수록합니다."],aptitude:"음악 관련직"},431:{name:"데이터베이스관리자",wage:4600,from:"워크넷",basis:"데이터베이스개발자",year:2021,sat:"70.4",works:["데이터베이스관리자는 컴퓨터를 사용하여 각종 데이터를 체계적으로 수집, 정리, 가공하거나 입력하여 데이터베이스를 구축, 관리, 분석하는 일을 합니다.","데이터베이스를 분석하고 전산시스템 사용자에 대한 등록, 데이터 접근 범위, 읽고 쓰기 권한, 사용자 로그인 및 암호를 관리합니다.","데이터베이스 시스템에 장애가 발생하거나 서버 부품의 고장으로 인해 문제가 발생하면 신속히 원인을 파악하고 빠르게 시스템을 복구합니다.","데이터베이스를 매일 또는 정기적으로 백업하거나 보관하여 데이터의 손실을 예방합니다."],aptitude:"IT관련전문직"},319:{name:"반려동물미용사",wage:2950,from:"워크넷",basis:"반려동물미용사",year:2021,sat:"68.8",works:["애완동물미용사는 애완동물의 미용과 청결을 담당합니다.","고객과 상담을 통해 애완동물 털의 커트 모양 및 장식 모양 등을 결정하고, 애완동물의 털 상태를 검사합니다.","애완동물의 청결과 건강 관리를 위해 털 다듬기, 빗질하기, 목욕시키기, 귀 청소 및 눈, 귀, 발톱 손질 등의 기본 미용(그루밍, grooming)작업을 합니다.","또한 애완동물의 미용을 위해 털을 깎고, 발바닥, 발등, 항문 주위, 배 주위의 털을 뽑거나 짧게 깎아 주는 전신 미용(트리밍, trimming) 작업을 합니다."],aptitude:"자연친화 관련직"},10012:{name:"헬스 케어 컨설턴트",wage:null,from:null,basis:null,year:null,sat:null,works:["헬스 케어 컨설턴트는 식품영양, 건강관리, 물리치료 등의 지식을 바탕으로 질병 예방과 치료를 위해 상담을 하고, 개인이 건강관리를 체계적으로 할 수 있도록 돕습니다.","어디에서 어떤 치료를 받을지 결정하는 데에 전문적인 조언을 해 주며 식단 관리 방법, 스트레스 관리 기법, 운동 방법 등을 통해 건강관리를 효과적으로 할 수 있도록 지원합니다.","특정 질병이 발생한 경우 적절한 병원을 소개해 주고 환자의 병원 스케줄을 관리하며 개인의 건강을 위해 필요한 최신 의료 정보를 수집하여 제공합니다.","의학적 지식을 바탕으로 운동 프로그램을 개발하고 지도합니다."],aptitude:"보건의료 관련 서비스직"},187:{name:"양식원",wage:3600,from:"워크넷",basis:"양식원",year:2021,sat:"58.6",works:["양식원은 해양생태계와 수산물에 대한 지식을 바탕으로 어류, 패류, 해조류 양식장에서 시설물을 설치하거나, 먹이를 주고, 양식한 생물을 수확하는 일에 종사합니다.","정해진 구역 또는 육상에 수조를 설치하여 물고기, 굴, 조개 또는 기타 형태의 물속 동식물의 성장과 번식에 필요한 환경을 만들어 줍니다.","먹이 수급 계획에 따라 먹이를 공급하고 양식장을 관찰하여 양식한 생물의 성장 상태, 각종 병충해, 해상의 변화를 수시로 검사합니다.","일정 시기가 되면 물고기, 굴, 조개 등 양식한 생물을 수확하고 판매합니다."],aptitude:"농생명산업 관련직"},1104:{name:"철학연구원",wage:5950,from:"워크넷",basis:"철학연구원",year:2021,sat:"72.6",works:["철학연구원은 인류 문화의 토대로서 동서양 사상 문화가 수행해 온 역할과 현대사회에서 부딪치는 문제들에 대해 생산적으로 탐구하고 이를 통해 한국 사회의 사상 문화를 발전시키는 데 기여하며, 다양한 문화권 사이의 교류에 능동적으로 대응할 수 있는 방법을 연구합니다.","사물의 근원에 대해 연구하며 사물과 현상에 대한 기본 전제들을 탐구합니다.","종교와 도덕적 문제를 개념적, 논리적으로 분석하고, 실존적 관심에 대해 연구합니다."],aptitude:"인문 및 사회과학 관련직"},61:{name:"대기환경기술자",wage:4172,from:"워크넷",basis:"대기환경기술자및연구원",year:2021,sat:"80.3",works:["대기환경기술자는 대기오염 상태를 측정, 분석하고, 대기오염을 방지할 수 있는 방법에 대해 연구, 실험하며, 대기오염방지시설과 장치 등을 설계, 개발하는 업무를 담당합니다.","지역의 대기오염 상태를 측정하고 분석합니다.","대기오염을 최소화하거나 제거할 수 있는 대기오염 방지시설과 장치에 대해 연구하고 설계합니다.","대기오염 방지시설의 타당성을 검토하고, 운전상 문제점 등을 점검합니다."],aptitude:"환경관련 전문직"},435:{name:"정보보호전문가",wage:3800,from:"워크넷",basis:"정보보안전문가",year:2021,sat:"67.1",works:["정보보호전문가는 정보시스템의 보안 정책을 세우고, 시스템에 대한 접근 및 운영을 통제하며, 침입자가 발생했을 때에는 신속하게 발견하고 대응해 시스템을 보호하는 일을 합니다.","허가받지 않은 사람이 정보시스템이나 컴퓨터에 불법 접근하여 정보를 탈취, 변조, 파괴하는 등의 공격 행위를 할 때, 이를 방어하거나 예방합니다.","각종 컴퓨터바이러스의 발생과 해커의 침입에 대비하여 보안 방법을 만들고, 정보를 보호하는 방화벽의 설정을 변경하거나 관리합니다.","정보시스템의 정보가 손상되는 크래킹을 당했을 때 이를 빠르게 복구하고 새로운 보안 방법을 마련합니다."],aptitude:"IT관련전문직"},320:{name:"연극연출가",wage:2200,from:"워크넷",basis:"연극연출가",year:2021,sat:"54.8",works:["연극연출가는 한 편의 연극을 연출하기 위해 희곡 작품의 주제, 성격 등을 분석하고, 연기자들과 스텝들을 지휘 및 감독합니다.","희곡 작품을 검토하고 제작자와의 협의를 통해 연극의 주요 배역을 선정합니다.","연기자들의 연기를 지도하여 연기자들이 자신의 배역을 잘 표현해 낼 수 있도록 합니다.","연극의 주제에 맞춰 의상, 음향, 특수 효과, 안무 등에 관련된 사항을 결정하고 무대감독과 협의하여 연극 무대를 구성합니다."],aptitude:"예술기획 관련직"},10013:{name:"노인 전문 간호사",wage:null,from:null,basis:null,year:null,sat:null,works:["노인 전문 간호사는 의학적 지식을 바탕으로 노인전문병원, 의료복지기관, 요양원 등에서 노인의 건강관리와 병세 호전을 위해 간호 계획을 수립하고 각종 프로그램을 진행하며 노인을 간호합니다. 또한 응급처치와 건강관리, 질병 예방을 위한 교육 진행 등을 실시합니다.","노인의 가족과 상담을 통해 요구 사항을 반영해 간호 계획을 수립하고, 노인의 건강상태에 관한 자료를 기록하고 관리합니다.","노인의 건강에 이상이 생기면 병원에 의뢰하여 진료와 건강상태를 확인하고 관련 의료기관이나 의사에게 건강상태 자료를 제출하여 정기적으로 건강상태를 검토합니다.","노인의 건강관리 및 병세 호전을 위한 각종 재활치료 및 치료 프로그램을 진행하고, 노인과 가족들에게 시설과 간호에 대해 안내하며 건강관리, 회복, 질병 예방 등에 관해 설명합니다."],aptitude:"보건의료 관련 서비스직"},189:{name:"연근해 어부 및 해녀",wage:2443,from:"워크넷",basis:"어부및해녀",year:2021,sat:"60.7",works:["연근해 어부 및 해녀는 수산물의 서식지와 특징에 대한 지식을 바탕으로 가까운 바다에서 물고기, 굴, 조개 또는 기타 형태의 물속 동식물을 잡습니다.","연근해 어부는 그물 등 장비나 미끼를 이용해 물고기, 굴, 조개 등을 주로 잡습니다.","해녀는 바닷속에 들어가 해삼, 전복, 미역 등을 수확합니다.","잡은 물고기 등은 씻어 소금에 절이고, 시장에 판매할 준비를 합니다."],aptitude:"농생명산업 관련직"},1105:{name:"행정학연구원",wage:6358,from:"워크넷",basis:"정치학연구원",year:2021,sat:"78.3",works:["행정학연구원은 중앙정부나 지방자치단체 등에서 나타나는 다양한 문제점들을 해결하기 위해 주요 과제들을 체계적, 전문적으로 조사하고 연구하여 그에 대한 행정학적 해결 방안 및 대안들을 개발합니다.","조세, 경제, 문화, 경찰 등 다양한 분야의 행정 체계에 대해 연구합니다.","여러 유형의 공공 과제 및 문제를 해결하기 위한 효율적 행정 운영 체계를 수립하고 합리적 의사결정과 관리 방법 및 기술을 연구 및 개발합니다."],aptitude:"인문 및 사회과학 관련직"},63:{name:"도배원",wage:3730,from:"워크넷",basis:"도배공",year:2021,sat:"62.8",works:["도배원은 벽지와 장판지를 건축 구조물의 벽, 천장, 바닥에 부착하는 업무를 수행합니다.","건축 도면이나 현장에서의 측정을 통해 도배에 필요한 도배지, 풀 등을 준비하고 도배 계획을 세웁니다.","도배할 면을 확인하여 벽에 있는 구멍, 갈라진 틈을 메우고, 기존의 벽지나 못 등을 제거한 후 도배지에 풀을 붙여 도배를 합니다.","도배지에 풀을 도포하고 솔, 헝겊 등을 사용해서 도배지가 들뜨지 않도록 눌러 주고, 장판지는 물축임 한 후 중앙에서부터 헝겊으로 평평하게 밀어서 붙입니다."],aptitude:"기능직"},440:{name:"시스템엔지니어",wage:3730,from:"워크넷",basis:"시스템소프트웨어개발자",year:2021,sat:"70.5",works:["시스템엔지니어는 정보 기술의 기술적 사항과 해당 업무에 필요한 사항을 종합적으로 분석하고 설계하여 사용 용도에 따라 가장 빠르면서 안정된 정보시스템을 만드는 일을 합니다.","정보시스템을 도입해 처리할 일을 확인하고 사용자가 일을 처리하는 절차와 관련된 자료를 가지고 정보시스템으로 만들기 위한 모든 요소를 확인합니다.","기존 시스템의 문제점과 고객이 원하는 사항을 자세히 파악하고 분석하여, 만들어야 할 정보시스템의 성능, 기능, 사양 등에 관한 주요 사항을 결정합니다.","만들고자 하는 시스템이 다른 업무를 처리하는 전산 시스템의 데이터와 얼마나 관련되어 있는지를 자세히 검토하여 데이터의 처리에 문제가 없도록 합니다."],aptitude:"IT관련전문직"},321:{name:"연예인매니저",wage:3250,from:"워크넷",basis:"연예인매니저",year:2021,sat:"62.1",works:["연예인매니저는 가수, 탤런트, 영화배우, 개그맨 등 연예인들의 방송 출연 등 연예 활동과 관련된 모든 일정을 계획 및 관리하는 일을 담당합니다.","연예인들의 방송 출연, 광고 촬영, 행사 및 콘서트 활동 등의 일정을 수립 및 관리하고 출연료 협상과 출연 계약 등의 업무를 대신합니다.","가능성 있는 재목을 발굴하여 연예인으로 연예계에 진출할 수 있도록 하고, 각 방송사나 매체에 담당 연예인을 홍보합니다.","연예인이 이미 계획된 스케줄을 무사히 진행할 수 있도록 연예인의 차를 운전하여 촬영지로 이동하는 등 연예인의 스케줄을 보조합니다."],aptitude:"매니지먼트 관련직"},10014:{name:"의료 기기 개발 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["의료 기기 개발 전문가는 기계공학에 대한 지식을 바탕으로 최신 과학기술을 접목한 의료 기기 개발 계획을 수립하고, 환자 모니터, 초음파기기, X선 촬영(X-ray), 자기공명영상(MRI: Magnetic Resonance Imaging) 등의 의료기기를 설계하고 개발합니다.","의료 기기 개발 방법에 대해 전략을 수립하고 진행 방법을 기획합니다.","개발을 위한 연구용 기자재 관리, 도면 관리, 품질 관리 등의 연구 관리 업무를 수행합니다.","개발한 의료 기기를 검사하고 점검합니다."],aptitude:"의료관련 전문직"},190:{name:"유제품제조원",wage:3315,from:"워크넷",basis:"육류·어패류·낙농품가공기계조작원",year:2021,sat:"60.8",works:["유제품제조원은 식품 가공에 대한 지식을 바탕으로 젖소로부터 짜낸 우유를 살균 가공하여 우유, 치즈, 버터, 아이스크림 등 각종 우유와 관련된 제품을 생산하는 일을 담당합니다.","작업지시서와 생산할 유제품의 종류에 따라 우유나 기타 필요한 재료를 준비하여 계량하고, 일정 비율로 배합하여 유제품 제조기기에 투입합니다.","유제품 제조기기를 조작하면서 기계장치의 온도, 압력, 속도 등을 조정하고 완성된 제품을 포장합니다."],aptitude:"조리 관련직"},1106:{name:"학습지방문교사",wage:3056,from:"워크넷",basis:"학습지·교육교구방문강사",year:2021,sat:"60.5",works:["학습지를 받아보는 회원의 가정을 직접 방문하여 일정 시간 동안 회원의 학습을 도와줍니다.","업무 지역이 배정되면 회원 및 회원 보호자와 가정방문 시간을 협의하고, 회원별 학습 진도를 계획합니다.","보통 1주일에 한 번 정도 회원의 가정에 방문하여 학습지를 전달하고, 학습지를 활용하여 한 과목당 약 10여 분간 수업을 진행합니다."],aptitude:"교육관련 서비스직"},64:{name:"도자기제조원",wage:3300,from:"워크넷",basis:"점토제품생산기계조작원",year:2021,sat:"55.9",works:["도자기제조원은 점토 등의 재료 가공을 통해 실용적이고 미적인 다양한 도자기를 제작하고 생산하는 업무를 수행합니다.","점토와 고령토 같은 재료를 혼합하여 도자기를 제작하고 건조시킨 후 가마에 넣어 굽습니다.","도자기에 유약을 바르고 그림을 그려 장식을 한 후 다시 가마에 굽습니다.","완성된 도자기의 품질과 결함을 검사합니다."],aptitude:"미술 및 공예 관련직"},441:{name:"애니메이터",wage:3471,from:null,basis:"만화영화작가(애니메이터)",year:null,sat:"68.8",works:["애니메이터는 애니메이션을 만들기 위한 기획에서부터 창작, 연출, 디자인, 채색, 촬영, 편집 등 제작의 모든 분야의 일을 담당합니다.","국내외 시장 조사를 하여 만들어야 할 애니메이션의 소재나 주제를 결정하고, 애니메이션 제작에 필요한 사람들을 모읍니다.","애니메이션의 대본인 시나리오를 작성하고 문장으로 이루어진 내용을 자세한 그림과 기호를 통해 애니메이션의 전체를 설계하는 설계도인 콘티를 만듭니다.","애니메이션에 등장하는 각각의 캐릭터마다 몸의 구조나 형태, 질감, 성격, 행동 방식, 옷이나 장식물을 디자인하기 위하여 물체를 삼차원의 숫자로 된 정보로 바꾸어 입력하는 모델링 작업을 합니다."],aptitude:"웹·게임·애니메이션 관련직"},322:{name:"영화감독",wage:4800,from:"워크넷",basis:"영화감독",year:2021,sat:"69.9",works:["영화감독은 영화 제작을 위한 연출을 하고, 연기자와 제작진을 지도하며, 편집과 녹음 작업을 지도합니다.","작품의 주제, 성격을 분석하고 제작 방침을 결정합니다.","대본(시나리오)을 분석하여 배역을 선정하고 제작진을 결정합니다.","촬영 현장을 답사하고 세트 디자인을 결정하며, 촬영 계획을 세우고 촬영의 개시와 종료를 결정합니다."],aptitude:"예술기획 관련직"},10015:{name:"스포츠 심리 상담원",wage:3108,from:"워크넷",basis:"심리상담전문가",year:2021,sat:"73.1",works:["스포츠 심리 상담원은 심리학과 체육학의 지식을 바탕으로 운동선수나 가족, 지도자에게 심리 상담과 교육을 합니다.","불안 관리, 스트레스 관리, 자신감 향상 등을 위한 심리기술훈련을 제공하고, 우울, 진로 전환, 부상 등의 위기 상황에 놓인 선수들을 상담합니다.","팀워크 강화를 위해 리더십, 의사소통 과정 등에 대해 상담하기도 하며, 운동선수 외 가족, 친구들이 운동선수와 관련해 겪는 문제에 관한 대처 방법 및 예방법을 알려주기도 합니다."],aptitude:"일반 서비스직"},192:{name:"조경원",wage:3806,from:"워크넷",basis:"조경원",year:2021,sat:"67.3",works:["조경원은 조경에 대한 지식을 바탕으로 가로나 정원에 나무를 심고 가꾸는 업무를 합니다.","조경 계획에 따라 작업에 필요한 공구와 자재를 준비합니다.","괭이나 삽을 이용하여 나무를 심고, 식물의 종류에 따라 가지치기를 하고 비료나 영양제를 줍니다.","잔디를 심거나 조경석, 장식품 등의 부자재를 배치하며, 정기적으로 조경물을 관리합니다."],aptitude:"농생명산업 관련직"},1107:{name:"안마사",wage:2800,from:"워크넷",basis:"안마사",year:2021,sat:"59.0",works:["안마사는 손이나 기구를 이용하여 환자나 고객의 근육을 두드리거나 주물러서 혈액순환을 원활히 하고 육체의 피로를 경감시키는 일을 합니다.","의사의 지시나 고객의 요구에 따라 증기열, 건조열, 자외선, 적외선, 물 등을 이용하여 마사지를 합니다.","체중감량이나 치료를 목적으로 하는 교정 운동과 신체운동 등 여러 가지 요법을 병행합니다."],aptitude:"일반 서비스직"},65:{name:"건물도장원",wage:3730,from:"워크넷",basis:"건물도장공",year:2021,sat:"52.6",works:["건물도장원은 건축 구조물의 표면에 페인트, 라커 등을 입혀 건축물을 아름답고 오랫동안 보존할 수 있도록 합니다.","도장 당일의 온도, 습도, 바람, 환기 조건 등의 환경조건을 살피고, 도면이나 지시서를 숙지합니다.","도장 시 공면을 매끄럽게 하기 위하여 장비를 사용하여 묵은 페인트나 거친 부위를 긁어냅니다.","페인트에 희석제를 섞거나 색조를 혼합하고 솔, 롤러, 분사기 등을 사용하여 지정된 표면에 페인트를 칠합니다."],aptitude:"기능직"},443:{name:"웹디자이너",wage:3522,from:"워크넷",basis:"웹디자이너",year:2021,sat:"72.7",works:["웹디자이너는 웹사이트의 첫 화면이나 세부적인 화면, 메뉴의 색상과 아이콘 등 사이트 전체를 디자인하고 만드는 일을 합니다.","웹페이지의 문자, 이미지, 동영상, 음성 등을 재가공하여 이용자들이 알기 쉽고 사용하기 쉽게 만드는 작업을 합니다.","웹사이트의 전체적인 이미지를 결정한 후 사용자가 웹페이지를 이용할 때 메뉴의 이동을 돕는 내비게이션을 디자인하고 전체 구조, 주메뉴와 부메뉴를 위계적으로 정하며, 웹사이트의 틀을 정하고 시각적인 배치를 합니다.","웹사이트의 주요 화면을 필요에 따라 갱신하며 웹사이트를 제작할 때 필요한 기술인 HTML5, CSS, Javascript, JSP, ASP, XML 등을 활용하여 웹에 애니메이션이나 특정한 효과를 구현하기도 합니다."],aptitude:"웹·게임·애니메이션 관련직"},323:{name:"영화기획자",wage:4579,from:"워크넷",basis:"공연·영화·음반기획자",year:2021,sat:"65.9",works:["영화기획자는 영화의 기획에서부터 개봉에 이르는 전 과정에 대한 기획과 관리를 담당합니다.","새로운 영화 소재의 발굴을 위해 소설 또는 대본(시나리오)을 검토하고 흥행에 성공할 수 있는 작품을 선정합니다.","영화의 기본 시나리오와 인력, 소요 비용, 제작 기간 등에 대한 기획안을 작성합니다.","기획안이 통과되어 영화화하기로 결정이 되면, 영화감독, 출연 배우, 스태프 등을 섭외합니다."],aptitude:"예술기획 관련직"},10016:{name:"여행 기획자",wage:3516,from:"워크넷",basis:"여행상품개발자",year:2021,sat:"68.2",works:["여행 기획자는 관광에 대한 지식을 바탕으로 국내 여행이나 해외여행 상품을 개발하는 일을 합니다.","여행에 필요한 교통수단, 비용, 관광 명소, 숙박 및 편의시설, 이동 경로 등을 파악하고 이를 바탕으로 여행 코스와 일정을 기획합니다.","관광지로 잘 알려지지 않은 곳을 발굴하고 사전 답사를 하거나 자료를 수집하여 새로운 여행 상품을 만들기도 합니다.","철도 여행, 공정 여행, 건축 여행, 장애인 여행 등 테마별 여행을 기획하기도 합니다."],aptitude:"기획서비스직"},193:{name:"조경기술자",wage:4144,from:"워크넷",basis:"조경기술자",year:2021,sat:"76.1",works:["조경기술사는 디자인과 환경에 대한 지식을 바탕으로 정원, 가로, 공원 등을 지형과 용도에 맞게 계획하고 설계하며, 조경공사를 관리 및 감독하고 조경 시설을 유지 및 관리합니다.","고객과의 협의를 통해 설계 계획을 수립하고, 나무, 바닥 등과 같은 특성을 반영하여 비용 견적을 냅니다.","지형적 위치 선정, 토양 식물의 성장도 등 대기조건에 관한 자료를 수집하고 분석하며 시공계획에 의한 공정관리, 자재 품질, 규격 검수, 안전, 환경관리 등 공사 관련 업무를 수행합니다."],aptitude:"공학 전문직"},1108:{name:"위생사",wage:3730,from:"워크넷",basis:"보건위생·환경검사원",year:2021,sat:"68.9",works:["위생사는 국민의 위생 상태를 개선하기 위해 식품위생, 환경위생 등을 점검하고 관리하는 일을 합니다.","관할 지역 내의 오염원 및 취약 지구를 확인하고 각 지역의 물, 해충, 토양 등의 견본을 채취하여 오염 상태를 검사합니다.","검사 결과를 분석하여 소독에 필요한 약품의 종류와 양을 결정합니다."],aptitude:"공학 기술직"},66:{name:"로봇연구원",wage:5698,from:"워크넷",basis:"로봇공학기술자",year:2021,sat:"77.0",works:["로봇연구원은 산업용, 의료용, 해저자원 개발용 로봇과 실생활에 이용할 수 있는 로봇을 연구하고 개발하는 업무를 담당합니다.","로봇의 구성 요소를 연구, 개발하고 하나의 단일체로 조립, 제작합니다.","최적의 방법으로 공장의 생산설비를 자동화하기 위하여 최신 제조기술, 자동화기술 등에 대하여 자문하고 전기, 전자, 기계 장치를 자동화하는 설비를 연구, 개발합니다.","용접로봇 등 생산 현장에서 사용되는 산업용 로봇이나 자동화시스템 설비를 설치, 운용, 정비, 수리합니다."],aptitude:"공학 전문직"},444:{name:"웹마스터",wage:4e3,from:"워크넷",basis:"웹개발자",year:2021,sat:"70.9",works:["웹마스터는 인터넷 웹사이트의 게시판을 관리하거나 사이트상에서 발생한 오류나 문제들을 확인하고 해결하는 일을 담당합니다.","운영 중인 웹사이트에서 제공되는 콘텐츠를 관리하고, 웹사이트에서 제공하는 서비스의 기능을 정기적으로 점검하고 유지합니다.","웹사이트에서 자주 발견되거나 사용자들로부터 접수되는 오류 사항 등을 파악하고 개선 사항을 정리하여 관련된 담당자(기획자 또는 개발자)에게 전달합니다.","웹사이트를 관리하는 관리자 페이지의 사용자 등록이나 삭제, 변경, 관리자 권한 등을 설정하고 관리하는 역할도 합니다."],aptitude:"IT관련전문직"},325:{name:"이미지컨설턴트",wage:3500,from:"워크넷",basis:"미용사",year:2021,sat:"69.6",works:["이미지컨설턴트는 개인이나 단체의 성격이나 특성을 분석하여 그에 적합한 이미지를 만들어 주는 일을 합니다.","화장, 화술, 매너, 대화 태도, 의복 등을 중심으로 고객의 현재 이미지를 분석합니다.","고객의 새로운 이미지를 창조하기 위해 의상, 표정, 몸짓 등의 다양한 영역에서의 개인의 문제점을 파악하고 분석합니다.","파악된 문제점을 개선하고 상황에 맞는 대화법, 옷차림, 화장법 등을 지도하여 고객으로 하여금 자신의 최적 이미지를 표현할 수 있는 능력을 기르도록 합니다."],aptitude:"기타 특수 예술직"},10017:{name:"해양 레저 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["해양 레저 전문가는 스포츠에 대한 지식을 바탕으로 해양 스포츠나 레저 활동을 일반 사람들이 쉽게 즐길 수 있도록 가르치고 새로운 레저 활동을 기획 및 개발하는 일을 합니다.","해양 레저 이벤트를 기획하거나 운영하고, 해양 스포츠를 홍보합니다.","해양레저 시설을 경영하거나 관리하고, 해양 레저 관광 상품을 개발하기도 하며 관광 회사를 운영할 수도 있습니다."],aptitude:"운동 관련직"},195:{name:"해양수산기술자",wage:5090,from:"워크넷",basis:"수산학연구원",year:2021,sat:"71.6",works:["해양수산기술자는 수산자원에 대한 지식을 바탕으로 바다에서 자라는 각종 수산물 관련 연구와 기술개발을 담당합니다.","해양기술자는 해양 과학 관련 기술과 해양 정책과 관련된 연구를 주로 수행합니다.","수산기술자는 각종 수산자원의 관리와 해산 어류의 생태를 파악하고, 수산자원의 관리, 증식, 양식, 수산물의 생산과 가공 등에 관련된 연구와 기술개발을 담당합니다.","어획 통계, 어장 환경 등의 자료를 수집하고 분석하여, 수산 정책의 기초 자료가 되는 어장 정보를 제공합니다."],aptitude:"공학 전문직"},1109:{name:"서예가",wage:3154,from:"워크넷",basis:"화가",year:2021,sat:"70.8",works:["서예가는 먹과 붓을 이용하여 화선지에 글이나 시를 쓰거나 사군자를 그리는 일을 합니다.","완성된 작품에 대하여 표구(그림의 뒷면이나 테두리에 종이 또는 천을 발라서 꾸미는 일)를 의뢰합니다.","개인 작품 전시회를 개최하여 사람들에게 본인의 작품을 소개합니다."],aptitude:"미술 및 공예 관련직"},68:{name:"목공",wage:4e3,from:"워크넷",basis:"건축목공",year:2021,sat:"60.8",works:["목공은 목재 등 자재를 깎고 조립하여 건축의 지붕틀, 방음 설비, 마루, 칸막이, 내외장 마감과 같은 건축물의 내외부 공사에 필요한 목재 작업을 담당합니다.","건축 설계 도면과 공작 도면에 따라 목재의 치수를 측정하고 절단하며, 마름질용 기계를 사용하여 목재를 다듬습니다.","다듬은 목재를 목조주택의 지붕, 전통 목조건축물의 복원, 수리 등의 목적에 따라 조립합니다."],aptitude:"기능직"},450:{name:"IT컨설턴트",wage:4750,from:"워크넷",basis:"정보통신컨설턴트및감리원",year:2021,sat:"75.6",works:["IT컨설턴트는 기업의 인적, 물적 자원 및 모든 조건에 관련된 자료를 수집 및 분석하고, 최근의 기술과 활용 가능한 자원, 현재 상태를 고려해 시스템을 만들기 위한 전문적인 조언이나 자문을 하는 일을 합니다.","이미 만들어진 정보시스템을 통해 경영상의 개선 효과, 시스템의 효율성 등에 대해 평가를 실시하고 시스템의 운용과 유지, 관리에 대한 조언을 합니다.","현재의 정보시스템을 완전히 교체하기 위해 새로운 시스템을 전면적으로 개발하는 경우, 국내나 국외의 비슷한 시스템에 대해 비교, 분석하며, 필요한 시스템 구성 방안이나 예산을 세우고 시스템이 만들어졌을 때 기대되는 효과를 분석합니다.","정보시스템 개발 프로젝트 진행 사항에 대한 점검을 하고 개발 중인 시스템에 대한 기획 단계와 프로그램 개발 단계 등 각 과정에 대해 감리하며, 개발 요구 사항에 맞게 진행되고 있는지를 확인하고 평가합니다."],aptitude:"IT관련전문직"},326:{name:"인테리어디자이너",wage:3867,from:"워크넷",basis:"실내장식디자이너",year:2021,sat:"70.3",works:["인테리어디자이너는 주택, 사무실, 상가 건물의 내부 환경을 기능과 용도에 맞게 설계하고 장식합니다.","내부 환경이 장식에 영향을 미치는 요인을 조사 및 결정하기 위하여 고객과 협의합니다.","건물의 목적, 기능, 예산, 건축 형태 등 여러 특성을 파악하여 디자인 콘셉트를 정하고 세부 일정 및 계획을 수립합니다.","공간 구조, 가구나 시설의 배치 및 이용, 색상 등 구체적인 계획에 대하여 고객과 협의하고, 동선 계획과 색채 계획, 조명 계획 등을 세웁니다."],aptitude:"디자인 관련직"},10018:{name:"반려동물 훈련·상담사",wage:null,from:null,basis:null,year:null,sat:null,works:["반려동물 훈련ㆍ상담가는 동물에 대한 지식을 바탕으로 반려동물의 문제 행동(끊임없이 짖거나, 아무 곳에서나 배설하는 문제, 주인과 잠시라도 떨어져 있는 것을 참지 못하는 경우 등)을 보일 때 이러한 행동을 바로잡아 주는 프로그램을 만들어 실시하고 교육하는 일을 합니다.","문제 행동을 바로잡기 위해 반려동물의 보호자와 대화를 통해 근본적인 원인을 찾고 반려동물의 행동을 관찰하고 파악합니다.","반려동물의 문제 행동을 바로잡기 위한 프로그램을 개발하고 훈련 일정을 계획하고 관리합니다. 그리고 보호자에게 반려동물의 행동을 바로잡는 방법을 알려주고, 보호자의 행동에서도 바로잡아야 하는 부분이 있다면 이를 알려주고 교육합니다."],aptitude:"일반 서비스직"},198:{name:"감정평가사",wage:6767,from:"워크넷",basis:"감정평가사",year:2021,sat:"80.0",works:["감정평가사는 문화재 감정, 부동산 감정 등의 지식을 바탕으로 공장, 자동차, 항공기 등과 같은 동산과 토지, 건물, 아파트, 임야와 같은 부동산, 무형 자산 등의 경제적 가치를 평가하는 일을 합니다.","토지 관련 세금의 과세 기준인 공시지가를 평가하고, 세금 부과 기준 가격 선정을 위한 감정평가, 공익사업을 위한 보상 평가, 금융기관 등의 담보 평가, 법원 경매 물건 평가 등을 담당합니다.","감정평가 의뢰서를 작성하고 대상물의 감정 목적을 생각하여 감정 계획을 세웁니다.","대상물의 가격에 미치는 모든 요인을 확인하여 부동산 가격을 조사하고, 해당 물건의 용도, 입지 조건, 주변 시설 등을 살핍니다."],aptitude:"회계 관련직"},1110:{name:"도선사",wage:4986,from:"워크넷",basis:"선박교통관제사",year:2021,sat:"75.3",works:["도선사는 항만, 운하, 강 등의 일정한 도선 구역에서 선박에 탑승하여 해당 선박을 안전한 수로로 안내하는 일을 담당합니다.","항구에서 출항하거나 귀항하는 선박의 항로를 검토하고 항만에 입출항하는 선박의 종류와 규모를 확인합니다.","해협, 항만 또는 연안 구역에서 선박의 안전한 항해를 위해 풍속, 풍향, 기상, 조류 등을 고려하여 선박의 항로와 속도를 조정합니다."],aptitude:"고급 운전 관련직"},69:{name:"목재가공관련조작원",wage:3450,from:"워크넷",basis:"목재가공기계조작원",year:2021,sat:"58.4",works:["목재가공관련조작원은 원목, 기타 목재 등을 가공하여 실생활에서 사용되는 제품으로 생산하는 기계와 장치를 조작하는 일을 담당합니다.","작업명세서를 확인하여 생산할 목제품의 종류를 파악하고, 작업에 필요한 재료와 장비를 준비합니다.","판재, 재목, 각목 등을 제조하기 위해서 다양한 기계톱, 제재기를 조작하여 원목을 일정한 규격으로 자릅니다.","합판을 제조하기 위해 단판 절삭기 등 기계를 조작하고, 단판에 아교를 살포한 후 접착하는 기계를 조작합니다."],aptitude:"기능직"},452:{name:"정보중개인",wage:4300,from:"워크넷",basis:"정보시스템운영자",year:2021,sat:"74.0",works:["정보중개인은 정보 요구자의 의뢰나 요청에 따라 해당하는 정보의 원천이 어디 있는지를 찾고 이 정보를 고객의 요구 사항에 맞게 가공하여 활용할 수 있는 형태로 제공하는 일을 담당하고 있습니다.","고객의 의뢰 및 요청 사항을 정확히 파악하여 필요한 정보에 대해 정의하고, 인터넷 검색, 문헌 탐색 및 관련 관계자들과의 만남을 통해 정보를 찾아냅니다.","고객의 요구 사항에 가장 적합하도록 습득한 정보를 가공하여 제공합니다."],aptitude:"사무 관련직"},327:{name:"일러스트레이터",wage:3500,from:"워크넷",basis:"시각디자이너",year:2021,sat:"66.9",works:["일러스트레이터는 주로 광고나 영상 매체의 그림이나 문양을 도안하고 제작하는 일을 담당합니다.","일러스트 의뢰를 받은 대상에 대한 스타일과 일러스트레이션 방향 및 주제에 대해 의뢰인과 논의합니다.","대상에 대하여 스타일이나 주제를 연구하고, 관련 시장의 추세 및 고객의 기호 등을 조사합니다.","작성할 내용과 크기를 확인하고, 각종 도안 도구를 사용하여 그림, 문자 등을 제도 혹은 스케치합니다."],aptitude:"웹·게임·애니메이션 관련직"},10019:{name:"디지털 큐레이터",wage:null,from:null,basis:null,year:null,sat:null,works:["디지털 큐레이터는 인터넷상에서 쏟아지는 다양한 정보 중 가치 있는 정보를 선별하고, 콘텐츠화하여 유용한 정보로 만들어서 사용자에게 제공합니다.","사용자가 정보를 쉽게 활용할 수 있도록 인터넷에 등록된 다양한 정보를 비교 및 분석하고 정리하는 일을 합니다.","블로그, SNS 등에 수많은 정보가 실시간으로 등록되면서 기존 정보를 찾기 어렵기 때문에 관련성 있는 정보를 하나의 화면에 보기 좋게 배치합니다."],aptitude:"예술기획 관련직"},199:{name:"검사",wage:7480,from:"워크넷",basis:"검사",year:2021,sat:"80.1",works:["검사는 법률적 지식을 바탕으로 범죄 사건을 수사하고, 범죄 여부를 판단하기 위해 범죄의 의심을 받는 사람인 피의자에게 법원의 심판을 구하는 일을 담당합니다.","형사사건의 경우 사건의 제반 사항을 조사하고, 사건 관련 증거를 수집하며 이를 분석하고 사건에 적용할 규정이나 기타 법적 문제를 검토한 후 법원의 재판을 요구합니다.","해당 사건에 관한 타당한 결정이나 방침, 규정, 기타 법적 문제를 검토한 후 공소를 제기하고 피고를 기소 또는 방면(붙잡아 가두어 두었던 사람을 놓아주기)하기 위한 증거를 제시하며, 법원에 정당한 법령의 적용을 청구합니다.","민사사건에 관하여, 금치산·한정치산 선고의 신청권, 부재자의 재산관리 관여권, 회사의 해산명령 청구권, 외국회사 지점의 폐쇄명령 청구권 등을 행사하기도 합니다."],aptitude:"법률 및 사회활동 관련직"},1111:{name:"지게차운전원",wage:4e3,from:"워크넷",basis:"지게차운전원",year:2021,sat:"57.1",works:["지게차운전원은 생산 현장이나 창고, 부두 등에서 화물을 싣거나 내리고, 화물의 운반을 위해 지게차를 운전하는 일을 담당합니다.","지게차를 운전하기 전, 각 부품 간의 연결 상태와 연료, 엔진오일, 냉각수 등을 점검합니다.","포크(짐받이)를 주행 위치(지면에서 30㎝)에 맞추고 천천히 작업 장소로 운전하며, 조종간을 조작하여 포크(짐받이)를 운반 물체 밑으로 밀어 넣습니다."],aptitude:"일반운전 관련직"},70:{name:"미장원",wage:3890,from:"워크넷",basis:"미장공",year:2021,sat:"58.2",works:["미장원은 건물의 습기를 방지하고, 방음 효과를 높이며, 벽과 바닥, 천장 등을 매끄럽게 마무리하기 위해 건물의 내외부에 시멘트를 바르는 업무를 수행합니다.","미장 작업을 할 부분을 점검하고, 필요한 미장 재료와 공구를 준비합니다.","미장할 부분을 평탄하고 꺼칠꺼칠하게 다듬은 다음, 접착성을 증대시키기 위해 물을 뿌리고, 시공 부위를 단계별로 구분하여 미장재를 일정 두께로 바릅니다.","미장 표면을 점검하고 재료와 공구를 준비합니다."],aptitude:"기능직"},457:{name:"컴퓨터게임시나리오작가",wage:2500,from:"워크넷",basis:"영화시나리오작가",year:2021,sat:"63.3",works:["컴퓨터게임시나리오작가는 게임 개발을 위해 필요한 시나리오를 구성하고 개발하는 일을 합니다.","다양한 자료를 읽고 조사하며, 게임 시장의 흐름을 파악하여 새로운 게임 소재를 발굴합니다.","게임의 주제나 장르를 결정하고 이에 따라 게임 시나리오를 창작합니다.","게임의 스토리 전개를 구성하며, 게임의 개발 과정을 관리하고 감독합니다."],aptitude:"작가 관련직"},328:{name:"작곡가",wage:2486,from:"워크넷",basis:"작곡가",year:2021,sat:"67.8",works:["작곡가는 관현악, 기악, 성악, 대중가요, 영화음악, 광고음악, 애니메이션음악 및 기타 배경음악 등을 만듭니다.","화음, 리듬, 멜로디, 음악이론 등을 기초로 작가의 생각과 감정을 악보로 표현합니다.","음을 합성하거나 관현악단의 연주 효과를 얻기 위해 컴퓨터를 이용하기도 합니다.","작곡한 음악을 피아노, 기타 등의 악기나 관현악단에서 연주할 수 있도록 편곡을 하기도 합니다."],aptitude:"음악 관련직"},10020:{name:"게임 방송 프로듀서",wage:null,from:null,basis:null,year:null,sat:null,works:["게임 방송 프로듀서는 게임 대회 방송이나 게임 방송 프로그램을 기획하고 제작하는 일을 합니다.","게임 대회 방송이나 프로그램을 위한 장소 섭외, 무대 구성, 일정 관리, 스태프와 출연진 섭외 등을 합니다.","게임의 특성을 파악하여 연출 방향을 설정하고 방송 촬영과 편집 등 방송을 총지휘합니다."],aptitude:"웹·게임·애니메이션 관련직"},201:{name:"상품중개인",wage:4600,from:"워크넷",basis:"상품중개인및경매사",year:2021,sat:"69.0",works:["상품중개인은 유통 경영과 시장경제에 대한 지식을 바탕으로 골동품, 예술품 등의 제품을 경매에 공급하는 자와 시장에 나온 상품에 최고 가격을 제시하는 상품 구매자를 연결합니다.","시장에 나온 상품의 유통에 따라 경매를 주관하는 경매인과 공판장에 시장에 나온 상품을 최고의 가격으로 소매 단계로 공급해 주는 중도매인으로 구분됩니다.","경매인은 시장에 나온 농수산물을 확인하고 물품에 대한 경매 우선순위를 결정하며 가격 평가, 최저 가격 설정, 낙찰자의 결정 등 경매 업무를 주관합니다.","중도매인은 도매 시장에서 매매할 수 있는 품목으로 지정된 농수산물을 경매 또는 입찰의 형태로 도매 법인으로부터 구입한 후 자가 상점이나 소매상들에게 판매합니다."],aptitude:"영업관련 서비스직"},1112:{name:"선박갑판원",wage:3626,from:"워크넷",basis:"선박갑판원",year:2021,sat:"57.3",works:["선박갑판원은 각종 선박의 갑판 시설 및 장비를 조작, 유지, 보수하는 데 관련된 제반 업무 및 선박의 운행 관련 업무를 담당합니다.","선박의 구명 장비, 화물 취급 설비, 닻, 케이블 등의 장비를 점검 및 수리하고, 갑판에 설치된 시설물 및 장비를 보수하며, 선체의 부식과 마멸을 방지하기 위하여 선박에 페인트를 도장하거나 선체를 정비합니다.","갑판에 설치된 시설물 및 장비를 일정한 운전 시간마다 점검하고 소모된 부품을 교체합니다."],aptitude:"일반운전 관련직"},72:{name:"방수원",wage:3600,from:"워크넷",basis:"방수공",year:2021,sat:"59.6",works:["방수원은 건물이나 구조물의 바닥, 지붕, 벽체에 물이 스며드는 것을 방지하기 위해 방수 재료를 바르거나 붙이는 업무를 수행합니다.","방수 작업을 할 부위를 확인하고, 방수제와 시멘트 모르타르의 혼합물이나 액체 상태의 방수재 등을 시공 면에 바릅니다.","아스팔트 접착제를 시공 면에 바르고, 롤러로 프라이머를 시공 면에 칠하는 등의 작업을 합니다.","사용한 방수 재료에 따라 코팅제를 마지막으로 바르기도 하며, 방수 시공이 잘 되었는지 검사합니다."],aptitude:"기능직"},458:{name:"컴퓨터그래픽디자이너",wage:3300,from:"워크넷",basis:"영상그래픽디자이너",year:2021,sat:"70.6",works:["컴퓨터그래픽디자이너는 컴퓨터를 이용해 광고, 영화, 드라마, 애니메이션에 사용되는 특수효과 등 3D 입체 영상이나 도형, 공간, 자막, 그림 등을 디자인하고 표현하는 일을 합니다.","인터넷 홈페이지에 사용되는 여러 가지 새로운 이미지를 생각해내고 제작하며, 웹페이지에 디자인한 이미지를 올립니다.","방송이나 영화 및 게임 시나리오 작가가 생각한 내용 즉, 입체 영상이나 특수효과, 자막, 그림 등을 컴퓨터 그래픽을 사용하여 영상 속에 표현합니다."],aptitude:"디자인 관련직"},332:{name:"제품디자이너",wage:3800,from:"워크넷",basis:"제품디자이너",year:2021,sat:"69.3",works:["제품디자이너는 우리의 일상생활에 필요한 각종 제품을 디자인합니다.","디자인 의뢰가 들어오면, 시장조사를 통해 소비자의 취향과 욕구, 유행을 분석하고 디자인 콘셉트를 정합니다.","설계도를 바탕으로 점토, 나무, 종이 등으로 모형 제작 후 개조, 수정 작업을 거쳐 설계 도면을 만듭니다.","시안으로 여러 디자인을 만든 후 몇 번의 수정 작업을 거쳐 최종 디자인을 결정합니다."],aptitude:"디자인 관련직"},10021:{name:"개인미디어 콘텐츠제작자(크리에이터)",wage:3937,from:null,basis:"웹방송전문가(콘텐츠제작자)",year:null,sat:"70.8",works:["개인 미디어 콘텐츠 제작자는 유튜브, 트위치, 아프리카TV 등 미디어 플랫폼 서비스에 영상과 오디오로 된 콘텐츠를 만들어 올립니다.","제작자 개인의 적성과 취향에 따라 표현하고 싶은 주제의 콘텐츠를 제작합니다.","콘텐츠 제작을 위한 자료 조사와 기획·연출, 영상 촬영을 합니다.","촬영된 영상을 편집하고, 자신의 미디어 플랫폼 서비스에 영상을 올립니다."],aptitude:"기타 특수 예술직"},202:{name:"경영컨설턴트",wage:5342,from:"워크넷",basis:"경영·진단전문가",year:2021,sat:"76.5",works:["경영컨설턴트는 경영과 경제에 대한 지식을 바탕으로 기업경영에 관한 문제점을 분석하고 대책을 연구하며, 사업 추진에 관한 상담과 자문을 제공합니다.","기업의 인사, 조직, 노무, 사무관리에 대한 진단과 지도를 돕고, 효율적인 경영을 위해 재무관리와 회계에 대한 진단과 지도를 돕습니다.","기업경영 전반에 대한 상담, 자문, 분석, 평가, 확인, 대행 등을 수행합니다.","물품의 생산, 유통관리, 판매관리 및 수출입 업무에 대해 상담하고 자문하며, 조사하고 분석합니다."],aptitude:"금융 및 경영 관련직"},1113:{name:"방문판매원",wage:2700,from:"워크넷",basis:"방문판매원",year:2021,sat:"56.9",works:["방문판매원은 가정이나 사업체를 직접 찾아다니면서 고객에게 상품이나 서비스를 홍보하고 판매하는 일을 담당합니다.","방문판매를 담당한 구역의 고객을 직접 방문하여 상품이나 서비스의 특징과 장점을 설명하여 고객의 구매 욕구를 자극합니다.","상품의 가격을 알리고 거래조건과 물품 인도조건을 협의하여 판매합니다."],aptitude:"영업관련 서비스직"},73:{name:"섬유제조원",wage:3300,from:"워크넷",basis:"섬유제조기계조작원",year:2021,sat:"54.8",works:["섬유제조원은 섬유로부터 실을 뽑아 내고, 연사 기계를 조작하는 업무를 담당합니다.","작업지시서에 따라 필요한 섬유와 혼합물을 준비합니다.","섬유를 청결히 하고, 소모를 소모 뭉치로, 소모 뭉치를 리본 뭉치로 결합시키며, 기계를 조작하여 몇 개의 소모를 결합시키는 작업을 수행합니다.","기계를 정기적으로 점검하고 이상이 있으면 수리합니다."],aptitude:"공학 기술직"},459:{name:"속기사",wage:3730,from:"워크넷",basis:"속기사",year:2021,sat:"71.3",works:["속기사는 속기 문자를 사용하여 발언자가 말한 내용을 받아쓰거나 컴퓨터 속기 기계로 기록하는 일을 합니다.","강의나 회의, 국회 및 법원 등에서 사람들이 발언한 내용을 속기 부호로 받아쓰거나 기록하고, 이를 다시 일반 문자로 번역하여 내용을 수정 및 편집해서 문서로 작성합니다.","기록한 내용의 정확성을 높이기 위해 발언 내용을 담은 녹음파일을 바탕으로 검토합니다.","어려운 외래어와 전문 용어는 사전이나 전문 서적 등의 자료를 참고하여 내용을 확인합니다."],aptitude:"사무 관련직"},333:{name:"조각가",wage:3918,from:"워크넷",basis:"조각가",year:2021,sat:"68.4",works:["조각가는 조각도를 사용하여 나무, 돌, 금속 또는 상아 등의 재료에 도안을 하거나 조각 작품을 창조합니다.","연마기, 끌, 정, 망치 등의 도구를 사용하여 석재, 콘크리트, 목재 등의 재료에 조각 대상을 새깁니다.","석재 또는 콘크리트 등의 재료로 조각상을 제작하기 위하여 진흙, 왁스 등의 재료를 사용하여 모형을 제작합니다.","완성된 모형의 외관과 가공하고자 하는 재료의 외형을 비교하면서 금속 또는 석재를 연마합니다."],aptitude:"미술 및 공예 관련직"},10022:{name:"드론 콘텐츠 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["드론 콘텐츠 전문가는 드론을 이용하여 다양한 콘텐츠를 만들어 내는 일을 합니다.","다양한 자료를 조사하여 드론 콘텐츠 주제를 찾아내고, 실제로 콘텐츠 제작이 가능한지 내용을 검토합니다.","드론을 활용한 다양한 콘텐츠를 떠올리고 사진, 영상, 가상현실(VR: Virtual Reality) 등을 활용하기도 합니다.","개발한 드론 콘텐츠를 각종 문화 공연, 드론 스포츠(레이싱, 축구 등), 행사와 축제, 테마파크 등에서 선보입니다."],aptitude:"기타 특수 예술직"},203:{name:"경제학연구원",wage:7500,from:"워크넷",basis:"경제학연구원",year:2021,sat:"76.6",works:["경제학연구원은 경제학에 대한 지식을 바탕으로 금융, 노동, 재정 등 전문 분야의 연구를 수행합니다.","금융, 노동, 농업 등 전문 분야의 이론적 연구, 실증적 연구를 하기 위한 기초 자료를 수집합니다.","경제 관계 자료를 검토하고 분석하여 연구 결과를 제시하고, 관련 전문가들과 논의하여 정책 제언 등을 도출합니다.","연구가 완료된 자료는 세미나, 토론회 등에서 발표하기도 합니다."],aptitude:"인문 및 사회과학 관련직"},1114:{name:"상품대여원",wage:3002,from:"워크넷",basis:"상품대여원",year:2021,sat:"58.6",works:["상품대여원은 고객에게 책, 의상, 장난감, 행사용품, 사무용 가구, 영상 장비, 컴퓨터와 같은 정보기기 등의 다양한 상품을 대여하는 일을 담당합니다.","고객을 응대하고 고객이 대여하고자 하는 상품이 무엇인지를 파악하여 고객의 상품 대여를 돕습니다.","상품의 대여 가격, 반납 일자, 대여 조건 및 상품의 사용법, 보관 요령 등에 대해 설명합니다."],aptitude:"영업관련 서비스직"},74:{name:"배관원",wage:3715,from:"워크넷",basis:"배관공",year:2021,sat:"58.9",works:["배관원은 건축물에 물, 가스, 증기, 기타 물질을 운반하는 배관시설을 제작, 설치하고, 배관시설의 유지보수와 관련된 업무를 수행합니다.","건물 설계도와 도면을 검토하고 현장을 검증하여 배관설비에 필요한 재료, 장비, 노동력 등을 판단합니다.","배관설비의 구조 도면에 따라 파이프를 절단, 가공하고, 배관시설을 설비할 곳에 구멍을 뚫어 배관 파이프를 설비하며, 파이프 간의 연결 부위를 봉합하고 용접하여 밀봉합니다.","오래되어 낡거나 고장이 난 건물의 배관시설을 수리하고 교체합니다."],aptitude:"기능직"},462:{name:"사이버교육운영자",wage:4e3,from:"워크넷",basis:"인사·교육·훈련사무원",year:2021,sat:"68.1",works:["사이버교육운영자는 컴퓨터를 이용해 시간과 장소에 상관없이 교사와 학생, 학생과 학생이 양방향으로 의사소통할 수 있는 온라인 교육환경을 설계 및 기획하는 일을 합니다.","온라인상에서 다양한 교육과정과 프로그램을 기획 및 운영하고 평가합니다.","사이버 교육 관련 인터넷 웹사이트를 만들고 운영하며, 교사와 학생, 학생과 학생 간의 의사소통이 잘 이루어질 수 있도록 수시로 관리를 합니다.","교육 내용을 그림이나 동영상 등 학습자가 잘 받아들일 수 있는 형태로 만들고, 이를 포함된 콘텐츠를 개발하는 업무를 수행합니다."],aptitude:"사무 관련직"},334:{name:"조향사",wage:4222,from:"워크넷",basis:"비누·화장품화학공학기술자및연구원",year:2021,sat:"73.0",works:["조향사는 여러 가지 향료를 배합하여 새로운 향을 만드는 일을 합니다.","다양한 향료를 배합하여 각 향료의 특성에 맞는 향수를 디자인하고 새로운 향을 개발하기 위한 실험을 합니다.","향이 사용될 제품의 특징을 고려하여 콘셉트를 정하고 원료를 선정합니다.","고객의 요청에 따라 새로운 향을 개발하기도 하며 제품이나 식품에 향을 첨가하는 일을 담당합니다."],aptitude:"기타 특수 예술직"},10023:{name:"문화 콘텐츠 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["문화 콘텐츠 전문가는 다양한 문화를 콘텐츠로 만들어 사람들이 쉽게 이용할 수 있도록 합니다.","드라마, 영화, 캐릭터, 애니메이션, 게임, 웹툰, 공연, 축제, 테마파크 등 다양한 형태로 콘텐츠를 떠올리고 실제로 만드는 일을 합니다.","문화 콘텐츠로 만들어 낼 주제를 찾아내고 다양한 문화 자료를 조사하여 콘텐츠 제작이 가능한지 검토합니다.","문화 콘텐츠 제작을 위해 작가, 연출가, 영상·음향 기술자 등 다양한 분야의 사람들과 함께 일을 합니다."],aptitude:"예술기획 관련직"},205:{name:"노무사",wage:5076,from:"워크넷",basis:"노무사",year:2021,sat:"75.4",works:["노무사는 노동관계 분야에 관한 법률적 지식을 바탕으로 부당 해고, 산업재해, 임금 체불 등에 관한 사건을 대리하는 업무를 담당합니다.","사업주나 노동조합의 의뢰로 노사 분쟁 예방과 해결을 위해 노사문제에 대한 상담과 자문을 하고, 노사 분쟁을 조정하고 중재하며 단체협약 분석 등 단체교섭을 대리하기도 합니다.","기업이나 노조에 노동 관계 법령, 인사 제도, 노무 관리에 대한 법률 정책 자문을 하고, 기업의 급여 관리나 4대보험에 관한 업무를 위탁받습니다.","합리적이고 효과적인 인사관리를 위해 HR컨설팅, 기업의 근로자 채용과 모집, 외국인근로자 관리와 같은 고용 컨설팅, 기업조직 및 개인의 역량 강화를 위한 교육 업무를 담당합니다."],aptitude:"법률 및 사회활동 관련직"},1115:{name:"주유원",wage:2595,from:"워크넷",basis:"주유원",year:2021,sat:"58.6",works:["주유원은 주유소나 가스충전소에 고용되어 자동차의 연료를 주입하고 판매하며, 그 외에도 엔진오일 등의 기타 자동차 소모품을 판매하거나 자동차의 세차를 담당합니다.","주유소나 가스충전소에 자동차가 들어오면, 자동차를 원하는 주유 위치로 안내합니다.","고객이 원하는 주유량을 확인한 다음, 자동차의 연료 주입구를 열고 주유기를 조작하여 연료를 주입하고 주유량에 따른 요금을 계산합니다."],aptitude:"영업관련 서비스직"},75:{name:"조적공",wage:3730,from:"워크넷",basis:"조적원",year:2021,sat:"54.2",works:["조적공은 벽돌, 블록 등의 조적 재료와 공구를 활용하여 건물의 내벽, 외벽, 바닥, 기둥, 담장, 굴뚝 등의 구조물을 제작하는 업무를 담당합니다.","건물의 도면도 또는 설계도에 따라 벽돌 시공 계획을 세우고, 시공에 필요한 조적용 공구와 장비, 재료 등을 준비합니다.","조적할 위치를 측정하여 표시하고, 규준틀을 설치하며, 이에 따라 벽돌이나 블록을 쌓습니다.","벽돌이나 블록을 원하는 크기로 잘라서 평벽의 수직, 수평을 조정하면서 다양한 형태로 쌓습니다."],aptitude:"기능직"},465:{name:"통신망설계운영기술자",wage:4400,from:"워크넷",basis:"통신망운영기술자",year:2021,sat:"70.6",works:["통신망설계운영기술자는 통신망의 접속자 몰림 현상 해소, 통화 완료율 향상, 기존 통신망의 효율성 극대화 등을 위해 연구 및 개발하는 일을 합니다.","통신망의 품질 향상, 안정적인 접속 상태 제공을 위해 통신망을 설계하고 차세대 통신기술 및 지능망서비스에 관하여 계획합니다.","통신망의 안정적 운용을 위하여 기술적 운영 방향을 세우고 이에 알맞은 통신망을 기획 및 설계하고 만듭니다.","통신망의 안정성과 품질을 높이기 위해 통신망 운영에 대한 중장기 전략을 마련하고 통신망 품질관리와 통신망 장애에 대한 복구 대책을 만듭니다."],aptitude:"공학 전문직"},335:{name:"지휘자",wage:2700,from:"워크넷",basis:"지휘자",year:2021,sat:"81.1",works:["지휘자는 관악기, 현악기, 타악기 등을 연주하는 관현악단을 지휘하고, 화음을 연출하기 위해 합창단을 지휘하는 일을 담당합니다.","연주를 심사하여 기악 연주자를 선정하고, 계획된 공연에 적합하고 연주자들의 재능과 능력에 알맞은 연주곡을 선정합니다.","각 악기의 화음이 균형과 조화를 이룰 수 있도록 연주자들을 적절히 배치합니다.","음악 작품을 해석하여 음색과 화음이 조화되어 음악적 효과를 낼 수 있도록 연주자들을 지휘합니다."],aptitude:"음악 관련직"},10024:{name:"해양 에너지 기술자",wage:null,from:null,basis:null,year:null,sat:null,works:["해양 에너지 기술자는 바다의 자원을 활용하여 에너지를 얻을 수 있는 방법과 기술을 개발합니다.","바다에 넓게 존재하고 있는 파랑(파도), 조류, 바다의 온도 차이 등을 전기에너지로 바꾸는 기술을 연구하고 관련 기계나 설비를 개발합니다.","바다를 조사하고 자원을 개발하기 위해 만드는 해양 구조물을 설치하고 관리하는 일을 합니다.","해양 에너지 자원을 조사하고 해양 에너지를 이용할 경우에 환경에 어떠한 영향을 미치는지 평가합니다."],aptitude:"공학 기술직"},206:{name:"회계사",wage:7770,from:"워크넷",basis:"회계사",year:2021,sat:"80.0",works:["회계사는 금융, 회계, 세무학 등의 지식을 바탕으로 개인이나 기업, 공공시설, 정부 기관 등의 경영 상태, 재무 상태, 지급 능력 등의 다양한 재무 보고와 관련하여 상담해주거나 관련 서류를 작성합니다.","대상 기업에서 작성한 기업의 재무와 성과에 관한 보고서인 재무제표가 적절한지 감사하고, 감사 보고서를 작성합니다.","기업의 회계와 결산 업무가 바르게 행해지도록 재무제표를 작성하고, 전표와 장부의 정비 및 개선에 대해 지도하는 업무도 수행합니다.","기업의 재무관리, 판매 정책 등에 대해 효과적인 방안을 제시하고 장단기 경영전략의 수립과 기업합병 등에 대한 경영 자문 업무를 수행하기도 합니다."],aptitude:"회계 관련직"},1116:{name:"계산원 및 매표원",wage:2486,from:"워크넷",basis:"계산원 ",year:2021,sat:"49.5",works:["계산원은 상점, 식당 등에서 제품 및 서비스의 가격을 계산하고 고객으로부터 금액을 직접 수령하는 일을 담당하며, 매표원은 극장, 공원, 유원지 등을 이용하는 고객들에게 표를 판매하는 일을 담당합니다.","계산원은 바코드스캐너를 사용하여 고객이 구매하거나 주문한 제품 및 서비스의 가격을 계산하고 금액을 수령합니다.","매표원은 정원이나 예약 상황을 검토하여 매표 수를 확인하고 시간이나 좌석번호 등을 표에 기록하여 단말기에 입출력하여 고객에게 판매합니다."],aptitude:"영업관련 서비스직"},76:{name:"보석감정사",wage:3626,from:"워크넷",basis:"귀금속·보석세공원",year:2021,sat:"68.9",works:["보석감정사는 보석의 진품 여부와 가치를 평가하여 품질에 따라 등급을 매기고 감정서를 발행하는 업무를 수행합니다.","보석의 가치에 영향을 미치는 특성과 결함을 찾아내기 위해 보석의 내부와 외부 구조를 검사합니다.","유색 보석 감별, 다이아몬드 검정, 귀금속 검사를 합니다.","광학기계나 화학 용액을 이용해 보석을 식별하여 물리적, 화학적 특성을 확인하고, 색상과 연마 가공도에 따라 등급을 매겨 보석 감정서를 발부합니다."],aptitude:"기타 특수 예술직"},466:{name:"컴퓨터설치·수리원",wage:3400,from:"워크넷",basis:"컴퓨터설치·수리원",year:2021,sat:"65.8",works:["컴퓨터설치ㆍ수리원은 고객의 요청에 따라 컴퓨터나 프린터 및 스캐너와 같은 주변기기를 설치하거나 컴퓨터의 고장 사항을 확인하고 수리하는 일을 합니다.","고객의 가정이나 사무실을 방문하여 컴퓨터, 스캐너, 프린터기기 등을 설치하고 컴퓨터와 주변기기 사용 방법에 대해 설명합니다.","고객센터로부터 접수된 컴퓨터 및 주변기기 사용의 불편 사항에 대하여 고객의 집이나 사무실을 방문하여 컴퓨터 및 주변기기의 고장 원인을 분석 및 파악하여 수리합니다.","컴퓨터 및 주변기기의 성능을 높이는(업그레이드) 일을 하기도 하며, 고객에게 장애 발생을 예방하는 방법에 대해 설명하기도 합니다."],aptitude:"공학 기술직"},336:{name:"운동선수",wage:4662,from:"워크넷",basis:"직업운동선수",year:2021,sat:"67.8",works:["운동선수는 축구, 야구, 테니스, 골프 등 각종 운동경기에서 선수로 활약합니다.","운동선수를 본업으로 하느냐 아니냐에 따라 직업 운동선수(프로선수)와 아마추어 운동선수로 구분됩니다.","운동선수는 해당 종목의 규칙을 익히고 좋은 성적과 기록을 내기 위해 체력 훈련과 기술 훈련 및 부상 예방 훈련을 합니다.","자기 자신과 팀은 물론, 경쟁 상대의 장단점을 분석하고 작전을 수립하여 각종 경기에 참여합니다."],aptitude:"운동 관련직"},10025:{name:"스마트 그리드 엔지니어",wage:null,from:null,basis:null,year:null,sat:null,works:["스마트 그리드 엔지니어는 전기를 생산, 운반, 소비하는 과정을 정보 통신 기술과 결합하여 지능형 전력망(스마트 그리드)을 개발합니다.","효율적으로 전력을 관리하는 지능형 전력망을 운영합니다.","지능형 전력망에 필요한 전기기기, 각종 전력 제어용 센서, 네트워크 장비, 데이터 처리 장비 등 각종 제품을 개발합니다."],aptitude:"공학 기술직"},207:{name:"관세사",wage:5180,from:"워크넷",basis:"관세사",year:2021,sat:"78.8",works:["관세사는 관세법과 관련 법령 등의 지식을 바탕으로 물건을 수출하거나 수입할 때 관련된 통관 업무를 수행합니다.","수출입 물품에 대해 물품 분류 기호에 따라 분류하고 이에 대한 세율을 부과합니다.","과세가격을 확인하고 세액을 계산하고, 관세법에 의한 수출통관 신고와 이와 관련되는 절차를 이행합니다.","수출용 원재료에 대한 관세 등 환급에 대한 특례법대로 환급 청구의 대리 업무를 수행하며, 관세법에 의한 이의신청, 심사청구, 심판청구를 대리합니다. 관세에 대한 상담 또는 자문을 담당하기도 합니다."],aptitude:"회계 관련직"},1117:{name:"청원경찰",wage:3050,from:"워크넷",basis:"청원경찰",year:2021,sat:"59.5",works:["청원경찰은 공공기관의 기관장이나 사업체의 경영자에 요청에 의해 기관이나 사업장에 배치되어 기관 및 사업장의 재산이나 시설의 치안을 유지하며 절도, 폭력 등의 불법행위를 방지하는 일을 담당합니다.","회사의 재산과 인원을 화재, 도난, 파손 및 불법 침입 등으로부터 보호하기 위하여 제반 경계 업무를 수행합니다.","도난, 폭력, 규칙 위반 또는 기타 불법적인 행위를 예방하기 위하여 건물이나 산업체의 작업 현장 등을 정기적으로 순찰합니다."],aptitude:"안전 관련직"},77:{name:"건설기계운전원",wage:4144,from:"워크넷",basis:"건설·채굴기계운전원",year:2021,sat:"62.8",works:["건설기계운전원은 건설 공사에 필요한 다양한 작업을 위해 각종 건설 기계를 운전합니다.","작업지시서 또는 작업 현장을 파악하여 작업에 필요한 부품, 작업시간, 작업 절차 등을 결정합니다.","기계의 작동상태를 검사하고 작업지시에 따라 건설기계를 조종합니다.","예정된 절차와 순서에 따라 중기를 운전 및 조작하여 작업을 수행합니다."],aptitude:"일반운전 관련직"},467:{name:"의료정보시스템개발자",wage:3561,from:"워크넷",basis:"보건의료정보관리사",year:2021,sat:"70.0",works:["의료정보시스템개발자는 의료정보의 축적 및 검색, 의료기관 간의 상호 연결 또는 지역주민이 의료기관을 보다 편리하게 이용할 수 있도록 하는 정보시스템을 연구 및 개발하는 일을 합니다.","국내외의 의료정보시스템 개발 흐름 및 우리나라 의료 체계와 관련된 법과 제도를 분석하여 적합한 의료정보시스템을 기획하고 개발합니다.","병원과 환자의 진료 정보 및 기타 의료 행정 정보들을 체계적으로 관리할 수 있는 의료정보시스템을 만듭니다.","의료정보시스템이 작동하는 데 필요한 하드웨어나 네트워크 장비를 정기적으로 점검하고, 시스템의 오류나 결함의 원인을 분석하여 문제를 해결합니다."],aptitude:"IT관련전문직"},337:{name:"촬영기사",wage:4197,from:"워크넷",basis:"촬영기사",year:2021,sat:"73.7",works:["촬영기사는 영화 카메라나 스튜디오 카메라 등으로 각종 물체나 대상을 촬영합니다.","화면의 노출 상태, 촬영 대상과 카메라의 움직임, 촬영 대상과의 거리 변경 등을 고려하여 방송연출가나 촬영감독의 지시에 따라 촬영 대상을 찍습니다.","촬영이 끝나면 촬영 일시, 장면 등을 기록하며 촬영 장비를 점검하고, 파손된 장비와 인화 장비 등을 수리합니다.","촬영이 끝난 필름을 방송연출가 또는 편집기사와 함께 편집하기도 합니다."],aptitude:"영상 관련직"},10026:{name:"기후변화 대응 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["기후변화 대응 전문가는 기후변화가 기업이나 정부 정책에 미치는 영향을 분석하고 대응 방안을 제시합니다.","기후변화에 따라서 농산물이나 수산물, 우리 생활이 어떻게 달라지는지 분석합니다.","기후에 부정적인 영향을 미치는 온실가스를 줄이기 위한 방법을 만듭니다.","기후변화에 대응하기 위한 교육 자료를 만들고 사람들에게 알립니다."],aptitude:"공학 전문직"},208:{name:"국제무역사무원",wage:3684,from:"워크넷",basis:"무역사무원",year:2021,sat:"71.2",works:["국제무역사무원은 무역학, 경영학 등의 지식을 바탕으로 무역에 필요한 계약, 결제 및 관련 법 규정 등에 대한 지식, 외국어 능력과 무역 실무 능력을 바탕으로 기업의 무역 사무 전반에 관한 업무를 담당합니다.","무역 절차의 흐름을 파악하여, 수출이나 수입 거래에 필요한 자료와 정보를 정리하고 계약 내용을 계약서의 형식이나 관련 법 규정에 따라 작성합니다.","수출입허가서, 신용장 등의 세관 신고 서류를 작성하고 통관절차를 진행합니다.","수출, 수입 바이어와 상담을 하며, 수출과 수입 시 발생하는 외국환을 취급하고 관리합니다."],aptitude:"금융 및 경영 관련직"},1118:{name:"무인경비시스템종사원",wage:2486,from:"워크넷",basis:"경비원",year:2021,sat:"48.8",works:["무인경비시스템종사원은 가정이나 사업체에 설치되어 있는 보안 기기에 이상이 감지되면 현장에 출동하여 이상 원인을 확인 및 처리하여 상황을 정리하는 일을 담당합니다.","침입, 화재, 가스 누출, 보안 기기의 사용 미숙 및 자체 고장 등의 원인으로 인해 보안 기기가 감지한 이상에 대해서 사업서비스업체의 대처 지시를 받고 출동합니다.","이상 내용을 판단하여 정상화하고 사고 확대 방지, 재발 방지, 원상 복구 등의 조치를 하여 보고합니다."],aptitude:"안전 관련직"},81:{name:"비파괴검사원",wage:3917,from:"워크넷",basis:"비파괴검사원",year:2021,sat:"68.8",works:["비파괴검사원은 방사선, 초음파 등을 이용하여 구조물, 산업 설비 등의 성질과 결함 등을 검사하고 평가하는 일을 담당합니다.","검사제품의 특성을 고려하여 검사 방법, 검사 일정 등 검사 계획을 수립하고, 수립된 계획에 따라 장비를 준비하고 설치합니다.","초음파, 방사선 촬영, 액체 침투 등을 사용하여 결함을 탐지하는 검사를 합니다.","소재의 특성, 구조물의 안전성과 신뢰성 등을 평가합니다."],aptitude:"공학 기술직"},469:{name:"고객관리시스템(CRM)전문가",wage:3730,from:"워크넷",basis:"응용소프트웨어개발자",year:2021,sat:"68.9",works:["고객관리시스템전문가는 고객과 관련된 기업의 내외부 자료를 분석 및 통합하여 사용자의 특성에 기초한 기업의 영업 활동을 지원하기 위한 정보시스템을 연구하고 설계하는 일을 합니다.","고객과 관련된 기업의 내외부 자료 및 기업의 전략, 목표 등을 분석하고 기업의 비즈니스와 연결해 효과적으로 고객을 관리할 수 있는 정보시스템을 연구하고 설계합니다.","고객관리시스템(CRM)과 관련된 국내외의 최신 정보 기술을 파악 및 분석하여 정보시스템을 개선하고 보완합니다.","기업의 사용자에게 고객관리시스템의 운영 및 관리에 대한 교육과 기술적 조언을 실시합니다."],aptitude:"IT관련전문직"},338:{name:"출판물기획전문가",wage:3968,from:"워크넷",basis:"출판물기획자",year:2021,sat:"63.8",works:["출판물기획전문가는 독자가 원하는 출판물의 내용과 출판 시장 동향 등을 파악합니다.","작가 섭외, 출판물 영업 전략 등 출판물 기획 및 제작에 관련된 모든 일을 담당합니다.","다양한 조사와 연구를 수행하며, 다른 출판물과의 차별성과 최근 경향을 고려해 세부적인 기획안을 작성합니다.","출판물에 적합한 작가를 섭외하고 집필된 원고를 검토합니다."],aptitude:"예술기획 관련직"},10027:{name:"신재생에너지 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["신재생에너지 전문가는 태양광, 풍력, 지열, 바이오에너지, 연료전지, 수소에너지 등을 이용하여 전기를 생산하고 이용하는 기술을 개발합니다.","신재생에너지를 이용하여 보다 효율적으로 전기를 생산하고 공급할 수 있는 장비를 개발하고 관리하는 일을 합니다.","태양광발전, 풍력발전, 지열발전 등과 같이 신재생에너지를 생산하는 발전 시스템을 설치하고 운영하는 일을 합니다."],aptitude:"공학 전문직"},209:{name:"국제회의전문가",wage:3469,from:"워크넷",basis:"행사기획자",year:2021,sat:"68.2",works:["국제회의전문가는 국제회의의 기획 및 유치, 준비, 진행 등과 관련된 제반 업무를 조정 및 운영하며, 회의 목표를 설정하고 회의 운영과 관련된 예산을 관리하는 등의 업무도 담당합니다.","국제회의, 전시회 등의 행사를 기획하고 이를 주최하기 위해 관련 업체 와 후원자들을 만나 행사의 크기, 형식, 예산 등에 대해 논의합니다.","전반적인 기획을 한 후, 참가자 등록 업무, 숙박, 행정, 관광, 전시회 등의 국제회의 관련 준비를 진행합니다.","개최할 국제회의를 국내외에 홍보하고, 국제회의의 원활한 진행을 위해 통역사와 관련 종사자를 섭외합니다."],aptitude:"기획서비스직"},1119:{name:"구두미화원 및 수선원",wage:3500,from:"워크넷",basis:"제화원",year:2021,sat:"61.3",works:["구두미화원 및 수선원은 고객의 구두에 묻은 각종 이물질을 제거하고 구두의 광택을 내는 일을 합니다.","고객의 요청에 따라 낡은 구두 굽을 갈거나 구두의 색상을 바꾸기 위해 염색을 하기도 합니다.","고객에 대한 서비스 정신과 성실한 자세 등이 요구됩니다."],aptitude:"기능직"},83:{name:"산업공학기술자",wage:null,from:null,basis:null,year:null,sat:null,works:["산업공학기술자는 기업경영에 대하여 사회과학적 전문 지식과 자연과학적 원리를 응용하여 경영의 여러 요소를 과학적으로 분석하고 조정하는 업무를 수행합니다.","생산을 위한 최적의 수준을 결정하고 기계, 원자재, 자원의 최적 활용을 위한 프로그램을 실행합니다.","경영 기획, 기술 전략, 경영 정보 시스템 분야 등에서 회사에 영향을 끼치는 다양한 요인들을 분석하고 사업전략과 경영관리 방법을 모색합니다.","시설을 계획하고 설계하며 새로운 기계, 설비를 연구하고 적용합니다."],aptitude:"공학 전문직"},470:{name:"전자상거래전문가",wage:3626,from:"워크넷",basis:"광고·홍보·마케팅사무원",year:2021,sat:"67.1",works:["전자상거래전문가는 정부, 기업, 개인 등이 인터넷 웹사이트를 통해 상품 및 서비스를 구매할 수 있는 전자상거래 시스템을 설계하고 만드는 일을 합니다.","전자상거래전문가는 사업 기획부터 콘텐츠 개발, 시스템 구성, 서버 관리 및 운영, 상품 구매 및 판매, 마케팅 및 홍보 등을 담당합니다.","인터넷을 통해 물건을 구매할 가능성이 있는 고객과 물건을 판매할 개인과 기업의 요구를 포함한 전자상거래 시스템을 만듭니다.","고객을 대상으로 마케팅 전략을 세우거나 전자상거래의 구축에 대한 전문적인 조언을 합니다."],aptitude:"IT관련전문직"},339:{name:"캐릭터디자이너",wage:3258,from:"워크넷",basis:"게임그래픽디자이너",year:2021,sat:"72.1",works:["캐릭터디자이너는 각종 팬시 사업의 캐릭터, 애니메이션, 게임, 인기 연예인들의 특징적인 캐릭터를 창조하여 이를 장난감, 문구류 등 다양한 상품에 활용해 디자인하는 일을 담당합니다.","선정된 아이템에 대해서 상품 제작진과 가격 및 제작 비용에 대해 협의하여 최종적인 아이템의 사양을 결정합니다.","캐릭터 대상에 대하여 스타일이나 주제를 연구하고, 시장조사를 통하여 영업 담당자, 상품 제작진과 함께 상품화할 아이템의 회의를 진행합니다.","흥행에 성공한 만화영화 등의 등장인물 캐릭터를 활용하거나 새로운 캐릭터를 창조하여 장난감, 문구류 등에 적용하고 디자인합니다."],aptitude:"웹·게임·애니메이션 관련직"},10028:{name:"스마트 재난 관리 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["스마트재난관리전문가는 각종 스마트기기를 활용해서 신속하고 정확하게 재난에 대응할 수 있도록 도와줍니다.","재난 상황의 공통점이나 발생 원인을 분석하여 필요한 대응 방법을 찾고, IT 기술과 최첨단 장비를 융합하여 재난관리 시스템을 기획, 개발합니다.","재난 피해를 최소화할 수 있도록 예방, 대비, 대응, 복구 등으로 단계를 나누어 재난 관리 업무를 수행합니다.","재난 상황에 대응하는 방법, 절차, 전략을 개발합니다."],aptitude:"공학 전문직"},211:{name:"농수산물중개인",wage:4600,from:"워크넷",basis:"상품중개인및경매사",year:2021,sat:"69.0",works:["농수산물중개인은 농수산과 유통학에 관한 지식을 바탕으로 개인이나 생산자 단체별로 도매시장에 나온 농수산물의 경매와 판매 거래를 중개하는 일을 담당합니다.","각종 자료를 수집하여 농수산물의 종류, 품질, 가격 등에 대한 시장 정보를 분석하며, 상품의 샘플을 검사하여 등급과 상품의 질을 결정합니다.","재배인과 거래조건에 대해 협상하고, 재배지를 방문하여 구매 결정을 하며, 상품 가격 지불과 구매 관련 서류를 작성합니다.","농수산물 경매에 내놓을 물품을 확인한 다음, 경매될 물품의 가격을 평가하여 경매 최저 가격을 설정하고 경매를 시행하여 낙찰자를 결정합니다."],aptitude:"영업관련 서비스직"},1120:{name:"주차관리원",wage:2383,from:"워크넷",basis:"주차관리·안내원",year:2021,sat:"48.7",works:["주차관리원은 무료 또는 유료 주차 시설에서 효율적 주차장 사용을 위해 차량의 주차 공간을 안내하는 등의 운영 및 관리 업무를 담당합니다.","주차장 입구에서 차량 입차 시 주차 발권기로부터 주차권을 고객에게 배부합니다.","차량의 주차장 출입을 유도하기 위하여 차단기를 조작하며, 차량번호 및 주차 예정 시간을 기록합니다."],aptitude:"일반 서비스직"},84:{name:"산업안전관리원",wage:4e3,from:"워크넷",basis:"산업안전원",year:2021,sat:"71.3",works:["산업안전관리원은 산업현장에서 근로자의 생명과 안전 보호를 위한 계획을 세우고, 종사자들에게 안전교육을 실시하여 각종 산업재해를 예방하는 업무를 수행합니다.","산업현장의 안전과 보건 상태를 점검하고, 작업 현장의 사고나 질병의 원인 등을 분석하며, 산업재해 방지를 위한 대책을 수립합니다.","근로자의 생명과 안전 보호를 위한 계획을 세우고, 근로자들에게 안전교육과 훈련을 제공합니다.","산업재해의 사례를 분석하고, 원인과 개선 방안에 대한 조언을 제공합니다."],aptitude:"공학 기술직"},474:{name:"아이티(IT)기술영업원",wage:3937,from:"워크넷",basis:"기술영업원",year:2021,sat:"64.6",works:["아이티(IT)기술영업원은 정보통신 제품에 대한 전문 지식을 활용하여 고객에게 적합한 제품을 소개하고, 판매하는 일을 합니다.","고객에게 IT 기술 제품(하드웨어 또는 소프트웨어)의 기능과 성능, 사용 방법 등에 대해 조언하고 기존 시스템과 이후 최신화될 기술 관련 문제에 대하여 상담합니다.","고객이 필요한 내용과 구매 능력을 파악하여 적합한 IT 제품 및 서비스를 추천하거나 판매 계약서를 작성합니다.","IT 기술 제품이나 서비스를 판매하고 문제가 발생한 경우 문제 해결을 위한 지속적인 서비스를 제공합니다."],aptitude:"영업관련 서비스직"},340:{name:"컬러리스트",wage:3500,from:"워크넷",basis:"시각디자이너",year:2021,sat:"66.9",works:["컬러리스트는 색채와 관련된 자료를 수집 및 분석하여 물건과 환경의 여러 가지 용도와 목적에 맞는 색채를 기획하고 적용합니다.","색상에 관한 각종 정보를 수집 및 분석하고 소비자 선호 조사 등을 통해 유행하는 색의 경향을 파악합니다.","색채 규정을 검토, 적용하여 상품의 색상을 기획하고 전체적인 컬러의 방향 및 상품의 배색, 프린트, 패턴 채색을 결정합니다.","브랜드이미지에 기초하여 소재 및 디테일 등의 경향에 맞추어 색상을 선정합니다."],aptitude:"디자인 관련직"},10029:{name:"블록체인 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["블록체인 전문가는 누구나 열람할 수 있는 장부에 거래 내용을 공개적으로 기록하고 여러 대의 컴퓨터에 복제, 저장하는 기술인 블록체인 기술을 활용할 수 있는 분야와 산업을 찾고 이를 적용하기 위한 소프트웨어를 설계하고 개발합니다.","실물 없이 사이버상에 전자 정보의 형태로 거래되는 전자화폐인 암호화폐를 블록체인 기술에 기반하여 개발합니다.","블록체인 기술이 실생활에서 사용될 수 있도록 소프트웨어를 개선하고 보완합니다."],aptitude:"공학 전문직"},212:{name:"도시 및 교통설계전문가",wage:4276,from:"워크넷",basis:"도시계획·설계가",year:2021,sat:"70.1",works:["도시 및 교통설계전문가는 도시설계와 교통체계에 관한 지식을 바탕으로 기존 도시와 특정 단지의 재개발 또는 신도시 건설과 관련하여 도시 및 단지를 계획하고 설계합니다.","건설될 도시와 지역에 관한 자료를 분석하는데, 해당 지역의 인구, 상하수도, 도로 등의 인문환경과 지리적 위치, 기후 등 자연환경을 조사 및 분석하여 향후 그 지역의 발전 및 확장 정도를 추정합니다.","확정된 계획안은 주문처인 자치단체나 건설회사에 제출되어 각계 전문가와 협의하여 결정안으로 확정합니다.","시공에 따라 발생하는 제반 사항에 대한 문제점을 해결하기 위해 현장 점검, 안전진단 등의 업무와 관리 및 감독 업무를 합니다."],aptitude:"공학 전문직"},1121:{name:"이용사",wage:2642,from:"워크넷",basis:"이용사",year:2021,sat:"60.5",works:["이용사는 주로 남성 고객을 대상으로 머리카락, 수염을 자르고 손질하는 등의 이용 서비스를 제공합니다.","고객의 얼굴과 머리 형태에 맞는 헤어스타일을 권하고, 고객의 요구에 따라 헤어스타일을 결정합니다.","가위, 이발용 커트기, 빗 등의 이용 기구를 사용하여 고객의 머리카락을 자르고 원하는 형태로 만듭니다.","면도칼과 비누 거품을 사용하여 고객의 수염을 면도해 줍니다."],aptitude:"이미용 관련직"},85:{name:"상ㆍ하수도 처리장치 조작원",wage:4e3,from:"워크넷",basis:"상·하수도처리장치조작원",year:2021,sat:"70.1",works:["상하수도 처리장치 조작원은 생활하수, 각종 폐수와 오수가 생활용수나 산업용수로 사용될 수 있도록 물 정화장치 등의 장비 및 기계를 조작하는 일을 합니다.","물 정화장치, 공기 및 가스압축기, 펌프장치 등의 가동상태나 처리 능력 등을 점검하고 투입하는 하수 및 각종 미생물의 수량을 조절합니다.","하수의 유입구 및 부유물 제거장치의 가동상태를 확인하고 하수의 유입량을 점검합니다.","수시로 하수처리 과정의 견본을 채취하여 처리물의 산도나 생화학적 산소요구량 등을 검사하고, 검사 결과에 따라 각종 기계의 가동 상태를 재조정합니다."],aptitude:"기능직"},475:{name:"아이티(IT)교육강사",wage:3730,from:"워크넷",basis:"컴퓨터강사",year:2021,sat:"72.5",works:["아이티(IT)교육강사는 수강생들에게 컴퓨터 정보처리 기술이나 기타 컴퓨터 프로그램을 능숙하게 활용하기 위한 방법과 이론 등을 설명하거나 가르칩니다.","정보통신학원 또는 컴퓨터 학원에서 각종 컴퓨터 프로그램을 능숙하게 활용하기 위한 방법 등에 대한 이론과 실기 및 실습을 함께 가르칩니다.","학생들에게 강의할 교재를 만들고 강의를 진행합니다.","IT 분야에 관련된 IT 기획, 웹프로그램, 웹디자이너, 웹퍼블리셔 등 정보통신 관련 기업의 취업 및 진로 상담을 담당합니다."],aptitude:"이공계 교육 관련직"},344:{name:"패션디자이너",wage:3613,from:"워크넷",basis:"패션소품디자이너",year:2021,sat:"70.4",works:["패션디자이너는 천(직물), 가죽, 비닐 등 여러 가지 소재로 남성복, 여성복, 아동복, 속옷 등 옷을 디자인합니다.","제품이 나오기 약 6개월 전부터 국내외 패션 흐름 등을 파악하고, 유행 경향, 소재, 색 등의 조화 등에 관련된 자료를 종합적으로 분석하여 새로운 패션 디자인을 기획합니다.","기획한 자료를 바탕으로 소비자의 성별과 연령에 맞는 새로운 의상을 디자인합니다.","디자이너가 디자인한 옷은 견본 의상으로 제작하고, 견본 의상을 실제 입어보면서 옷의 착용감 등을 파악하여 디자인을 수정하며 판매할 수 있는 옷으로 제작을 합니다."],aptitude:"디자인 관련직"},10030:{name:"디지털 포렌식 수사관",wage:null,from:null,basis:null,year:null,sat:null,works:["디지털 포렌식 수사관은 PC나 노트북, 휴대폰 등 각종 저장 매체 또는 인터넷상에 남아 있는 디지털 정보를 수집하고 분석해 범죄 단서를 찾는 업무를 수행합니다.","범죄자가 숨기거나 쓰지 못하게 변형시킨 데이터를 복구하여 법적인 증거자료로 만듭니다.","확보한 디지털 자료가 법정에서 증거로서 받아들여질 수 있도록 신뢰성을 확보하고, 증거로서 생명력을 잃지 않도록 유지 및 보관하여 법정에 제출합니다."],aptitude:"법률 및 사회활동 관련직"},214:{name:"바이어(구매인)",wage:3937,from:"워크넷",basis:"기술영업원",year:2021,sat:"64.6",works:["바이어는 물류와 유통에 대한 지식을 바탕으로 도소매사업체에서 재판매를 하기 위해 공급자로부터 상품을 구매하거나 구매한 상품을 판매합니다.","작업장 내 요구를 파악하고 필요한 장비, 자재, 물품에 대한 상세한 내역을 작성합니다.","수요와 재고에 관한 정보를 토대로 구입할 상품의 수량과 종류를 결정하여 제품 공급자를 접촉해 구매비용, 물건의 권리를 넘겨주는 일자 및 계약조건 등을 협의합니다.","매장의 상품 판매 상황을 파악하고, 적정재고수준을 유지하며 구매를 위해 제품 공급자와 지속적인 관계를 유지합니다."],aptitude:"금융 및 경영 관련직"},1122:{name:"미용사",wage:3500,from:"워크넷",basis:"미용사",year:2021,sat:"69.6",works:["미용사는 고객에게 적합한 헤어스타일을 연출하고, 염색, 파마 등 고객의 머리 손질과 관련된 서비스를 제공하는 일을 담당합니다.","고객의 얼굴과 머리 형태에 맞는 헤어스타일을 권하고, 고객의 요구에 따라 헤어스타일을 결정합니다.","가위, 빗, 염색제 등의 미용 설비를 사용하여 고객의 머리카락을 자르고 다듬어 고객이 원하는 형태로 만듭니다.","고객 스스로가 왁스나 스프레이, 젤 등을 이용하여 헤어스타일을 연출할 수 있도록 조언합니다."],aptitude:"이미용 관련직"},86:{name:"생물공학연구원",wage:4835,from:"워크넷",basis:"생물학연구원",year:2021,sat:"75.3",works:["생물공학연구원은 미생물, 동식물, 효소를 이용하여 물질을 생산, 분해, 변환하고 이를 통해 얻은 지식과 기술을 인간 생활에 응용하는 연구를 담당합니다.","의학, 약학, 화공, 환경공학 등의 전문가들과 협동하여 유전자 재조합, 생물 공정 등 이미 개발된 기술을 습득하고 새로운 생물공학기술을 개발하는 연구를 수행합니다.","DNA 조작을 통해 신물질 개발 실험을 하거나, 실험동물의 체세포나 혈액을 분리 및 조작하는 실험을 통해 새로운 생물의약품, 생물화학제품, 바이오식품 등의 신제품을 개발합니다."],aptitude:"이학 전문직"},476:{name:"무선주파수(RF)엔지니어",wage:4325,from:"워크넷",basis:"통신기술개발자",year:2021,sat:"75.5",works:["무선주파수(RF)엔지니어는 무선주파수(RF: Radio Frequency)를 이용하여 무선통신 장비들을 연구, 개발, 설계하는 일을 합니다.","국내외 시장을 조사하고 경쟁하는 기업의 제품 및 무선통신 장비 관련 기술 변화 등에 대해 분석하여, 새로운 기능과 성능을 갖춘 무선통신 장비를 기획하고 개발합니다.","꾸준한 실험과 검사를 통해 새롭게 개발한 무선통신 장비의 성능과 품질을 검사하고 장비의 결함이나 불량의 원인에 대해 분석하여 해결책을 제시합니다."],aptitude:"공학 전문직"},345:{name:"패션코디네이터",wage:3250,from:"워크넷",basis:"메이크업아티스트 ",year:2021,sat:"66.2",works:["패션코디네이터는 방송이나 공연의 성격, 연예인의 취향을 고려하여 어울리는 의상과 소품(장신구 등)을 준비하고, 준비한 의상과 소품이 잘 조화될 수 있도록 연출하는 일을 합니다.","드라마나 영화의 등장인물의 성격과 외모를 분석하고, 이를 방송 연출자와 배우와 상의하여 의상 연출 방향을 결정합니다.","결정된 의상 연출 방향에 알맞은 의상이나 소품(액세서리 등)을 준비하고, 필요에 따라서는 직접 의상을 제작하기도 합니다.","패션 경향에 대한 정보를 수집하고, 고객의 외모나 성격, 직업 등에 알맞은 의상이나 소품(장신구, 액세서리 등)을 추천하고 연출합니다."],aptitude:"디자인 관련직"},10031:{name:"클라우드 시스템 엔지니어",wage:null,from:null,basis:null,year:null,sat:null,works:["클라우드 시스템 엔지니어는 인터넷의 서버에 각종 컴퓨터 프로그램을 올려 놓고 여러 이용자들이 인터넷에 접속하여 데이터를 저장하고 처리할 수 있는 기술을 개발합니다.","‘클라우드(cloud)’는 인터넷에 존재하는 클라우드 인프라 위에서 작동되는 소프트웨어를 이용해 컴퓨터 자원을 사용하거나, 자료를 저장하거나, 새로운 애플리케이션을 개발하는 가상의 환경을 말합니다.","클라우드 기술을 통해 우리는 인터넷 공간에 프로그램과 데이터를 저장해 두고 언제 어디서나 필요할 때마다 다양한 기기(컴퓨터/핸드폰/태블릿피시)를 통해 편리하게 사용할 수 있습니다.","고객 회사가 각자 가지고 있는 시스템과 응용 소프트웨어를 분석하여, 고객 회사의 시스템이 클라우드 환경으로 자연스럽게 바뀔 수 있도록 기술지원을 제공합니다."],aptitude:"공학 전문직"},215:{name:"물류관리사",wage:3305,from:"워크넷",basis:"물류사무원",year:2021,sat:"62.4",works:["물류관리사는 물류에 관한 전문 지식을 바탕으로 화물의 수송, 보관, 짐을 싣고 내리는 하역, 포장 등의 물류체계를 합리적으로 구축하거나 이에 대한 상담과 자문 업무를 담당합니다.","물류의 이동, 보관, 비용 등을 분석하고 분석 결과를 바탕으로 기업의 물류관리와 물류 지원 시스템을 가장 합리적이고 경제적으로 실행할 방법을 설계하고 실행합니다.","지역별, 국가별 경제 및 물류산업의 동향을 조사 및 분석하고, 기업의 물류관리 합리화 방안 등 물류 산업과 기업 물류에 관해 연구합니다.","기업의 합리적 물류체계의 구축 및 물류비 절감 방안 등에 대한 자문 업무를 수행합니다."],aptitude:"금융 및 경영 관련직"},1124:{name:"혼례종사원",wage:2279,from:"워크넷",basis:"혼례종사원",year:2021,sat:"56.4",works:["혼례종사원은 결혼식의 원활한 진행을 위해 의자, 카펫 등을 정리하고 필요한 자료와 물품을 준비하는 등의 일을 담당합니다.","예식 진행 과정을 관찰하여 신랑, 신부의 의상과 행동을 교정해주고, 결혼식순을 도와줍니다.","결혼식 행진 연주자, 전문 주례사를 주선하며, 때에 따라서 직접 연주를 하거나 주례를 담당하기도 합니다.","결혼식장 사용에 대한 고객의 질문에 응하고, 결혼식장 사용 비용을 계산합니다."],aptitude:"매니지먼트 관련직"},87:{name:"석공",wage:3626,from:"워크넷",basis:"건축석공",year:2021,sat:"59.4",works:["석공은 1차적으로 가공된 석재를 건축 내ㆍ외장재, 석축용 석재 또는 생활도구나 기념품 등의 목적에 따라 자르고, 다듬고, 만드는 일을 담당합니다.","1차 가공된 석재를 지정된 위치나 번호, 크기, 색상, 형태에 따라 선별합니다.","다양한 장비를 사용하여 석재의 위치 상태와 무늬, 형태를 점검합니다.","석재가 변색되거나 분열되는 등의 하자가 발생하면 보수작업을 수행합니다."],aptitude:"기능직"},481:{name:"교장",wage:8184,from:"워크넷",basis:"중고등학교교장및교감",year:2021,sat:"79.5",works:["교장은 초등학교나 중학교, 고등학교, 특수학교를 대표하는 책임자로서 학교의 교육, 행정 및 기타 운영 활동에 관련된 모든 제반 사항을 기획하고 조정하는 일을 합니다.","학교의 교육 목적을 효율적으로 달성하기 위한 활동들을 계획하고 학급의 규모를 결정하며 교사와 강사들의 교육 활동을 기획하고 감독합니다.","학교의 모든 행정 사항 및 기타 운영 활동들과 관련된 사항들을 감독합니다.","학교의 예산을 절차에 맞게 사용하고, 교사 및 학교 직원의 모집과 채용에 관여하는 등 인사와 행정에 관련한 일을 합니다."],aptitude:"인문계 교육 관련직"},346:{name:"편집기사",wage:3750,from:"워크넷",basis:"영상·녹화·편집기사",year:2021,sat:"68.6",works:["편집기사는 영화, 방송에 쓰이는 영상을 대본(시나리오)에 맞게 편집하는 일을 담당합니다.","대본을 검토하여 드라마나 영화의 분위기와 흐름 등을 파악합니다.","대본과 촬영 순서에 따라 영상을 관찰하고 편집 순서를 검토하여 작품의 분위기를 고려하면서 영상을 편집합니다."],aptitude:"영상 관련직"},10032:{name:"빅 데이터 전문가",wage:4455,from:"워크넷",basis:"빅데이터분석가",year:2021,sat:"75.3",works:["빅 데이터 전문가는 대량의 빅 데이터로 사람들의 행동이나 시장의 변화 등을 분석하는 데 도움이 되는 정보를 제공합니다.","구체적으로는 데이터 수집, 데이터 저장 및 분석, 데이터 시각화 등을 통한 정보 제공을 담당합니다.","실시간으로 데이터를 수집·저장·분석하고 시각화하여 의미 있는 분석 결과를 도출하기도 합니다.","빅 데이터와 관련된 새로운 기술, 유행 등을 수시로 파악합니다"],aptitude:"공학 전문직"},217:{name:"보험계리인",wage:6200,from:"워크넷",basis:"보험상품개발자",year:2021,sat:"76.3",works:["보험계리인은 보험 및 연금 분야 지식을 바탕으로 수학적인 방법을 적용해서 위험의 평가와 분석을 통하여 불확실한 사실을 종합적으로 해결하는 업무를 수행합니다.","보험, 연금, 퇴직연금 등에 대한 보험료 및 보상 지급금을 계산하고 금리 변동률, 영업비용과 회사 이익 등을 고려하여 보험 상품을 개발하며 보험회사의 전반적인 위험을 평가하고 진단합니다.","통계 기법을 활용해서 위험률을 고려하여 보험료를 계산하고 보험률의 산정과 조정 및 검증 업무를 수행합니다.","보험 및 연금 계획을 설계하거나 검토하고 시장 상황을 고려한 합리적인 요금의 정도 비율 산정, 보험금 평가 및 산정 등의 업무를 수행합니다."],aptitude:"금융 및 경영 관련직"},1125:{name:"선박 및 열차객실승무원",wage:3358,from:"워크넷",basis:"열차객실승무원",year:2021,sat:"74.3",works:["선박ㆍ열차객실승무원은 선박이나 열차에서 승객에게 음료나 간단한 식사를 제공하는 등 승객이 안전하고 편안하게 여행할 수 있도록 승객의 각종 편의를 도모합니다.","선박이나 열차의 출발 전, 승객에게 자리 또는 선실을 안내하고 열차ㆍ선박의 목적지, 여행시간, 주의사항 등을 공지합니다.","승객의 탑승 인원을 확인하고, 운행, 노선, 일정 및 편의 시간 등에 관한 승객의 질문에 응대합니다.","간단한 식사나 음료를 제공하며 요금을 수령하기도 합니다."],aptitude:"일반 서비스직"},88:{name:"석유화학기술자",wage:5090,from:"워크넷",basis:"석유화학공학기술자및연구원",year:2021,sat:"73.4",works:["석유화학기술자는 석유와 천연가스의 가공처리 과정에서 온도와 압력, 탱크 수위 등을 조절하기 위해 중앙제어장치를 조작하는 일을 합니다.","제조장치 운전 상태의 이상 여부를 일정한 시간마다 점검하고 확인한 내용을 기록합니다.","제조장치가 생산에 적합하게 운용되도록, 온도, 압력, 유출 속도, 반응 시간 등을 조절합니다.","제조공정 과정에서 생산 제품 샘플의 실험결과를 기록하고 불량 발생 시 필요한 조치를 취합니다."],aptitude:"공학 전문직"},539:{name:"소음진동기술자",wage:4144,from:"워크넷",basis:"소음진동기술자및연구원",year:2021,sat:"70.4",works:["소음진동기술자는 각종 공사 현장 등에서 기계 및 장비의 사용으로 인해 발생하는 소음과 진동을 측정하고, 생활환경을 오염시키는 소음과 진동을 최소화하거나 해소할 수 있는 방법에 대해 연구 및 개발하는 일을 합니다.","소음과 진동을 측정 및 분석하고 원인을 감소 또는 제거할 수 있는 방지시설이나 방법 등을 연구하고 개발합니다.","소음방지시설의 적합성을 검토하고 시공이나 운전상의 문제점 등을 점검하고 평가하며 이에 대한 해결책을 제시합니다."],aptitude:"환경관련 전문직"},347:{name:"악기수리원 및 조율사",wage:3815,from:"워크넷",basis:"악기제조원및조율사",year:2021,sat:"62.6",works:["악기수리원 및 조율사는 각종 악기의 파손된 부위를 수리하거나 조율합니다.","악기수리원은 악기를 연주 등을 통해 소리를 점검하여 파손된 부위를 확인한 후 결함이 있는 부분을 수리하고 결함이 있는 부품을 제거하거나 교체합니다.","조율사는 악기의 수리, 음색을 바로잡는 정음 등의 작업을 담당합니다."],aptitude:"악기 관련직"},10033:{name:"크라우드 펀딩 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["크라우드 펀딩은 군중 또는 다수를 의미하는 영어 단어 크라우드(crowd)와 자금 조달을 뜻하는 펀딩(funding)을 조합한 용어입니다.","회사를 새로 시작하기 위해 자금이 필요한 사람이 중개업자를 통해 온라인에서 다수의 소액 투자자로부터 자금을 얻는 것을 크라우드 펀딩이라 합니다.","크라우드 펀딩 전문가는 크라우드 펀딩 중개를 담당하는 금융 투자업자로서, 고객의 재산을 직접 맡아서 관리하지 않고, 자금이 필요한 사람과 자금을 투자하고 싶은 사람 사이를 중개하는 역할을 수행합니다."],aptitude:"금융 및 경영 관련직"},219:{name:"부동산중개인",wage:3833,from:"워크넷",basis:"부동산중개인",year:2021,sat:"68.9",works:["부동산중개인은 부동산과 관련된 법률적 지식을 바탕으로 아파트, 건물, 토지 등에 대하여 팔기를 원하는 사람과 사려고 하는 사람 간의 매매, 교환, 임대차, 기타 권리의 이익과 손해(득실)변경에 대한 행위를 알선 또는 중개하고 일정한 보수를 받습니다.","부동산을 팔기를 원하는 사람에게 중개를 의뢰받으면 해당 부동산의 지번, 대지, 건평, 방 개수, 매도 희망액 등을 파악하여 정리합니다.","고객에게 알맞은 부동산을 선정하여 고객과 함께 해당 부동산을 답사하여 팔기를 원하는 사람(매도자)과 사려고 하는 사람(매수자) 간의 매매 희망 가격을 조정하고 계약이 성립되도록 주선합니다.","계약이 성립되면 매매계약서에 매매대상물의 양도 일시, 매매 조건과 단서 조항을 기재하고, 계약 일시와 매도자, 매수자, 중개인의 인적 사항을 서명, 날인합니다."],aptitude:"영업관련 서비스직"},1126:{name:"치어리더",wage:2950,from:"워크넷",basis:"대중무용수",year:2021,sat:"62.8",works:["치어리더는 운동 경기장에서 흥겨운 음악이나 구호에 맞추어 춤을 추면서 관중의 흥과 응원을 유도하는 일을 담당합니다.","경기를 관람하러 온 사람들이 함께 즐겁게 응원을 할 수 있도록 팀의 특색이나 취향을 살린 응원 안무나 구호를 고안하고, 안무나 구호에 맞춰 춤을 춥니다.","관중들이 구호나 선수들의 이름을 외치도록 유도합니다."],aptitude:"무용 관련직"},90:{name:"조선공학기술자",wage:4860,from:"워크넷",basis:"조선·해양공학기술자",year:2021,sat:"75.1",works:["조선공학기술자는 선박과 해저자원의 탐사 및 채굴을 목적으로 하는 해양구조물을 연구하고 해양구조물의 시공 및 관리 등과 관련된 일을 담당합니다.","선박설계의 원리, 선박설계의 환경조건 등의 조선공학기술을 바탕으로 선박 및 해양구조물을 설계하고 건조합니다.","선박의 기본적인 특성, 구조 등을 개발, 연구하고 선박 및 해양구조물을 설치하기 위하여 설계계획안, 설계서 등의 관련 자료를 검토하고 분석합니다.","새로운 선박 및 해양구조물의 설계 및 선박 생산과정의 고능률화와 자동화를 위한 시스템 시뮬레이션 기술을 개발하고 실제에 적용하기 위한 연구를 합니다."],aptitude:"공학 전문직"},592:{name:"크레인 및 호이스트운전원",wage:4455,from:"워크넷",basis:"크레인·호이스트운전원",year:2021,sat:"62.3",works:["크레인 및 호이스트운전원은 제품, 중간 소재, 자재 등의 무거운 재료나 화물을 필요한 위치와 목적에 따라 운반하기 위해 크레인이나 호이스트를 운전하는 일을 합니다.","작업지시서에 따라 이동시킬 물품이나 화물의 종류와 위치를 확인하고 안전을 확인하고 신호를 보내는 신호수와 통신 상태를 확인합니다.","작업 현장 주위의 상태와 주변 시설물 등을 확인하고 신호수의 신호에 따라 운반한 재료나 화물을 들어 올립니다.","재료나 화물의 고정 상태를 잘 확인한 후 작업의 목적에 따라 재료나 화물을 상승, 회전, 이동, 하강시켜 원하는 위치로 이동시킵니다."],aptitude:"일반운전 관련직"},348:{name:"학예사(큐레이터)",wage:3937,from:"워크넷",basis:"학예사",year:2021,sat:"76.1",works:["학예사(큐레이터)는 박물관이나 미술관에서 관람객을 위해 전시회를 기획하고 작품을 수집하며 관리를 담당합니다.","관람객들에게 소장품이나 자료에 대한 이해를 돕기 위해 교육 프로그램을 개발하고 실행합니다.","소장품과 관련된 학술적인 연구 업무를 수행합니다.","전시할 작품의 진위 여부를 판단하고, 소장 작품의 경우 훼손되지 않도록 관리를 담당합니다."],aptitude:"예술기획 관련직"},10034:{name:"사이버 평판 관리자",wage:null,from:null,basis:null,year:null,sat:null,works:["사이버 평판 관리자는 주로 온라인에서 개인이나 기업과 관련된 사람들의 평가나 만족/불만족 내용과 같은 평판을 감시합니다.","누군가가 의도적으로 만들어낸 좋지 않은 내용(악성 평판)을 해결합니다.","평판과 관련된 의견을 모으거나, 미리 좋지 않은 내용이 인터넷에 퍼지기 전에 대응할 수 있도록 자료를 수집하는 일을 합니다.","기업에 대한 나쁜 평판에 관해 체계적이고 조직적으로 대응하여 좋은 평판을 얻기 위한 방안을 찾습니다."],aptitude:"일반 서비스직"},222:{name:"생활설계사",wage:3626,from:"워크넷",basis:"보험모집인",year:2021,sat:"67.4",works:["생활설계사는 금융보험에 대한 지식을 바탕으로 보험 가입 대상자를 선정 및 방문하여 각종 보험 상품의 종류와 특성을 설명하고, 고객의 생활수준, 가족 상황, 건강상태, 미래 계획 등을 파악하여 적합한 보험상품을 권유하는 일을 합니다.","보험 가입 절차, 납입 방법, 보험료 지급 방식 등을 설명하고 계약서를 작성합니다.","성사된 보험계약은 영업점에 관련 서류를 제출하고 보험계약 체결을 신청한 사람에 대한 보험증서 발송 상황 확인 등의 사후 관리를 합니다.","고객의 절세 방법, 재산 증식을 위한 효율적 투자 방법 및 보험상품에 대한 상담 외 대출 상담 업무를 수행하기도 합니다."],aptitude:"영업관련 서비스직"},1127:{name:"접객원",wage:2493,from:"워크넷",basis:"홀서빙원",year:2021,sat:"53.1",works:["접객원은 레스토랑이나 호텔 등에서 고객에게 음식이나 음료의 주문을 받고, 각종 서비스를 제공하는 일을 담당합니다.","용모와 복장을 단정히 하여 고객을 맞을 준비를 하며, 청소를 하거나 집기를 준비하고 테이블 정돈을 합니다.","고객에게 자리를 안내하며 메뉴판을 제시하고, 고객의 질문에 답하거나 음식과 음료를 추천합니다.","주문된 음식이 나오면 고객에게 제공하고, 식사가 끝난 고객의 빈 그릇들을 정리합니다."],aptitude:"영업관련 서비스직"},92:{name:"선박정비원",wage:3867,from:"워크넷",basis:"선박정비원",year:2021,sat:"59.3",works:["선박정비원은 선박기계를 정비, 점검하고 선박의 고장 상태를 확인하며 수리합니다.","검사 기구를 이용하여 선박의 각 부분을 진단 및 점검하고, 고장의 위치나 범위, 고장의 정도 등을 확인합니다.","검사를 통해 파악된 고장 부위를 수리하고, 마모되거나 파손된 파이프, 철판 등의 부품을 새 부품으로 교체합니다.","연료, 오일 및 기타 보급품을 채우며 수리 부분의 작동상태를 최종 확인합니다."],aptitude:"기능직"},626:{name:"여행상품개발원",wage:3516,from:"워크넷",basis:"여행상품개발자",year:2021,sat:"68.2",works:["여행상품개발원은 새로운 여행 상품을 기획 및 개발하고 고객과 상담하는 일을 합니다.","여행지로 활성화되지 않은 지역을 찾아내어 현지답사를 한 다음, 여행에 필요한 상황과 조건을 조사 및 분석하여 새로운 여행지를 개발하고 상품화합니다.","여행과 관련된 모든 상황을 고려하여 여행 계획을 세우며, 이동을 위한 교통수단을 마련하며, 경비, 관광 명소, 숙박 및 편의시설, 편의성 등에 대한 정보를 수집하고, 여행 코스와 일정을 기획하고 총감독합니다.","고객과의 상담을 통해 여행자의 요구를 파악하고, 상품의 특징과 장점을 소개하거나 권유하며 여행 계획에 대해 전문적인 조언을 합니다."],aptitude:"기획서비스직"},349:{name:"화가",wage:3154,from:"워크넷",basis:"화가",year:2021,sat:"70.8",works:["화가는 물감, 먹물 등을 사용하여 인물화, 풍경화, 정물화, 추상화 등의 예술 작품을 창작합니다.","작품의 구도를 구상하고 유채, 수채, 연필, 파스텔, 먹물 등의 그림 재료를 선택하고, 캔버스, 나무판, 종이 등에 작품의 윤곽을 그립니다.","원하는 그림을 그리기 위해서 선, 공간, 크기, 색채, 원근, 농담 등의 시각적 요소를 활용합니다.","완성된 작품은 개인전이나 단체전을 통해 전시합니다."],aptitude:"미술 및 공예 관련직"},10035:{name:"사물 인터넷 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["사물 인터넷 전문가는 우리 주변에 있는 사람, 사물, 공간과 관련된 데이터를 인터넷으로 연결하여 새로운 정보가 생성·수집·공유·활용되도록 하고, 이를 통해 새롭게 가치 있는 것을 만들어 이전에 없던 편리함을 사람들에게 제공합니다.","우리 사회의 안전, 복지, 교통, 환경 등에서 문제점이 없는지 점검하고 더 편리하고 안전한 삶을 만들기 위하여 사물 인터넷 기술을 활용한 해결 방안을 찾습니다.","사물 인터넷 기술과 서비스를 판매하거나 구입할 수 있는 제품으로 만드는 역할을 합니다."],aptitude:"공학 전문직"},223:{name:"선물중개인",wage:5698,from:"워크넷",basis:"증권딜러",year:2021,sat:"73.4",works:["적정한 거래 시점을 파악하기 위해 국제 선물시장의 동향을 분석하여 고객에게 투자 상담 또는 시장 정보를 제공합니다.","기업체의 선물 주문을 해외시장에 중개하고 기업체의 희망 거래조건과 맞는 거래자를 찾아 연결해 계약을 체결하도록 돕습니다.","원자재 또는 상품을 안정적이고 경제적으로 확보할 수 있는 적절한 가격과 시기를 연구합니다.","선물중개인은 자산관리에 대한 지식을 바탕으로 원유, 농산물, 금, 은, 비철, 금속, 통화, 금리, 주가지수 등 선물로 거래되는 다양한 상품들을 일정 기간이 지난 다음에 인수할 것을 전제로 현재의 가격으로 미리 사거나 파는 일을 중개합니다."],aptitude:"금융 및 경영 관련직"},1128:{name:"주방보조원",wage:2486,from:"워크넷",basis:"주방보조원",year:2021,sat:"50.3",works:["주방보조원은 음식점, 학교, 레스토랑, 호텔 등에서 조리장이나 조리사의 지시에 따라 각종 조리 업무를 보조하는 일을 담당합니다.","야채, 과일, 고기 등의 음식 재료를 다듬으며, 칼, 도마, 국자 등 각종 조리 관련 기구를 세척합니다.","주방을 청소하고, 주방에서 배출된 음식물 쓰레기 등을 버립니다.","조리사의 지시에 따라 음식을 운반하거나 그릇들을 정리하기도 합니다."],aptitude:"조리 관련직"},97:{name:"시멘트제조원",wage:3937,from:"워크넷",basis:"시멘트·광물제품생산기계조작원",year:2021,sat:"60.0",works:["시멘트제조원은 석회석, 혈암, 석고 등의 재료를 혼합, 분쇄, 분말하는 기계를 조작하여 시멘트 제품 또는 콘크리트 제품을 제조하는 일을 담당합니다.","명세서 및 배합 비율에 따라 재료를 투입하고 혼합하는 장치를 조작합니다.","재료를 성형, 압출, 롤링하는 기계를 설치, 조작, 취급하고, 성형장치의 압력, 유출량, 컨베이어의 속도를 조정합니다.","완성제품을 측정, 계량, 검사하고 명세서와 비교하며, 기계장치를 세척하고 기능 장애를 탐지해 수리하며 생산기록을 작성하고 보관합니다."],aptitude:"기능직"},740:{name:"귀금속 및 보석세공원",wage:3626,from:"워크넷",basis:"귀금속·보석세공원",year:2021,sat:"68.9",works:["귀금속 및 보석세공원은 귀금속으로 장신구를 디자인하고 제작하는 일을 하거나 보석에 모양을 만들고 광택을 내는 일을 합니다.","원석의 가치와 순도, 물리적 구조, 색 등급 및 기타 관련 요소를 판단하기 위해 특성을 검사하는 일도 합니다.","디자인된 도면을 보고, 금, 은, 백금 등의 귀금속을 소재로 실톱대, 줄, 벼랑공구, 압연기 등 수공구 및 기계 기구를 사용하여 정확한 치수와 함량으로 금속 원형을 제작합니다.","귀금속 재료를 형틀에 부어 주조하거나 조각 및 용접하여 특정한 형태로 가공합니다."],aptitude:"기타 특수 예술직"},352:{name:"가사도우미",wage:2e3,from:"워크넷",basis:"가사도우미",year:2021,sat:"45.2",works:["가사도우미는 가정에 방문하여 청소, 요리, 세탁 등의 일을 합니다.","가정의 화장실과 거실 등 집 안을 청소하고, 정리 정돈을 합니다.","의복과 이불 등을 세탁하고 다림질합니다.","고용된 가정에 따라 음식을 만들고 공과금 납부, 우편물 보관 등의 가사 업무를 합니다."],aptitude:"일반 서비스직"},10036:{name:"생체 인식 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["생체 인식 전문가는 카메라, 스캐너 등의 센서 장치로 생체 정보(지문, 얼굴, 눈동자의 홍채, 정맥 등)를 파악하여, 이를 통해 본인임을 확인해 주는 장치를 만드는 일을 합니다.","본인 확인을 위해 사용될 영상 정보를 컴퓨터가 처리할 수 있는 상태로 저장하는 프로그램을 만듭니다.","지문이나 얼굴 등을 인식할 수 있는 인식기와 같은 하드웨어를 개발합니다."],aptitude:"공학 전문직"},224:{name:"세무사",wage:6750,from:"워크넷",basis:"세무사",year:2021,sat:"73.8",works:["세무사는 세무에 대한 법률적 지식을 바탕으로 세금에 대한 상담과 자문을 하고, 의뢰인을 대리하여 세무에 대한 각종 서류를 작성하여 세무서에 신고, 신청, 청구하는 등의 일을 합니다.","사업자의 사업 내용에 대한 회계장부 작성을 대행하고 각종 세무신고를 대신합니다.","세무 대리인으로서 신고서, 신청서, 이의신청, 심사 및 심판 청구서 등을 작성하여 과세 관청에 제출합니다.","공개적으로 알리는 땅값인 부동산의 개별공시지가와 주택가격 공시에 대한 이의신청을 대신합니다."],aptitude:"회계 관련직"},1129:{name:"요리배달원",wage:2850,from:"워크넷",basis:"음식배달원",year:2021,sat:"50.4",works:["요리배달원은 고객의 요구에 따라 주문한 요리를 고객이 원하는 장소까지 배달하는 일을 담당합니다.","음식이 포장되어 나오면 배달 장소를 확인하여 음식을 배달합니다.","오토바이, 자동차 등을 이용하거나 도보로 배달합니다.","고객에게 음식을 배달하면서 요금을 계산하고, 나중에 빈 그릇을 수거하기도 합니다."],aptitude:"일반운전 관련직"},98:{name:"신경회로망연구원",wage:4662,from:"워크넷",basis:"반도체공학기술자및연구원",year:2021,sat:"74.4",works:["신경회로망연구원은 영상 및 음성인식, 로봇 제어, 통신 등에 사용되는 인공지능형 반도체 및 응용기술을 연구하고 개발하는 일을 담당합니다.","인간의 뇌와 뇌세포 구조에 대한 지식을 바탕으로 컴퓨터나 로봇 등이 인간과 같이 사고하고 학습하는 능력을 갖도록 하는 프로그램을 개발하고 연구합니다.","영상인식, 음성인식, 로봇제어, 표적인식, 통신 등에 사용되는 응용기술을 연구합니다."],aptitude:"공학 전문직"},795:{name:"호텔지배인",wage:5491,from:"워크넷",basis:"여행·호텔관리자",year:2021,sat:"73.5",works:["호텔지배인은 객실 예약과 판매, 고객 안내, 식당 운영, 호텔 홍보 등 호텔에서 이루어지는 다양한 업무들이 잘 운영될 수 있도록 각종 활동을 계획하고, 호텔 종사원의 업무를 종합적으로 관리 및 감독하는 일을 합니다.","객실부, 연회부 등 각 부서 소속 호텔 종업원의 작업 계획을 만들어 업무가 원활히 운영될 수 있도록 관리 조정하고, 호텔 종업원에게 효과적인 작업 방법을 교육하고 훈련시킵니다.","호텔의 객실이나 연회, 회의실 등 매출을 높이기 위한 영업 전략을 만들고 호텔 서비스의 향상 및 청결 유지를 관리 감독하고 고객의 불편 사항을 처리합니다.","회의, 연회, 각종 행사 등 다양한 목적을 위해 사용되는 시설에 대한 고객의 요구 사항을 파악하여 고객 맞춤 서비스를 제공하는 업무를 합니다."],aptitude:"기획서비스직"},353:{name:"간병인",wage:2279,from:"워크넷",basis:"요양보호사및간병인",year:2021,sat:"63.8",works:["간병인은 병원, 요양소, 산후조리원 등에서 환자의 보호자를 대신하여 환자를 간호하고 돌보는 일을 합니다.","움직임이 불편한 환자를 목욕시키고, 환자가 이동할 때 휠체어를 밀어 주거나 함께 이동합니다.","환자의 체온, 맥박, 호흡수 등을 측정하고 기록하며, 환자가 먹는 음식 및 음료의 양과 내용을 체크하고, 필요에 따라서 환자에게 음식을 먹여 줍니다.","병실의 청소를 담당하는 등 환자 주변의 위생 상태를 관리하고, 환자의 안정을 위해 말벗이 되어 주기도 합니다."],aptitude:"보건의료 관련 서비스직"},10037:{name:"생물 정보 분석가",wage:null,from:null,basis:null,year:null,sat:null,works:["생물 정보 분석가는 생물의 유전자에서 출발해 단백질, 세포, 기관, 인간 전체에서 나오는 생물학적인 정보를 수집하여 데이터로 만들고, 이를 발전시키는 작업을 합니다.","이렇게 나온 정보를 비교 및 분석이 가능하도록 조직화하고, 조직화한 데이터를 다시 새롭게 만들거나 분석해서 연구자에게 제공하기도 합니다.","데이터를 분석해 새로운 현상을 발견하는 일도 하는데, 이때 그 도구로 컴퓨터 프로그램이나 언어를 활용하며, 이를 개발하는 과정에도 참여합니다."],aptitude:"공학 전문직"},226:{name:"손해사정사",wage:4662,from:"워크넷",basis:"손해사정사",year:2021,sat:"73.0",works:["손해사정사는 금융보험, 법률적 지식을 바탕으로 보험 가입자에게 사고로 인한 손해가 발생했을 때 그 손해액을 결정하고 보험금을 객관적이고 공정하게 계산하고 정하는 업무를 수행합니다.","사고 발생에 관한 정확한 자료를 수집하여 조사 및 분석하고, 보상 범위를 결정하기 위해 보상 협상 사무원의 보고서를 조사하며, 유사한 보험 사례나 판례들을 검토합니다.","사고 현장 조사와 손해 사실을 확인하며, 증거를 수집하여 실제 손해 정도를 판단합니다.","보상 청구의 타당성 여부를 확인하고 협상이 회사의 관례 및 절차에 따라 이루어졌는지 확인하며 보험금 청구의 적정성을 심사하기 위해 변호사, 의사 등의 자문을 구합니다."],aptitude:"회계 관련직"},1130:{name:"건설견적원",wage:4278,from:"워크넷",basis:"건축시공기술자및견적원",year:2021,sat:"65.3",works:["건설견적원은 도로, 교량, 건축구조물, 전기 및 기계 설비 등의 공사 비용을 분석하고 이에 대한 견적서를 작성하는 일을 담당합니다.","시장가격, 설계 도면, 각종 내역서에 기초하여 건설사업에 필요한 자재, 노동력, 장비 등에 대한 비용 견적서를 작성합니다.","입찰 방법, 경쟁업체 등을 파악하고, 관련 자료 분석을 통해 낙찰 가능한 입찰 금액을 계산합니다.","공사 규모에 따라 필요한 인력의 비용을 고려하여 전체적인 공사비를 산출하고, 입찰과 관련된 서류를 작성합니다."],aptitude:"공학 기술직"},100:{name:"압연원",wage:3833,from:"워크넷",basis:"금속가공기계조작원",year:2021,sat:"57.8",works:["압연원은 금속재료를 회전하는 2개의 롤(roll) 사이로 통과시켜 여러 형태로 금속재료를 가공하는 일을 담당합니다.","압연 과정과 관련된 장치를 운전하여 금속재료를 원하는 치수와 형상, 기계적 성질을 갖춘 제품으로 가공합니다.","압연 과정을 거쳐 생산된 제품이 적절하게 가공되었는지를 검사합니다."],aptitude:"기능직"},834:{name:"시스템소프트웨어개발자",wage:3730,from:"워크넷",basis:"시스템소프트웨어개발자",year:2021,sat:"70.5",works:["시스템소프트웨어개발자는 컴퓨터를 작동시키고 각 부품의 활동을 조정, 통제, 관리하는 윈도우, 맥, 리눅스와 같은 오퍼레이팅시스템 소프트웨어를 연구, 개발, 설계하는 일을 합니다.","국내외의 시장을 조사하고 경쟁기업의 제품 및 소프트웨어 업계의 기술 변화 등을 분석하여 새로운 기능과 성능을 갖춘 시스템소프트웨어를 기획하고 개발합니다.","개발된 시스템소프트웨어를 컴퓨터에 설치 및 시험 운영하여 시스템소프트웨어의 기능과 성능을 평가하고 분석합니다.","시스템소프트웨어에 대한 사용자 교육과 기술에 대한 전문적인 조언을 하고 새로운 시스템소프트웨어 관련 기술을 조사하고 연구합니다."],aptitude:"IT관련전문직"},354:{name:"간호사",wage:3665,from:"워크넷",basis:"간호사",year:2021,sat:"76.3",works:["간호사는 의사의 진료를 돕고, 의사의 처방이나 규정된 간호 기술에 따라 치료를 하고, 환자나 가족에게 치료와 질병에 대해 설명을 하고 전문적인 의료 활동을 수행합니다.","의사가 없을 경우 비상조치를 시행할 수 있으며, 의사의 진료를 도우며 의사의 처방이나 규정에 따라 치료를 합니다.","환자의 상태를 파악하기 위해 혈압, 체온 등을 측정하고, 약품을 투여하거나 외상 치료를 하면서 환자의 상태와 반응을 관찰합니다.","수술하는 의사를 돕고, 간호 활동에 대한 기록을 수집하여 관련 문제에 대해 조언을 하기도 합니다."],aptitude:"보건의료 관련 서비스직"},10038:{name:"로봇 윤리학자",wage:null,from:null,basis:null,year:null,sat:null,works:["로봇 윤리학자는 로봇을 어떻게 만들어야 하며, 어떤 로봇이 윤리적으로 바람직하지 않은가에 대해 질문하고 여기에 대해 답을 찾는 연구를 합니다.","로봇이 작동하여 발생한 결과에 대해 도덕적인 관점에서 판단 기준을 만듭니다.","만일 로봇이 잘못해서 피해가 발생했다면 로봇을 만든 사람, 로봇의 주인, 로봇 사용이나 관리를 감독해야 하는 정부 중에서 누구를 어느 정도로 처벌해야 하는지 윤리나 법적인 면에서 따져 보는 일을 합니다.","로봇이 물건을 생산하거나 서비스를 했을 때 발생하는 부가가치에 대한 세금을 부과해야 한다는 목소리가 높아지고 있어 이를 깊이 따져 보는 일을 하기도 합니다."],aptitude:"공학 전문직"},230:{name:"시장 및 여론조사전문가",wage:4376,from:"워크넷",basis:"조사전문가",year:2021,sat:"70.7",works:["시장 및 여론조사전문가는 통계학, 경제학, 사회학 및 심리학 등의 전문 지식을 바탕으로 특정 상품이나 여론 및 선거, TV 시청률 등에 대한 조사와 연구를 실시하고, 조사 결과를 분석하여 보고서로 작성하는 일을 합니다.","의뢰인과 용역의 특성에 따라 조사 계획안을 수립하여 표본추출과 조사 방식, 조사 규모 등을 확정합니다.","개인 또는 전화조사, 인터뷰, 설문조사 등의 진행 과정을 감독합니다.","시장조사전문가는 특정 상품에 대한 소비자의 선호도를 조사하고 분석하여 마케팅 전략 결정에 필요한 기초 자료를 제공합니다."],aptitude:"금융 및 경영 관련직"},1131:{name:"전통건축원",wage:4662,from:"워크넷",basis:"전통건축기능원",year:2021,sat:"66.9",works:["전통건축원은 전통 건축기법을 이용하여 한옥, 사원, 궁궐 등의 전통 건축물을 설계하고 시공하는 일을 합니다.","전통 건축물을 새로 짓거나 보수하기 위해 건축 설계도를 해석합니다.","전통 건축 기법을 이용하여 한옥, 사원, 궁궐 등의 전통 창호와 가구 등을 제작합니다.","나무로 된 건물을 세우기 위해 나무를 깎고 다듬으며, 건물의 기울어진 부분을 바로잡거나 전통 건축물의 기와를 잇거나 보수하는 업무를 수행합니다."],aptitude:"기능직"},101:{name:"영사기사",wage:3750,from:"워크넷",basis:"영상·녹화·편집기사",year:2021,sat:"68.6",works:["영사기사는 영화가 상영될 수 있도록 필름을 영사기에 연결하고 가동하는 일을 담당합니다.","영사기를 점검 및 가동하고 영사전등과 렌즈를 조절하며 음향 재생 장비를 조정합니다.","영화의 상영이 끝난 다음에는 필름을 되감고, 필름의 손상 여부를 확인해 이를 수선합니다."],aptitude:"영상 관련직"},911:{name:"조명기사",wage:4020,from:"워크넷",basis:"조명기사",year:2021,sat:"66.2",works:["조명기사는 연극, 영화, 무용, 뮤지컬, 콘서트, 방송 드라마 등의 제작을 위해 조명 장치를 설치하고 조종하는 일을 합니다.","무대에 올릴 작품의 내용, 제작 의도, 성격 등을 정확하게 파악한 다음 대본이나 기본 설계도를 보고 조명 감독과 협의하여 조명 계획을 세웁니다.","무대 공연에서 출연자의 움직임에 따라 집중 조명 설비를 조작하거나 조명의 밝기, 조명 사용 시간, 조명 색상 등을 조정합니다.","영화나 방송 촬영 현장의 상황에 따라 축전지 또는 발전기의 사용 여부를 결정하고 투광조명기, 반사판, 집중조명 등을 배치하고 조명 장비를 설치합니다."],aptitude:"영상 관련직"},355:{name:"간호조무사",wage:2590,from:"워크넷",basis:"간호조무사",year:2021,sat:"64.0",works:["간호조무사는 의료기관 등에서 의사 또는 간호사의 지시에 따라 환자의 간호 및 진로에 관련된 업무를 보조합니다.","환자가 병원에 방문하였을 때 안내해 주고, 각종 의료 검사 및 투약 업무를 보조합니다.","의사나 간호사의 지시에 따라 환자를 치료하고 치료 내용을 기록하며, 환자의 체온, 맥박, 호흡수 등을 측정하며 간호를 보조합니다.","병원에서 사용하는 의약품을 관리하며, 의료 기구나 물품 등을 소독하고 살균하는 업무를 수행합니다."],aptitude:"보건의료 관련 서비스직"},10039:{name:"드론 전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["드론(drone)은 조종사 없이 무선으로 비행 및 조종이 가능한 비행기나 헬리콥터 모양의 무인 항공기를 말하며, 드론 전문가는 세부적으로 드론 개발자와 드론 조종사를 포함합니다.","드론 개발자는 드론의 비행을 제어하는 소프트웨어를 개발합니다. 또한 드론을 이용해 촬영, 스포츠, 관측, 감시, 정보 통신, 광고, 배달 등 다양한 응용 분야에서 임무를 수행하는 데 필요한 응용 장치를 연구개발 합니다.","드론 조종사는 지상에서 원격조종을 통해 미리 정해둔 대로 자동 또는 반자동으로 드론을 조종합니다. 또한 지상 통제 장비(GCS: Ground Control System), 통신 장비 및 지원 장비 등의 시스템을 운영·통제합니다."],aptitude:"공학 전문직"},231:{name:"신용조사원",wage:5950,from:"워크넷",basis:"신용분석가",year:2021,sat:"72.3",works:["신용조사원은 경영과 경제적 지식을 바탕으로 기업이나 개인의 경영 상태와 신용도를 파악합니다.","의뢰자로부터 개인이나 기업체에 대한 신용조사 의뢰를 하고, 조사 대상 업체의 문제점과 중점적으로 조사할 내용을 판단합니다.","신용조사 대상자와 직접 면접을 하고, 조사 대상자의 신용 상태에 대한 자료를 수집하고 분석한 후 평가합니다.","신용조사 대상자의 분석 결과를 바탕으로 조사 개요, 현황, 전망, 재무 상태, 은행거래 상황 등을 기록하는 신용평가 자료를 최종적으로 작성하여 신용조사 의뢰자에게 제공합니다."],aptitude:"금융 및 경영 관련직"},1132:{name:"단열원",wage:3833,from:"워크넷",basis:"단열공",year:2021,sat:"59.1",works:["단열원은 건물 벽, 보일러, 파이프 등의 단열재를 시공하여 건물 구조물의 열기 및 냉기의 손실을 막고 외부로부터의 소음을 최소화하는 일을 담당합니다.","작업 대상물에 따라 재료와 시공 방법을 결정하고 작업 계획을 세웁니다.","시공을 위해 적합한 단열재를 선택하여 준비합니다.","준비한 단열재를 각종 도구를 사용하여 적합한 크기로 절단하여 건물 벽, 파이프, 보일러 등의 표면에 시공합니다."],aptitude:"기능직"},102:{name:"용접원",wage:3500,from:"워크넷",basis:"용접원및용접기조작원",year:2021,sat:"60.4",works:["용접원은 각종 기계나 금속 구조물 및 압력 용기 등을 제작하기 위하여 금속과 비금속 재료를 용접기 등으로 열이나 압력을 가하여 접합합니다.","도면 또는 작업지시서를 검토하고 검토가 끝나면 용접물의 재료, 두께, 형태 등에 따라 용접 방법을 결정합니다.","용접 전에 용접 부위의 이물질을 제거하고 용접점을 표시한 후, 적절한 용접봉 및 기타 필요한 공구를 사용하여 접합부나 이음매를 용접합니다.","비파괴 검사기나 만능 시험기 등으로 작업 명세서와 비교하여 용접 부위의 이상 유무를 검사한 후, 결함이 있는 부위는 보수 용접을 하여 마무리합니다."],aptitude:"기능직"},914:{name:"영화시나리오작가",wage:2500,from:"워크넷",basis:"영화시나리오작가",year:2021,sat:"63.3",works:["영화시나리오작가는 영화 제작을 위해 작품의 주제를 선정하고, 새로운 영화 대본을 창작하거나 기존의 작품(문학, 웹툰, 드라마 등)을 각색하여 대본을 집필합니다.","영화의 주제를 선택하고 내용에 따른 역사적 사실이나 사건의 과정 등을 세밀하게 조사 및 분석하여 작품의 전체 줄거리를 구상합니다.","영화 및 애니메이션 제작을 위해 작품의 주제를 선택하고 주인공이나 등장인물의 성격, 시대적 배경과 장소 등을 결정합니다.","작품의 내용에 따른 등장인물, 시대, 장소 등을 결정하고 영화의 진행에 필요한 대사 내용이나 동작 등을 구상합니다."],aptitude:"작가 관련직"},356:{name:"청소원",wage:2200,from:"워크넷",basis:"청소원",year:2021,sat:"50.3",works:["청소원은 건물의 내부와 외부, 거리 및 기타 공공장소, 운송장비(자동차, 항공기, 선박 등) 등의 청소와 관련된 업무를 담당합니다.","건물청소원은 빌딩, 병원, 상가, 아파트, 호텔, 미술관 등의 내부 및 외부를 청소합니다.","환경미화원은 거리, 공원 등의 공공장소를 청소합니다.","운송장비 청소원은 승용차, 버스, 항공기, 선박, 기관차 등의 운송장비의 외부를 세척하거나 내부의 쓰레기를 청소합니다."],aptitude:"일반 서비스직"},10040:{name:"손실방지전문가",wage:null,from:null,basis:null,year:null,sat:null,works:["손실방지전문가는 기업의 손실을 줄이고 안전을 유지하기 위해 시스템을 관리하는 업무를 수행합니다.","기업의 자산, 자금, 물품 등을 확인하고 손실을 최소화하기 위한 전략을 세우고 방법을 구현합니다.","고객과 직원의 안전 확보 방법, 상대하기 어려운 고객이나 미아 발생 시 대처 방법 등에 관한 전략을 세웁니다.","기업 내부에서 상품이 사라지지 않도록 관리, 감독합니다."],aptitude:"금융 및 경영 관련직"},232:{name:"광고 및 홍보전문가",wage:4248,from:"워크넷",basis:"광고·홍보·마케팅전문가",year:2021,sat:"69.2",works:["광고 및 홍보전문가는 광고 기획, 마케팅에 대한 지식을 바탕으로 광고물을 제작하고 광고 행사를 기획하며 상품 판매 전략을 수립하고 홍보물을 제작합니다.","광고전문가는 광고할 상품이나 용역에 대해 조사 및 분석하여 광고 기획서를 작성합니다. 광고의 제작 방향과 소요되는 예산을 수립하고 조정하며 상품의 경쟁 상황, 시장상황, 판매 기간 등에 대한 자료와 광고매체에 대한 효과를 분석하여 광고를 제작합니다.","홍보전문가는 기업의 명성이나 이미지와 같이 눈에 보이지 않는 기업의 자산을 그 조직의 성격과 특성에 맞도록 전문적으로 홍보하고, 홍보 프로그램을 연구하여 자문합니다.","기업 혹은 상품 등의 광고 계약 체결부터 제작 완성까지 광고 제작의 모든 과정을 지휘합니다."],aptitude:"언어 관련 전문직"},1133:{name:"유리부착원",wage:3626,from:"워크넷",basis:"유리부착원",year:2021,sat:"63.2",works:["유리부착원은 건축물의 창문, 문, 진열장, 기타 틀에 부착할 각종 유리를 절단하고 부착합니다.","건물 도면을 보거나 유리를 부착할 건축물을 직접 검토하고 의뢰인과의 협의를 통해 유리의 종류와 디자인을 결정합니다.","다양한 수공구와 작업보조구를 사용하여 유리를 절단하고 연마하여 틀에 유리를 끼우고 마감재로 이음매 부분을 막아 유리를 고정시킵니다.","유리 부착 작업이 완료된 후에는 잘못된 부분이 없는지 확인하고 수정합니다."],aptitude:"기능직"},104:{name:"원자력연구원",wage:5450,from:"워크넷",basis:"원자력공학기술자",year:2021,sat:"77.3",works:["원자력연구원은 사람들과 산업체에 에너지를 제공하기 위해 사용되는 원자력의 안전한 이용 방법에 대해 연구하고 개발합니다.","안전성과 경제성을 지닌 새로운 원자력 에너지를 연구ㆍ개발하며, 원자력 발전소의 안전성을 평가합니다.","방사선 폐기물의 안전한 처리 방법에 대해 연구하고, 방사선을 의학용, 농업용 등으로 이용할 수 있는 기술을 개발합니다.","화학, 생물 등의 기초 분야 및 인공지능, 신소재 개발과 같은 여러 분야와 원자력 기술을 접목하는 연구를 수행합니다."],aptitude:"공학 전문직"},915:{name:"음향기사",wage:3937,from:"워크넷",basis:"음향·녹음기사",year:2021,sat:"66.9",works:["음향기사는 세상에 존재하는 수많은 소리들을 이용해 영화나 드라마의 영상과 음원에 잘 어울릴 수 있도록 음향 장비를 다루고 조작하는 일을 합니다.","감독이나 연출자의 의도에 따라 음향 연출 방향을 정하고, 촬영장에서 동시에 녹음된 자료를 받아 편집실에서 화면상의 입 모양을 보고 대사를 알맞게 교정하거나 불필요한 잡음을 제거합니다.","적합한 음향을 연출하기 위하여 고음, 중음, 저음을 조작하고 각각의 음색을 혼합하는 장치인 이퀄라이저를 사용하여 조절하거나 혼합합니다.","특수 효과음을 영화나 드라마에 알맞게 가공하여 삽입하거나 음악 감독을 통해 각 영상에 알맞은 배경음악을 받아 영상에 녹음하는 작업을 수행합니다."],aptitude:"음악 관련직"},358:{name:"경비원",wage:2486,from:"워크넷",basis:"경비원",year:2021,sat:"48.8",works:["경비원은 아파트, 주택, 사무실 등 각종 건물 및 시설물을 관리하며, 건물 내의 거주자들을 화재, 도난, 불법침입으로부터 보호하기 위해 출입자 통제, 내방객 안내 등의 업무를 담당합니다.","건물에서 방문자의 출입을 점검하고 입주자에게 필요한 정보를 제공합니다.","건물을 관리하며 간단한 수선 및 정비를 합니다.","소음 및 공동생활에 문제를 일으킬 수 있는 행동을 하는 사람에게 그러한 행동을 하지 못하도록 합니다."],aptitude:"일반 서비스직"},10041:{name:"소비생활어드바이저",wage:null,from:null,basis:null,year:null,sat:null,works:["소비생활어드바이저는 기업, 행정 기관, 각종 단체 등의 상담 창구에서 소비자 불만 상담에 응하고, 소비자 의견, 동향 등을 파악하여 상품, 서비스를 개발하고 개선하는 업무를 수행합니다.","상품, 서비스에 관한 상담과 조언을 합니다.","제품 성능, 안전성 등 사용 목적에 따라 쇼핑 상담과 조언을 합니다.","상품 설명서와 같은 각종 자료 작성, 상품 테스트, 모니터링 등을 수행합니다."],aptitude:"기획서비스직"},233:{name:"외교관",wage:6717,from:"워크넷",basis:"정부행정관리자",year:2021,sat:"81.8",works:["외교관은 본국을 대표하여 외국에 파견되어 외국과의 교섭을 통해 정치, 경제, 상업적 이익의 보호와 증진을 추구하며, 해외동포와 해외여행을 하는 자국민을 보호합니다.","부임한 나라의 정치적 사건과 상황을 본국에 보고하며, 경제 통상 정보, 생활 정보 등을 수집 및 분석하여 본국의 정부나 기업에 알립니다.","본국을 대신해 본국의 이익과 정책을 옹호하는 교섭을 하고, 본국의 전통 및 문화를 알리는 문화 홍보 활동을 합니다.","본국과 주재국과의 우호 관계를 증진시키고, 양국 간의 경제적, 문화적, 과학적 관계를 발전시키는 역할도 합니다."],aptitude:"법률 및 사회활동 관련직"},1134:{name:"메카트로닉스공학기술자",wage:5100,from:"워크넷",basis:"건설기계공학기술자및연구원",year:2021,sat:"78.0",works:["메카트로닉스공학기술자는 의복, 식품, 자동차, 항공기 등 각종 제품들의 생산과정을 자동화하는 설비 기술을 연구하고 개발합니다.","생산 현장을 조사하고 각종 자료 수집과 공정 분석을 거쳐 공장의 자동화 계획을 수립하고 지도합니다.","논리제어기, 마이크로프로세서 등의 관련 기술을 적용하여 자동화 설비를 설계하고 개발합니다.","기업체 등의 의뢰를 받아 최적의 방법으로 공장의 생산 설비를 자동화하기 위하여 최신 제조기술, 자동화기술 등에 대하여 자문합니다."],aptitude:"공학 전문직"},106:{name:"유리제품제조원",wage:3626,from:"워크넷",basis:"유리·유리제품생산기계조작원",year:2021,sat:"60.6",works:["유리제품제조원은 규석, 석회석 등의 재료를 가공하여 유리 및 각종 유리 제품을 만드는 일을 담당합니다.","규석, 석회석 등의 재료를 원료 배합기에 넣고 섞은 다음, 배합된 원료를 용해로에서 열을 가해 녹입니다.","배합된 원료의 용해된 상태를 점검하고 적정 온도를 맞추어 원료를 원하는 모형의 유리 제품으로 만듭니다.","성형 작업을 마친 유리 제품을 냉각한 다음, 완성된 유리 제품의 품질과 결함 등을 검사합니다."],aptitude:"기능직"},916:{name:"특수효과기술자",wage:3400,from:"워크넷",basis:"분장사",year:2021,sat:"66.4",works:["특수효과기술자는 방송이나 영화에서 연출의 효과를 높이기 위해 컴퓨터 그래픽 프로그램을 이용해 다양한 배경과 특수효과들을 만드는 일을 합니다.","촬영이 끝난 영화나 방송 내용이 담긴 촬영 자료를 받아, 장면 하나하나를 보면서 특수효과를 넣거나 가공할 부분을 찾습니다.","특수효과 의뢰인과의 회의를 통해 원하는 특수효과가 무엇인지를 먼저 파악하고, 컴퓨터 그래픽 프로그램(CG)을 활용하여 현실에서 촬영이 불가능한 액션이나 효과가 포함된 영상을 만듭니다."],aptitude:"디자인 관련직"},359:{name:"경찰관",wage:3900,from:"워크넷",basis:"경찰관",year:2021,sat:"70.6",works:["경찰관은 국민의 생명과 재산을 보호하는 역할을 합니다.","범죄 수사를 통해 범인을 잡고, 범죄 예방을 위한 순찰 등 안전한 사회를 만들기 위해 노력합니다.","해킹, 인터넷 사기, 사이버명예훼손 등 사이버 공간의 안전을 위협하는 사이버범죄를 수사합니다.","교통을 단속하고 교통사고 예방을 위한 계획을 세우는 등 교통안전을 위한 일을 합니다."],aptitude:"안전 관련직"},10042:{name:"문화여가사",wage:3108,from
