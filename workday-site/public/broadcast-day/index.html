<dialog id="sources"><h2>방송을 만들 때</h2><p>새빛 방송국과 보람 님은 가상이에요. 장비 눈금과 큐 타이밍은 학습용으로 단순화했어요.</p><p>제보의 사실을 확인하고, 개인의 사생활을 보호해요. 리허설에서는 어떤 장면을 사용할지 출연자와 이야기해요.</p><p><a href="https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2200000108985" target="_blank" rel="noopener">방송심의에 관한 규정 · 제14조 객관성, 제19조 사생활 보호</a></p><p><a href="https://www.career.go.kr/cloud/w/job/view?seq=301" target="_blank" rel="noopener">커리어넷 방송연출가 · 301</a> · 시리즈에 수록된 워크넷 2021년 연봉 4,500만 원.</p><form method="dialog"><button>돌아가기</button></form></dialog><script type="module" src="app.mjs"></script></body></html>
